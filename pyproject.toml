[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coauthor"
version = "0.15.2"
authors = [
  { name="Sirui Lu", email="sirui.lu.phys@gmail.com" },
]
description = "A package containing utility functions for interacting with LLM models like Anthropic's Claude AI."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "colorlog",
    "requests",
    "openai>=1.58.0",
    "anthropic>=0.41.0",
    "IPython",
    "click",
    "PyMuPDF",
    "python-dotenv",
    "pillow",
    "jinja2",
]

[project.urls]
"Homepage" = "https://github.com/LionSR/coauthor"
"Bug Tracker" = "https://github.com/LionSR/coauthor/issues"

[tool.setuptools]
packages = ["coauthor"]

[project.entry-points.console_scripts]
coauthor = "coauthor.cli:cli"

[tool.black]
line-length = 151
target-version = ['py310', 'py311', 'py312']
include = '\.(pyi?|ipynb)$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "D410"]
fixable = ["E", "F", "W", "D"]
ignore = ["E501", "E731", "E721", "E741"]
#ignore = ["E266"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402","F401"]