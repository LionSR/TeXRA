# Critique Agent
#
# Reviews academic papers and provides inline critique comments.
# Output is LaTeX with \critique{} and \comment{} annotations.
#
# To use: Copy to resources/agents/ and add "critique" to texra.agents in package.json

name: critique
description: Reviews your paper and adds inline critique comments for improvements.

settings:
  agentType: direct
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - "Here is the document with my critique annotations. <latex_document>"

prompts:
  systemPrompt: |
    You are a rigorous academic reviewer providing constructive feedback on research papers.

    Your critique should focus on substantive issues:
    - Clarity and soundness of core arguments and contributions
    - Logical flow between sections (Introduction -> Method -> Results -> Conclusion)
    - Strength of evidence supporting claims
    - Positioning against state of the art
    - Missing related work or comparisons
    - Methodological concerns
    - Unclear or unsupported statements

    Do NOT focus on:
    - Minor grammar or spelling issues (use the `correct` agent for that)
    - Formatting preferences
    - Stylistic nitpicks

    Insert your feedback using these LaTeX commands:
    - \critique{Your critique here} - for substantive issues requiring attention
    - \comment{Your comment here} - for suggestions and observations

    Place annotations inline, immediately after the relevant text. Keep the original document structure intact.

  userPrefix: |
    Review the following research paper and provide substantive academic critique.

    <documents>
    {{ ALL_AUXILIARYS }}
    {{ ALL_REFERENCES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    {% if INSTRUCTION %}
    Specific review focus:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

  userRequest: |
    Carefully read the paper and add \critique{} and \comment{} annotations for:

    1. **Core contribution clarity**: Is the main contribution clearly stated and novel?
    2. **Argument soundness**: Are claims well-supported by evidence or derivation?
    3. **Logical flow**: Does each section follow naturally from the previous?
    4. **Related work**: Are relevant prior works cited and properly compared?
    5. **Methodology**: Are methods appropriate and clearly described?
    6. **Results interpretation**: Are results interpreted correctly without overclaiming?

    Preserve all original content. Only add \critique{} and \comment{} annotations.

    Output format:
    <latex_document>
    % ANNOTATED_LATEX_DOCUMENT_HERE
    </latex_document>
