name: equations
description: Fixes for LaTeX equation spacing and formatting
isRegex: false
patterns:
  # Environment spacing fixes
  '\n\n\begin{align}': '\n\begin{align}'
  '\end{align}\n\n': '\end{align}\n'
  '\n\n\begin{equation}': '\n\begin{equation}'
  '\end{equation}\n\n': '\end{equation}\n'

  # Fix reference numbering
  'figure \ref{': 'figure~\ref{'
  'table \ref{': 'table~\ref{'
  'equation \ref{': 'equation~\ref{'
  'Fig. \ref{': 'Fig.~\ref{'
  'Table \ref{': 'Table~\ref{'
  'Equation \ref{': 'Equation~\ref{'
  'eq. \ref{': 'eq.~\ref{'
  'eqn. \ref{': 'eqn.~\ref{'
  'Eq. \ref{': 'Eq.~\ref{'
  'Eqs. \ref{': 'Eqs.~\ref{'

  # Fix incorrect math operator commands
  '\\cos': '\cos'
  '\\sin': '\sin'
  '\\tan': '\tan'
  '\\arctan': '\arctan'
  '\\arccos': '\arccos'
  '\\arcsin': '\arcsin'
  '\\log': '\log'
  '\\ln': '\ln'
  '\\exp': '\exp'
  '\\sqrt': '\sqrt'
  '\\pi': '\pi'
  '\\bna': '\bna'
  '\\alpha': '\alpha'
  '\\beta': '\beta'
  '\\gamma': '\gamma'
  '\\delta': '\delta'
  '\\epsilon': '\epsilon'
  '\\zeta': '\zeta'
  '\\eta': '\eta'
  '\\theta': '\theta'
  '\\iota': '\iota'
  '\\kappa': '\kappa'
  '\\lambda': '\lambda'
  '\\mu': '\mu'
  '\\nu': '\nu'
  '\\xi': '\xi'
  '\\omicron': '\omicron'
  '\\\rho': '\rho'
  '\\rho': '\rho'
  '\\\delta': '\delta'
  '\\left': '\left'
  '\\right': '\right'
  '\\left(': '\left('
  '\\right(': '\right('
  '\\left[': '\left['
  '\\right[': '\right['
  '\\frac': '\frac'
  '\\rho_': '\rho_'
  '\\rho^': '\rho^'
  '\\rho\': '\rho\'
  '\\sum_': '\sum_'
  '\\prod_': '\prod_'
  '\\int_': '\int_'
  '\\oint_': '\oint_'
  '\\nabla': '\nabla'

  # alphabet
  '\\e^': 'e^'

  # greek
  '\a_': 'a_'
  '\b_': 'b_'
  '\c_': 'c_'
  '\d_': 'd_'
  '\e_': 'e_'
  '\f_': 'f_'
  '\g_': 'g_'
  '\h_': 'h_'
  '\i_': 'i_'
  '\j_': 'j_'
  '\k_': 'k_'
  '\l_': 'l_'
  '\m_': 'm_'
  '\n_': 'n_'
  '\o_': 'o_'
  '\p_': 'p_'
  '\q_': 'q_'
  '\r_': 'r_'
  '\s_': 's_'
  '\t_': 't_'
  '\u_': 'u_'
  '\v_': 'v_'
  '\w_': 'w_'
  '\x_': 'x_'
  '\y_': 'y_'
  '\z_': 'z_'

  # letters
  '\a^': 'a^'
  '\b^': 'b^'
  '\c^': 'c^'
  '\d^': 'd^'
  '\e^': 'e^'
  '\f^': 'f^'
  '\g^': 'g^'
  '\h^': 'h^'
  '\i^': 'i^'
  '\j^': 'j^'
  '\k^': 'k^'
  '\l^': 'l^'
  '\m^': 'm^'
  '\n^': 'n^'
  '\o^': 'o^'
  '\p^': 'p^'
  '\q^': 'q^'
  '\r^': 'r^'
  '\s^': 's^'
  '\t^': 't^'
  '\u^': 'u^'
  '\v^': 'v^'
  '\w^': 'w^'
  '\x^': 'x^'
  '\y^': 'y^'
  '\z^': 'z^'

  # text formatting
  '\\mathbf': '\mathbf'
  '\\mathbb': '\mathbb'
  '\\mathcal': '\mathcal'
  '\\mathscr': '\mathscr'

  '\\bm': '\bm'
  '\\text{': '\text{'
  '\\tilde{': '\tilde'
  '\\textit{': '\textit'
  '\\textbf{': '\textbf'
  '\\emph{': '\emph'
  '\\underline{': '\underline'
  '\\overbrace{': '\overbrace'
  '\\underbrace{': '\underbrace'

  # math mode
  '\e^{': 'e^{'
  '\\der': '\der'
  '\\partial': '\partial'
  '\\Delta': '\Delta'
  '\\Gamma': '\Gamma'
  '\\Lambda': '\Lambda'
  '\\Sigma': '\Sigma'
  '\\Omega': '\Omega'

  # labels
  '\\label{': '\label{'
  '\\\nlabel{': '\label{'

  # align problem
  '\n\n\end{align}': '\n\end{align}'

  # latex ending separators
  '\n\\\nend{align}': '\n\end{align}'
  '\n\\\nend{equation}': '\n\end{equation}'
  '\n\\\nend{itemize}': '\n\end{itemize}'
  '\n\\\nend{enumerate}': '\n\end{enumerate}'
  '\n\\\nend{figure}': '\n\end{figure}'
  '\n\\\nend{tikzpicture}': '\n\end{tikzpicture}'
  '\n\\\nend{document}': '\n\end{document}'

  # Fix newlines in commands
  '\right\n)': '\right)'
  '\right\n]': '\right]'
  '\right\n}': '\right}'
  '\left\n(': '\left('
  '\left\n[': '\left['
  '\left\n{': '\left{'

  # Unusual line/paragraph separators (Gemini problem)
  '/[\u2028\u2029]/g': '\n'

  # Environment name fixes
  '{\align}': '{align}'
  '{\equation}': '{equation}'
  '{\itemize}': '{itemize}'
  '{\enumerate}': '{enumerate}'
  '{\figure}': '{figure}'
  '{\tikzpicture}': '{tikzpicture}'
  '{\document}': '{document}'
