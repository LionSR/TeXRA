<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <!-- Outline Circle (transparent background) -->
  <circle cx="250" cy="200" r="180" fill="none" stroke="#0099cc" stroke-width="6"/>
  
  <!-- Deer Body -->
  <ellipse cx="220" cy="230" rx="130" ry="70" fill="#c68c53"/>
  
  <!-- Deer Legs -->
  <rect x="160" y="300" width="15" height="50" fill="#a67643"/>
  <rect x="190" y="300" width="15" height="50" fill="#a67643"/>
  <rect x="250" y="300" width="15" height="50" fill="#a67643"/>
  <rect x="280" y="300" width="15" height="50" fill="#a67643"/>
  
  <!-- Deer Hooves -->
  <ellipse cx="167.5" cy="350" rx="10" ry="6" fill="#5c3d22"/>
  <ellipse cx="197.5" cy="350" rx="10" ry="6" fill="#5c3d22"/>
  <ellipse cx="257.5" cy="350" rx="10" ry="6" fill="#5c3d22"/>
  <ellipse cx="287.5" cy="350" rx="10" ry="6" fill="#5c3d22"/>
  
  <!-- Deer Tail -->
  <ellipse cx="100" cy="230" rx="15" ry="10" fill="#d9ad7c"/>
  
  <!-- Deer Neck -->
  <path d="M350 180 C330 150, 310 150, 300 180" fill="#c68c53"/>
  
  <!-- Deer Head -->
  <path d="M350 180 C370 160, 390 160, 400 180 C410 200, 390 220, 380 220 L350 220 C340 220, 330 200, 350 180Z" fill="#c68c53"/>
  
  <!-- Deer Ears -->
  <ellipse cx="370" cy="165" rx="12" ry="18" fill="#c68c53" transform="rotate(-15 370 165)"/>
  <ellipse cx="370" cy="165" rx="7" ry="12" fill="#e6d2b7" transform="rotate(-15 370 165)"/>
  
  <!-- Deer Eye -->
  <ellipse cx="385" cy="185" rx="6" ry="7" fill="white"/>
  <circle cx="387" cy="184" r="3" fill="black"/>
  
  <!-- Deer Nose -->
  <ellipse cx="405" cy="195" rx="8" ry="6" fill="#5c3d22"/>
  
  <!-- Deer Antlers -->
  <path d="M350 170 C350 150, 360 140, 370 130" stroke="#8b5a2b" stroke-width="5" fill="none"/>
  <path d="M370 130 C380 125, 390 130, 385 140" stroke="#8b5a2b" stroke-width="4" fill="none"/>
  <path d="M365 145 C375 140, 385 145, 380 155" stroke="#8b5a2b" stroke-width="4" fill="none"/>
  
  <!-- Lab Coat -->
  <path d="M120 230 L120 300 Q220 330, 300 300 L300 220" fill="white" stroke="#999999" stroke-width="3"/>
  <path d="M120 245 L180 245 L230 245 L300 245" fill="none" stroke="#999999" stroke-width="3"/>
  
  <!-- Stethoscope -->
  <path d="M170 235 C170 215, 240 200, 280 220" stroke="#333" stroke-width="5" fill="none"/>
  <circle cx="165" cy="235" r="10" fill="#333"/>
  <rect x="280" y="215" width="12" height="15" rx="3" fill="#333"/>
  
  <!-- Doctor's Cap -->
  <path d="M340 145 L380 145 L370 160 C360 170, 350 170, 340 160 Z" fill="#0099cc" stroke="#0077aa" stroke-width="2"/>
  <rect x="350" y="125" width="20" height="20" rx="5" fill="#0099cc" stroke="#0077aa" stroke-width="2"/>
  
  <!-- Glasses -->
  <ellipse cx="385" cy="185" rx="12" ry="14" stroke="black" stroke-width="2.5" fill="none"/>
  <path d="M373 180 L350 175" stroke="black" stroke-width="2.5" fill="none"/>
  
  <!-- CLEAN PHYSICS ELEMENTS (just the 3 requested) -->
  
  <!-- 1. Schrödinger Wave Function (clean) -->
  <path d="M130 120 Q155 90, 180 120 Q205 150, 230 120" stroke="#9933ff" stroke-width="5" fill="none"/>
  <text x="180" y="90" font-family="Arial" font-weight="bold" font-size="24" fill="#9933ff" text-anchor="middle">ψ</text>
  
  <!-- 2. Atom Cloud (clean) -->
  <circle cx="300" cy="120" r="8" fill="#ff6600"/>
  <ellipse cx="300" cy="120" rx="30" ry="18" stroke="#ff6600" stroke-width="3" fill="none"/>
  <ellipse cx="300" cy="120" rx="30" ry="18" stroke="#ff6600" stroke-width="3" fill="none" transform="rotate(60 300 120)"/>
  <ellipse cx="300" cy="120" rx="30" ry="18" stroke="#ff6600" stroke-width="3" fill="none" transform="rotate(120 300 120)"/>
  
  <!-- 3. Heisenberg Uncertainty Principle (clean) -->
  <rect x="150" y="270" width="200" height="40" rx="10" fill="white" opacity="0.8"/>
  <text x="250" y="297" font-family="Arial" font-weight="bold" font-size="24" fill="#009966" text-anchor="middle">ΔxΔp ≥ ħ/2</text>
</svg>
