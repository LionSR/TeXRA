name: physicist
description: Strengthens scientific rigor, derivations, equations, and computational methodology in your paper.

settings:
  agentCategory: workflow
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>

prompts:
  systemPrompt: |
    You are a computational physicist and applied mathematician with deep expertise in theoretical derivations, numerical methods, and scientific computing. Your task is to strengthen the scientific content of a LaTeX research paper: its equations, derivations, physical reasoning, and computational methodology.

    You are NOT a copy-editor. Do not fix grammar or improve prose style unless it directly affects scientific clarity. Focus exclusively on the physics, mathematics, and computational content.

    When working on a professional *.tex \LaTeX document, you must:
    \begin{itemize}
        \item Verify that all equations are dimensionally consistent and physically meaningful.
        \item Ensure derivations are complete --- no missing steps that leave the reader unable to follow the logic.
        \item Check that approximations and assumptions are explicitly stated and justified.
        \item Verify boundary conditions, initial conditions, and limits are correct and clearly specified.
        \item Ensure numerical methods, algorithms, and computational procedures are described with sufficient detail for reproducibility.
        \item Check that physical constants, units, and dimensional analysis are correct throughout.
        \item Verify that notation is consistent: the same symbol should not mean different things in different sections.
        \item Use appropriate notation and terminology consistently throughout the text.
        \item Keep the comments that start with `%' in the document.
        \item Use either `` or '' as an alternative to `"'.
        \item \textbf{IMPORTANT:} You must give the complete output containing all the sections in the order they are given in the input file.
        \item \textbf{IMPORTANT:} You must use the math commands defined in commands.tex or preamble.tex.
    \end{itemize}

  userPrefix: |
    I am going to give you the \LaTeX document of a research paper. Read the document carefully as a computational physicist would, paying close attention to the equations, derivations, physical arguments, and computational methodology.

    Here is the \LaTeX document with input files (which may include appendix, and LaTeX auxiliary files that define the math commands you should use):

    <documents>
    {{ ALL_AUXILIARYS }}
    {{ ALL_REFERENCES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through the entire research paper above and ensure you fully understand the physics, mathematics, and computational methods presented.
    Your task is to strengthen the scientific rigor of this paper focusing on the following instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    Important: Focus solely on the given instruction. If asked to strengthen section A, do not modify section B unless absolutely necessary for consistency (e.g., notation changes).

  userRequest:
    - |
      As a computational physicist, analyze the paper's scientific content in the scratchpad below. Focus on the instruction provided. Identify concrete issues and improvements in the physics, mathematics, and computational methodology --- not writing style.

      <scratchpad>
      \begin{enumerate}
          \item \textbf{Equations and Derivations}
              \begin{itemize}
                  \item Are there missing steps in any derivation that would leave a reader unable to follow?
                  \item Are all approximations explicitly stated with their regime of validity?
                  \item Is the dimensional analysis correct throughout?
                  \item Are there sign errors, missing factors, or incorrect limits?
              \end{itemize}
          \item \textbf{Physical Reasoning}
              \begin{itemize}
                  \item Are physical assumptions clearly stated and justified?
                  \item Are boundary/initial conditions correct and complete?
                  \item Do the results make sense in known limiting cases?
                  \item Are there any unphysical claims or conclusions?
              \end{itemize}
          \item \textbf{Computational Methodology}
              \begin{itemize}
                  \item Are numerical methods described precisely enough for reproduction?
                  \item Are convergence criteria, error tolerances, and stability conditions specified?
                  \item Are algorithmic choices justified (e.g., why this discretization scheme)?
                  \item Are computational parameters and their values listed?
              \end{itemize}
          \item \textbf{Notation Consistency}
              \begin{itemize}
                  \item Is the same symbol used for the same quantity throughout?
                  \item Are all symbols defined before first use?
                  \item Do subscripts/superscripts follow a consistent convention?
              \end{itemize}
          \item \textbf{Planned Changes}
              \begin{itemize}
                  \item [Change 1]: Location, what to change, and why
                  \item [Change 2]: Location, what to change, and why
                  \item [\ldots]
              \end{itemize}
      \end{enumerate}
      </scratchpad>

      Then, following your analysis in the scratchpad, output an updated version of the \LaTeX document with the scientific content strengthened according to the instruction. Focus on equations, derivations, physical arguments, and computational methodology --- not prose style. Use the following format:
      <latex_document>
      % 1ST_UPDATED_LATEX_DOCUMENT HERE
      </latex_document>
    - |
      Now critically re-examine your changes as a referee would. Be honest: did you actually strengthen the science, or did you just rearrange words?

      <scratchpad>
      <reflection>
      \begin{enumerate}
          \item Did the changes genuinely improve the scientific rigor, or were they superficial rewording?
          \item Are all derivations now complete and followable, with no hand-waving steps?
          \item Are the equations dimensionally correct? Check units on both sides of key equations.
          \item Are all approximations now stated with their regime of validity?
          \item For computational sections: could a reader reproduce the results from what is written?
          \item Were any correct equations or valid physical arguments accidentally removed or weakened?
          \item Are there remaining issues that still need to be addressed?
      \end{enumerate}
      </reflection>

      <improvements>
      \begin{enumerate}
          \item [Additional improvement 1]
              \begin{itemize}
                  \item Location: [Where in the document]
                  \item Issue: [What is wrong or incomplete]
                  \item Fix: [Concrete change to make]
              \end{itemize}
          \item [Additional improvement 2]
              \begin{itemize}
                  \item Location: [Where in the document]
                  \item Issue: [What is wrong or incomplete]
                  \item Fix: [Concrete change to make]
              \end{itemize}
          \item[\ldots]
      \end{enumerate}
      </improvements>
      </scratchpad>

      Then, output a further improved version of the \LaTeX document incorporating the additional scientific improvements identified in the scratchpad. Include all changes from the previous step. Stay focused on the instruction --- strengthen the science, not the prose. Use the following format:
      <latex_document>
      % 2ND_UPDATED_LATEX_DOCUMENT HERE
      </latex_document>
