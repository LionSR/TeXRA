name: correct_multiple
inherits: correct
settings:
  documentTag: latex_documents
  endTag: </latex_documents>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>

prompts:
  systemPrompt: |
    Your task is to write a research paper.

    When writing a professional \LaTeX document, you must:
    \begin{itemize}
        \item Use appropriate notation and terminology consistently throughout the text.
        \item Keep the comments that start with `%' in the document. For example, do not delete ``% We found the time step $\delta=1/16=0.0625$ to give sufficient accuracy for our simulations.'' in the output.
        \item If there are duplicate labels, handle the collision correctly by renaming one of them using a condensed label and adjust accordingly where the labelled items are referenced.
        \item Use $\ldots$ or $\cdots$ rather than $\dots$ or ``...'' to achieve an ellipsis following the best practice of chktex.
        \item Use non-breaking spaces when referencing equations, figures, sections, and references, e.g., use ``Eq.~\ref{eq:label}''; ``see Fig.~\ref{fig:label}''; ``Section~\ref{sec:label}''; ``see Ref.~\cite{Jarzynski1997Nonequilibrium}''.
        \item Use either `` or '' as an alternative to `"'.
        \item Put punctuation outside inner math mode.
        \item Use $\tr$ instead of \text{tr} or \textrm{tr}.
        \item Prefer $\bra{...}$ and $\ket{...}$ over $|...\rangle$ and $\langle...|$.
        \item Treat formulas as part of the sentences and add punctuation accordingly in the displayed math environments depending on the next sentence.
        \item When in doubt, follow the best practice that will result in zero warnings when checked by chktex.
        \item Use the math commands defined in the auxiliary file command.tex if provided.
    \end{itemize}

  userPrefix: |
    I am going to give you a \LaTeX document of a research paper. You are about to correct the typos and mistakes in the document. So please read the document carefully.

    Here are the \LaTeX documents with additional LaTeX auxiliary files (where the math commands are defined):

    <documents>
    {{ AUXILIARY_FILES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through the entire document, looking for any typos, grammatical errors, formatting inconsistencies, incorrect math, or factual inaccuracies.

    {% if INSTRUCTION %}
    Specific instructions that you must follow closely:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    For example, in the instruction, if I ask you to revise section A in all papers, you do not need to revise section B in any paper.
    {% endif %}

    {% if OUTPUT_FILES_ORDER %}
    The output files should be in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}.
    {% endif %}

  userRequest: |
    In the scratchpad below, brainstorm concrete ways to significantly improve the quality of all latex documents that are directly relevant to the instruction above. Do not consider any other aspects of the papers. Be as concrete as to change what in which section of which paper in what ways. Use the scratchpad as an opportunity to formulate as detailed as possible action plans so that a graduate student can also perform the revisions. In the scratchpad, list the planned changes, the rationale for each change, and the concrete steps to be taken to implement the changes starting from the beginning of each document.

    <scratchpad>
    1. [Specific improvement 1 addressing the instruction]
        - Affected documents: [List of documents]
        - Rationale: [explanation]
        - Implementation: [Concrete steps]
    2. [Specific improvement 2 addressing the instruction]
        - Affected documents: [List of documents]
        - Rationale: [explanation]
        - Implementation: [Concrete steps]
    3. [Specific improvement 3 addressing the instruction]
        - Affected documents: [List of documents]
        - Rationale: [explanation]
        - Implementation: [Concrete steps]
    </scratchpad>

    Then, following your plan in the scratchpad, please output updated versions of all \LaTeX documents with targeted corrections and enhancements that laser-focus on addressing the specific instruction provided. Refrain from making any changes that are not directly related to the instruction. Use the following format:

    <latex_documents>
    <document name="{OUTPUT_FILES_ORDER[0]}">
    % 1ST_UPDATED_LATEX_DOCUMENT_1 HERE
    </document>
    <document name="{OUTPUT_FILES_ORDER[1]}">
    {{ 1ST_UPDATED_LATEX_DOCUMENT_2 }}
    </document>
    ... (repeat for all output files)
    </latex_documents>

  userReflect: |
    Now that you have made initial improvements to the papers, please reflect on your changes and consider any additional improvements that could further enhance the quality of the papers while staying focused on the original instruction.

    <scratchpad>
    \begin{reflection}
        \subsection{Summary of Previous Changes}
        \begin{enumerate}
            \item [Summary of major changes made to each paper]
            \item [Evaluation of the effectiveness of these changes]
            \item [Identification of any areas that may need further improvement]
        \end{enumerate}

        \subsection{Additional Improvements}
        \begin{enumerate}
            \item [Additional improvement 1]
            \begin{itemize}
                \item Affected documents: [List of documents]
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
            
            \item [Additional improvement 2]
            \begin{itemize}
                \item Affected documents: [List of documents]
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
            
            \item [Additional improvement 3]
            \begin{itemize}
                \item Affected documents: [List of documents]
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \end{enumerate}
    \end{reflection}
    ...
    </scratchpad>

    Then, output further enhanced and complete versions of all \LaTeX documents in the <latex_documents> tag, incorporating the reflections and additional improvements discussed above. Remember to stay laser-focused on the specific instruction or the additional plan in the scratchpad. Only modify sections explicitly mentioned in the instruction or the additional plan in the scratchpad, unless changes in one section directly necessitate adjustments in another for consistency.

    Ensure that the output documents are in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}
