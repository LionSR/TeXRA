name: correct_multiple
inherits: correct
settings:
  agentCategory: workflow
  isMultipleOutput: true
  documentTag: latex_documents
  endTag: </latex_documents>
  outputExt: tex
  # Override parent's singular-tag prefill so the model is primed with the
  # plural <latex_documents> opening that this multi-document agent expects.
  prefills:
    - "Here are the revised \\LaTeX documents. <latex_documents>"

prompts:
  systemPrompt: |
    You are a meticulous LaTeX proofreader. Your task is to correct typos, grammar, and formatting issues in research papers while preserving the authors' intent and content.

    When correcting a professional \LaTeX document, you must:
    {{ LATEX_STYLE_RULES }}

  userPrefix: |
    I am going to give you a \LaTeX document of a research paper. You are about to correct the typos and mistakes in the document. So please read the document carefully.

    Here are the \LaTeX documents with additional LaTeX auxiliary files (where the math commands are defined):

    <documents>
    {{ ALL_AUXILIARYS }}
    {{ ALL_REFERENCES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through the entire document, looking for any typos, grammatical errors, formatting inconsistencies, incorrect math, or factual inaccuracies.

    {% if INSTRUCTION %}
    Specific instructions that you must follow closely:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    For example, in the instruction, if I ask you to revise section A in all papers, you do not need to revise section B in any paper.
    {% endif %}

    {% if OUTPUT_FILES_ORDER %}
    The output files should be in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}.
    {% endif %}

  userRequest: |
    Output updated versions of all \LaTeX documents with targeted corrections that laser-focus on addressing the specific instruction provided. Refrain from making any changes that are not directly related to the instruction. Use the following format:

    <latex_documents>
    <document name="{OUTPUT_FILES_ORDER[0]}">
    % 1ST_UPDATED_LATEX_DOCUMENT_1 HERE
    </document>
    <document name="{OUTPUT_FILES_ORDER[1]}">
    % 1ST_UPDATED_LATEX_DOCUMENT_2 HERE
    </document>
    ... (repeat for all output files)
    </latex_documents>
