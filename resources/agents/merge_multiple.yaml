name: merge_multiple
inherits: merge
description: Merges multiple partial edits back into their full original documents.

settings:
  agentCategory: workflow
  maxRounds: 1
  isMultipleOutput: true
  documentTag: merged_documents
  endTag: </merged_documents>
  outputExt: tex
  prefills:
    - <merged_documents>

prompts:
  systemPrompt: |
    You are an expert LaTeX editor tasked with merging changes from edited versions of multiple \LaTeX documents back into their original versions. Your goal is to produce accurate and complete representations of the edited documents, incorporating all changes while maintaining the original structure and formatting for each document.

  userPrefix: |
    You are tasked with creating full versions of multiple edited \LaTeX documents by combining information from pairs of sources: each original \LaTeX document and its corresponding edited version. This task is necessary for enabling accurate comparison between versions using tools like latexdiff. Your goal is to produce complete, updated versions of each document that incorporate all changes while maintaining the original structure.

    Here are the original \LaTeX documents:
    {{ ALL_INPUTS }}

    Here are the edited versions of the \LaTeX documents:
    {{ ALL_EDITEDS }}

  userRequest:
    - |
      Follow these steps to create the full versions of each edited document:
      1. For each document pair (original and edited), carefully read through both versions.
      2. For parts indicated as ``unchanged'' or ``previous parts remain unchanged'' in each edited version, copy the corresponding sections from the original document verbatim.
      3. Where specific edits or additions are shown in the edited version, incorporate these changes exactly as they appear, replacing the corresponding parts in the original document.
      4. Pay close attention to any structural elements like section headers, equations, figures, or tables. Ensure that these are maintained in their correct positions and formats.
      5. Be extremely careful not to introduce any new errors or typos. The goal is to create accurate representations of the edited documents.
      6. Maintain all LaTeX formatting, including commands, environments, and any custom macros or definitions present in each original document.
      7. If there are any ambiguities or unclear instructions in the edited version, default to the original document's content for those sections.
      8. Process each document pair independently - changes in one document should not affect another.

      {% if OUTPUT_FILES_ORDER %}
      The output files should be in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}.
      {% endif %}

      Provide your output as complete \LaTeX documents, including any preamble, document class declarations, and all content up to and including the \end{document} command. Use the following format:

      <merged_documents>
      <document name="{first output filename}">
      % First merged LaTeX document here
      </document>
      <document name="{second output filename}">
      % Second merged LaTeX document here
      </document>
      ... (repeat for all document pairs)
      </merged_documents>

      Remember, accuracy is paramount in this task. Even small discrepancies can affect the ability to use diff tools effectively, so please be as thorough and precise as possible for each document.
    - |
      After thoroughly reviewing each original \LaTeX document, its edited version, and your generated merged document, please critically check that your outputs satisfy the following requirements for each document:

      <requirements>
      - All changes and additions from the edited version are accurately incorporated.
      - Sections marked as ``unchanged'' in the edited version match the original document verbatim.
      - The structure and formatting of the original document are maintained, including section headers, equations, figures, tables, and LaTeX commands and environments.
      - No parts of the document are accidentally omitted or duplicated.
      - The output is a complete \LaTeX document, including the preamble, document class declarations, and all content up to \end{document}.
      </requirements>

      If any of these requirements are not fully met for any document, please revise your merged documents to address the issues. Output all updated versions under the `<merged_documents>' tag.

      If you are satisfied that all outputs meet all the requirements, please confirm this by stating "All merged documents meet the specified requirements." Otherwise, provide the revised documents.

      <merged_documents>
      <document name="{first output filename}">
      % First revised merged LaTeX document here, if needed
      </document>
      <document name="{second output filename}">
      % Second revised merged LaTeX document here, if needed
      </document>
      ... (repeat for all document pairs)
      </merged_documents>
