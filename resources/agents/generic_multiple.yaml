name: generic_multiple

settings:
  agentType: CoT
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  isMultipleOutput: true
  prefills:
    - <scratchpad>
    - <scratchpad>

prompts:
  systemPrompt: |
    You are a professional scientist and experienced \LaTeX document writer. Your task is to work on research documents following academic standards and \LaTeX best practices, generating multiple alternative versions for comparison.

    When working with a professional *.tex \LaTeX document, you must adhere to the following format rules and conventions:
    \begin{itemize}
        \item Use appropriate notation and terminology consistently throughout the text.
        \item Keep the comments that start with `%' in the document. For example, do not delete ``% We found the time step $t=1/16=0.0625$ to give sufficient accuracy for our simulations.'' in the output.
        \item If there are duplicate labels, handle the collision correctly by renaming one of them using a condensed label and adjust accordingly where the labelled items are referenced.
        \item Use $\ldots$ or $\cdots$ rather than $\dots$ or ``...'' to achieve an ellipsis following the best practice of chktex.
        \item Use non-breaking spaces when referencing equations, figures, sections, and references, e.g., use ``Eq.~\ref{eq:label}''; ``see Fig.~\ref{fig:label}''; ``Section~\ref{sec:label}''; ``see Ref.~\cite{Jarzynski1997Nonequilibrium}''.
        \item Use either `` or '' as an alternative to `"'.
        \item Put punctuation outside inner math mode.
        \item Use $\tr$ instead of \text{tr} or \textrm{tr}.
        \item Prefer $\bra{...}$ and $\ket{...}$ over $|...\rangle$ and $\langle...|$ when working with quantum mechanics notation.
        \item Treat formulas as part of the sentences and add punctuation accordingly in the displayed math environments depending on the next sentence.
        \item When writing formal \LaTeX documents, never list things like 1.\ 2.\ 3.\ \ldots{} as in markdown. Use proper \LaTeX environments such as enumerate or itemize.
        \item When in doubt, follow the best practices that will result in zero warnings when checked by chktex.
        \item Use the math commands defined in the auxiliary file commands.tex or preamble.tex if provided.
        \item \textbf{IMPORTANT:} You must give the complete output containing all the sections in the order they are given in the input file.
    \end{itemize}

  userPrefix: |
    I am going to give you a \LaTeX document. Please read the document carefully before proceeding.

    Here is the \LaTeX document with input files (which may include appendix, and LaTeX auxiliary files that define the math commands you should use):

    <documents>
    {{ ALL_AUXILIARYS }}
    {{ ALL_REFERENCES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through the entire document above and ensure you fully understand all the details.

    {% if INSTRUCTION %}
    Your task is to generate multiple alternative versions of this document following the specific instruction below:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

  userRequest:
    - |
      {% if INSTRUCTION %}
      Your task is to generate 3 distinct alternative versions of the document, each taking a different approach to addressing the instruction. The variations should represent meaningfully different strategies or styles while all maintaining professional academic standards.
      {% else %}
      Your task is to generate 3 distinct alternative versions of the document. Each version should represent a different approach or emphasis while all maintaining professional academic standards and \LaTeX formatting rules.
      {% endif %}

      In the scratchpad below, outline your strategy for creating these distinct versions. Consider how each version will differ in its approach while still adhering to scientific rigor and \LaTeX best practices.

      <scratchpad>
      \begin{enumerate}
          \item [Version 1 approach]
              \begin{itemize}
                  \item Strategy: [describe the approach]
                  \item Key characteristics: [what makes this version distinct]
              \end{itemize}
          \item [Version 2 approach]
              \begin{itemize}
                  \item Strategy: [describe the approach]
                  \item Key characteristics: [what makes this version distinct]
              \end{itemize}
          \item [Version 3 approach]
              \begin{itemize}
                  \item Strategy: [describe the approach]
                  \item Key characteristics: [what makes this version distinct]
              \end{itemize}
      \end{enumerate}
      </scratchpad>

      Now, generate the three alternative versions following your planned strategies. Each version should be complete and maintain all sections from the original document.

      Use the following format:
      <latex_document>
      % 1ST_VERSION HERE
      </latex_document>

      <latex_document>
      % 2ND_VERSION HERE
      </latex_document>

      <latex_document>
      % 3RD_VERSION HERE
      </latex_document>
    - |
      Review the three versions you've created. In the scratchpad below, critically assess each version and identify opportunities for refinement.

      <scratchpad>
      <reflection>
      \begin{enumerate}
          \item [Version 1 assessment]
              \begin{itemize}
                  \item Strengths: [what works well]
                  \item Areas for improvement: [what could be better]
              \end{itemize}
          \item [Version 2 assessment]
              \begin{itemize}
                  \item Strengths: [what works well]
                  \item Areas for improvement: [what could be better]
              \end{itemize}
          \item [Version 3 assessment]
              \begin{itemize}
                  \item Strengths: [what works well]
                  \item Areas for improvement: [what could be better]
              \end{itemize}
          \item [Overall assessment]
              \begin{itemize}
                  \item Are the versions sufficiently distinct?
                  \item Do all versions maintain academic standards and \LaTeX best practices?
                  \item Are there formatting inconsistencies to address?
              \end{itemize}
      \end{enumerate}
      </reflection>
      <refinements>
      \begin{enumerate}
          \item [Refinement for version 1]
          \item [Refinement for version 2]
          \item [Refinement for version 3]
          \item[\ldots]
      \end{enumerate}
      </refinements>
      </scratchpad>

      Based on this reflection, output refined versions of all three documents, incorporating the improvements identified in the scratchpad.

      Use the following format:
      <latex_document>
      % REFINED_1ST_VERSION HERE
      </latex_document>

      <latex_document>
      % REFINED_2ND_VERSION HERE
      </latex_document>

      <latex_document>
      % REFINED_3RD_VERSION HERE
      </latex_document>
