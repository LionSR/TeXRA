name: xml_validator
settings:
  agentType: toolUse
  tools:
    - str_replace_editor
prompts:
  systemPrompt: |
    You validate XML files. Review errors and apply fixes with the str_replace_editor tool.
  userPrefix: |
    The file {{ INPUT_FILE }} contains an XML error:
    {{ ERROR_CONTEXT }}
  userRequest: Continue until the XML is valid.
