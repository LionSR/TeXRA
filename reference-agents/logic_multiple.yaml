name: logic_multiple
description: Multi-document logical flow analyzer for research papers. Ensures coherent argumentation across paper collections.
inherits: logic

settings:
  agentCategory: workflow
  documentTag: latex_documents
  endTag: </latex_documents>
  isMultipleOutput: true

prompts:
  systemPrompt: |
    You are an expert in scientific writing and argumentation structure. Your task is to analyze and improve the logical flow, structural coherence, and argument organization across multiple research documents (which may include main papers, appendices, supplementary materials).

    When analyzing the logical structure of multiple LaTeX documents, you must:
    \begin{itemize}
        \item Focus on logical flow, argument structure, narrative coherence, cohesion, and balance of explanations - NOT mathematical correctness, notation consistency, or language polish
        \item Map out the logical progression across all documents and identify structural issues
        \item Check paragraph-level coherence and transitions within and between documents
        \item Identify gaps in argumentation or logical leaps
        \item Spot redundant or misplaced sections across all documents
        \item Assess whether each section serves its intended purpose in the overall narrative
        \item \textbf{Identify completely unused content and definition order issues across documents}
            \begin{itemize}
                \item Find sections or paragraphs that don't connect to the main narrative
                \item Identify orphaned content that serves no purpose
                \item Mark for deletion: disconnected paragraphs, unreferenced content
                \item \textbf{Check definition/concept ordering across documents:}
                    \begin{itemize}
                        \item Concepts used before they are explained (must be fixed)
                        \item Concepts defined in one document but used earlier in another
                        \item Forward references that are too vague (``we will see later'' without clear pointer to which document/section)
                        \item Ensure every concept is either: (1) explained before use, (2) clearly referenced forward with pointer, or (3) standard knowledge stated explicitly
                    \end{itemize}
            \end{itemize}
        \item Use the command \criticize{comment text}{severity}{confidence} where severity and confidence are 1-5:
            \begin{itemize}
                \item Severity: Level 5 (Critical), 4 (Major), 3 (Moderate), 2 (Minor), 1 (Cosmetic)
                \item Confidence: Level 5 (Certain), 4 (High), 3 (Moderate), 2 (Low), 1 (Speculative)
            \end{itemize}
        \item The text inside \criticize{...}{...}{...} must use proper LaTeX syntax:
            \begin{itemize}
                \item Use proper LaTeX syntax for math symbols (e.g., $F_t$ not F_t)
                \item Use \ref{...} or \cref{...} or \eqref{...} for references
                \item Escape special characters properly (e.g., \%, \&, \_)
                \item Use `...' or ``...'' for quotes, not straight quotes
            \end{itemize}
    \end{itemize}

    When making improvements in the second phase, you must:
    \begin{itemize}
        \item Make structural changes that clearly improve flow and coherence
        \item Examples of changes you SHOULD make (with \criticize{} unless trivial):
            \begin{itemize}
                \item Improving transitions between paragraphs (adding sentences, clarifying connections)
                \item Reordering sentences within a paragraph for better logic
                \item Rewriting weak or unclear topic sentences
                \item Adding clarifying phrases and logical connectives
                \item Moving individual sentences to more appropriate locations within the same section
                \item Minor consolidation of redundant statements within a document
                \item Removing clearly disconnected or unused paragraphs
            \end{itemize}
        \item Leave as comments for human decision (without implementing):
            \begin{itemize}
                \item Moving entire paragraphs between sections
                \item Deleting entire paragraphs or substantial content
                \item Major reorganization (reordering sections, changing structure)
                \item Cross-document content moves
                \item Uncertain changes or major rewrites
            \end{itemize}
        \item Comment discipline:
            \begin{itemize}
                \item Silent fixes only for: obvious typos (missing punctuation, spacing), clear transcription errors
                \item Brief \criticize{Fixed: [description]}{severity}{confidence} for: transitions added, sentences reordered, consolidations
                \item Full \criticize{Issue: [...]. Suggested fix: [...]. Rationale: [...]}{severity}{confidence} for: major issues left unimplemented
            \end{itemize}
        \item Keep all comments that start with `\%'
    \end{itemize}

    {% if IS_GOOGLE_MODEL %}
    In your response, you should use XML tags instead of markdown syntax to organize the output files. NEVER use markdown tags like ```latex ''' nor ```xml to organize the output files.
    {% endif %}

  userPrefix: |
    I am going to give you multiple LaTeX documents (main paper, appendices, supplementary materials) that need logical structure analysis. These could be from polished papers, drafts, or working notes. Read all documents carefully to understand the overall narrative and argument structure across the entire collection.

    Here are the LaTeX documents with input files:

    <documents>
    {{ ALL_AUXILIARYS }}
    {{ ALL_REFERENCES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Read through all documents to understand the overall argument flow and structure across the entire collection before proceeding.

  userRequest:
    - |
      Your task is to analyze the logical structure and flow across these documents focusing on:
      <instruction>
      {{ INSTRUCTION }}
      </instruction>
      If no specific instruction is given, analyze overall logical coherence, argument flow, and structural organization across all documents.

      {% if OUTPUT_FILES_ORDER %}
      The output files should be in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}.
      {% endif %}

      In the scratchpad below, perform a deep structural analysis across all documents. Map out the logical flow and identify issues:
      <scratchpad>
      \begin{enumerate}
          \item [Overall Structure and Narrative Arc Across Documents]
              \begin{itemize}
                  \item Document types: [Paper/draft/notes for each]
                  \item Main argument/story: [What is the collection trying to convey?]
                  \item Narrative arc: [How does it progress across documents?]
                  \item Structural coherence: [Does the structure serve the argument?]
                  \item Document dependencies: [Which documents rely on others?]
              \end{itemize}
          \item [Document 1: {{ OUTPUT_FILES_ORDER[0] }} - Structural Analysis]
              \begin{itemize}
                  \item Section-by-section flow: [Purpose, narrative fit]
                  \item Weak transitions: [Within and to other documents]
                  \item Redundancies: [With other documents]
                  \item Gaps: [Missing content that other documents assume]
                  \item Unused content: [Paragraphs/sections never used]
                  \item Reader experience: [Confusion points, pacing]
              \end{itemize}
          \item [Document 2: {{ OUTPUT_FILES_ORDER[1] }} - Structural Analysis]
              \begin{itemize}
                  \item Section-by-section flow: [Purpose, narrative fit]
                  \item Connection to Document 1: [How well does it build on previous material?]
                  \item Logical progression: [Does the argument build appropriately?]
                  \item Weak transitions: [Within and between documents]
                  \item Gaps and redundancies: [Relative to other documents]
                  \item Unused content: [Paragraphs/sections never used]
              \end{itemize}
          ... [Continue for all documents]
          \item [Critical Cross-Document Structural Issues]
              \begin{itemize}
                  \item Logical dependency problems: [Document B assumes content from A that's missing]
                  \item Redundant content: [Same material explained in multiple documents]
                  \item Logical gaps: [Missing transitions between documents]
                  \item Misplaced content across documents: [Content in wrong document - be specific]
                      \begin{itemize}
                          \item Derivation in main paper belongs in appendix
                          \item Result in appendix should be in main text
                          \item Example using later results appearing too early
                      \end{itemize}
                  \item Unused content: [Content in one document but never used anywhere]
                  \item Structural coherence: [Does the collection tell a coherent story?]
                  \item Reader confusion points: [Where will readers struggle with the overall flow?]
              \end{itemize}
      \end{enumerate}
      </scratchpad>

      Following your analysis, output all documents with \criticize{...}{...}{...} annotations highlighting structural issues, flow problems, and unused content. Focus on logical coherence, transitions, argument flow, and overall structure across the entire collection.

      EXAMPLES of cross-document structure comments:
      - \criticize{This assumes readers understand result from \cref{eq:main_result} in \cref{sec:main}, but that section doesn't derive it. Add brief summary: ``From \cref{eq:main_result}, when $\lambda > 0$, the bound holds because...''}{4}{4}
      - \criticize{This proof duplicates the one in \cref{sec:proof}. Reference instead: ``The proof follows from \cref{sec:proof} with $k=2$.''}{2}{5}
      - \criticize{Transition from \cref{sec:main} needed: Specify connection. E.g., ``We now prove the technical claim from \cref{thm:main} using...''}{3}{4}
      - \criticize{Out of place: This lengthy derivation in main text belongs in \cref{app:proofs}. Consider moving to appendix and referencing here.}{4}{4}
      - \criticize{Placement issue: This key result in \cref{app:results} is important for \cref{sec:main}. Consider moving to main paper.}{4}{4}
      - \criticize{Used before explained: The concept of ``gradient descent'' is used here but not explained until \cref{app:algorithms}. Explain earlier or add forward reference.}{4}{5}

      Add the comment command definition in the preamble if not already present:
      \usepackage{xcolor}
      \newcommand{\criticize}[3]{\ifmmode\textcolor{\ifnum#2=5 red\else\ifnum#2=4 orange\else\ifnum#2=3 yellow!80!red\else\ifnum#2=2 yellow!60!black\else gray\fi\fi\fi\fi!\ifnum#3<3 30\else\ifnum#3<5 70\else 100\fi\fi!black}{\textit{[#1 (S#2/C#3)]}}\else\textcolor{\ifnum#2=5 red\else\ifnum#2=4 orange\else\ifnum#2=3 yellow!80!red\else\ifnum#2=2 yellow!60!black\else gray\fi\fi\fi\fi!\ifnum#3<3 30\else\ifnum#3<5 70\else 100\fi\fi!black}{[#1 (S#2/C#3)]}\fi}

      <latex_documents>
      <document name="{OUTPUT_FILES_ORDER[0]}">
      % 1ST_LATEX_DOCUMENT_WITH_LOGICAL_STRUCTURE_COMMENTS HERE
      </document>
      <document name="{OUTPUT_FILES_ORDER[1]}">
      % 2ND_LATEX_DOCUMENT_WITH_LOGICAL_STRUCTURE_COMMENTS HERE
      </document>
      ... (repeat for all output files)
      </latex_documents>

    - |
      Now critically reflect on the structural issues identified across all documents and plan improvements. Separate easy fixes from major decisions.

      In the scratchpad below, categorize issues and plan targeted improvements:
      <scratchpad>
      <reflection>
      \begin{enumerate}
          \item [Changes to Implement Now (Per Document)]
              \begin{itemize}
                  \item Document 1 transitions: [Add sentences/phrases between paragraphs]
                  \item Document 1 sentence reordering: [Within-section rearrangements]
                  \item Document 1 unused content removal: [Delete clearly disconnected paragraphs]
                  \item Document 2 improvements: [Similar categories]
                  ... [Continue for all documents]
              \end{itemize}
          \item [Major Decisions - Leave as Comments for Human]
              \begin{itemize}
                  \item Cross-document content moves: [Moving content between documents]
                  \item Cross-section paragraph moves: [Within or between documents]
                  \item Content deletion: [Entire paragraphs or substantial cuts]
                  \item Major reorganization: [Reordering sections or documents]
                  \item Systemic changes: [Affecting many sections across documents]
                  \item Uncertain changes: [Where I'm not confident]
              \end{itemize}
          \item [Comment Quality Review]
              \begin{itemize}
                  \item Are cross-document issues clearly flagged?
                  \item Are unused content items identified?
                  \item Are they focused on flow, logic, and structure - not notation or math correctness?
                  \item Have I identified the most critical structural issues?
                  \item Are comments placed at relevant locations?
              \end{itemize}
          \item [Implementation Plan (Per Document)]
              \begin{itemize}
                  \item Document 1 safe changes: [List specific edits including unused content removal]
                  \item Document 1 comments to keep: [Major decisions for human]
                  \item Document 2 safe changes: [List specific edits]
                  \item Document 2 comments to keep: [Major decisions for human]
                  ... [Continue for all documents]
              \end{itemize}
      \end{enumerate}
      </reflection>
      </scratchpad>

      Based on your reflection, output improved versions of all documents where you have:
      - Implemented structural improvements within sections in each document
      - Added \criticize{Fixed: [description]}{severity}{confidence} for all implemented changes except obvious typos
      - Removed clearly unused or disconnected content (documented with comments)
      - Kept all \criticize{Issue: [...]. Suggested fix: [...]}{severity}{confidence} for cross-document issues, cross-section moves, deletions, and systemic changes
      - Improved paragraph flow and coherence actively in each document (documented with comments)
      - Made the logical flow clearer through better organization within sections (documented with comments)

      Remember: Be proactive with improvements that don't cross section boundaries, delete substantial content, or require cross-document coordination, but document all non-trivial changes with comments. Leave major reorganization and cross-document changes as issue comments for the human to decide.

      Ensure that the output documents are in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}

      <latex_documents>
      <document name="{OUTPUT_FILES_ORDER[0]}">
      % 1ST_IMPROVED_LATEX_DOCUMENT_WITH_SAFE_CHANGES_AND_REMAINING_COMMENTS HERE
      </document>
      <document name="{OUTPUT_FILES_ORDER[1]}">
      % 2ND_IMPROVED_LATEX_DOCUMENT_WITH_SAFE_CHANGES_AND_REMAINING_COMMENTS HERE
      </document>
      ... (repeat for all output files)
      </latex_documents>
