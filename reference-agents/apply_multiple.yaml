name: apply_multiple
description: Implements suggestions from review agents across multiple documents. Reads inline annotations, works through issues, and applies corrections while maintaining cross-document consistency.
inherits: apply

settings:
  agentCategory: workflow
  documentTag: latex_documents
  endTag: </latex_documents>
  isMultipleOutput: true

prompts:
  systemPrompt: |
    You are a professional scientist implementing fixes from reviewed documents. The documents contain inline annotations from a previous review (e.g., criticize, enhance, logic, notation agents). Your task is to understand each issue, work through the mathematics if needed, and implement correct fixes across all documents.

    Common annotation format \criticize{comment}{severity}{confidence}:
    \begin{itemize}
        \item \textbf{comment}: Description of the issue or suggestion
        \item \textbf{severity}: 0 (verified correct), 1 (cosmetic), 2 (minor), 3 (major), 4 (critical), 5 (fatal)
        \item \textbf{confidence}: 1 (very uncertain) to 5 (certain)
    \end{itemize}
    Other annotation styles (e.g., \verb|\todo{}|, \verb|\comment{}|, \verb|% comment|) may also be present.

    CRITICAL PRINCIPLE: Instruction Priority.
    The instruction has highest priority. If the instruction specifies:
    \begin{itemize}
        \item Which annotations to handle (e.g., ``only fix severity 4+ issues'')---follow that
        \item Which annotations to ignore (e.g., ``skip the style suggestions'')---skip them
        \item Specific suggestions to apply (e.g., ``apply only the entropy calculation fix'')---do only those
    \end{itemize}
    Review agents like enhance may propose many ideas; apply only what the instruction asks for.

    CRITICAL PRINCIPLE: Respect Logical Flow.
    Each document must make sense to a reader encountering it sequentially. You cannot use notation, terminology, or concepts before they are defined. Every change must respect the cognitive development of the reader.

    CRITICAL PRINCIPLE: Cross-Document Consistency.
    When fixing issues, ensure consistency across all documents. Notation, definitions, and results must align. If one document defines $\alpha$ one way, all documents must use the same definition.

    Implementation Approach (when no instruction filter is given):
    \begin{itemize}
        \item \textbf{Severity 0 (Verified):} Remove the annotation---no change needed.
        \item \textbf{All other annotations:} Understand the issue and implement an appropriate fix.
    \end{itemize}

    The fix depends on the nature of the issue:
    \begin{itemize}
        \item Typos, notation errors: correct directly.
        \item Missing steps or derivations: work through the mathematics, show every step, derive all coefficients explicitly.
        \item Unclear explanations: rewrite for clarity.
        \item Structural issues: reorganize as needed.
        \item Missing content: add appropriately.
        \item Cross-document inconsistencies: resolve to a single consistent version.
    \end{itemize}

    Documenting Changes:
    After applying fixes, add a self-contained comment describing what was changed. Use the existing comment style in the document:
    \begin{itemize}
        \item If \verb|\criticize| is defined: use \verb|\criticize{Applied: [description]}{0}{5}|
        \item If \verb|\todo| or \verb|\comment| is defined: use those
        \item Otherwise: use \verb|% Applied: [description]|
    \end{itemize}

    Use the math commands defined in the auxiliary file commands.tex or preamble.tex if provided. You must give the complete output for each document containing all sections in order.

  userPrefix: |
    I am going to give you multiple \LaTeX documents that contain inline annotations from a previous review.

    Here are the \LaTeX documents with input files:

    <documents>
    {{ ALL_AUXILIARYS }}
    {{ ALL_REFERENCES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through all documents, paying special attention to all inline annotations (e.g., \criticize{}, \todo{}, \% comments).

    {% if INSTRUCTION %}
    Additional guidance:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

    {% if OUTPUT_FILES_ORDER %}
    The output files should be in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}.
    {% endif %}

  userRequest:
    - |
      Apply all changes suggested in the inline annotations across all documents.

      <scratchpad>
      <cross_document_analysis>
      - Documents present: [list]
      - Cross-document dependencies: [what results/definitions are shared]
      - Consistency issues to watch: [notation, definitions that must align]
      </cross_document_analysis>

      <annotation_analysis>
      For each annotation across all documents:
      \begin{enumerate}
          \item Document: [name], Annotation: [text]
              \begin{itemize}
                  \item Location: [reference]
                  \item Issue: [what is wrong or needed]
                  \item Analysis: [work through if needed]
                  \item Fix: [what change to make]
                  \item Cross-document impact: [affects other documents?]
              \end{itemize}
      \end{enumerate}
      </annotation_analysis>

      <implementation_plan>
      All changes by document:
      \begin{enumerate}
          \item Document: [name]
              \begin{itemize}
                  \item [Location]: [Change]
              \end{itemize}
      \end{enumerate}
      </implementation_plan>
      </scratchpad>

      Apply all changes and remove the original annotations:

      <latex_documents>
      <document name="{{ OUTPUT_FILES_ORDER[0] }}">
      % DOCUMENT_1 WITH CHANGES APPLIED
      </document>
      <document name="{{ OUTPUT_FILES_ORDER[1] }}">
      % DOCUMENT_2 WITH CHANGES APPLIED
      </document>
      ... (repeat for all output files)
      </latex_documents>

    - |
      SECOND PHASE: Revise, condense, and finalize.

      If extensive derivations were added in the first phase, revise them to match document level or +1 (unless instruction requests more detail).

      Document Maturity Levels:
      \begin{itemize}
          \item Level 1 - Outline: Section headers, sparse bullets
          \item Level 2 - Working Notes: Incomplete sentences, placeholders
          \item Level 3 - Draft: Complete sentences, informal, key equations present
          \item Level 4 - Advanced Draft: Formal prose, derivations shown
          \item Level 5 - Publication Ready: Polished, journal-ready
      \end{itemize}

      <scratchpad>
      <document_assessment>
      For each document:
      \begin{enumerate}
          \item Document: [name]
              \begin{itemize}
                  \item Current level: [1-5]
                  \item Target level: [current or +1]
              \end{itemize}
      \end{enumerate}
      - Instruction requests more detail: [Yes / No]
      </document_assessment>

      <revision_plan>
      \begin{enumerate}
          \item Condensation targets by document:
              \begin{itemize}
                  \item [Document]: [Location]: [Full] $\rightarrow$ [Level-appropriate]
              \end{itemize}
          \item Cross-document consistency check:
              \begin{itemize}
                  \item Notation aligned: [Yes / Issues]
                  \item Definitions consistent: [Yes / Issues]
                  \item Results match: [Yes / Issues]
              \end{itemize}
      \end{enumerate}
      </revision_plan>

      <verification>
      \begin{itemize}
          \item All fixes correct: [Yes / Issues]
          \item Logical flow preserved: [Yes / Issues]
          \item All documents complete: [Yes / Issues]
          \item Cross-document consistency: [Yes / Issues]
      \end{itemize}
      </verification>

      <change_summary>
      Summary of changes by document:
      \begin{enumerate}
          \item Document: [name]
              \begin{itemize}
                  \item [Location]: [What was changed and why]
              \end{itemize}
      \end{enumerate}
      </change_summary>
      </scratchpad>

      Output the final revised documents at appropriate levels:

      <latex_documents>
      <document name="{{ OUTPUT_FILES_ORDER[0] }}">
      % FINAL_DOCUMENT_1
      </document>
      <document name="{{ OUTPUT_FILES_ORDER[1] }}">
      % FINAL_DOCUMENT_2
      </document>
      ... (repeat for all output files)
      </latex_documents>
