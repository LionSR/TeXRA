packages:
  - packages/*
# One source for every version `packages/agent` redeclares: the SDK keeps its
# own dependency names (pnpm links a workspace package before any build script
# runs), and both manifests take the version from here through `catalog:`.
catalog:
  '@anthropic-ai/claude-agent-sdk': '^0.3.278'
  '@anthropic-ai/sdk': '^0.125.0'
  '@cantoo/pdf-lib': '^2.9.2'
  '@date-fns/tz': '^1.5.0'
  '@effect/platform-node': '4.0.0-rc.117'
  '@effect/sql-sqlite-node': '4.0.0-rc.117'
  '@google/genai': '^2.23.0'
  '@jamesgopsill/crossref-client': '^1.1.0'
  '@jitl/quickjs-wasmfile-release-sync': '0.32.0'
  '@octokit/request': '^10.0.16'
  '@octokit/request-error': '^7.1.2'
  '@openai/codex-sdk': '^0.155.1'
  '@openrouter/sdk': '^1.3.11'
  '@supabase/supabase-js': '2.116.0'
  '@typescript/native': 'npm:typescript@^7.0.2'
  acorn: '^8.18.0'
  acorn-walk: '^8.3.5'
  arxiv-client: '^0.0.9'
  bibtex: '^0.9.0'
  content-disposition: '^3.0.0'
  date-fns: '^4.4.0'
  diff: '^9.0.0'
  diff-match-patch: '^1.0.5'
  effect: '4.0.0-rc.117'
  esbuild: '^0.28.2'
  escape-string-regexp: '^5.0.0'
  execa: '^10.0.1'
  fast-xml-parser: '^5.11.1'
  glob: '^13.0.6'
  http-status-codes: '^2.3.0'
  identifiers-arxiv: '^0.1.1'
  ignore: '^7.0.9'
  image-size: '^2.0.4'
  ipaddr.js: '^2.5.0'
  is-network-error: '^1.3.2'
  is-wsl: '^3.1.1'
  ky: '^2.1.0'
  llm-zoo: '^1.37.0'
  lru-cache: '^11.5.3'
  mime-types: '^3.0.1'
  nanoid: '^6.0.1'
  nunjucks: '^3.2.4'
  openai: '^7.20.0'
  pathe: '^2.0.3'
  pdf2pic: '^3.2.0'
  postal-mime: '^3.0.0'
  pretty-ms: '^9.3.1'
  quickjs-emscripten-core: '0.32.0'
  safe-stable-stringify: '^2.5.0'
  shell-quote: '^1.10.0'
  tar: '^7.5.22'
  tree-kill: '^1.2.2'
  turndown: '^7.2.4'
  turndown-plugin-gfm: '^1.0.2'
  typescript: 'npm:@typescript/typescript6@^6.0.2'
  undici: '^8.10.2'
  which: '^5.0.0'
  write-file-atomic: '^7.0.1'
  yaml: '^2.9.1'
  zod: '^4.4.3'
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
allowBuilds:
  '@google/genai': true
  '@openrouter/sdk': true
  '@vscode/vsce-sign': true
  electron-winstaller: true
  esbuild: true
  keytar: true
  # Optional native accelerator for msgpackr (via effect); the pure-JS
  # fallback is sufficient, so skip its node-gyp build.
  msgpackr-extract: false
  node-pty: true
  protobufjs: true
  unrs-resolver: true
patchedDependencies:
  ink@7.1.1: patches/ink@7.1.1.patch
  openai@7.20.0: patches/openai@7.20.0.patch
# pnpm 11 enables a 24h minimumReleaseAge supply-chain quarantine by default,
# which blocked same-day dependency bumps (e.g. a fresh llm-zoo for a new model)
# until they aged out, forcing a per-package allowlist. Disable it repo-wide so
# reviewed bumps land immediately.
minimumReleaseAge: 0
