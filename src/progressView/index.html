<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} vscode-resource: 'unsafe-inline'; script-src 'nonce-${nonce}'; font-src ${cspSource} vscode-resource:; img-src ${cspSource} data: https:;"
    />
    <link rel="stylesheet" href="${commonStyleUri}" />
    <link rel="stylesheet" href="${styleUri}" />
    <link rel="stylesheet" href="${codiconUri}" />
    <style>
      /* Removed duplicate log group styles - these are already defined in groups.css */
    </style>
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "split.js": "${splitJsUri}",
          "marked": "https://esm.sh/marked@9.1.5",
          "./modules/stateManager.js": "${stateManagerUri}",
          "./modules/messageHandlers.js": "${messageHandlersUri}",
          "./modules/domHandlers.js": "${domHandlersUri}",
          "./modules/constants.js": "${constantsUri}",
          "./modules/logFormatters.js": "${logFormattersUri}",
          "@common/vscodeApi.js": "${vscodeApiUri}",
          "@common/webviewState.js": "${webviewStateUri}",
          "@common/templateUtils.js": "${templateUtilsUri}",
          "@common/domUtils.js": "${domUtilsUri}",
          "@common/stringUtils.js": "${stringUtilsUri}",
          "@common/messageRouter.js": "${messageRouterUri}"
        }
      }
    </script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
  </head>

  <body>
    <div class="main-container">
      <div class="content-area split">
        <div class="log-header">
          <div class="header-left">
            <span id="currentStreamName"></span>
            <span
              id="statusIndicator"
              class="status-indicator stopped"
              data-status="Ready"
            ></span>
            <span id="runSummary" class="run-summary"></span>
          </div>
          <div id="toolbarContainer" class="header-actions button-group"></div>
        </div>
        <div id="logContent" class="log-container"></div>
        <div id="generatedFiles" class="files-container"></div>
        <template id="fileItemTemplate">
          <div class="file-item">
            <span class="file-name">
              <span class="file-path clickable">
                <span class="file-dir"></span>
                <span class="file-basename"></span>
              </span>
            </span>
            <span class="file-stats"></span>
            <span class="file-actions button-group">
              <button
                class="vscode-button tiny compare-btn"
                title="Compare with base"
              >
                <i class="codicon codicon-diff"></i>
              </button>
              <button
                class="vscode-button tiny accept-btn"
                title="Accept edits"
              >
                <i class="codicon codicon-check"></i>
              </button>
              <button class="vscode-button tiny merge-btn" title="Merge edits">
                <i class="codicon codicon-git-merge"></i>
              </button>
              <button class="vscode-button tiny diff-btn" title="LaTeXdiff">
                <i class="codicon codicon-git-compare"></i>
              </button>
              <button
                class="vscode-button tiny prev-btn"
                title="Compare with previous round"
              >
                <i class="codicon codicon-diff-added"></i>
              </button>
            </span>
          </div>
        </template>
      </div>
      <div class="tabs split">
        <div id="streamTabs" class="tabs-content">
          <!-- Stream tabs will be dynamically inserted here -->
        </div>
        <div class="clear-all-container">
          <button class="clear-button danger" id="deleteAllBtn">
            <i class="codicon codicon-close-all"></i> Delete All
          </button>
        </div>
      </div>
    </div>
    <template id="iconButtonTemplate">
      <button class="vscode-button">
        <i class="codicon"></i>
      </button>
    </template>
  </body>
</html>
