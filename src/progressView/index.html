<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} vscode-resource: 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'nonce-${nonce}' https://esm.sh; font-src ${cspSource} vscode-resource: https://cdn.jsdelivr.net; img-src ${cspSource} data: https:;"
    />
    <link rel="stylesheet" href="${commonStyleUri}" />
    <link rel="stylesheet" href="${styleUri}" />
    <link rel="stylesheet" href="${codiconUri}" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/copy-tex.min.css"
    />
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "split.js": "${splitJsUri}",
          "markdown-it": "https://esm.sh/markdown-it@14.1.0",
          "@vscode/markdown-it-katex": "https://esm.sh/@vscode/markdown-it-katex@1.1.1",
          "./modules/progressViewState.js": "${progressViewStateUri}",
          "./modules/messageHandlers.js": "${messageHandlersUri}",
          "./modules/domHandlers.js": "${domHandlersUri}",
          "./modules/constants.js": "${constantsUri}",
          "./modules/formatters.js": "${formattersUri}",
          "./modules/taskManagers.js": "${taskManagersUri}",
          "./modules/usageManagers.js": "${usageManagersUri}",
          "./modules/uiManagers/StreamTabs.js": "${streamTabsUri}",
          "./modules/uiManagers/Toolbar.js": "${toolbarUri}",
          "./modules/uiManagers/Status.js": "${statusUri}",
          "./modules/uiManagers/FileList.js": "${fileListUri}",
          "./modules/uiManagers/EventsManager.js": "${eventsUri}",
          "./modules/katexMacros.js": "${katexMacrosUri}",
          "@common/webviewContext.js": "${webviewContextUri}",
          "@common/webview/commands.js": "${commandsUri}",
          "@common/webviewState.js": "${webviewStateUri}",
          "@common/templateUtils.js": "${templateUtilsUri}",
          "@common/domUtils.js": "${domUtilsUri}",
          "@common/stringUtils.js": "${stringUtilsUri}",
          "he": "https://esm.sh/he@1.2.0"
        }
      }
    </script>
    <script type="module" nonce="${nonce}">
      import 'https://esm.sh/katex@0.16.22/dist/contrib/copy-tex';
    </script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
  </head>

  <body>
    <div class="main-container">
      <div class="content-area split">
        <div class="log-header">
          <div class="header-left">
            <span id="activeStreamName"></span>
            <span
              id="statusIndicator"
              class="status-indicator stopped"
              data-status="Ready"
            ></span>
            <span id="runSummary" class="run-summary"></span>
          </div>
          <div id="toolbarContainer" class="header-actions button-group"></div>
        </div>
        <div id="logContent" class="log-container"></div>
        <div id="generatedFiles" class="files-container"></div>
        <template id="fileItemTemplate">
          <div class="file-item">
            <span class="file-name">
              <span class="file-path clickable-link">
                <span class="file-dir"></span>
                <span class="file-basename"></span>
              </span>
            </span>
            <span class="file-stats"></span>
            <span class="file-actions button-group">
              <button
                class="vscode-button compare-btn"
                title="Compare with base"
              >
                <i class="codicon codicon-diff"></i>
              </button>
              <button class="vscode-button accept-btn" title="Accept edits">
                <i class="codicon codicon-check"></i>
              </button>
              <button class="vscode-button merge-btn" title="Merge edits">
                <i class="codicon codicon-git-merge"></i>
              </button>
              <button class="vscode-button diff-btn" title="LaTeXdiff">
                <i class="codicon codicon-diff-single"></i>
              </button>
              <button
                class="vscode-button prev-btn"
                title="Compare with previous round"
              >
                <i class="codicon codicon-diff-added"></i>
              </button>
            </span>
          </div>
        </template>
        <template id="usageTemplate">
          <span class="group-usage">
            <i class="codicon codicon-arrow-up"></i>
            <span class="usage-input"></span>,
            <i class="codicon codicon-arrow-down"></i>
            <span class="usage-output"></span>, $<span
              class="usage-cost"
            ></span>
          </span>
        </template>
        <template id="bulletTemplate">
          <i class="codicon codicon-circle-small-filled group-bullet"></i>
        </template>
        <template id="streamTabTemplate">
          <div class="tab-container" data-stream="" title="">
            <div class="tab-main">
              <span class="tab-title"></span>
              <i class="agent-type"></i>
              <i class="multi-file"></i>
            </div>
            <div class="tab-meta">
              <span class="model"></span>
              <span class="last-active"></span>
            </div>
            <button class="tab-delete" data-stream="" title="Delete stream">
              <i class="codicon codicon-close"></i>
            </button>
          </div>
        </template>
        <template id="roundHeaderTemplate">
          <div class="round-group">
            <div class="round-header"></div>
          </div>
        </template>
      </div>
      <div class="tabs split">
        <div id="streamTabs" class="tabs-content">
          <!-- Stream tabs will be dynamically inserted here -->
        </div>
        <div class="clear-all-container">
          <button class="clear-button" id="deleteAllBtn">
            <i class="codicon codicon-close-all"></i> Delete All
          </button>
        </div>
      </div>
    </div>
    <template id="iconButtonTemplate">
      <button class="vscode-button">
        <i class="codicon"></i>
      </button>
    </template>
  </body>
</html>
