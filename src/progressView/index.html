<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} vscode-resource: 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'nonce-${nonce}' https://esm.sh; connect-src https://esm.sh; font-src ${cspSource} vscode-resource: https://cdn.jsdelivr.net; img-src ${cspSource} data: https:;"
    />
    <link rel="stylesheet" href="${commonStyleUri}" />
    <link rel="stylesheet" href="${styleUri}" />
    <link
      rel="stylesheet"
      href="${codiconUri}"
      id="vscode-codicon-stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
    />
    <link
      id="hljs-theme"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.css"
    />
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "markdown-it": "https://esm.sh/markdown-it@14.1.0",
          "@vscode/markdown-it-katex": "https://esm.sh/@vscode/markdown-it-katex@1.1.2",
          "./modules/progressViewState.js": "${progressViewStateUri}",
          "./modules/messageHandlers.js": "${messageHandlersUri}",
          "./modules/domHandlers.js": "${domHandlersUri}",
          "./modules/constants.js": "${constantsUri}",
          "./modules/formatters.js": "${formattersUri}",
          "./modules/utils.js": "${utilsUri}",
          "./modules/taskManagers.js": "${taskManagersUri}",
          "./modules/usageManagers.js": "${usageManagersUri}",
          "./modules/uiManagers/StreamTabs.js": "${streamTabsUri}",
          "./modules/uiManagers/Toolbar.js": "${toolbarUri}",
          "./modules/uiManagers/Status.js": "${statusUri}",
          "./modules/uiManagers/FileList.js": "${fileListUri}",
          "./modules/uiManagers/EventsManager.js": "${eventsUri}",
          "./modules/uiManagers/Placeholder.js": "${placeholderUri}",
          "./modules/uiManagers/RunSelector.js": "${runSelectorUri}",
          "./modules/uiManagers/InstructionPanel.js": "${instructionPanelUri}",
          "./modules/uiManagers/FollowUpInputManager.js": "${followUpInputManagerUri}",
          "./modules/uiManagers/ApprovalRequests.js": "${approvalRequestsUri}",
          "./modules/uiManagers/RetryRequests.js": "${retryRequestsUri}",
          "./modules/uiManagers/TodoList.js": "${todoListUri}",
          "./modules/uiManagers/BaseUIRequestManager.js": "${baseUIRequestManagerUri}",
          "./modules/handlers/themeHandlers.js": "${themeHandlersUri}",
          "./modules/katexMacros.js": "${katexMacrosUri}",
          "@common/webviewContext.js": "${webviewContextUri}",
          "@common/webview/commands.js": "${commandsUri}",
          "@common/webview/themeHandlers.js": "${webviewThemeHandlersUri}",
          "@common/webviewState.js": "${webviewStateUri}",
          "@common/templateUtils.js": "${templateUtilsUri}",
          "@common/RecordingButtonManager.js": "${recordingButtonManagerUri}",
          "@common/textareaUtils.js": "${textareaUtilsUri}",
          "@common/modules/files/baseFileUtils.js": "${baseFileUtilsUri}",
          "@common/htmlEncoding.js": "${htmlEncodingUri}",
          "@common/domUtils.js": "${domUtilsUri}",
          "@common/BaseDomHandler.js": "${baseDomHandlerUri}",
          "@common/stringUtils.js": "${stringUtilsUri}",
          "@common/pathUtils.js": "${pathUtilsUri}",
          "@common/constants/streamStatus": "${streamStatusUri}",
          "@common/constants/todoStatus": "${todoStatusUri}",
          "@common/ToggleStateStore.js": "${toggleStateStoreUri}",
          "@common/iconConstants.js": "${iconConstantsUri}",
          "@common/BaseWebviewMessageHandler.js": "${baseWebviewMessageHandlerUri}",
          "@common/clipboardUtils.js": "${clipboardUtilsUri}",
          "he": "https://esm.sh/he@1.2.0",
          "highlight.js": "https://esm.sh/highlight.js@11.11.1",
          "markdown-it-highlightjs": "https://esm.sh/markdown-it-highlightjs@4.2.0",
          "yaml": "https://esm.sh/yaml@2.8.1"
        }
      }
    </script>
    <script type="module" nonce="${nonce}">
      import 'https://esm.sh/katex@0.16.22/dist/contrib/copy-tex';
    </script>
    <script
      type="module"
      nonce="${nonce}"
      src="${vscodeElementsBundleUri}"
    ></script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
  </head>

  <body>
    <div class="main-container">
      <vscode-split-layout initial-handle-position="80%">
        <div slot="start" class="content-area">
          <div class="log-header">
            <div class="log-header__primary">
              <div class="header-left">
                <div class="stream-header">
                  <span id="activeStreamName"></span>
                </div>
                <span
                  id="statusIndicator"
                  class="status-indicator is-stopped"
                  data-status="Ready"
                ></span>
              </div>
              <vscode-toolbar-container
                id="toolbarContainer"
                class="header-actions"
              ></vscode-toolbar-container>
            </div>
            <div
              class="log-header__secondary"
              id="runSelectorRow"
              hidden
              aria-hidden="true"
            >
              <div class="run-selector-title" aria-hidden="true">
                <i class="codicon codicon-history"></i>
                <span>Sessions</span>
              </div>
              <vscode-single-select
                id="runSelector"
                class="run-selector"
                aria-label="Select session"
                disabled
                hidden
              >
                <span slot="placeholder">No sessions</span>
              </vscode-single-select>
            </div>
          </div>
          <div
            id="instructionContainer"
            class="instruction-panel"
            aria-hidden="true"
          >
            <div class="instruction-panel__header">
              <span class="instruction-panel__title">
                <i class="codicon codicon-notebook"></i>
                <span>Instructions</span>
              </span>
              <vscode-toolbar-container class="instruction-panel__actions">
                <vscode-toolbar-button
                  id="instructionCopyBtn"
                  class="instruction-panel__copy"
                  icon="copy"
                  label="Copy instruction"
                  title="Copy instruction"
                  data-default-title="Copy instruction"
                  data-success-title="Copied!"
                ></vscode-toolbar-button>
              </vscode-toolbar-container>
            </div>
            <div class="instruction-panel__body" role="presentation">
              <vscode-textarea
                id="instructionText"
                class="instruction-panel__text"
                readonly
                resize="none"
                rows="8"
              ></vscode-textarea>
            </div>
          </div>
          <div id="approvalRequests" class="approval-requests" hidden>
            <div class="approval-requests__header">
              <i class="codicon codicon-diff"></i>
              <span>Pending approvals</span>
            </div>
            <div class="approval-requests__list"></div>
          </div>
          <div id="retryRequests" class="retry-requests" hidden>
            <div class="retry-requests__header">
              <i class="codicon codicon-refresh"></i>
              <span>Retry available</span>
            </div>
            <div class="retry-requests__list"></div>
          </div>
          <vscode-scrollable
            id="logContent"
            class="log-container"
          ></vscode-scrollable>
          <div id="generatedFiles" class="files-container"></div>
          <div
            id="todoListContainer"
            class="todo-list-container"
            hidden
            aria-hidden="true"
          >
            <div class="todo-list__header">
              <i class="codicon codicon-tasklist"></i>
              <span>Task Progress</span>
            </div>
            <div id="todoList" class="todo-list"></div>
          </div>
          <div class="usage-summary-footer" hidden>
            <span id="runSummary" class="run-summary"></span>
          </div>
          <div id="followUpContainer" class="follow-up-container">
            <vscode-textarea
              id="followUpInput"
              placeholder="Send follow-up message"
              rows="10"
              resize="vertical"
            ></vscode-textarea>
            <div class="follow-up-actions">
              <vscode-toolbar-button
                id="polishFollowUpBtn"
                icon="sparkle"
                label="Polish follow-up"
                title="Polish follow-up with AI"
              ></vscode-toolbar-button>
              <vscode-progress-ring
                id="polishFollowUpProgressContainer"
                style="display: none; width: 16px; height: 16px"
              ></vscode-progress-ring>
              <vscode-toolbar-button
                id="resetApprovalBypassBtn"
                icon="shield"
                label="Resume approval prompts"
                title="Resume approval prompts"
                hidden
              ></vscode-toolbar-button>
              <vscode-toolbar-button
                id="recordFollowUpBtn"
                icon="mic"
                label="Record follow-up"
                title="Record follow-up with microphone"
              ></vscode-toolbar-button>
              <vscode-toolbar-button
                id="clearFollowUpBtn"
                icon="clear-all"
                label="Clear input"
                title="Clear input"
              ></vscode-toolbar-button>
              <vscode-toolbar-button
                id="sendFollowUpBtn"
                icon="send"
                label="Send"
                title="Send follow-up message"
              ></vscode-toolbar-button>
            </div>
          </div>
          <template id="fileItemTemplate">
            <div class="file-item">
              <span class="file-name">
                <span class="file-path clickable-link">
                  <span class="file-dir"></span>
                  <span class="file-basename"></span>
                </span>
              </span>
              <span class="file-stats"></span>
              <vscode-toolbar-container class="file-actions">
                <vscode-toolbar-button
                  class="compare-btn"
                  icon="diff"
                  label="Compare with base"
                  title="Compare with base"
                ></vscode-toolbar-button>
                <vscode-toolbar-button
                  class="accept-btn"
                  icon="check"
                  label="Accept edits"
                  title="Accept edits"
                ></vscode-toolbar-button>
                <vscode-toolbar-button
                  class="merge-btn"
                  icon="git-merge"
                  label="Merge edits"
                  title="Merge edits"
                ></vscode-toolbar-button>
                <vscode-toolbar-button
                  class="diff-btn"
                  icon="diff-single"
                  label="LaTeXdiff"
                  title="LaTeXdiff"
                ></vscode-toolbar-button>
                <vscode-toolbar-button
                  class="prev-btn"
                  icon="diff-added"
                  label="Compare with previous round"
                  title="Compare with previous round"
                ></vscode-toolbar-button>
              </vscode-toolbar-container>
            </div>
          </template>
          <template id="usageTemplate">
            <span class="group-usage">
              <i class="codicon codicon-arrow-up"></i>
              <span class="usage-input"></span>,
              <i class="codicon codicon-arrow-down"></i>
              <span class="usage-output"></span>, $<span
                class="usage-cost"
              ></span>
            </span>
          </template>
          <template id="bulletTemplate">
            <i class="codicon codicon-circle-small-filled group-bullet"></i>
          </template>
          <template id="streamTabTemplate">
            <div class="tab-container" title="">
              <button class="tab" data-stream="" title="">
                <div class="tab-header">
                  <span class="tab-status status-indicator"></span>
                  <div class="tab-title"></div>
                </div>
                <div class="tab-meta">
                  <span class="model"></span>
                  <span class="last-active"></span>
                  <i class="remote-agent"></i>
                  <i class="agent-type"></i>
                  <i class="multi-file"></i>
                </div>
              </button>
              <vscode-toolbar-button
                class="tab-delete"
                data-stream=""
                icon="close"
                label="Delete stream"
                title="Delete stream"
              ></vscode-toolbar-button>
            </div>
          </template>
          <template id="roundHeaderTemplate">
            <div class="round-group">
              <div class="round-header"></div>
            </div>
          </template>
          <template id="logLineTemplate">
            <div class="log-line">
              <span class="timestamp"></span> <span class="level"></span
              ><span class="message"></span>
            </div>
          </template>
          <template id="nativeStatusTemplate">
            <div class="native-status-line" role="status">
              <span class="native-status-time"></span>
              <span class="native-status-text"></span>
            </div>
          </template>
          <template id="bannerDetailsTemplate">
            <details class="banner-details">
              <summary class="details-summary">
                <i class="toggle-icon"></i>
                <i class="codicon icon"></i>
                <span class="label"></span>
                <vscode-toolbar-button
                  class="banner-content-copy"
                  icon="copy"
                  label="Copy content"
                  data-default-title="Copy content"
                  data-success-title="Copied!"
                ></vscode-toolbar-button>
              </summary>
              <div
                class="banner-content log-entry-content markdown-content"
              ></div>
            </details>
          </template>
          <template id="toolUseTemplate">
            <details class="banner-details">
              <summary class="details-summary">
                <i class="toggle-icon"></i>
                <i class="codicon codicon-wrench"></i>
                <span class="tool-use-title">Tool Use</span>
              </summary>
              <div class="banner-content log-entry-content"></div>
            </details>
          </template>
          <template id="userMessageTemplate">
            <div class="user-message-container">
              <div class="user-message">
                <div class="user-message-header">
                  <i class="codicon codicon-account user-message-icon"></i>
                  <span class="user-message-timestamp"></span>
                </div>
                <div class="user-message-content"></div>
              </div>
            </div>
          </template>
          <template id="fileListDetailsTemplate">
            <details class="file-list-details detail-section">
              <summary class="details-summary">
                <i class="toggle-icon"></i>
                <i class="codicon codicon-list-tree"></i>
                <span class="summary-text"></span>
              </summary>
              <ul class="file-list-content detail-content detail-list"></ul>
            </details>
          </template>
          <template id="missingOutputsDetailsTemplate">
            <details class="file-list-details detail-section">
              <summary class="details-summary">
                <i class="toggle-icon"></i>
                <i class="codicon codicon-warning"></i>
                <span class="summary-text"></span>
              </summary>
              <ul class="file-list-content detail-content detail-list"></ul>
            </details>
          </template>
          <template id="latexdiffDetailsTemplate">
            <details class="latexdiff-details detail-section" open>
              <summary class="details-summary">
                <i class="toggle-icon"></i>
                <i class="codicon codicon-diff"></i>
                <span class="summary-text"></span>
              </summary>
              <ul class="latexdiff-content detail-content detail-list"></ul>
            </details>
          </template>
          <template id="statisticsDetailsTemplate">
            <details class="statistics-details detail-section" open>
              <summary class="details-summary">
                <i class="toggle-icon"></i>
                <i class="codicon codicon-dashboard"></i>
                <span>Statistics</span>
              </summary>
              <div class="statistics-content detail-content"></div>
            </details>
          </template>
          <template id="groupDetailsTemplate">
            <div class="log-group">
              <div class="log-group-content"></div>
            </div>
          </template>
          <template id="groupHeaderTemplate">
            <summary class="log-group-header">
              <span class="group-status-icon"></span>
              <span class="group-title"></span>
              <span class="group-time">
                <span class="group-start-time"></span>
                <span class="group-duration"></span>
              </span>
            </summary>
          </template>
          <template id="retryRequestTemplate">
            <div class="retry-request">
              <div class="retry-request__details">
                <div class="retry-request__operation"></div>
                <div class="retry-request__meta"></div>
                <div class="retry-request__error"></div>
              </div>
              <vscode-toolbar-container class="retry-request__actions">
                <vscode-toolbar-button
                  icon="refresh"
                  label="Retry"
                  title="Retry"
                  data-action="retry"
                  >Retry</vscode-toolbar-button
                >
                <vscode-toolbar-button
                  icon="close"
                  label="Dismiss"
                  title="Dismiss"
                  data-action="dismiss"
                  >Dismiss</vscode-toolbar-button
                >
              </vscode-toolbar-container>
            </div>
          </template>
          <template id="approvalRequestTemplate">
            <div class="approval-request">
              <div class="approval-request__details">
                <div class="approval-request__path"></div>
                <div class="approval-request__meta"></div>
              </div>
              <vscode-toolbar-container class="approval-request__actions">
                <vscode-toolbar-button
                  icon="diff"
                  label="Open diff"
                  title="Open diff"
                  data-action="open"
                  >Open diff</vscode-toolbar-button
                >
                <vscode-toolbar-button
                  icon="check"
                  label="Approve"
                  title="Approve"
                  data-action="approve"
                  >Approve</vscode-toolbar-button
                >
                <vscode-toolbar-button
                  icon="close"
                  label="Reject"
                  title="Reject"
                  data-action="reject"
                  >Reject</vscode-toolbar-button
                >
                <vscode-toolbar-button
                  icon="shield"
                  label="Approve & Yolo this session"
                  title="Approve & Yolo this session"
                  data-action="approveAll"
                  data-toggle-action="resumeApprovals"
                  toggleable
                  >Yolo</vscode-toolbar-button
                >
              </vscode-toolbar-container>
            </div>
          </template>
        </div>
        <div slot="end" class="tabs">
          <div id="streamTabs" class="tabs-content">
            <!-- Stream tabs will be dynamically inserted here -->
          </div>
          <div class="clear-all-container">
            <vscode-radio-group
              class="agent-filter-group"
              id="agentFilterButtons"
              aria-label="Filter streams by agent type"
            >
              <vscode-radio id="filterAllBtn" value="all" checked
                >All</vscode-radio
              >
              <vscode-radio id="filterWorkflowBtn" value="workflow"
                >Workflow</vscode-radio
              >
              <vscode-radio id="filterToolBtn" value="toolUse"
                >Chat</vscode-radio
              >
            </vscode-radio-group>
            <vscode-toolbar-container id="sortButtons">
              <vscode-toolbar-button
                class="sort-btn"
                id="sortTimeBtn"
                data-sort="time"
                icon="clock"
                label="Sort by time"
              ></vscode-toolbar-button>
              <vscode-toolbar-button
                class="sort-btn"
                id="sortFileBtn"
                data-sort="inputFile"
                icon="file"
                label="Sort by file"
              ></vscode-toolbar-button>
              <vscode-toolbar-button
                class="sort-btn"
                id="sortAgentBtn"
                data-sort="agent"
                icon="account"
                label="Sort by agent"
              ></vscode-toolbar-button>
              <vscode-toolbar-button
                id="deleteAllBtn"
                icon="close-all"
                label="Delete All"
              ></vscode-toolbar-button>
            </vscode-toolbar-container>
          </div>
        </div>
      </vscode-split-layout>
    </div>
    <template id="iconButtonTemplate">
      <vscode-button>
        <i class="codicon"></i>
      </vscode-button>
    </template>
  </body>
</html>
