<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} vscode-resource: 'unsafe-inline'; script-src 'nonce-${nonce}'; font-src ${cspSource} vscode-resource:; img-src ${cspSource} data: https:;"
    />
    <link rel="stylesheet" href="${commonStyleUri}" />
    <link rel="stylesheet" href="${styleUri}" />
    <link rel="stylesheet" href="${codiconUri}" />
    <style>
      /* Removed duplicate log group styles - these are already defined in groups.css */
    </style>
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "split.js": "${splitJsUri}",
          "marked": "https://esm.sh/marked@9.1.5",
          "./modules/vscodeApi.js": "${vscodeApiUri}",
          "./modules/stateManager.js": "${stateManagerUri}",
          "./modules/messageHandlers.js": "${messageHandlersUri}",
          "./modules/domHandlers.js": "${domHandlersUri}",
          "./modules/constants.js": "${constantsUri}",
          "./modules/logFormatters.js": "${logFormattersUri}"
        }
      }
    </script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
  </head>

  <body>
    <div class="main-container">
      <div class="content-area split">
        <div class="log-header">
          <div class="header-left">
            <span id="currentStreamName"></span>
            <span
              id="statusIndicator"
              class="status-indicator stopped"
              data-status="Ready"
            ></span>
            <span id="runSummary" class="run-summary"></span>
          </div>
          <div class="header-actions button-group">
            <button
              class="vscode-button stop-button"
              id="stopStreamBtn"
              disabled
              title="Request task interruption (note: current API call will complete)"
            >
              <span class="codicon codicon-debug-stop"></span>
            </button>
            <button
              class="vscode-button run-button"
              id="runAgainBtn"
              disabled
              title="Run this task again"
            >
              <i class="codicon codicon-debug-rerun"></i>
            </button>
            <button
              class="vscode-button restore-button"
              id="restoreStateBtn"
              disabled
              title="Restore this configuration to the main view"
            >
              <i class="codicon codicon-reply"></i>
            </button>
            <button
              class="vscode-button diff-button"
              id="diffStreamBtn"
              disabled
              title="Run latexdiff on existing tex files"
            >
              <i class="codicon codicon-diff-multiple"></i>
            </button>
            <button
              class="vscode-button pack-button"
              id="packStreamBtn"
              disabled
              title="Pack the output for this agent into the History folder"
            >
              <i class="codicon codicon-archive"></i>
            </button>
            <button
              class="vscode-button clean-button"
              id="cleanStreamBtn"
              disabled
              title="Clean the output for this agent"
            >
              <i class="codicon codicon-trash"></i>
            </button>
            <button
              class="vscode-button clear-button"
              id="eraseStreamBtn"
              title="Erase the stream output for this agent"
            >
              <i class="codicon codicon-clear-all"></i>
            </button>
          </div>
        </div>
        <div id="logContent" class="log-container"></div>
        <div id="generatedFiles" class="files-container"></div>
      </div>
      <div class="tabs split">
        <div id="streamTabs" class="tabs-content">
          <!-- Stream tabs will be dynamically inserted here -->
        </div>
        <div class="clear-all-container">
          <button class="clear-button danger" id="deleteAllBtn">
            <i class="codicon codicon-close-all"></i> Delete All
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
