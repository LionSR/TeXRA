<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} vscode-resource: 'unsafe-inline'; script-src 'nonce-${nonce}' https://cdnjs.cloudflare.com https://esm.sh; connect-src https://cdnjs.cloudflare.com https://esm.sh; font-src ${cspSource} vscode-resource:;"
    />
    <link rel="stylesheet" href="${commonStyleUri}" />
    <link rel="stylesheet" href="${styleUri}" />
    <link
      rel="stylesheet"
      href="${codiconUri}"
      id="vscode-codicon-stylesheet"
    />
    <title>TeXRA History</title>
    <script
      nonce="${nonce}"
      src="https://cdnjs.cloudflare.com/ajax/libs/mark.js/8.11.1/mark.min.js"
    ></script>
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "./modules/domHandlers.js": "${domHandlersUri}",
          "./modules/constants.js": "${constantsUri}",
          "./modules/uiManagers/HistoryEventsManager.js": "${eventsUri}",
          "./modules/uiManagers/HistoryRenderer.js": "${historyRendererUri}",
          "./modules/historyViewState.js": "${historyViewStateUri}",
          "./modules/uiManagers/SearchManager.js": "${searchManagerUri}",
          "./modules/messageHandlers.js": "${messageHandlersUri}",
          "@common/webviewState.js": "${webviewStateUri}",
          "@common/webview/commands.js": "${commandsUri}",
          "@common/webviewContext.js": "${webviewContextUri}",
          "@common/domUtils.js": "${domUtilsUri}",
          "@common/debounce.js": "${debounceUri}",
          "@common/templateUtils.js": "${templateUtilsUri}",
          "@common/htmlEncoding.js": "${htmlEncodingUri}",
          "@common/iconConstants.js": "${iconConstantsUri}",
          "@common/BaseWebviewMessageHandler.js": "${baseWebviewMessageHandlerUri}",
          "@common/BaseDomHandler.js": "${baseDomHandlerUri}",
          "@common/ToggleStateStore.js": "${toggleStateStoreUri}",
          "@common/constants/agentTypes.js": "${agentTypesUri}",
          "he": "https://esm.sh/he@1.2.0"
        }
      }
    </script>
    <script
      type="module"
      nonce="${nonce}"
      src="${vscodeElementsBundleUri}"
    ></script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
  </head>

  <body>
    <div class="view-header">
      <div class="view-header__primary">
        <div class="view-header__titles">
          <h2 class="view-header__title">Agent Execution History</h2>
          <p class="view-header__subtitle">
            Search and revisit your previous sessions
          </p>
        </div>
      </div>
      <div id="searchContainer" class="view-header__secondary search-container">
        <vscode-textfield
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Search history items..."
        ></vscode-textfield>
        <vscode-toolbar-container class="search-controls view-header__actions">
          <vscode-toolbar-button
            id="prevMatch"
            class="search-nav-btn"
            icon="chevron-up"
            label="Previous match"
            title="Previous match"
          ></vscode-toolbar-button>
          <vscode-toolbar-button
            id="nextMatch"
            class="search-nav-btn"
            icon="chevron-down"
            label="Next match"
            title="Next match"
          ></vscode-toolbar-button>
          <span id="matchCount" class="match-count"></span>
        </vscode-toolbar-container>
      </div>
    </div>

    <div id="clearButtonContainer">
      <!-- Clear button will be added here if history items exist -->
    </div>

    <div id="historyContainer" class="history-container">
      <!-- History items will be inserted here -->
    </div>
    <template id="historyItemTemplate">
      <div class="history-item">
        <div class="history-item-header">
          <div class="history-timestamp"></div>
          <vscode-toolbar-container class="history-actions">
            <vscode-toolbar-button
              class="delete-btn"
              icon="trash"
              label="Delete"
              title="Delete"
            ></vscode-toolbar-button>
            <vscode-toolbar-button
              class="restore-btn"
              icon="reply"
              label="Restore"
              title="Restore"
            ></vscode-toolbar-button>
            <vscode-toolbar-button
              class="rerun-btn"
              icon="debug-rerun"
              label="Rerun"
              title="Rerun"
            ></vscode-toolbar-button>
          </vscode-toolbar-container>
        </div>
        <div class="history-details basic-details"></div>
        <vscode-collapsible class="history-collapsible">
          <div class="history-details extra-details"></div>
        </vscode-collapsible>
      </div>
    </template>
  </body>
</html>
