<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} vscode-resource: 'unsafe-inline'; script-src 'nonce-${nonce}' https://cdnjs.cloudflare.com; font-src ${cspSource} vscode-resource:;"
    />
    <link rel="stylesheet" href="${commonStyleUri}" />
    <link rel="stylesheet" href="${styleUri}" />
    <link rel="stylesheet" href="${codiconUri}" />
    <title>TeXRA History</title>
    <script
      nonce="${nonce}"
      src="https://cdnjs.cloudflare.com/ajax/libs/mark.js/8.11.1/mark.min.js"
    ></script>
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "./modules/domHandlers.js": "${domHandlersUri}",
          "./modules/constants.js": "${constantsUri}",
          "./modules/uiManagers/Events.js": "${eventsUri}",
          "./modules/uiManagers/HistoryRenderer.js": "${historyRendererUri}",
          "./modules/historyViewState.js": "${historyViewStateUri}",
          "./modules/uiManagers/SearchManager.js": "${searchManagerUri}",
          "./modules/messageHandlers.js": "${messageHandlersUri}",
          "@common/webviewState.js": "${webviewStateUri}",
          "@common/webview/commands.js": "${commandsUri}",
          "@common/webviewContext.js": "${webviewContextUri}",
          "@common/templateUtils.js": "${templateUtilsUri}",
          "@common/domUtils.js": "${domUtilsUri}"
        }
      }
    </script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
  </head>

  <body>
    <div>
      <h2>Agent Execution History</h2>

      <div id="searchContainer" class="search-container">
        <input
          type="text"
          id="searchInput"
          class="search-input vscode-input"
          placeholder="Search history items..."
        />
        <div class="search-controls">
          <button
            id="prevMatch"
            class="vscode-button search-nav-btn"
            title="Previous match"
          >
            <i class="codicon codicon-chevron-up"></i>
          </button>
          <button
            id="nextMatch"
            class="vscode-button search-nav-btn"
            title="Next match"
          >
            <i class="codicon codicon-chevron-down"></i>
          </button>
          <span id="matchCount" class="match-count"></span>
        </div>
      </div>

      <div id="clearButtonContainer">
        <!-- Clear button will be added here if history items exist -->
      </div>

      <div id="historyContainer" class="history-container">
        <!-- History items will be inserted here -->
      </div>
      <template id="historyItemTemplate">
        <div class="history-item">
          <div class="history-item-header">
            <div class="history-timestamp"></div>
            <div class="history-actions button-group"></div>
          </div>
          <div class="history-details basic-details"></div>
          <div class="collapsible">
            <div class="history-details"></div>
          </div>
          <button class="toggle-button"></button>
        </div>
      </template>
      <template id="iconButtonTemplate">
        <button class="vscode-button">
          <i class="codicon"></i>
        </button>
      </template>
    </div>
  </body>
</html>
