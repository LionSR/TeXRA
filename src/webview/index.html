<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} vscode-resource: 'unsafe-inline'; script-src 'nonce-${nonce}' https://cdnjs.cloudflare.com; img-src https: vscode-resource:; font-src ${cspSource} vscode-resource:;"
    />
    <link rel="stylesheet" href="${commonStyleUri}" />
    <link rel="stylesheet" href="${styleUri}" />
    <link rel="stylesheet" href="${codiconUri}" />
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "./modules/stateManager.js": "${stateManagerUri}",
          "./modules/fileHandlers.js": "${fileHandlersUri}",
          "./modules/uiHandlers.js": "${uiHandlersUri}",
          "./modules/messageHandlers.js": "${messageHandlersUri}",
          "./modules/utils.js": "${utilsUri}",
          "@common/vscodeApi.js": "${vscodeApiUri}",
          "@common/webviewState.js": "${webviewStateUri}",
          "@common/templateUtils.js": "${templateUtilsUri}",
          "sortablejs": "https://cdn.skypack.dev/sortablejs"
        }
      }
    </script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
  </head>

  <body>
    <div class="content-wrapper">
      <div class="main-content">
        <div class="file-selection-group">
          <div class="file-select">
            <div class="file-select-header">
              <div class="file-select-label-group">
                <label for="inputFile"
                  ><i
                    class="codicon codicon-file-code clickable"
                    title="Input (Click to refresh)"
                  ></i>
                  Input</label
                >
              </div>
              <div class="file-select-actions button-group">
                <button
                  id="currentInputFileButton"
                  class="vscode-button"
                  title="Set current file as input"
                >
                  <i class="codicon codicon-file-code"></i>
                </button>
                <button
                  id="emptyInputFileButton"
                  class="vscode-button"
                  title="Empty"
                >
                  <i class="codicon codicon-close"></i>
                </button>
                <span id="toggleInputFiles" class="toggle-icon" title="Multiple"
                  ><i class="codicon codicon-chevron-down"></i
                ></span>
                <button
                  id="addOpenedInputFilesButton"
                  class="vscode-button"
                  title="Add opened files as input"
                >
                  <i class="codicon codicon-folder-opened"></i>
                </button>
                <button
                  id="emptyInputFilesButton"
                  class="vscode-button"
                  title="Empty"
                >
                  <i class="codicon codicon-trash"></i>
                </button>
                <button
                  id="selectInputFilesButton"
                  class="vscode-button"
                  title="Add"
                >
                  <i class="codicon codicon-add"></i>
                </button>
              </div>
            </div>
            <select id="inputFile">
              <option value="">None</option>
            </select>
            <div
              id="inputFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="inputFiles" class="multiple-files-list"></div>
              </div>
            </div>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <label for="referenceFile"
                ><i
                  class="codicon codicon-book clickable"
                  title="Reference (Click to refresh)"
                ></i>
                Reference</label
              >
              <div class="file-select-actions button-group">
                <button
                  id="currentReferenceFileButton"
                  class="vscode-button"
                  title="Set current file as reference"
                >
                  <i class="codicon codicon-file-code"></i>
                </button>
                <button
                  id="emptyReferenceFileButton"
                  class="vscode-button"
                  title="Empty"
                >
                  <i class="codicon codicon-close"></i>
                </button>
                <span
                  id="toggleReferenceFiles"
                  class="toggle-icon"
                  title="Multiple"
                  ><i class="codicon codicon-chevron-down"></i
                ></span>
                <button
                  id="addOpenedReferenceFilesButton"
                  class="vscode-button"
                  title="Add opened files as reference"
                >
                  <i class="codicon codicon-folder-opened"></i>
                </button>
                <button
                  id="emptyReferenceFilesButton"
                  class="vscode-button"
                  title="Empty"
                >
                  <i class="codicon codicon-trash"></i>
                </button>
                <button
                  id="selectReferenceFilesButton"
                  class="vscode-button"
                  title="Add"
                >
                  <i class="codicon codicon-add"></i>
                </button>
              </div>
            </div>
            <select id="referenceFile">
              <option value="">None</option>
            </select>
            <div
              id="referenceFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="referenceFiles" class="multiple-files-list"></div>
              </div>
            </div>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <label for="auxiliaryFile"
                ><i
                  class="codicon codicon-file-add clickable"
                  title="Auxiliary (Click to refresh)"
                ></i>
                Auxiliary</label
              >
              <div class="file-select-actions button-group">
                <button
                  id="currentAuxiliaryFileButton"
                  class="vscode-button"
                  title="Set current file as auxiliary"
                >
                  <i class="codicon codicon-file-code"></i>
                </button>
                <button
                  id="emptyAuxiliaryFileButton"
                  class="vscode-button"
                  title="Empty"
                >
                  <i class="codicon codicon-close"></i>
                </button>
                <span
                  id="toggleAuxiliaryFiles"
                  class="toggle-icon"
                  title="Multiple"
                  ><i class="codicon codicon-chevron-down"></i
                ></span>
                <button
                  id="addOpenedAuxiliaryFilesButton"
                  class="vscode-button"
                  title="Add opened files as auxiliary"
                >
                  <i class="codicon codicon-folder-opened"></i>
                </button>
                <button
                  id="emptyAuxiliaryFilesButton"
                  class="vscode-button"
                  title="Empty"
                >
                  <i class="codicon codicon-trash"></i>
                </button>
                <button
                  id="selectAuxiliaryFilesButton"
                  class="vscode-button"
                  title="Add"
                >
                  <i class="codicon codicon-add"></i>
                </button>
              </div>
            </div>
            <select id="auxiliaryFile">
              <option value="">None</option>
            </select>
            <div
              id="auxiliaryFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="auxiliaryFiles" class="multiple-files-list"></div>
              </div>
            </div>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <div class="file-select-label-group">
                <label for="mediaFile"
                  ><i
                    class="codicon codicon-file-media clickable"
                    title="Media (Click to refresh)"
                  ></i>
                  Media</label
                >
                <div class="dropdown-container dropdown-left">
                  <span
                    id="toggleAutoExtract"
                    class="auto-toggle"
                    title="Auto-extract options"
                  >
                    <i class="codicon codicon-wand"></i
                    ><i class="codicon codicon-chevron-down"></i>
                  </span>
                  <div
                    id="autoExtractOptions"
                    class="dropdown-options"
                    style="display: none"
                  >
                    <label class="vscode-checkbox"
                      ><input type="checkbox" id="autoExtractFigure" /><i
                        class="codicon codicon-file-media"
                      ></i
                      >Figures</label
                    >
                    <label class="vscode-checkbox"
                      ><input type="checkbox" id="autoExtractTikzFigure" /><i
                        class="codicon codicon-file-code"
                      ></i
                      >TikZ Figures</label
                    >
                    <label class="vscode-checkbox"
                      ><input type="checkbox" id="autoCompileInputPdf" /><i
                        class="codicon codicon-file-pdf"
                      ></i
                      >Compile Input PDF</label
                    >
                  </div>
                </div>
              </div>
              <div class="file-select-actions button-group">
                <button
                  id="emptyMediaFileButton"
                  class="vscode-button"
                  title="Empty"
                >
                  <i class="codicon codicon-close"></i>
                </button>
                <span id="toggleMediaFiles" class="toggle-icon" title="Multiple"
                  ><i class="codicon codicon-chevron-down"></i
                ></span>
                <button
                  id="emptyMediaFilesButton"
                  class="vscode-button"
                  title="Empty"
                >
                  <i class="codicon codicon-trash"></i>
                </button>
                <button
                  id="selectMediaFilesButton"
                  class="vscode-button"
                  title="Add"
                >
                  <i class="codicon codicon-add"></i>
                </button>
              </div>
            </div>
            <select id="mediaFile">
              <option value="">None</option>
            </select>
            <div
              id="mediaFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="mediaFiles" class="multiple-files-list"></div>
              </div>
            </div>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <div class="file-select-label-group">
                <span
                  id="toggleOutputFiles"
                  class="toggle-icon"
                  title="Multiple"
                  ><i class="codicon codicon-chevron-down"></i
                ></span>
                <span class="optional-label">Multiple Outputs</span>
              </div>
              <div class="file-select-actions button-group">
                <button
                  id="emptyOutputFilesButton"
                  class="vscode-button"
                  title="Empty"
                >
                  <i class="codicon codicon-trash"></i>
                </button>
                <button
                  id="selectOutputFilesButton"
                  class="vscode-button"
                  title="Add"
                >
                  <i class="codicon codicon-add"></i>
                </button>
              </div>
            </div>
            <div
              id="outputFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="outputFiles" class="multiple-files-list"></div>
                <div
                  class="output-filename-override"
                  style="margin-top: var(--spacing-medium)"
                >
                  <div
                    class="file-select-label-group"
                    title="Optional: Customize the output filename (including extension)"
                  >
                    <span id="toggleOutputNameOverride" class="toggle-icon"
                      ><i class="codicon codicon-chevron-right"></i
                    ></span>
                    <span class="optional-label">Output Filename</span>
                    <input
                      type="text"
                      id="outputNameOverride"
                      class="vscode-input"
                      placeholder="(including extension)"
                      style="display: none"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="instruction-box">
          <div class="instruction-header">
            <div class="instruction-header-left">
              <label for="instruction"
                ><i class="codicon codicon-edit"></i> Instruction</label
              >
              <div class="dropdown-container dropdown-left">
                <span
                  id="toggleToolConfig"
                  class="auto-toggle"
                  title="Tool Config options"
                >
                  <i class="codicon codicon-tools"></i
                  ><i class="codicon codicon-chevron-down"></i>
                </span>
                <div
                  id="toolConfigOptions"
                  class="dropdown-options"
                  style="display: none"
                >
                  <label class="vscode-checkbox"
                    ><input type="checkbox" id="reflect" />
                    <i class="codicon codicon-refresh"></i> Reflect</label
                  >
                  <label class="vscode-checkbox"
                    ><input type="checkbox" id="attachTeXCount" />
                    <i class="codicon codicon-symbol-numeric"></i> Attach TeX
                    Count</label
                  >
                  <label class="vscode-checkbox"
                    ><input type="checkbox" id="usePrefillFromInput" />
                    <i class="codicon codicon-edit"></i> Use Prefill from
                    Input</label
                  >
                  <label class="vscode-checkbox"
                    ><input type="checkbox" id="printInputPrompt" />
                    <i class="codicon codicon-file-code"></i> Print Input
                    Prompt</label
                  >
                </div>
              </div>
            </div>
            <div class="instruction-header-actions button-group">
              <button
                id="settingsButton"
                class="vscode-button"
                title="Open Extension Settings"
              >
                <i class="codicon codicon-gear"></i>
              </button>
              <button
                id="historyButton"
                class="vscode-button"
                title="Open Agent Execution History"
              >
                <i class="codicon codicon-history"></i>
              </button>
              <button
                id="packButton"
                class="vscode-button"
                title="Pack the output for this agent into the History folder"
              >
                <i class="codicon codicon-archive"></i>
              </button>
              <button
                id="cleanButton"
                class="vscode-button"
                title="Clean the output for this agent"
              >
                <i class="codicon codicon-trash"></i>
              </button>
              <button
                id="magicPolishButton"
                class="vscode-button"
                title="Polish instruction text with AI"
              >
                <i class="codicon codicon-sparkle"></i>
              </button>
              <button
                id="eraseInstructionButton"
                class="vscode-button"
                title="Erase Instruction"
              >
                <i class="codicon codicon-clear-all"></i>
              </button>
            </div>
          </div>
          <textarea
            id="instruction"
            class="vscode-textarea"
            placeholder="Enter your specific instruction such as: Gently correct mathematical mistakes and typos."
          ></textarea>
          <div class="model-selection-footer">
            <div class="select-group">
              <i class="codicon codicon-sparkle" title="Agent"></i>
              <select id="agent">
                ${agentOptions}
              </select>
            </div>
            <div class="select-group">
              <i class="codicon codicon-robot" title="Model"></i>
              <select id="model">
                ${modelOptions}
              </select>
            </div>
          </div>
          <button id="executeButton" class="vscode-button" title="Execute">
            <i class="codicon codicon-play"></i>
          </button>
        </div>
      </div>
      <div class="latexdiffs-section">
        <h6 class="section-header">
          <i class="codicon codicon-source-control"></i> LaTeXDiffs
        </h6>
        <div class="file-select">
          <div class="file-select-header">
            <div class="file-select-label-group">
              <label for="baseFile"
                ><i class="codicon codicon-file"></i> Base</label
              >
            </div>
            <div class="file-select-actions button-group">
              <button
                id="currentBaseFileButton"
                class="vscode-button"
                title="Set current file as base"
              >
                <i class="codicon codicon-file-code"></i>
              </button>
              <button
                id="emptyBaseFileButton"
                class="vscode-button"
                title="Empty"
              >
                <i class="codicon codicon-close"></i>
              </button>
            </div>
          </div>
          <select id="baseFile">
            <option value="">None</option>
          </select>
        </div>
        <div class="file-select">
          <div class="file-select-header">
            <div class="file-select-label-group">
              <label for="editedFile"
                ><i
                  class="codicon codicon-edit clickable"
                  title="Edited (Click to refresh)"
                ></i>
                Edited</label
              >
            </div>
            <div class="file-select-actions button-group">
              <button
                id="acceptButton"
                class="vscode-button"
                title="Accept changes from edited file and overwrite base file"
              >
                <i class="codicon codicon-check"></i>
              </button>
              <button
                id="compareButton"
                class="vscode-button"
                title="Compare the selected edited file with the selected base file"
              >
                <i class="codicon codicon-diff"></i>
              </button>
              <button
                id="mergeButton"
                class="vscode-button"
                title="Create a new verion of the base file by merging the edits suggested by the edited file"
              >
                <i class="codicon codicon-merge"></i>
              </button>
              <button
                id="latexdiffButton"
                class="vscode-button"
                title="LaTeXdiff the selected edited file with the selected base file"
              >
                <i class="codicon codicon-diff-single"></i>
              </button>
              <button
                id="currentEditedFileButton"
                class="vscode-button"
                title="Set current file as edited"
              >
                <i class="codicon codicon-file-code"></i>
              </button>
              <button
                id="emptyEditedFileButton"
                class="vscode-button"
                title="Empty"
              >
                <i class="codicon codicon-close"></i>
              </button>
            </div>
          </div>
          <select id="editedFile">
            <option value="">None</option>
          </select>
        </div>
        <div class="file-select">
          <div class="file-select-header">
            <div class="file-select-label-group">
              <label for="commit"
                ><i
                  class="codicon codicon-git-commit clickable"
                  title="Commit (Click to refresh)"
                ></i>
                Commit</label
              >
            </div>
            <div class="file-select-actions button-group">
              <button
                id="latexdiffvcButton"
                class="vscode-button"
                title="LaTeXdiff the selected base file with another git commit"
              >
                <i class="codicon codicon-diff-single"></i>
              </button>
              <button
                id="packLatexdiffvcButton"
                class="vscode-button"
                title="Pack the latexdiff-vc output into the History folder"
              >
                <i class="codicon codicon-archive"></i>
              </button>
              <button
                id="cleanLatexdiffvcButton"
                class="vscode-button"
                title="Clean the latexdiff-vc output"
              >
                <i class="codicon codicon-trash"></i>
              </button>
            </div>
          </div>
          <select id="commit">
            <option value="HEAD">HEAD</option>
          </select>
        </div>
      </div>
    </div>
    <template id="iconButtonTemplate">
      <button class="vscode-button">
        <i class="codicon"></i>
      </button>
    </template>
  </body>
</html>
