<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} vscode-resource: 'unsafe-inline'; script-src 'nonce-${nonce}'; font-src ${cspSource} vscode-resource:;"
    />
    <link rel="stylesheet" href="${tokensStyleUri}" />
    <link rel="stylesheet" href="${commonStyleUri}" />
    <style nonce="${nonce}">
      @font-face {
        font-family: 'codicon';
        font-display: block;
        src: url('${codiconsFontUri}') format('truetype');
      }
    </style>
    <link
      rel="stylesheet"
      href="${codiconUri}"
      id="vscode-codicon-stylesheet"
    />
    <title>TeXRA</title>
  </head>

  <body>
    <main-app></main-app>
    <script nonce="${nonce}">
      window.__CODICON_FONT_URI__ = '${codiconsFontUri}';
    </script>
    <script
      type="module"
      nonce="${nonce}"
      src="${vscodeElementsBundleUri}"
    ></script>
    <script type="module" nonce="${nonce}" src="${mainViewBundleUri}"></script>
  </body>
</html>
