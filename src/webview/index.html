<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} vscode-resource: 'unsafe-inline'; script-src 'nonce-${nonce}' https://cdnjs.cloudflare.com; img-src https: vscode-resource:; font-src ${cspSource} vscode-resource:;"
    />
    <link rel="stylesheet" href="${commonStyleUri}" />
    <link rel="stylesheet" href="${styleUri}" />
    <link rel="stylesheet" href="${codiconUri}" />
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "./modules/stateManager.js": "${stateManagerUri}",
          "./modules/fileHandlers.js": "${fileHandlersUri}",
          "./modules/uiHandlers.js": "${uiHandlersUri}",
          "./modules/messageHandlers.js": "${messageHandlersUri}",
          "./modules/vscodeApi.js": "${vscodeApiUri}",
          "./modules/utils.js": "${utilsUri}",
          "sortablejs": "https://cdn.skypack.dev/sortablejs"
        }
      }
    </script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
  </head>

  <body>
    <div class="content-wrapper">
      <div class="main-content">
        <div class="file-selection-group">
          <div class="file-select">
            <div class="file-select-header">
              <div class="file-select-label-group">
                <label for="inputFile"
                  ><i
                    class="codicon codicon-file-code clickable"
                    title="Input (Click to refresh)"
                  ></i>
                  Input</label
                >
              </div>
              <div class="file-select-actions">
                <button
                  id="currentInputFileButton"
                  class="action-button"
                  title="Set current file as input"
                >
                  <i class="codicon codicon-file-code"></i>
                </button>
                <button
                  id="emptyInputFileButton"
                  class="icon-button"
                  title="Empty"
                >
                  <i class="codicon codicon-close"></i>
                </button>
                <span
                  id="toggleMultipleInputFiles"
                  class="toggle-icon"
                  title="Multiple"
                  >▼</span
                >
                <button
                  id="addOpenedInputFilesButton"
                  class="icon-button"
                  title="Add opened files as input"
                >
                  <i class="codicon codicon-folder-opened"></i>
                </button>
                <button
                  id="emptyMultipleInputFilesButton"
                  class="icon-button"
                  title="Empty"
                >
                  <i class="codicon codicon-trash"></i>
                </button>
                <button
                  id="selectMultipleInputFilesButton"
                  class="icon-button"
                  title="Add"
                >
                  <i class="codicon codicon-add"></i>
                </button>
              </div>
            </div>
            <select id="inputFile">
              <option value="">None</option>
            </select>
            <div
              id="multipleInputFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="multipleInputFiles" class="multiple-files-list"></div>
              </div>
            </div>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <label for="referenceFile"
                ><i
                  class="codicon codicon-book clickable"
                  title="Reference (Click to refresh)"
                ></i>
                Reference</label
              >
              <div class="file-select-actions">
                <button
                  id="currentReferenceFileButton"
                  class="action-button"
                  title="Set current file as reference"
                >
                  <i class="codicon codicon-file-code"></i>
                </button>
                <button
                  id="emptyReferenceFileButton"
                  class="icon-button"
                  title="Empty"
                >
                  <i class="codicon codicon-close"></i>
                </button>
                <span
                  id="toggleMultipleReferenceFiles"
                  class="toggle-icon"
                  title="Multiple"
                  >▼</span
                >
                <button
                  id="addOpenedReferenceFilesButton"
                  class="icon-button"
                  title="Add opened files as reference"
                >
                  <i class="codicon codicon-folder-opened"></i>
                </button>
                <button
                  id="emptyMultipleReferenceFilesButton"
                  class="icon-button"
                  title="Empty"
                >
                  <i class="codicon codicon-trash"></i>
                </button>
                <button
                  id="selectMultipleReferenceFilesButton"
                  class="icon-button"
                  title="Add"
                >
                  <i class="codicon codicon-add"></i>
                </button>
              </div>
            </div>
            <select id="referenceFile">
              <option value="">None</option>
            </select>
            <div
              id="multipleReferenceFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div
                  id="multipleReferenceFiles"
                  class="multiple-files-list"
                ></div>
              </div>
            </div>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <label for="auxiliaryFile"
                ><i
                  class="codicon codicon-file-add clickable"
                  title="Auxiliary (Click to refresh)"
                ></i>
                Auxiliary</label
              >
              <div class="file-select-actions">
                <button
                  id="currentAuxiliaryFileButton"
                  class="action-button"
                  title="Set current file as auxiliary"
                >
                  <i class="codicon codicon-file-code"></i>
                </button>
                <button
                  id="emptyAuxiliaryFileButton"
                  class="icon-button"
                  title="Empty"
                >
                  <i class="codicon codicon-close"></i>
                </button>
                <span
                  id="toggleMultipleAuxiliaryFiles"
                  class="toggle-icon"
                  title="Multiple"
                  >▼</span
                >
                <button
                  id="addOpenedAuxiliaryFilesButton"
                  class="icon-button"
                  title="Add opened files as auxiliary"
                >
                  <i class="codicon codicon-folder-opened"></i>
                </button>
                <button
                  id="emptyMultipleAuxiliaryFilesButton"
                  class="icon-button"
                  title="Empty"
                >
                  <i class="codicon codicon-trash"></i>
                </button>
                <button
                  id="selectMultipleAuxiliaryFilesButton"
                  class="icon-button"
                  title="Add"
                >
                  <i class="codicon codicon-add"></i>
                </button>
              </div>
            </div>
            <select id="auxiliaryFile">
              <option value="">None</option>
            </select>
            <div
              id="multipleAuxiliaryFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div
                  id="multipleAuxiliaryFiles"
                  class="multiple-files-list"
                ></div>
              </div>
            </div>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <div class="file-select-label-group">
                <label for="figureFile"
                  ><i
                    class="codicon codicon-file-media clickable"
                    title="Figure (Click to refresh)"
                  ></i>
                  Figure</label
                >
                <div class="dropdown-container dropdown-left">
                  <span
                    id="toggleAutoExtract"
                    class="auto-toggle"
                    title="Auto-extract options"
                  >
                    Auto Extract ○<i class="codicon codicon-chevron-down"></i>
                  </span>
                  <div
                    id="autoExtractOptions"
                    class="dropdown-options"
                    style="display: none"
                  >
                    <div class="dropdown-options-content">
                      <label
                        ><input type="checkbox" id="autoExtractFigure" /><i
                          class="codicon codicon-file-media"
                        ></i>
                        Figures</label
                      >
                      <label
                        ><input type="checkbox" id="autoExtractTikzFigure" /><i
                          class="codicon codicon-file-code"
                        ></i
                        >TikZ Figures</label
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="file-select-actions">
                <button
                  id="emptyFigureFileButton"
                  class="icon-button"
                  title="Empty"
                >
                  <i class="codicon codicon-close"></i>
                </button>
                <span
                  id="toggleMultipleFigureFiles"
                  class="toggle-icon"
                  title="Multiple"
                  >▼</span
                >
                <button
                  id="emptyMultipleFigureFilesButton"
                  class="icon-button"
                  title="Empty"
                >
                  <i class="codicon codicon-trash"></i>
                </button>
                <button
                  id="selectMultipleFigureFilesButton"
                  class="icon-button"
                  title="Add"
                >
                  <i class="codicon codicon-add"></i>
                </button>
              </div>
            </div>
            <select id="figureFile">
              <option value="">None</option>
            </select>
            <div
              id="multipleFigureFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="multipleFigureFiles" class="multiple-files-list"></div>
              </div>
            </div>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <div class="file-select-label-group">
                <span
                  id="toggleMultipleOutputFiles"
                  class="toggle-icon"
                  title="Multiple"
                  >▼</span
                >
                <span class="optional-label">Multiple Outputs</span>
              </div>
              <div class="file-select-actions">
                <button
                  id="emptyMultipleOutputFilesButton"
                  class="icon-button"
                  title="Empty"
                >
                  <i class="codicon codicon-trash"></i>
                </button>
                <button
                  id="selectMultipleOutputFilesButton"
                  class="icon-button"
                  title="Add"
                >
                  <i class="codicon codicon-add"></i>
                </button>
              </div>
            </div>
            <div
              id="multipleOutputFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="multipleOutputFiles" class="multiple-files-list"></div>
                <div class="output-filename-override" style="margin-top: 8px">
                  <div
                    class="file-select-label-group"
                    title="Optional: Customize the output filename (including extension)"
                  >
                    <span id="toggleOutputNameOverride" class="toggle-icon"
                      >></span
                    >
                    <span class="optional-label">Output Filename</span>
                    <input
                      type="text"
                      id="outputNameOverride"
                      class="vscode-input"
                      placeholder="(including extension)"
                      style="display: none"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="instruction-box">
          <div class="instruction-header">
            <div class="instruction-header-left">
              <label for="instructionInput"
                ><i class="codicon codicon-edit"></i> Instruction</label
              >
              <div class="dropdown-container dropdown-left">
                <span
                  id="toggleToolUse"
                  class="auto-toggle"
                  title="Tool Use options"
                >
                  Tool Use ○<i class="codicon codicon-chevron-down"></i>
                </span>
                <div
                  id="toolUseOptions"
                  class="dropdown-options"
                  style="display: none"
                >
                  <div class="dropdown-options-content">
                    <label
                      ><input type="checkbox" id="reflect" />
                      <i class="codicon codicon-refresh"></i> Reflect</label
                    >
                    <label
                      ><input type="checkbox" id="attachTeXCount" />
                      <i class="codicon codicon-symbol-numeric"></i> Attach TeX
                      Count</label
                    >
                    <label
                      ><input type="checkbox" id="usePrefillFromInput" />
                      <i class="codicon codicon-edit"></i> Use Prefill from
                      Input</label
                    >
                    <label
                      ><input type="checkbox" id="printInputPrompt" />
                      <i class="codicon codicon-file-code"></i> Print Input
                      Prompt</label
                    >
                  </div>
                </div>
              </div>
            </div>
            <div class="instruction-header-actions">
              <button
                id="packButton"
                class="icon-button"
                title="Pack the output for this agent into the History folder"
              >
                <i class="codicon codicon-archive"></i>
              </button>
              <button
                id="cleanButton"
                class="icon-button"
                title="Clean the output for this agent"
              >
                <i class="codicon codicon-trash"></i>
              </button>
              <button
                id="eraseInstructionsButton"
                class="icon-button"
                title="Erase Instructions"
              >
                <i class="codicon codicon-clear-all"></i>
              </button>
            </div>
          </div>
          <textarea
            id="instructionInput"
            placeholder="Enter your specific instruction such as: Gently correct mathematical mistakes and typos."
          ></textarea>
          <div class="model-selection-footer">
            <div class="select-group">
              <i class="codicon codicon-sparkle" title="Agent"></i>
              <select id="agent">
                ${agentOptions}
              </select>
            </div>
            <div class="select-group">
              <i class="codicon codicon-robot" title="Model"></i>
              <select id="model">
                ${modelOptions}
              </select>
            </div>
          </div>
          <button id="executeButton">
            <i class="codicon codicon-play"></i> Execute
          </button>
        </div>
      </div>
      <div class="latrexdiffs-section">
        <h6 class="section-header">
          <i class="codicon codicon-source-control"></i> LaTeXDiffs
        </h6>
        <div class="file-select">
          <div class="file-select-header">
            <div class="file-select-label-group">
              <label for="baseFile"
                ><i class="codicon codicon-file"></i> Base File</label
              >
            </div>
            <div class="file-select-actions">
              <button
                id="currentBaseFileButton"
                class="icon-button"
                title="Set current file as base"
              >
                <i class="codicon codicon-file-code"></i>
              </button>
              <button
                id="emptyBaseFileButton"
                class="icon-button"
                title="Empty"
              >
                <i class="codicon codicon-close"></i>
              </button>
            </div>
          </div>
          <select id="baseFile">
            <option value="">None</option>
          </select>
        </div>
        <div class="file-select">
          <div class="file-select-header">
            <div class="file-select-label-group">
              <label for="editedFile"
                ><i
                  class="codicon codicon-edit clickable"
                  title="Edited (Click to refresh)"
                ></i>
                Edited File</label
              >
              <button
                id="mergeButton"
                class="action-button"
                title="Create a new verion of the base file by merging the edits suggested by the edited file"
              >
                <i class="codicon codicon-merge"></i>Merge
              </button>
              <button
                id="latexdiffButton"
                class="action-button"
                title="LaTeXdiff the selected edited file with the selected base file"
              >
                <i class="codicon codicon-diff-single"></i>latexdiff
              </button>
            </div>
            <div class="file-select-actions">
              <button
                id="currentEditedFileButton"
                class="icon-button"
                title="Set current file as edited"
              >
                <i class="codicon codicon-file-code"></i>
              </button>
              <button
                id="emptyEditedFileButton"
                class="icon-button"
                title="Empty"
              >
                <i class="codicon codicon-close"></i>
              </button>
            </div>
          </div>
          <select id="editedFile">
            <option value="">None</option>
          </select>
        </div>
        <div class="file-select">
          <div class="file-select-header">
            <div class="file-select-label-group">
              <label for="commit"
                ><i
                  class="codicon codicon-git-commit clickable"
                  title="Commit (Click to refresh)"
                ></i>
                Commit</label
              >
              <button
                id="latexdiffvcButton"
                class="action-button"
                title="LaTeXdiff the selected base file with another git commit"
              >
                <i class="codicon codicon-diff-single"></i>latexdiff-vc
              </button>
            </div>
            <div class="file-select-actions">
              <button
                id="packLatexdiffvcButton"
                class="action-button"
                title="Pack the latexdiff-vc output into the History folder"
              >
                <i class="codicon codicon-archive"></i>
              </button>
              <button
                id="cleanLatexdiffvcButton"
                class="action-button"
                title="Clean the latexdiff-vc output"
              >
                <i class="codicon codicon-trash"></i>
              </button>
            </div>
          </div>
          <select id="commit">
            <option value="HEAD">HEAD</option>
          </select>
        </div>
      </div>
    </div>
  </body>
</html>
