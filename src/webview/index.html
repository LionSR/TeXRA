<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} vscode-resource: 'unsafe-inline'; script-src 'nonce-${nonce}' https://cdnjs.cloudflare.com; img-src https: vscode-resource:; font-src ${cspSource} vscode-resource:;"
    />
    <link rel="stylesheet" href="${commonStyleUri}" />
    <link rel="stylesheet" href="${styleUri}" />
    <link rel="stylesheet" href="${codiconUri}" />
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "./modules/mainViewState.js": "${webviewStateModuleUri}",
          "./modules/uiManagers/FileList.js": "${fileListUri}",
          "./modules/uiManagers/FileSelect.js": "${fileSelectUri}",
          "./modules/uiManagers/ToggleManager.js": "${toggleManagerUri}",
          "./modules/uiManagers/BaseUIManager.js": "${baseUIManagerUri}",
          "./modules/uiManagers/FileInputManager.js": "${fileInputManagerUri}",
          "./modules/uiManagers/ActionButtonManager.js": "${actionButtonManagerUri}",
          "./modules/uiManagers/SettingsButtonManager.js": "${settingsButtonManagerUri}",
          "./modules/uiManagers/BannerManager.js": "${bannerManagerUri}",
          "./modules/uiManagers/RecordingManager.js": "${recordingManagerUri}",
          "./modules/uiManagers/InstructionManager.js": "${instructionManagerUri}",
          "./modules/uiManagers/OutputFilesManager.js": "${outputFilesManagerUri}",
          "./modules/uiManagers/LatexdiffManager.js": "${latexdiffManagerUri}",
          "./modules/domHandlers.js": "${domHandlersUri}",
          "./modules/eventBus.js": "${eventBusUri}",
          "./modules/constants.js": "${constantsUri}",
          "./modules/messageHandlers.js": "${messageHandlersUri}",
          "./modules/handlers/themeHandlers.js": "${themeHandlersUri}",
          "./modules/handlers/fileHandlers.js": "${fileMessageHandlersUri}",
          "./modules/handlers/recordingHandlers.js": "${recordingHandlersUri}",
          "@common/webviewContext.js": "${webviewContextUri}",
          "@common/webviewState.js": "${webviewStateUri}",
          "@common/webview/commands.js": "${commandsUri}",
          "@common/webview/themeHandlers.js": "${webviewThemeHandlersUri}",
          "@common/templateUtils.js": "${templateUtilsUri}",
          "@common/iconButtonInitializer.js": "${iconButtonInitializerUri}",
          "@common/domUtils.js": "${domUtilsUri}",
          "@common/BaseDomHandler.js": "${baseDomHandlerUri}",
          "@common/stringUtils.js": "${stringUtilsUri}",
          "@common/iconConstants.js": "${iconConstantsUri}",
          "@common/BaseWebviewMessageHandler.js": "${baseWebviewMessageHandlerUri}",
          "sortablejs": "https://cdn.skypack.dev/sortablejs",
          "nanoid": "https://cdn.skypack.dev/nanoid"
        }
      }
    </script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
  </head>

  <body>
    <div class="content-wrapper">
      <div class="main-content">
        <div class="file-selection-group">
          <div class="file-select">
            <div class="file-select-header">
              <div class="file-select-label-group">
                <label
                  for="inputFile"
                  title="Primary files the agent processes, such as .tex, .txt, or .md"
                  ><i
                    class="codicon codicon-file-code clickable"
                    title="Refresh input files"
                  ></i>
                  Input</label
                >
              </div>
              <div class="file-select-actions button-group">
                <button
                  id="currentInputFileButton"
                  class="vscode-button"
                  title="Set current file as input"
                  data-icon="file-code"
                ></button>
                <button
                  id="emptyInputFileButton"
                  class="vscode-button"
                  title="Empty"
                  data-icon="close"
                ></button>
                <span
                  id="toggleInputFiles"
                  class="toggle-icon"
                  title="Show or hide additional input files"
                  ><i class="codicon codicon-chevron-down"></i
                ></span>
                <button
                  id="addOpenedInputFilesButton"
                  class="vscode-button"
                  title="Add opened files as input"
                  data-icon="folder-opened"
                ></button>
                <button
                  id="emptyInputFilesButton"
                  class="vscode-button"
                  title="Empty"
                  data-icon="trash"
                ></button>
                <button
                  id="selectInputFilesButton"
                  class="vscode-button"
                  title="Add"
                  data-icon="add"
                ></button>
              </div>
            </div>
            <select id="inputFile">
              <option value="">None</option>
            </select>
            <div
              id="inputFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="inputFiles" class="multiple-files-list"></div>
              </div>
            </div>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <label
                for="referenceFile"
                title="Example or context files that guide the agent's output"
                ><i
                  class="codicon codicon-book clickable"
                  title="Refresh reference files"
                ></i>
                Reference</label
              >
              <div class="file-select-actions button-group">
                <button
                  id="currentReferenceFileButton"
                  class="vscode-button"
                  title="Set current file as reference"
                  data-icon="file-code"
                ></button>
                <button
                  id="emptyReferenceFileButton"
                  class="vscode-button"
                  title="Empty"
                  data-icon="close"
                ></button>
                <span
                  id="toggleReferenceFiles"
                  class="toggle-icon"
                  title="Show or hide additional reference files"
                  ><i class="codicon codicon-chevron-down"></i
                ></span>
                <button
                  id="addOpenedReferenceFilesButton"
                  class="vscode-button"
                  title="Add opened files as reference"
                  data-icon="folder-opened"
                ></button>
                <button
                  id="emptyReferenceFilesButton"
                  class="vscode-button"
                  title="Empty"
                  data-icon="trash"
                ></button>
                <button
                  id="selectReferenceFilesButton"
                  class="vscode-button"
                  title="Add"
                  data-icon="add"
                ></button>
              </div>
            </div>
            <select id="referenceFile">
              <option value="">None</option>
            </select>
            <div
              id="referenceFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="referenceFiles" class="multiple-files-list"></div>
              </div>
            </div>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <label
                for="auxiliaryFile"
                title="Supporting files required for correct processing, including .cls, .sty, .bib"
                ><i
                  class="codicon codicon-file-add clickable"
                  title="Refresh auxiliary files"
                ></i>
                Auxiliary</label
              >
              <div class="file-select-actions button-group">
                <button
                  id="currentAuxiliaryFileButton"
                  class="vscode-button"
                  title="Set current file as auxiliary"
                  data-icon="file-code"
                ></button>
                <button
                  id="emptyAuxiliaryFileButton"
                  class="vscode-button"
                  title="Empty"
                  data-icon="close"
                ></button>
                <span
                  id="toggleAuxiliaryFiles"
                  class="toggle-icon"
                  title="Show or hide additional auxiliary files"
                  ><i class="codicon codicon-chevron-down"></i
                ></span>
                <button
                  id="addOpenedAuxiliaryFilesButton"
                  class="vscode-button"
                  title="Add opened files as auxiliary"
                  data-icon="folder-opened"
                ></button>
                <button
                  id="emptyAuxiliaryFilesButton"
                  class="vscode-button"
                  title="Empty"
                  data-icon="trash"
                ></button>
                <button
                  id="selectAuxiliaryFilesButton"
                  class="vscode-button"
                  title="Add"
                  data-icon="add"
                ></button>
              </div>
            </div>
            <select id="auxiliaryFile">
              <option value="">None</option>
            </select>
            <div
              id="auxiliaryFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="auxiliaryFiles" class="multiple-files-list"></div>
              </div>
            </div>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <div class="file-select-label-group">
                <label
                  for="mediaFile"
                  title="Visual or audio assets such as images or PDFs"
                  ><i
                    class="codicon codicon-file-media clickable"
                    title="Refresh media files"
                  ></i>
                  Media</label
                >
                <div class="dropdown-container dropdown-left">
                  <span
                    id="toggleAutoExtract"
                    class="auto-toggle"
                    title="Auto-extract options"
                  >
                    <i class="codicon codicon-wand"></i
                    ><i class="codicon codicon-chevron-down"></i>
                  </span>
                  <div
                    id="autoExtractOptions"
                    class="dropdown-options"
                    style="display: none"
                  >
                    <label class="vscode-checkbox"
                      ><input type="checkbox" id="autoExtractFigure" /><i
                        class="codicon codicon-file-media"
                      ></i
                      >Figures</label
                    >
                    <label class="vscode-checkbox"
                      ><input type="checkbox" id="autoExtractTikzFigure" /><i
                        class="codicon codicon-file-code"
                      ></i
                      >TikZ Figures</label
                    >
                    <label class="vscode-checkbox"
                      ><input type="checkbox" id="autoCompileInputPdf" /><i
                        class="codicon codicon-file-pdf"
                      ></i
                      >Compile Input PDF</label
                    >
                  </div>
                </div>
              </div>
              <div class="file-select-actions button-group">
                <button
                  id="emptyMediaFileButton"
                  class="vscode-button"
                  title="Empty"
                  data-icon="close"
                ></button>
                <span
                  id="toggleMediaFiles"
                  class="toggle-icon"
                  title="Show or hide additional media files"
                  ><i class="codicon codicon-chevron-down"></i
                ></span>
                <button
                  id="emptyMediaFilesButton"
                  class="vscode-button"
                  title="Empty"
                  data-icon="trash"
                ></button>
                <button
                  id="selectMediaFilesButton"
                  class="vscode-button"
                  title="Add"
                  data-icon="add"
                ></button>
              </div>
            </div>
            <select id="mediaFile">
              <option value="">None</option>
            </select>
            <div
              id="mediaFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="mediaFiles" class="multiple-files-list"></div>
              </div>
            </div>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <div class="file-select-label-group">
                <span
                  id="toggleOutputFiles"
                  class="toggle-icon"
                  title="Show or hide additional files for the agent’s output"
                  ><i class="codicon codicon-chevron-down"></i
                ></span>
                <span
                  class="optional-label"
                  title="List the files that should receive the agent’s output"
                  >Multiple Outputs</span
                >
              </div>
              <div class="file-select-actions button-group">
                <button
                  id="emptyOutputFilesButton"
                  class="vscode-button"
                  title="Empty"
                  data-icon="trash"
                ></button>
                <button
                  id="selectOutputFilesButton"
                  class="vscode-button"
                  title="Add"
                  data-icon="add"
                ></button>
              </div>
            </div>
            <div
              id="outputFilesContainer"
              class="multiple-files-container"
              style="display: none"
            >
              <div class="multiple-files-content">
                <div id="outputFiles" class="multiple-files-list"></div>
                <!-- Output filename override removed -->
              </div>
            </div>
          </div>
        </div>
        <div class="instruction-box">
          <div class="instruction-header">
            <div class="instruction-header-left">
              <label for="instruction"
                ><i class="codicon codicon-edit"></i> Instruction</label
              >
              <div class="dropdown-container dropdown-left">
                <span
                  id="toggleToolConfig"
                  class="auto-toggle"
                  title="Tool Config options"
                >
                  <i class="codicon codicon-tools"></i
                  ><i class="codicon codicon-chevron-down"></i>
                </span>
                <div
                  id="toolConfigOptions"
                  class="dropdown-options"
                  style="display: none"
                >
                  <label class="vscode-checkbox"
                    ><input type="checkbox" id="attachTeXCount" />
                    <i class="codicon codicon-symbol-numeric"></i> Attach TeX
                    Count</label
                  >
                  <label class="vscode-checkbox"
                    ><input type="checkbox" id="attachDiagnostics" />
                    <i class="codicon codicon-tools"></i> Attach
                    Diagnostics</label
                  >
                </div>
              </div>
            </div>
            <div class="instruction-header-actions button-group">
              <button
                id="packButton"
                class="vscode-button"
                title="Pack the output for this agent into the History folder"
                style="display: none"
                data-icon="archive"
              ></button>
              <button
                id="cleanButton"
                class="vscode-button"
                title="Clean the output for this agent"
                style="display: none"
                data-icon="trash"
              ></button>
              <button
                id="magicPolishButton"
                class="vscode-button"
                title="Polish instruction text with AI"
                data-icon="sparkle"
              ></button>
              <button
                id="recordInstructionButton"
                class="vscode-button"
                title="Record instruction with microphone"
                data-icon="mic"
              ></button>
              <button
                id="eraseInstructionButton"
                class="vscode-button"
                title="Erase Instruction"
                data-icon="clear-all"
              ></button>
            </div>
          </div>
          <textarea
            id="instruction"
            class="vscode-textarea"
            placeholder="Enter your specific instruction such as: Gently correct mathematical mistakes and typos."
          ></textarea>
          <div class="instruction-controls">
            <div class="model-selection-footer">
              <div class="select-group agent-select-group">
                <i
                  id="agentSettingsButton"
                  class="codicon codicon-sparkle clickable"
                  title="Agent settings"
                ></i>
                <div class="agent-select-controls">
                  <input type="hidden" id="sessionType" value="workflow" />
                  <div
                    id="sessionTypeToggle"
                    class="session-toggle"
                    role="radiogroup"
                    aria-label="Choose the session type"
                  >
                    <button
                      type="button"
                      class="session-toggle__option active"
                      data-session-type="workflow"
                      aria-pressed="true"
                      title="Workflow agents automate document editing tasks"
                    >
                      Workflow
                    </button>
                    <button
                      type="button"
                      class="session-toggle__option"
                      data-session-type="toolUse"
                      aria-pressed="false"
                      title="Tool-use agents execute commands and scripts"
                    >
                      Tool Use
                    </button>
                  </div>
                  <div class="agent-select-dropdowns">
                    <select
                      id="workflowAgent"
                      class="agent-select agent-select--active"
                      data-session-type="workflow"
                      aria-label="Workflow agent"
                      title="Workflow agent"
                    >
                      ${workflowAgentOptions}
                    </select>
                    <select
                      id="toolUseAgent"
                      class="agent-select agent-select--hidden"
                      data-session-type="toolUse"
                      aria-label="Tool-use agent"
                      title="Tool-use agent"
                      tabindex="-1"
                      aria-hidden="true"
                    >
                      ${toolUseAgentOptions}
                    </select>
                  </div>
                </div>
              </div>
              <div class="select-group">
                <i
                  id="modelSettingsButton"
                  class="codicon codicon-robot clickable"
                  title="Model settings"
                ></i>
                <select id="model">
                  ${modelOptions}
                </select>
              </div>
            </div>
            <button
              id="executeButton"
              class="vscode-button"
              title="Execute"
              data-icon="play"
            ></button>
          </div>
        </div>

        <!-- Agent Config Banner -->
        <div
          id="agentConfigBanner"
          class="agent-config-banner"
          style="display: none"
        >
          <span>Agent configuration is missing.</span>
          <div class="actions">
            <button
              id="agentConfigEditButton"
              class="vscode-button"
              data-icon="list-selection"
            >
              Edit Agents
            </button>
            <button
              id="agentConfigDirButton"
              class="vscode-button"
              data-icon="folder-opened"
            >
              Set Directory
            </button>
            <button
              id="agentConfigDocButton"
              class="vscode-button"
              data-icon="book"
            >
              Docs
            </button>
          </div>
        </div>

        <!-- API Key Banner -->
        <div id="apiKeyBanner" class="api-key-banner" style="display: none">
          <span>TeXRA requires an API key to run.</span>
          <div class="actions">
            <button
              id="apiKeyBannerButton"
              class="vscode-button"
              data-icon="key"
            >
              Set API Key
            </button>
            <button
              id="apiKeyGuideButton"
              class="vscode-button"
              data-icon="book"
            >
              API Key Guide
            </button>
          </div>
        </div>

        <!-- Dependency Banner -->
        <div
          id="dependencyBanner"
          class="dependency-banner"
          style="display: none"
        >
          <span class="missing-tools"></span>
          <div class="actions">
            <button
              id="dependencyRecheckButton"
              class="vscode-button"
              data-icon="refresh"
            >
              Re-check
            </button>
            <button
              id="dependencyDismissButton"
              class="vscode-button secondary"
              data-icon="close"
              title="Dismiss (can be re-enabled in settings)"
            >
              Dismiss
            </button>
          </div>
        </div>
      </div>

      <div class="latexdiffs-section">
        <div class="file-select-header">
          <div class="file-select-label-group">
            <span id="toggleLatexdiffs" class="toggle-icon" title="LaTeXDiffs">
              <i class="codicon codicon-chevron-down"></i>
            </span>
            <span class="optional-label"
              ><i class="codicon codicon-source-control"></i> LaTeXDiffs</span
            >
          </div>
        </div>
        <div id="latexdiffsContent" style="display: none">
          <div class="file-select">
            <div class="file-select-header">
              <div class="file-select-label-group">
                <label for="baseFile"
                  ><i class="codicon codicon-file"></i> Base</label
                >
              </div>
              <div class="file-select-actions button-group">
                <button
                  id="currentBaseFileButton"
                  class="vscode-button"
                  title="Set current file as base"
                  data-icon="file-code"
                ></button>
                <button
                  id="emptyBaseFileButton"
                  class="vscode-button"
                  title="Empty"
                  data-icon="close"
                ></button>
              </div>
            </div>
            <select id="baseFile">
              <option value="">None</option>
            </select>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <div class="file-select-label-group">
                <label
                  for="editedFile"
                  title="File containing edits to merge into the base file"
                  ><i
                    class="codicon codicon-edit clickable"
                    title="Edited (Click to refresh)"
                  ></i>
                  Edited</label
                >
              </div>
              <div class="file-select-actions button-group">
                <button
                  id="acceptButton"
                  class="vscode-button"
                  title="Accept changes from edited file and overwrite base file"
                  data-icon="check"
                ></button>
                <button
                  id="compareButton"
                  class="vscode-button"
                  title="Compare the selected edited file with the selected base file"
                  data-icon="diff"
                ></button>
                <button
                  id="mergeButton"
                  class="vscode-button"
                  title="Create a new verion of the base file by merging the edits suggested by the edited file"
                  data-icon="merge"
                ></button>
                <button
                  id="latexdiffButton"
                  class="vscode-button"
                  title="LaTeXdiff the selected edited file with the selected base file"
                  data-icon="diff-single"
                ></button>
                <button
                  id="currentEditedFileButton"
                  class="vscode-button"
                  title="Set current file as edited"
                  data-icon="file-code"
                ></button>
                <button
                  id="emptyEditedFileButton"
                  class="vscode-button"
                  title="Empty"
                  data-icon="close"
                ></button>
              </div>
            </div>
            <select id="editedFile">
              <option value="">None</option>
            </select>
          </div>
          <div class="file-select">
            <div class="file-select-header">
              <div class="file-select-label-group">
                <label for="commit"
                  ><i
                    class="codicon codicon-git-commit clickable"
                    title="Commit (Click to refresh)"
                  ></i>
                  Commit</label
                >
              </div>
              <div class="file-select-actions button-group">
                <button
                  id="latexdiffvcButton"
                  class="vscode-button"
                  title="LaTeXdiff the selected base file with another git commit"
                  data-icon="diff-single"
                ></button>
                <button
                  id="packLatexdiffvcButton"
                  class="vscode-button"
                  title="Pack the latexdiff-vc output into the History folder"
                  data-icon="archive"
                ></button>
                <button
                  id="cleanLatexdiffvcButton"
                  class="vscode-button"
                  title="Clean the latexdiff-vc output"
                  data-icon="trash"
                ></button>
              </div>
            </div>
            <select id="commit">
              <option value="HEAD">HEAD</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <template id="iconButtonTemplate">
      <button class="vscode-button">
        <i class="codicon"></i>
      </button>
    </template>
    <template id="selectOptionTemplate">
      <option value=""></option>
    </template>
    <template id="fileListEntryTemplate">
      <div class="file-item" data-path="">
        <span class="file-name"></span>
        <span class="remove-button">-</span>
      </div>
    </template>
    <template id="codiconTemplate">
      <i class="codicon"></i>
    </template>
  </body>
</html>
