<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} vscode-resource: 'unsafe-inline'; script-src 'nonce-${nonce}'; font-src ${cspSource} vscode-resource:; img-src ${cspSource} data: https:;"
    />
    <link rel="stylesheet" href="${commonStyleUri}" />
    <link rel="stylesheet" href="${styleUri}" />
    <link rel="stylesheet" href="${codiconUri}" />
    <style>
      /* Log Group Styles */
      .log-group-header {
        padding: 4px 8px;
        margin: 4px 0;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        background-color: var(--vscode-editor-background);
        border-left: 4px solid var(--vscode-activityBarBadge-background);
      }

      .log-group-header.running {
        border-left-color: var(--vscode-statusBarItem-warningBackground);
      }

      .log-group-header.error {
        border-left-color: var(--vscode-errorForeground);
      }

      .log-group-header.stopped {
        border-left-color: var(--vscode-testing-iconPassed);
      }

      .log-group-content {
        margin-left: 20px;
        padding-left: 12px;
        border-left: 1px solid var(--vscode-editorGroupHeader-tabsBorder);
      }

      .group-toggle {
        margin-right: 8px;
      }

      .group-status-icon {
        margin-right: 8px;
      }

      .group-title {
        font-weight: bold;
        flex-grow: 1;
      }

      .group-time {
        font-size: 12px;
        opacity: 0.7;
        margin-left: 12px;
      }

      .group-start-time,
      .group-end-time {
        margin-right: 8px;
      }

      /* Add animation for running indicator */
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .spin {
        animation: spin 2s linear infinite;
      }

      /* Make sure log lines in groups are associated */
      .log-line[data-group-id] {
        border-left: 2px solid transparent;
      }
    </style>
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "split.js": "${splitJsUri}",
          "marked": "https://esm.sh/marked@9.1.5"
        }
      }
    </script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
  </head>

  <body>
    <div class="main-container">
      <div class="content-area split">
        <div class="log-header">
          <div class="header-left">
            <span id="currentStreamName"></span>
            <span
              id="statusIndicator"
              class="status-indicator stopped"
              data-status="Ready"
            ></span>
          </div>
          <div class="header-actions">
            <button
              class="action-button stop-button"
              id="stopStreamBtn"
              disabled
              title="Request task interruption (note: current API call will complete)"
            >
              <span class="codicon codicon-debug-stop"></span>
            </button>
            <button
              class="action-button run-button"
              id="runAgainBtn"
              disabled
              title="Run this task again"
            >
              <i class="codicon codicon-debug-rerun"></i>
            </button>
            <button
              class="action-button restore-button"
              id="restoreStateBtn"
              disabled
              title="Restore this configuration to the main view"
            >
              <i class="codicon codicon-replay"></i>
            </button>
            <button
              class="action-button pack-button"
              id="packStreamBtn"
              disabled
              title="Pack the output for this agent into the History folder"
            >
              <i class="codicon codicon-archive"></i>
            </button>
            <button
              class="action-button clean-button"
              id="cleanStreamBtn"
              disabled
              title="Clean the output for this agent"
            >
              <i class="codicon codicon-trash"></i>
            </button>
            <button
              class="action-button clear-button"
              id="eraseStreamBtn"
              title="Erase the stream output for this agent"
            >
              <i class="codicon codicon-remove"></i>
            </button>
          </div>
        </div>
        <div id="logContent" class="log-container"></div>
      </div>
      <div class="tabs split">
        <div id="streamTabs" class="tabs-content">
          <!-- Stream tabs will be dynamically inserted here -->
        </div>
        <div class="clear-all-container">
          <button class="clear-button danger" id="deleteAllBtn">
            <i class="codicon codicon-trash"></i> Delete All
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
