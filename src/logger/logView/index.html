<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} vscode-resource: 'unsafe-inline'; script-src 'nonce-${nonce}'; font-src ${cspSource} vscode-resource:;"
    />
    <link rel="stylesheet" href="${styleUri}" />
    <link rel="stylesheet" href="${codiconUri}" />
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "split.js": "${splitJsUri}"
        }
      }
    </script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
  </head>

  <body>
    <div class="main-container">
      <div class="content-area split">
        <div class="log-header">
          <div class="header-left">
            <span id="currentStreamName"></span>
            <span
              id="statusIndicator"
              class="status-indicator stopped"
              data-status="Ready"
            ></span>
          </div>
          <div class="header-actions">
            <button class="stop-button" id="stopStreamBtn" disabled>
              <span class="stop-icon">■</span> Stop
            </button>
            <button
              class="pack-button"
              id="packStreamBtn"
              title="Pack the output for this agent"
            >
              <i class="codicon codicon-package"></i> Pack
            </button>
            <button
              class="clean-button"
              id="cleanStreamBtn"
              title="Clean the output for this agent"
            >
              <i class="codicon codicon-trash"></i> Clean
            </button>
            <button
              class="clear-button"
              id="eraseStreamBtn"
              title="Erase the stream output for this agent"
            >
              <i class="codicon codicon-clear-all"></i>
            </button>
          </div>
        </div>
        <div id="logContent" class="log-container"></div>
      </div>
      <div class="tabs split">
        <div id="streamTabs" class="tabs-content">
          <!-- Stream tabs will be dynamically inserted here -->
        </div>
        <div class="clear-all-container">
          <button class="clear-button danger" id="deleteAllBtn">
            <i class="codicon codicon-trash"></i> Delete All
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
