name: paper2note_example
inherits: paper2note

settings:
  requiredFiles:
    - DOCUMENT_CLS: lecture.cls
    - COMMAND: command.tex
  filePatternsContain:
    - pattern: "example_paper"
      varName: "EXAMPLE_PAPER"
      categories: ["referenceFile", "referenceFiles"]
    - pattern: "example_note"
      varName: "EXAMPLE_NOTE"
      categories: ["referenceFile", "referenceFiles"]

prompts:
  userPrefix: |
    I am going to give you a research paper. You are about to convert it into a lecture note, so please read the document carefully.

    Here is the \LaTeX document with additional \LaTeX document class and commands (where has defined the math commands you should use):

    <documents>
    <document name="{{ DOCUMENT_CLS_FILE }}">
    {{ DOCUMENT_CLS_CONTENT }}
    </document>
    <document name="{{ COMMAND_FILE }}">
    {{ COMMAND_CONTENT }}
    </document>
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    <document name="{{ EXAMPLE_PAPER_FILE }}">
    {{ EXAMPLE_PAPER_CONTENT }}
    </document>
    <document name="{{ EXAMPLE_NOTE_FILE }}">
    {{ EXAMPLE_NOTE_CONTENT }}
    </document>
    </documents>

    Please carefully read through the entire research paper above and ensure you fully understand all the details.
