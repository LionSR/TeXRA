name: paper2note_example
inherits: paper2note

settings:
  required_files:
    - DOCUMENT_CLS: lecture.cls
    - COMMAND: command.tex
  file_patterns_contain:
    - pattern: "example_paper"
      var_name: "EXAMPLE_PAPER"
      categories: ["reference_file", "reference_files"]
    - pattern: "example_note"
      var_name: "EXAMPLE_NOTE"
      categories: ["reference_file", "reference_files"]

prompts:
  user_prefix: |
    I am going to give you a research paper. You are about to convert it into a lecture note, so please read the document carefully.

    Here is the \LaTeX document with additional \LaTeX document class and commands (where has defined the math commands you should use):

    <documents>
    <document name="{{ DOCUMENT_CLS_FILE }}">
    {{ DOCUMENT_CLS_CONTENT }}
    </document>
    <document name="{{ COMMAND_FILE }}">
    {{ COMMAND_CONTENT }}
    </document>
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    <document name="{{ EXAMPLE_PAPER_FILE }}">
    {{ EXAMPLE_PAPER_CONTENT }}
    </document>
    <document name="{{ EXAMPLE_NOTE_FILE }}">
    {{ EXAMPLE_NOTE_CONTENT }}
    </document>
    </documents>

    Please carefully read through the entire research paper above and ensure you fully understand all the details.

  user_request: |
    {% if INSTRUCTION %}
    Specific instructions that you must follow during the adaptation:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>

    Follow these instructions closely while adapting the paper into lecture notes.
    {% endif %}

    Based on the provided research paper and example materials, please create a lecture note that follows the style and structure of the example note. The note should:

    \begin{enumerate}
        \item Present the key concepts and derivations in a pedagogical manner
        \item Include detailed mathematical explanations and step-by-step derivations
        \item Add insightful comments and interpretations to help students understand the material
        \item Use consistent notation as defined in the command.tex file
        \item Follow the style and formatting of the example note
    \end{enumerate}
