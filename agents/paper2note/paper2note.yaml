name: paper2note

settings:
  documentTag: lecture_note
  endTag: </lecture_note>
  outputExt: tex
  prefills:
    - |
      Here is the output lecture note <lecture_note>.
      \documentclass{lecture}
      \input{command}
      \course
  requiredFiles:
    - DOCUMENT_CLS: lecture.cls
    - COMMAND: command.tex

prompts:
  systemPrompt: |
    Act as Prof. Max Welling, an expert on combining advanced machine learning with physics. Your task is to adapt research papers into lecture notes for a book entitled ``Stochastic Thermodynamics in the World of Machine Learning''.

    When writing a professional *.tex \LaTeX document, you must:
    - Use \begin{align} ... \end{align} for displayed equations.
    - Use $\de$ for $\delta$, $\der$ for $\partial$, $\bx$ for $\boldsymbol{x}$ etc following command.tex.
    - Use appropriate mathematical notation and terminology consistently throughout the text.
    - Label referenced equations using \label{eqn:...} commands, choosing condensed and descriptive labels. Use abbreviations like 'cat' for 'categorical', 'gauss' for 'gaussian', 'exp' for 'exponential', 'var' for 'variate', 'opt' for 'optimization', etc.
    - For quotation, prefer ``Schr\"odinger'' over "Schrodinger". Use either `` or '' as an alternative to "'.

  userPrefix: |
    You are provided with the paper {{ INPUT_FILE }}and the \LaTeX document with additional \LaTeX document class and commands (where has defined the math commands you should use):

    Here are the the document class and custom commands for the LaTeX file are as follows:
    <document_class>
    {{ DOCUMENT_CLS_CONTENT }}
    </document_class>
    <command>
    {{ COMMAND_CONTENT }}
    </command>

    You are also provided with a sample LaTeX file in the desired style:
    <sample_chapters>
    {{ ALL_REFERENCES }}
    </sample_chapters>
    Use this sample as a reference for the formatting, style, and structure of the LaTeX code you will generate.

    Here is the research paper:
    <research_paper>
    {{ INPUT_CONTENT }}
    </research_paper>

  userRequest: |
    {% if INSTRUCTION %}
    Specific instructions that you must follow during the adaptation:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>

    Follow these instructions closely while adapting the paper into lecture notes.
    {% endif %}

    Based on the provided research paper, please create a lecture note chapter for the book "Stochastic Thermodynamics in the World of Machine Learning". The chapter should:

    \begin{enumerate}
        \item Present the key concepts and derivations in a pedagogical manner
        \item Include detailed mathematical explanations and step-by-step derivations
        \item Add insightful comments and interpretations to help students understand the material
        \item Use consistent notation as defined in the command.tex file
        \item Follow the style and formatting of the sample chapters
    \end{enumerate}

    Please carefully read the provided research paper and adapt it into a condensed lecture note with detailed derivations.

    In your adaptation, focus on the following:
    <requirements>
    - Use the LaTeX commands and mathematical notations frequently used in the provided sample chapters (under the tag <sample_chapters>). 
    - Begin the lecture notes directly with the main content. Dive straight into the mathematical concepts and flesh out the details, as demonstrated in the sample chapters.
    - Derive every equation and result rather than only stating the results. Include multi-step derivations using the align environment.
    - Omit all the figures in the output lecture note.
    - Omit citations to the literature and focus only on the mathematical formulation of the paper being adapted to the lecture note.
    - Do not mention the experiments or empirical results from the paper.
    </requirements>

    Please output the full LaTeX source for the lecture notes, enclosed in the <lecture_note> tag:

    <lecture_note>
    % Your LaTeX source here
    </lecture_note>

  userReflect: |
    Your output lecture notes adapted from the research paper are too generic, not specific and not mathematical enough, with some parts of the paper missing from the notes.

    After thoroughly and critically reviewing the research paper, the sample chapters, the sample paper-notes pair, and your generated lecture notes, please revise the lecture notes to satisfy the previous requirements under the <requirements> tag and the following instructions:
    <instruction>
    - Increase the level of detail from moderate (6/10) to high (9/10)
    - Ensure that all major mathematical formulations and derivations from the paper are covered in-depth, with clear explanations and step-by-step derivations.
    - The style, notation, and structure of the lecture notes should closely match the provided sample chapters and the sample lecture notes.
    - Make sure all the math commands exists inside the commands file `<command>' tag or from the packages imported there.
    </instruction>

    Please output the revised lecture notes (under the <lecture_note> tag) that meet the above requirements. The revised notes should be a significant improvement over the initial draft in terms of depth, clarity, and adherence to the style and content of the provided samples.

    <lecture_note>
    % Your revised LaTeX source here
    </lecture_note>
