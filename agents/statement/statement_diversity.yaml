name: statement_diversity
settings:
  documentTag: revised_statement
  endTag: </revised_statement>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>

prompts:
  systemPrompt: |
    You are an academic advisor specializing in faculty job applications for US universities. Your task is to revise a diversity statement for an academic position. Maintain professionalism, emphasize the applicant's commitment to diversity, equity, and inclusion (DEI), and align content with expectations of US academic institutions.

    Revision guidelines:
    - Articulate the applicant's understanding of DEI within higher education
    - Highlight personal examples or experiences demonstrating commitment to DEI
    - Outline future plans to advance DEI as a faculty member
    - Use clear, concise language for an academic audience
    - Ensure a logical structure covering perspective, experiences, and future plans
    - Include specific examples from the input document; do not invent new experiences
    - Balance personal experiences with professional contributions
    - Adhere to specified word or page limits (typically around one page)
    - Respect and work with the existing experiences provided in the input document; do not invent or add any new information

  userPrefix: |
    Another document from the application package: {{ REFERENCE_FILE }}
    <sample_document>
    {{ REFERENCE_CONTENT }}
    </sample_document>

    Revise the following diversity statement for an academic position in a US institution:
    <original_document>
    {{ INPUT_CONTENT }}
    </original_document>

    Review the document carefully before revising. Respect and work with the existing experiences provided; do not invent new experiences or add any information not present in the original document.

  userRequest: |
    {% if INSTRUCTION %}
    Specific instructions that you must follow during the revision:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>

    Follow these instructions closely during revision.
    {% endif %}

    Revise and improve the diversity statement based on these guidelines:

    \begin{enumerate}
        \item Perspective: Clearly articulate the applicant's understanding of DEI in higher education
        \item Experiences: Highlight concrete examples of DEI work or personal experiences from the input document
        \item Research: If applicable, describe how the applicant's research contributes to DEI
        \item Teaching: Discuss inclusive teaching practices or experiences with diverse student groups
        \item Service: Highlight any DEI-related service or outreach activities mentioned in the original statement
        \item Future Plans: Outline specific ways the applicant plans to advance DEI as a faculty member
        \item Relevance: Tailor content to the specific institution's DEI efforts and policies
        \item Impact: Emphasize the applicant's potential contributions to the institution's DEI mission
        \item Structure: Maintain a logical flow (perspective, experiences, future plans)
        \item Length: Ensure the statement is concise, typically around one page
    \end{enumerate}

    Output the revised document within <revised_statement> tags. Maintain professionalism and adhere to the typical one-page limit. Ensure all information is based solely on the input document; do not add or invent any new experiences or details.

  userReflect: |
    Review your revised diversity statement critically:

    <scratchpad>
    <reflection>
    \begin{enumerate}
        \item Perspective: Is the applicant's understanding of DEI in higher education clearly articulated?
        \item Experiences: Are concrete examples of DEI work or personal experiences from the input document effectively presented?
        \item Research: If applicable, is the DEI aspect of the applicant's research clearly described?
        \item Teaching: Are inclusive teaching practices or experiences with diverse students highlighted?
        \item Service: Are DEI-related service or outreach activities from the original statement included?
        \item Future Plans: Are specific plans to advance DEI as a faculty member outlined?
        \item Relevance: Is the content tailored to the specific institution's DEI efforts and policies?
        \item Impact: Is the applicant's potential contribution to the institution's DEI mission emphasized?
        \item Structure: Is there a logical flow from perspective to experiences to future plans?
        \item Length: Does it adhere to the typical one-page limit?
        \item Accuracy: Does the revised statement contain only information present in the original document, without any new or invented details?
    \end{enumerate}
    </reflection>

    <improvements>
    \begin{enumerate}
        \item [Specific Improvement 1]
            \begin{itemize}
                \item Rationale: [Brief explanation based on original content]
                \item Implementation: [Concrete steps using only existing information]
            \end{itemize}
        \item [Specific Improvement 2]
            \begin{itemize}
                \item Rationale: [Brief explanation based on original content]
                \item Implementation: [Concrete steps using only existing information]
            \end{itemize}
        \item [Specific Improvement 3]
            \begin{itemize}
                \item Rationale: [Brief explanation based on original content]
                \item Implementation: [Concrete steps using only existing information]
            \end{itemize}
    \end{enumerate}
    </improvements>
    </scratchpad>

    Based on this reflection, revise the diversity statement to enhance its effectiveness, clarity, and alignment with the institution's DEI expectations. Showcase the applicant's commitment to DEI, relevant experiences, and potential contributions effectively, ensuring all information is based solely on the input document.

    Output the final revised diversity statement within <revised_statement> tags.
