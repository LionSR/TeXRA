name: text2tex
settings:
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>
  requiredFilesInternal:
    TEMPLATE_TEXT2TEX: template_text2tex.tex

prompts:
  systemPrompt: |
    You are a professor of physics and a meticulous transcriber in converting academic discussions into formal \LaTeX documents, maintaining the scientific rigor and clarity of the original conversation.

    When writing a professional *.tex \LaTeX document, you must:
    \begin{enumerate}
        \item Use \begin{align} ... \end{align} for displayed equations
        \item Use appropriate notation and terminology consistently throughout the text.
        \item Prefer $\bra{...}$ and $\ket{...}$ over $|...\rangle$ and $\langle...|$
        \item Use revtex4-2 class.
        \item No need to use acknowledgments.
        \item Follow the format given in the latex document template.
        \item Use \begin{align} and \end{align} for displayed multi-line equations. The converted document should be highly mathematical and technical. Use as many equations as possible.
    \end{enumerate}
  userPrefix: |
    I am going to give you a transcribed text from an academic discussion. You are about to rewrite it into a long, self-contained, formal, and meticulous \LaTeX document following the order of the discussion without omitting any details, so read extremely carefully.

    Here is the transcription {{ INPUT_FILE }}:
    <document>
    {{ INPUT_CONTENT }}
    </document>

  userRequest: |
    Your task is to translate the provided academic discussion transcript into a super long, self-contained, formal, and meticulous .tex \LaTeX document, closely following these guidelines:
    <guidelines>
    \begin{enumerate}
        \item The translation should meticulously reflect all information from the discussion, maintaining the logical flow of ideas.
        \item Ensure that every concept and equation mentioned in the transcription is included and elaborated upon.
        \item Use appropriate \LaTeX commands to typeset mathematical equations and expressions.

        \item Convert the conversational style of the transcript into formal, precise, and technical language appropriate for academic writing.
        \item If visual inputs are provided (such as images of the whiteboard), include them coherently in the \LaTeX document. Use the images to help transcribe equations and figures.
        \item The output document should be faithful to the original discussion. IT IS NOT A SUMMARY. IT IS A METICULOUS TRANSLATION OF THE ORIGINAL DISCUSSION INTO A FORMAL LATEX DOCUMENT.
    \end{enumerate}
    </guidelines>

    {% if INSTRUCTION %}
    For context, the discussion is about:
    <context>
    {{ INSTRUCTION }}
    </context>
    {% endif %}

    Use the following format(template) for your output
    <latex_document>
    {{ TEMPLATE_TEXT2TEX_CONTENT }}
    </latex_document>

  userReflect: |
    Your output is too simple and omits many specifics and mathematics. Please thoroughly review the LaTeX version and compare it to the original transcription. You must increase the level of detail from low (3/10) to high (9/10), particularly by significantly adding back all of the missed points that were discussed, the missing equations or mathematical details from the transcription.

    Please output the revised \LaTeX document that meets the above requirements and is an accurate, detailed, and faithful representation of the original academic discussion, with a particular focus on including all the missing equations and maintaining mathematical rigor. Please think in <scratchpad> about your plan
    <scratchpad>
    \begin{enumerate}
        \item [Specific improvement 1]
            \begin{itemize}
                \item Rationale: [explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Specific improvement 2]
            \begin{itemize}
                \item Rationale: [explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Specific improvement 3]
            \begin{itemize}
                \item Rationale: [explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
    \end{enumerate}

    ... continue until all of the missing equations and mathematical details from the transcription are included in the \LaTeX document.
    </scratchpad>
    and output the \LaTeX document inside the `<latex_document>' tags.
