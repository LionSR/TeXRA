name: transcribe
settings:
  documentTag: edited_transcript
  endTag: </edited_transcript>
  outputExt: md
  prefills:
    - |
      Here is the faithfully and correctly edited transcript:
      <edited_transcript>
  requiredFiles:
    EXAMPLE_TRANSCRIPT: example_transcript.txt
    EXAMPLE_EDITED_TRANSCRIPT: example_edited.txt
  filePatternsContain:
    - pattern: "example"
      varName: "EXAMPLE_TRANSCRIPT"
      categories: ["referenceFile", "referenceFiles"]
    - pattern: "edited"
      varName: "EXAMPLE_EDITED_TRANSCRIPT"
      categories: ["referenceFile", "referenceFiles"]

prompts:
  systemPrompt: |
    You are a meticulous transcriber.

  userPrefix: |
    You will be editing a noisy academic discussion transcript that has been transcribed using voice-to-text software and contains inaccuracies. Please read carefully, as the quality of my work depends on the results.

    <documents>
    <document name="example_transcript">
    {{ EXAMPLE_TRANSCRIPT_CONTENT }}
    </document>
    <document name="example_edited_transcript">
    {{ EXAMPLE_EDITED_TRANSCRIPT_CONTENT }}
    </document>
    <document name="transcript_to_edit">
    {{ INPUT_CONTENT }}
    </document>
    <document name="context">
    {{ INSTRUCTION }}
    </document>
    </documents>

  userRequest: |
    Improve the given noisy transcription while sticking to the original sentences as much as possible by following these instructions:
    <instruction>
    - Be faithful to the original content.
    - Group sentences conveying the same idea or topic into well-structured, coherent paragraphs. This is crucial for clarity and readability.
    - Ensure each sentence has a reasonable length. Break extremely long sentences into shorter ones.
    - Correct punctuation as needed.
    - Correct grammatical mistakes and ensure proper sentence structure.
    - Remove filler words and phrases like ``I know'', ``yeah'', ``I mean'', ``oh'', ``you know'', ``very good'', ``I see'', ``very simple'' etc.
    - Fix recognition errors and mistranscriptions.
    - Transform spoken equations into LaTeX format:
        - For inline equations, use single dollar signs, e.g. $\sigma_x$ and $\ket{\psi}$
        - For displayed equations, use double dollar signs, e.g. $$...$$
    - Some partial identifications have been made to the speaker names. Identify the rest of the speakers in your transcript based on the context and include their names in the edited version.
    - Prefix each speaker's dialogue with their first name followed by a colon (e.g., ``**Speaker1:**'', ``**Speaker2:**'')
    </instruction>

    Refer back to the example edited transcript to see how these guidelines should be applied in practice.

    Before you begin editing, carefully read through the full transcript to ensure you understand the overall context and flow of the discussion. Then, go through and meticulously edit the transcript line by line.

    After you are done editing, please provide your final edited version of the transcript inside <edited_transcript> tag. 
    The edited transcript should use markdown format, be easy to follow, with clear distinctions between speakers and a logical flow of information. Example output:
    <example>
    **Speaker 1:** [Speaker 1's dialogue line 1]

    **Speaker 2:** [Speaker 2's dialogue line 1]

    **Speaker 3:** [Speaker 3's dialogue line 1]

    ...
    </example>

    Do not include the original transcript or the example transcripts in your response.

  userReflect: |
    You missed some parts of the discussion and it still contains some errors and typos. Your output needs to be improved to ensure it adheres more closely to the original transcription while enhancing clarity and structure. After critically reviewing the edited document, make sure that the transcription:
    <requirements>
    - Accurately reflects the original content without adding or omitting any details. Ensure that the transcription maintains the original chronological order of information.
    - Enhances the readability by organizing the content into coherent paragraphs that group related ideas or topics.
    - Converts all spoken equations into LaTeX format correctly, ensuring that inline and displayed equations are formatted appropriately.
    - Adjusts sentence lengths to improve readability, breaking down overly long sentences into shorter, more manageable ones.
    - Corrects all punctuation, typos, grammatical errors, and recognition mistakes to produce a polished and professional document.
    - Removes all filler words and phrases that do not contribute to the meaning or flow of the text.
    - Read carefully and make sure the speaker identifications are correct given the context.
    - To make the transcription more readable, propose a section and subsection structure for this meeting based on the meeting content.
    </requirements>

    Please revise the document to meet these requirements, ensuring it is a faithful, clear, and grammatically correct representation of the original transcription.
