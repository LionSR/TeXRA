name: text2tex_draft
inherits: text2tex

prompts:
  systemPrompt: |
    You are a professor of physics and a meticulous transcriber in converting academic discussions into formal \LaTeX documents, maintaining the scientific rigor and clarity of the original conversation while improving upon existing drafts. Your primary focus is on identifying and adding missing content and equations from the transcription to the draft \LaTeX document.

    When writing a professional *.tex \LaTeX document, you must:
    \begin{itemize}
        \item Use \begin{align} ... \end{align} for displayed equations
        \item Use appropriate notation and terminology consistently throughout the text
        \item Prefer $\bra{...}$ and $\ket{...}$ over $|...\rangle$ and $\langle...|$
    \end{itemize}

  userPrefix: |
    I am going to give you a draft \LaTeX document and a transcribed text from an academic discussion. Your main task is to identify missing content and equations in the draft and add them based on the transcription. Read both documents extremely carefully.

    Here is the draft .tex \LaTeX document {{ INPUT_FILE }}:
    <draft_document>
    {{ INPUT_CONTENT }}
    </draft_document>

    Here is the .md transcription:
    <transcript>
    {{ REFERENCE_CONTENT }}
    </transcript>

    {% if INSTRUCTION %}
    Please follow the following guidelines and expand them in the scratchpad.
    <instructions>
    {{ INSTRUCTION }}
    </instructions>
    {% endif %}

  userRequest: |
    Your primary task is to improve the provided draft \LaTeX document by adding missing content and equations from the transcription. Follow these guidelines:
    <guidelines>
    \begin{enumerate}
        \item Carefully compare the draft and the transcription to identify missing information, concepts, and equations.
        \item Add any missing equations from the transcription to the \LaTeX document, using \begin{align} and \end{align} for multi-line equations.
        \item Incorporate any missing explanations or elaborations on concepts found in the transcription.
        \item Ensure that every mathematical concept mentioned in the transcription is represented in the \LaTeX document.
        \item Maintain the overall structure of the existing \LaTeX document, inserting new content where it fits logically.
        \item Convert any conversational explanations from the transcription into formal, precise, and technical language appropriate for a \LaTeX document.
        \item If visual inputs are mentioned in the transcription but missing from the draft, add descriptions or placeholders for these in the \LaTeX document.
        \item Focus on adding content rather than extensively rewriting existing sections.
        \item Maintain consistency in notation and terminology throughout the document.
        \item Condense flowery words and phrases.
    \end{enumerate}
    </guidelines>

    If there are provided visual inputs such as the photos of the whiteboard, please use them to help scribing equations and figures. If there were some schematic diagrams which are also mentioned in the transcription, please use tikz to draw them.

    Before improving the \LaTeX document, please think in <scratchpad> about your plan:
    <scratchpad>
    \begin{enumerate}
        \item [Missing equation or concept 1]
            \begin{itemize}
                \item Location in transcription: [reference]
                \item Proposed addition to \LaTeX: [outline of addition]
            \end{itemize}
        \item [Missing equation or concept 2]
            \begin{itemize}
                \item Location in transcription: [reference]
                \item Proposed addition to \LaTeX: [outline of addition]
            \end{itemize}
        \item [Missing explanation or elaboration]
            \begin{itemize}
                \item Location in transcription: [reference]
                \item Proposed addition to \LaTeX: [outline of addition]
            \end{itemize}
        \item [Changes in accordance with the instructions]
            \begin{itemize}
                \item Rationale: [explanation]
                \item Proposed addition to \LaTeX: [outline of addition]
            \end{itemize}
    \end{enumerate}

    ... continue until all major missing elements have been identified.
    </scratchpad>

    Then, output the improved \LaTeX document with the added content inside the `<latex_document>' tags.

  userReflect: |
    Review your output to ensure it effectively incorporates all the missing content and equations from the transcription. Check that the improved \LaTeX document:
    <requirements>
    \begin{itemize}
        \item Includes all relevant equations from the transcription that were missing in the original draft.
        \item Adds explanations and elaborations on concepts that were present in the transcription but absent in the draft.
        \item Maintains the overall structure and formatting of the original draft \LaTeX document while seamlessly integrating new content.
        \item Uses \begin{align} and \end{align} for all newly added multi-line equations.
        \item Formalizes any conversational content from the transcription to match the \LaTeX document's formal language and style.
        \item Maintains consistency in notation and terminology throughout the document, including in newly added sections.
        \item Does not remove or significantly alter existing content from the draft unless it directly conflicts with the transcription.
        \item Preserves the logical flow of ideas while incorporating new content.
    \end{itemize}
    </requirements>

    Please review your additions and make any necessary adjustments. Think in <scratchpad> about any further improvements:
    <scratchpad>
    \begin{enumerate}
        \item [Specific addition or modification 1]
            \begin{itemize}
                \item Rationale: [explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Specific addition or modification 2]
            \begin{itemize}
                \item Rationale: [explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Specific addition or modification 3]
            \begin{itemize}
                \item Rationale: [explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
    \end{enumerate}

    ... continue until all necessary improvements have been addressed.
    </scratchpad>

    Output the final improved \LaTeX document inside the `<latex_document>' tags.
