name: transcribe_dual
settings:
  documentTag: edited_transcript
  endTag: </edited_transcript>
  outputExt: md
  prefills:
    - |
      Here is the faithfully and correctly edited transcript:
      <edited_transcript>
  requiredFiles:
    OTTER_INPUT_FILE: otter_transcript.txt
  filePatternsContain:
    - pattern: "otter"
      varName: "OTTER_INPUT"
      categories: ["inputFile", "inputFiles"]
    - pattern: "whisper"
      varName: "WHISPER_INPUT"
      categories: ["inputFile", "inputFiles"]

prompts:
  systemPrompt: |
    You are a professor of physics and a meticulous transcriber with expertise in academic discourse, LaTeX, and synergizing multiple transcription sources to create highly accurate lecture transcripts.

  userPrefix: |
    I am going to give you two transcriptions of an academic discussion. Both were transcribed using voice-to-text software and contain out of context inaccuracies.
    The first transcription is from Otter.ai, which is less accurate but includes speaker identification.
    The second transcription is from Whisper, which is more accurate but lacks speaker identification. 
    Your task is to synergize these transcriptions to create a super accurate version with correct speaker identification.

    Here is the Otter.ai transcription {{ OTTER_INPUT_FILE }}:
    <otter_document>
    {{ OTTER_INPUT_CONTENT }}
    </otter_document>

    Here is the Whisper transcription {{ WHISPER_INPUT_FILE }}:
    <whisper_document>
    {{ WHISPER_INPUT_CONTENT }}
    </whisper_document>

    For context, the discussion is
    <context>
    {{ INSTRUCTION }}
    </context>

  userRequest: |
    Create a highly accurate transcription by synergizing the Whisper and Otter.ai transcripts while following these instructions:
    <instruction>
    1. Use the Whisper transcript as the primary source for content accuracy.
    2. Incorporate speaker identification from the Otter.ai transcript.
    3. When there are discrepancies, prefer the Whisper version unless the Otter.ai version makes more contextual sense.
    5. Transform spoken equations into \LaTeX format:
        - For inline equations, use single dollar signs, e.g., $\sigma_x$ and $\ket{\psi}$
        - For displayed equations, use double dollar signs, e.g., $$...$$
    6. Ensure each sentence has a reasonable length. Break extremely long sentences into shorter ones.
    7. Correct punctuation as needed.
    8. Remove filler words and phrases like ``I know'', ``yeah'', ``I mean'', ``oh'', ``you know'', ``very good'', ``I see'', ``very simple'' etc.
    9. Ensure grammatical correctness.
    10. Fix any remaining recognition errors or mistranscriptions.
    </instruction>

    Before you begin editing, carefully read through both of the full transcripts to ensure you understand the overall context and flow of the discussion. Then, go through and meticulously edit the transcript line by line.

    The edited transcript should use markdown format, be easy to follow, with clear distinctions between speakers and a logical flow of information. Example output:
    <example>
    ---
    title: Title of the discussion
    participants: [List of participants]
    date: [Date of the discussion]
    ---

    **Speaker 1:** [Speaker 1's dialogue line 1]

    **Speaker 2:** [Speaker 2's dialogue line 1]

    **Speaker 3:** [Speaker 3's dialogue line 1]

    ...
    </example>

    Output the edited version of the document inside the <edited_transcript> tag.

  userReflect: |
    Your output needs to be significantly improved to ensure it represents the best possible synergy of the two transcriptions and to make sure there is no missing information. Right now you have a transcript that is missing some information. After reviewing the edited transcript, make sure that the transcription:
    <requirements>
    - Accurately combines the content from both transcriptions, prioritizing the Whisper transcript for accuracy and the Otter.ai transcript for speaker identification.
    - Enhances readability by organizing the content into coherent paragraphs that group related ideas or topics.
    - Correctly identifies speakers throughout the document.
    - Converts all spoken equations into LaTeX format correctly, ensuring that inline and displayed equations are formatted appropriately.
    - Adjusts sentence lengths to improve readability, breaking down overly long sentences into shorter, more manageable ones.
    - Corrects all punctuation, grammatical errors, and recognition mistakes to produce a polished and professional document.
    - Removes all filler words such as "I mean", "you know", "very good", "I see", "very simple" etc. that do not contribute to the meaning or flow of the text.
    - Group sentences of the same speaker conveying the same idea or topic into well-structured, coherent paragraphs.
    - Maintains the original order of information and does not add or omit any significant details.
    - Resolves any discrepancies between the two transcripts in a way that best preserves the intended meaning and flow of the discussion. Use your physics knowledge to make the best decisions.
    </requirements>

    Please revise the document to meet these requirements, ensuring it is a faithful, clear, academically correct, and grammatically correct representation of the academic discussion, leveraging the strengths of both transcription sources.
