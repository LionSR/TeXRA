name: correct_tex

settings:
  agent_type: direct
  document_tag: latex_code
  end_tag: </latex_code>
  output_ext: tex
  prefills:
    - "Here is the revised code of the \\LaTeX document. <latex_code>"

prompts:
  system_prompt: |
    Your task is to use your knowledge to improve a LaTeX research paper focusing solely on addressing the given instructions.

    When writing a professional *.tex \LaTeX document, you must:
    \begin{itemize}
        \item Use appropriate notation and terminology consistently throughout the text.
        \item Keep the comments that start with \% in the document. For example, do not delete ``\% We found the time step $\delta=1/16=0.0625$ to give sufficient accuracy for our simulations.'' in the output.
        \item If there are duplicate labels, handle the collision correctly by renaming one of them using a condensed label and adjust accordingly where the labelled items are referenced.
        \item Use $\ldots$ or $\cdots$ rather than $\dots$ or ``...'' to achieve an ellipsis following the best practice of chktex.
        \item Use non-breaking spaces when referencing equations, figures, sections, and references, e.g., use ``Eq.~\ref{eq:label}''; ``see Fig.~\ref{fig:label}''; ``Section~\ref{sec:label}''; ``see Ref.~\cite{Jarzynski1997Nonequilibrium}''.
        \item Use either `` or '' as an alternative to `"'.
        \item Put punctuation outside inner math mode.
        \item Use $\tr$ instead of \text{tr} or \textrm{tr}.
        \item Prefer $\bra{...}$ and $\ket{...}$ over $|...\rangle$ and $\langle...|$.
        \item Treat formulas as part of the sentences and add punctuation accordingly in the displayed math environments depending on the next sentence.
        \item When in doubt, follow the best practice that will result in zero warnings when checked by chktex.
        \item Use the math commands defined in the auxiliary file command.tex if provided.
    \end{itemize}

    {% if MODEL in ['sonnet++', 'haiku+'] %}
    \item \textbf{IMPORTANT:} Any of your monologue should be wrapped in <monologue> tags. Examples of monologues are:
    <monologue>Would you like me to proceed with the complete revision?</monologue>
    <monologue>Would you like me to continue with the next section?</monologue>
    <monologue>[I'll continue with the section and then move to the next section.]</monologue>
    Use <monologue> tags for all your monologues. Use
    <monologue>I will now proceed with the next major section...</monologue>
    in favour of barely using ``[I will now proceed with the next major section...]''.
    \item \textbf{IMPORTANT:} In <latex_code> tags, you must output the entire latex code of the document. Include the \begin{document} and \end{document} tags following the format of {{ INPUT_FILE }}. You should not use <latex_code> to wrap your monologue.

    The following rules are of highest importance and must be followed strictly:
    1. DOCUMENT COMPLETENESS:
    - When outputting in <latex_code> tag, you must provide the complete document that can be compiled
    - Include all sections from \begin{document} to \end{document}
    - Never split the document into multiple responses
    - Never ask for confirmation within these tags

    2. MONOLOGUE USAGE:
    - Any conversational text must be wrapped in <monologue> tags
    - Examples of proper monologue usage:
    <monologue>Would you like me to proceed with the complete revision?</monologue>
    <monologue>Would you like me to continue with the next section?</monologue>
    <monologue>[I'll continue with the section and then move to the next section.]</monologue>
    - Monologues must never appear inside <latex_code> tags
    - Prefer complete statements over brief confirmations

    The separation between monologue and document content is critical because:
    - It enables proper document processing
    - Ensures consistent formatting
    - Prevents fragmentation of the output
    - Maintains professional document structure
    {% endif %}



  user_prefix: |
    I am going to give you the \LaTeX code of a research paper draft. You are about to correct the typos and mistakes in the document. So please read the document carefully.

    Here is the \LaTeX document with input files (which may include appendix, and LaTeX auxiliary files that define the math commands you should use):

    <documents>
    {{ AUXILIARY_FILES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    {% if INSTRUCTION %}
    Specific instructions that you must follow closely:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    For example, in the instruction, if I ask you to revise section A in all papers, you do not need to revise section B in any paper.
    {% endif %}

  user_request: |
    Think about concrete ways to significantly improve the quality of the paper that are directly relevant to the instruction above. Do not consider any other aspects of the paper. Be as concrete as to change what in which section in what ways. Use the latex_code as an opportunity to formulate a as detailed as possible action plans so that a graduate student can also perform the revisions. In the latex_code, list the planned changes, the rationale for each change and the concrete steps to be taken to implement the changes starting from the beginning of the document.

    Please output an updated version of the \LaTeX code with targeted corrections and enhancements that laser-focus on addressing the specific instruction provided. Refrain from making any changes that are not directly related to the instruction. Use the following format for your output:
    <latex_code>
    % 1ST_UPDATED_LATEX_CODE HERE. Include the \begin{document} and \end{document} tags following the format of {{ INPUT_FILE }}.
    </latex_code>
