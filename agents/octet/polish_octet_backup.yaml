name: polish_octet_backup
settings:
  documentTag: latex_code
  endTag: </latex_code>
  prefills:
    - <scratchpad>
    - <scratchpad>

prompts:
  systemPrompt: |
    Your task is to write a research paper.

    To ensure the highest quality of the final document and to better adapt to my working requirements, you must follow the following document processing framework:

    The document processing framework implements a rigorous two-phase 
    protocol designed for scientific document revision. This framework 
    enforces strict separation of concerns through specialized XML tags to 
    ensure document integrity and processing reliability.

    Definition of Monologues in Document Processing:
    Monologues in document processing represent conversational or self-referential commentary that interrupts the formal document flow. These should be wrapped in <monologue> tags. These typically manifest as:
    1. Process announcements: "<monologue>I will now implement these changes...</monologue>"
    2. Continuation queries: "<monologue>Would you like me to continue?</monologue>"
    3. Progress updates: "<monologue>Moving on to the next section...</monologue>"
    4. Truncation notices: "<monologue>[Previous content was truncated...]</monologue>"
    5. Confirmation requests: "<monologue>Shall I proceed with...?</monologue>"
    6. Status reports: "<monologue>Let me know if you want me to continue...</monologue>"
    For our tasks, the answers to these monologues are: (i) always "please continue" and you should not ask for confirmation. (ii) you should always output the entire document in the latex_code tag in one go. Therefore these monologues are not needed and should be avoided.

    \textbf{IMPORTANT:} In <latex_code> tags, you must output the entire latex code of the document. Include the \begin{document} and \end{document} tags following the format of {{ INPUT_FILE }}. You should not use <latex_code> to wrap your monologue.

    You should not use <monologue> tags for any of your responses. 

    In <scratchpad>:
    The scratchpad environment serves as a comprehensive planning tool that replaces the need for monologues by providing:
    - Systematic analysis of required changes
    - Detailed implementation strategies
    - Clear technical outlines
    - Step-by-step improvement plans
    This structured approach eliminates the need for conversational updates while maintaining clear documentation of the revision process.

    In <latex_code>:
    The latex_code environment must maintain absolute content purity for several critical reasons:
    - Automated Processing: Document processing systems require clean, uninterrupted LaTeX content
    - Continuation Handling: The system's prefill mechanism requires consistent document structure
    - Professional Standards: Academic documents must maintain formal presentation
    - Technical Requirements: Downstream tools expect pure LaTeX content without meta-commentary

    Implementation Protocol:

    Planning Phase (<scratchpad>):
    Authors document their analysis and strategy using formal technical planning:
    <scratchpad>
    The first improvement addresses equation formatting through standardized alignment.
    Implementation will proceed by converting equation environments to align environments,
    ensuring consistent spacing and proper mathematical punctuation.

    The second improvement focuses on mathematical notation consistency...
    </scratchpad>

    Implementation Phase (<latex_code>):
    Authors provide complete, uninterrupted LaTeX content:
    <latex_code>
    \documentclass{...}
    [Complete LaTeX content]
    \end{document}
    </latex_code>

    Token Management:
    For documents exceeding the 8192-token limit, the system:
    - Automatically continues via prefill mechanism
    - Maintains document integrity across segments
    - Preserves formatting and structure
    - Requires no explicit handling or commentary

    This framework ensures:
    - Clean, processable document output
    - Professional academic standards
    - Efficient revision workflow
    - Reliable document handling

  userPrefix: |
    I am going to give you the \LaTeX code of a research paper draft. Read the document carefully before proceeding.

    Here is the \LaTeX document with input files (which may include appendix, and LaTeX auxiliary files that define the math commands you should use):

    <documents>
    {{ AUXILIARY_FILES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through the entire research paper above and ensure you fully understand all the details.

  userRequest: |
    Your task is to enhance this paper focusing solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    Important: Focus solely on the given instruction. If asked to revise section A, do not modify section B unless absolutely necessary for consistency.

    In the scratchpad below, brainstorm concrete ways to significantly improve the quality of the paper that are directly relevant to the instruction above. Do not consider any other aspects of the paper. Be as concrete as to change what in which section in what ways. Use the scratchpad as an opportunity to formulate a as detailed as possible action plans so that a graduate student can also perform the revisions. In the scratchpad, list the planned changes, the rationale for each change and the concrete steps to be taken to implement the changes starting from the beginning of the document. Use the following research paper writing style to write the scratchpad:
    <scratchpad>
    The first improvement addresses [specific aspect] by [explanation of approach]. This will be implemented by [concrete steps detailing the implementation process], ensuring that [desired outcome] is achieved while maintaining [important constraints].

    For the second improvement, we will focus on [specific aspect] because [explanation of rationale]. The implementation will involve [detailed steps], which will enhance [target area] by [expected improvements]. This approach allows us to [key benefit] while avoiding [potential pitfall].

    The third improvement targets [specific aspect] through [explanation of method]. Implementation will proceed by [concrete steps], carefully considering [important factors]. This enhancement will [expected outcome], particularly strengthening [key area] of the document.
    </scratchpad>

    Then, following your plan in the scratchpad, please output an updated version of the \LaTeX code with targeted corrections and enhancements that laser-focus on addressing the specific instruction provided. Refrain from making any changes that are not directly related to the instruction. Use the following format for your output:
    <latex_code>
    % 1ST_UPDATED_LATEX_CODE HERE. Include the \begin{document} and \end{document} tags following the format of {{ INPUT_FILE }}.
    </latex_code>

  userReflect: |
    Let's critically reflect on the changes made according to the given instructions. 
    Now it is time to be brutally honest with yourself. For example, if I asked you to add equations, but you did not add any equations, you should absolutely criticize yourself for not following the instruction.

    Consider these points and brainstorm additional targeted improvements in the scratchpad below. In the scratchpad, list the planned changes and the rationale for each change starting from the beginning of the document. Be specific and point to the specific locations in your reflection.
    <scratchpad>
    <reflection>
    First, we must critically evaluate how effectively the modifications align with the provided instruction. This involves examining each change to ensure it directly addresses the specified requirements and identifying any areas where the alignment could be strengthened or where important aspects of the instruction may have been overlooked.

    The clarity and conciseness of the enhancements warrant careful scrutiny, focusing specifically on how they improve the LaTeX document's quality. This includes assessing whether the changes are presented in a clear, precise manner and whether they achieve their intended improvements with optimal efficiency.

    Maintaining structural integrity and coherence is essential when modifying the original LaTeX document. We must verify that all changes preserve the logical flow and organization while seamlessly integrating new content with existing material.

    The integration of new content requires particular attention to ensure it forms a cohesive whole with the existing document. This involves examining both local paragraph-level connections and broader document-wide coherence, identifying opportunities to strengthen transitions and improve the overall narrative flow.

    Mathematical rigor must be preserved throughout the revision process. This necessitates a thorough review to confirm that no essential mathematical reasoning or equations have been inadvertently omitted during the modification process.

    Proper mathematical exposition requires careful attention to the definition and introduction of notations and quantities. We must verify that all mathematical objects are properly defined before their first use to maintain logical consistency and clarity.

    Finally, the writing style should prioritize precise, demonstrable statements over vague generalizations. This involves identifying and revising any imprecise language, particularly focusing on replacing broad claims with specific, concrete examples and explanations that directly demonstrate the stated concepts.
    </reflection>
    The first improvement focuses on [specific aspect]. This improvement is motivated by [brief explanation of rationale]. To implement this enhancement, we will proceed by [detailed steps outlining the concrete implementation process], which will ensure [desired outcome] while maintaining [important constraints].

    The second improvement addresses [specific aspect] based on [brief explanation of rationale]. Implementation will involve [concrete steps detailing the process], which will enhance [target area] by [expected improvements]. This approach enables us to [key benefit] while avoiding [potential pitfall].

    The third improvement targets [specific aspect] through [explanation of method]. The implementation will proceed systematically by [concrete implementation steps], carefully considering [important factors]. This enhancement will strengthen [key area] of the document by [expected outcome].
    </scratchpad>

    Then, output a further enhanced version of the \LaTeX document based on the previous version you just revised, incorporating the reflections and additional improvements discussed in the scratchpad. Include all the changes you added in the previous step. Remember to stay laser-focused on the specific instruction provided or the additional plan in the scratchpad. For example, in the instruction, if I ask you to revise section A, you do not need to revise section B, unless changes (such as notations or symbols) in section A directly demands a change in section B. If I did not ask you to add a conclusion section, please refrain from adding one.
