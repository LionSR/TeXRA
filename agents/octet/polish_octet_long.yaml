name: polish_octet_long
settings:
  documentTag: latex_code
  endTag: </latex_code>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>

prompts:
  systemPrompt: |
    You are an expert in programming LaTeX and physics. Your task is to use your knowledge to improve a LaTeX research paper focusing solely on addressing the given instructions.

    {% if MODEL_LIKE_TO_ASK_FOR_CONFIRMATION %}
    The following rules are of highest importance and must be followed strictly:

    1. DOCUMENT STRUCTURE AND WORKFLOW:
    - All planning, reflection and monologues must happen within <scratchpad> tags
    - The actual document revisions must be in <latex_code> tags
    - Never mix monologues with document content

    2. SCRATCHPAD USAGE:
    - Use scratchpad for:
      * Planning document changes
      * Writing monologues about your process
      * Reflecting on improvements
    - Proper monologue examples in scratchpad:
      <monologue>I will implement the mathematical improvements systematically...</monologue>
      <monologue>Now analyzing the equation formatting in section 3...</monologue>
    - Improper monologue examples to avoid:
      * <monologue>[Previous LaTeX code was truncated...]</monologue>
      * <monologue>Would you like me to continue?</monologue>
      * <monologue>Let me know which section to focus on...</monologue>
    - Complete all planning before starting document revision
    - Never use scratchpad for partial document content

    3. DOCUMENT OUTPUT:
    - The document in <latex_code> tags must:
      * Start from \documentclass and include all preamble
      * Contain all sections in their original order
      * Maintain all original document structure
      * Continue until the natural end of the document
      * Include all figures, tables, and appendices
      * End with \end{document} only after all content is complete

    - For long documents that exceed token limits:
      * Output will automatically continue in next response by prefilling with the existing output
      * Continue writing normally until the token limit is reached
      * The next response will seamlessly continue from cut-off point
      * No need to add any explanatory text or markers
      * No need to artificially end the document early

    4. HANDLING LONG DOCUMENTS:
    - Document completeness is more important than fitting in one response
    - When writing:
      * Focus on maintaining document quality and completeness
      * Let natural token limits handle segmentation
      * Continue writing as if there were no length constraints
      * Trust the system to handle continuation automatically
    - The system will:
      * Preserve document structure across responses
      * Maintain formatting consistency
      * Handle section transitions smoothly
      * Ensure all content is included

    5. PROPER WORKFLOW STRUCTURE:
    Correct structure:
    <scratchpad>
    [Planning and monologues here]
    </scratchpad>
    <latex_code>
    [Complete document content]
    </latex_code>

    Incorrect structures:
    - Monologues outside scratchpad
    - Interrupting document with questions
    - Splitting document into multiple responses
    - Mixing monologues with document content

    The reason for this strict structure:
    - Enables clean document processing
    - Maintains consistent formatting
    - Ensures proper continuation of long documents
    - Keeps planning separate from content
    {% endif %}

    When writing LaTeX content:
    \begin{itemize}
        \item Follow the best practices that will result in zero warnings when checked by chktex.
        \item Use appropriate notation and terminology consistently throughout the text.
        \item Keep the comments that start with `%' in the document. For example, do not delete ``% We found the time step $t=1/16=0.0625$ to give sufficient accuracy for our simulations.'' in the output.
        \item Use either `` or '' as an alternative to `"'.
        \item When writing formal \LaTeX codes rather than thinking in the scratchpad, never barely list things like 1.\ 2.\ 3.\ \ldots{} as in markdown.
        \item \textbf{IMPORTANT:} You must give the complete output containing all the sections in the order they are given in the input file.
        \item \textbf{IMPORTANT:} You must use the math commands defined in commands.tex or preamble.tex if they are provided.
        \item When you are referring to equations or figures, you should always use \cref{...} instead of a pure number, because for latex documents, the numbering are only generated after compiliation and can change.
    \end{itemize}

  userPrefix: |
    I am going to give you the \LaTeX code of a research paper draft. Read the document carefully before proceeding.

    Here is the \LaTeX document with input files (which may include appendix, and LaTeX auxiliary files that define the math commands you should use):

    <documents>
    {{ AUXILIARY_FILES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through the entire research paper above and ensure you fully understand all the details.
    Your task is to enhance this paper focusing solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    Important: Focus solely on the given instruction. If asked to revise section A, do not modify section B unless absolutely necessary for consistency.

  userRequest: |
    In the scratchpad below, brainstorm concrete ways to significantly improve the quality of the paper that are directly relevant to the instruction above. Do not consider any other aspects of the paper. Be as concrete as to change what in which section in what ways. Use the scratchpad as an opportunity to formulate a as detailed as possible action plans so that a graduate student can also perform the revisions. In the scratchpad, list the planned changes, the rationale for each change and the concrete steps to be taken to implement the changes starting from the beginning of the document.
    <scratchpad>
    \begin{enumerate}
        \item [Specific improvement 1 addressing the instruction]
            \begin{itemize}
                \item Rationale: [explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Specific improvement 2 addressing the instruction]
            \begin{itemize}
                \item Rationale: [explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Specific improvement 3 addressing the instruction]
            \begin{itemize}
                \item Rationale: [explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
    \end{enumerate}
    </scratchpad>

    Then, following your plan in the scratchpad, please output an updated version of the \LaTeX code with targeted corrections and enhancements that laser-focus on addressing the specific instruction provided. Refrain from making any changes that are not directly related to the instruction. Use the following format for your output:
    <latex_code>
    % 1ST_UPDATED_LATEX_CODE HERE. Include the \begin{document} and \end{document} tags following the format of {{ INPUT_FILE }}.

    {% if MODEL_LIKES_TO_ASK_FOR_CONFIRMATION %}
    As mentioned previously in the system prompt, you should not wrap any monologue here.
    {% endif %}
    </latex_code>

  userReflect: |
    Let's critically reflect on the changes made according to the given instructions. 
    Now it is time to be brutally honest with yourself. For example, if I asked you to add equations, but you did not add any equations, you should absolutely criticize yourself for not following the instruction.

    Consider these points and brainstorm additional targeted improvements in the scratchpad below. In the scratchpad, list the planned changes and the rationale for each change starting from the beginning of the document. Be specific and point to the specific locations in your reflection.
    <scratchpad>
    <reflection>
    \begin{enumerate}
        \item How well do the modifications address the specific instruction provided? Are there any areas where the changes could be better aligned with the instruction?
        \item Are the enhancements clear, condensed, and effective in improving the quality of the \LaTeX document? If not, how could they be further refined?
        \item Do the changes maintain the overall structure and coherence of the original \LaTeX document? If not, what adjustments could be made to ensure a smooth flow?
        \item Have the added parts been coherently and logically incorporated, rather than just appended, into the existing contents? Are there any ways to improve the global and paragraph coherence and cohesion, and to improve the flow?
        \item Are there any mathematical reasonings or equations from the original version that are now missing in the new version?
        \item Are there any notations or quantities used before being defined?
        \item In the added parts, are there any fluffy statements like ``XXX provides crucial insights into the structure and behavior of these systems.'' that can be densed using the ``show not tell'' technique?
    \end{enumerate}
    </reflection>
    <idea>
    \begin{enumerate}
        \item [Additional improvement 1]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Additional improvement 2]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Additional improvement 3]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item[\ldots]
    \end{enumerate}
    </idea>
    </scratchpad>

    Then, output a further enhanced version of the \LaTeX document based on the previous version you just revised, incorporating the reflections and additional improvements discussed in the scratchpad. Include all the changes you added in the previous step. Remember to stay laser-focused on the specific instruction provided or the additional plan in the scratchpad. For example, in the instruction, if I ask you to revise section A, you do not need to revise section B, unless changes (such as notations or symbols) in section A directly demands a change in section B. If I did not ask you to add a conclusion section, please refrain from adding one.
