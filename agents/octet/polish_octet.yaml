name: polish_octet
settings:
  documentTag: latex_code
  endTag: </latex_code>
  prefills:
    - <scratchpad>
    - <scratchpad>

prompts:
  systemPrompt: |
    Your task is to write a research paper.

    When writing a professional *.tex \LaTeX document, you must:
    \begin{itemize}
        \item Use appropriate notation and terminology consistently throughout the text.
        \item Keep the comments that start with `%' in the document. For example, do not delete ``% We found the time step $\delta=1/16=0.0625$ to give sufficient accuracy for our simulations.'' in the output.
        \item If there are duplicate labels, handle the collision correctly by renaming one of them using a condensed label and adjust accordingly where the labelled items are referenced.
        \item Use $\ldots$ or $\cdots$ rather than $\dots$ or ``...'' to achieve an ellipsis following the best practice of chktex.
        \item Use non-breaking spaces when referencing equations, figures, sections, and references, e.g., use ``Eq.~\ref{eq:label}''; ``see Fig.~\ref{fig:label}''; ``Section~\ref{sec:label}''; ``see Ref.~\cite{Jarzynski1997Nonequilibrium}''.
        \item Use either `` or '' as an alternative to `"'.
        \item Put punctuation outside inner math mode.
        \item Use $\tr$ instead of \text{tr} or \textrm{tr}.
        \item Prefer $\bra{...}$ and $\ket{...}$ over $|...\rangle$ and $\langle...|$.
        \item Treat formulas as part of the sentences and add punctuation accordingly in the displayed math environments depending on the next sentence.
        \item When in doubt, follow the best practice that will result in zero warnings when checked by chktex.
        \item Use the math commands defined in the auxiliary file command.tex if provided.
    \end{itemize}

    {% if MODEL_LIKE_TO_ASK_FOR_CONFIRMATION %}
    \item \textbf{IMPORTANT:} Any of your monologue should be wrapped in <monologue> tags. Examples of monologues are:
    <monologue>Would you like me to proceed with the complete revision?</monologue>
    <monologue>Would you like me to continue with the next section?</monologue>
    <monologue>[I'll continue with the section and then move to the next section.]</monologue>
    Use <monologue> tags for all your monologues. Use
    <monologue>I will now proceed with the next major section...</monologue>
    in favour of barely using ``[I will now proceed with the next major section...]''.
    \item \textbf{IMPORTANT:} In <latex_code> tags, you must output the entire latex code of the document. Include all the sections following the order and the format of {{ INPUT_FILE }}. You should not use <latex_code> to wrap your monologue.
    \item \textbf{IMPORTANT:} In <output> tags, you must output the latex code of the each section. You should not use <output> to wrap your monologue.

    The following rules are of highest importance and must be followed strictly:
    1. DOCUMENT COMPLETENESS:
    - When outputting in <latex_code> or <output> tags, you must provide the complete document that can be compiled
    - Include all sections following the order and the format of {{ INPUT_FILE }}
    - Never split the document into multiple responses
    - Never ask for confirmation within these tags

    2. MONOLOGUE USAGE:
    - Any conversational text must be wrapped in <monologue> tags
    - Examples of proper monologue usage:
    <monologue>Would you like me to proceed with the complete revision?</monologue>
    <monologue>Would you like me to continue with the next section?</monologue>
    <monologue>[I'll continue with the section and then move to the next section.]</monologue>
    - Monologues must never appear inside <latex_code> or <output> tags
    - Prefer complete statements over brief confirmations

    The separation between monologue and document content is critical because:
    - It enables proper document processing
    - Ensures consistent formatting
    - Prevents fragmentation of the output
    - Maintains professional document structure
    {% endif %}

  userPrefix: |
    I am going to give you the \LaTeX code of a research paper draft. Read the document carefully before proceeding.

    Here is the \LaTeX document with input files (which may include appendix, and LaTeX auxiliary files that define the math commands you should use):

    <documents>
    {{ AUXILIARY_FILES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through the entire research paper above and ensure you fully understand all the details.
    Your task is to enhance this paper focusing solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    Important: Focus solely on the given instruction. If asked to revise section A, do not modify section B unless absolutely necessary for consistency.

  userRequest: |
    In the scratchpad below, brainstorm concrete ways to significantly improve the quality of the paper that are directly relevant to the instruction above. Do not consider any other aspects of the paper. Be as concrete as to change what in which section in what ways. Use the scratchpad as an opportunity to formulate a as detailed as possible action plans so that a graduate student can also perform the revisions. In the scratchpad, list the planned changes, the rationale for each change and the concrete steps to be taken to implement the changes starting from the beginning of the document. 

    Then, following your plan in the scratchpad, please output an updated version of the \LaTeX code with targeted corrections and enhancements that laser-focus on addressing the specific instruction provided. Refrain from making any changes that are not directly related to the instruction. 

    Use the following style for your output:
    <scratchpad>
    The first improvement addresses [specific aspect] by [explanation of approach]. This will be implemented by [concrete steps detailing the implementation process], ensuring that [desired outcome] is achieved while maintaining [important constraints].

    For the second improvement, we will focus on [specific aspect] because [explanation of rationale]. The implementation will involve [detailed steps], which will enhance [target area] by [expected improvements]. This approach allows us to [key benefit] while avoiding [potential pitfall].

    The third improvement targets [specific aspect] through [explanation of method]. Implementation will proceed by [concrete steps], carefully considering [important factors]. This enhancement will [expected outcome], particularly strengthening [key area] of the document.
    </scratchpad>
    <latex_code>
    % 1ST_UPDATED_LATEX_CODE HERE. Follow the order and the format of {{ INPUT_FILE }}.
    </latex_code>

  userReflect: |
    Let's critically reflect on the changes made according to the given instructions. 
    Now it is time to be brutally honest with yourself. For example, if I asked you to add equations, but you did not add any equations, you should absolutely criticize yourself for not following the instruction.

    Your task is to:
    1. First, reflect on your previous changes and brainstorm additional improvements in the scratchpad below
    2. Then, output a complete revised LaTeX document that incorporates both your previous changes and these new improvements

    Use the following format for your response:
    <scratchpad>
    <reflection>
    First, we must critically evaluate how effectively the modifications align with the provided instruction. This involves examining each change to ensure it directly addresses the specified requirements and identifying any areas where the alignment could be strengthened or where important aspects of the instruction may have been overlooked.

    The clarity and conciseness of the enhancements warrant careful scrutiny, focusing specifically on how they improve the LaTeX document's quality. This includes assessing whether the changes are presented in a clear, precise manner and whether they achieve their intended improvements with optimal efficiency.

    Maintaining structural integrity and coherence is essential when modifying the original LaTeX document. We must verify that all changes preserve the logical flow and organization while seamlessly integrating new content with existing material.

    The integration of new content requires particular attention to ensure it forms a cohesive whole with the existing document. This involves examining both local paragraph-level connections and broader document-wide coherence, identifying opportunities to strengthen transitions and improve the overall narrative flow.

    Mathematical rigor must be preserved throughout the revision process. This necessitates a thorough review to confirm that no essential mathematical reasoning or equations have been inadvertently omitted during the modification process.

    Proper mathematical exposition requires careful attention to the definition and introduction of notations and quantities. We must verify that all mathematical objects are properly defined before their first use to maintain logical consistency and clarity.

    Finally, the writing style should prioritize precise, demonstrable statements over vague generalizations. This involves identifying and revising any imprecise language, particularly focusing on replacing broad claims with specific, concrete examples and explanations that directly demonstrate the stated concepts.
    </reflection>

    Based on this reflection, here are the concrete improvements we will make:

    The first improvement focuses on [specific aspect]. This improvement is motivated by [brief explanation of rationale]. To implement this enhancement, we will proceed by [detailed steps outlining the concrete implementation process], which will ensure [desired outcome] while maintaining [important constraints].

    The second improvement addresses [specific aspect] based on [brief explanation of rationale]. Implementation will involve [concrete steps detailing the process], which will enhance [target area] by [expected improvements]. This approach enables us to [key benefit] while avoiding [potential pitfall].

    The third improvement targets [specific aspect] through [explanation of method]. The implementation will proceed systematically by [concrete implementation steps], carefully considering [important factors]. This enhancement will strengthen [key area] of the document by [expected outcome].
    </scratchpad>
    <latex_code>
    % Complete LaTeX document incorporating all previous changes and new improvements
    % Follow the order and format of {{ INPUT_FILE }}
    </latex_code>

    Remember to stay laser-focused on the specific instruction provided. If asked to revise section A, do not modify section B unless absolutely necessary for consistency (e.g., notation changes that must be propagated). Do not add new sections unless specifically requested.
