name: lecture2tex

settings:
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>
  requiredFiles:
    DOCUMENT_CLS: lecture.cls
    COMMAND: commands_qi.tex

prompts:
  systemPrompt: |
    You are a professor of quantum information, a meticulous transcriber, and an expert physics graduate-level textbook writer.

  userPrefix: |
    I am going to give you a transcribed txt from a lecture of a graduate quantum information course. You are about to rewrite it line by line into formal graduate textbook language using LaTeX, so read extremely carefully.

    Here is the transcription {{ INPUT_FILE }} with additional \LaTeX document class and commands (where has defined the math commands you should use):

    <documents>
    <document name="{{ DOCUMENT_CLS_FILE }}">
    {{ DOCUMENT_CLS_CONTENT }}
    </document>
    <document name="{{ COMMAND_FILE }}">
    {{ COMMAND_CONTENT }}
    </document>
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

  userRequest: |
    Your task is to rewrite the provided transcribed lecture into a long-formed graduate-level physics textbook style \LaTeX document, closely following these guidelines:
    <guidelines>
    \begin{enumerate}
        \item The rewrite should meticulously reflect all information from the lecture, strictly maintaining the original order in the transcription.
        \item Ensure that every concept and equation mentioned in the transcription is included and elaborated upon.
        \item Organize the document into well-structured sections and subsections using \section{} and \subsection{}. Use at most three \section{} in each lecture.
        \item In all the sections and subsections, make extensive use of |\paragraph{} to explain each concept.
        \item Utilize math commands from commands_qi.tex and the document class lecture.cls to typeset mathematical equations and expressions.
        \item Use \begin{equation} and \end{equation} and \ee for displayed equations, and \begin{align} and \end{align} for multi-line equations. The text should be technical, with all key equations prominently displayed.
        \item Employ \begin{example}...\end{example} to present examples, ensuring they are thoroughly explained and connected to the main content.
        \item Ignore administrative information about the course such as exam date in the rewrite.
        \item Use an introduction section at the beginning, but never add a conclusion section at the end.
    \end{enumerate}
    </guidelines>

    Thoroughly study the writing style, pedagogical approach, and level of detail from the following examples and use them in your output. The transcription is colloquial (similar to the ones under the <input> tag), so rephrase it using formal, precise, and technical language similar to the provided examples inside the <output> tag. However, only directly incorporate content from the examples if it is explicitly referenced in the transcription.
    <example>
    <input>
    As you know, last century there were many scientific and technological revolutions, but there were two that changed our society and the way that we look at nature very much. One of them was the discovery of quantum physics, and the second one was the discovery of information theory. Information theory, developed in the 40s by Shannon and many other people, basically tells us that information is something that can be measured. You can have, for example, three books and you can say that the first book has more information than the second and the second more than the third. It can be quantified how much information you have. This information is just basically a measure of surprise. If you learn a lot by reading a book, then it means that it had a lot of information for you. If you don't learn much, then there is little information. Information theory also showed that information can be manipulated, compressed, corrected if there are some errors, and processed. The theory behind all this manipulation of information is the basis of communication systems, computer systems, artificial intelligence, and many other things today.

    The second revolution was quantum physics. As you know, it was discovered at the beginning of the last century that some experiments could not be explained with the standard theories of classical mechanics, classical electromagnetism, classical thermodynamics, or classical statistical mechanics. That's why at the beginning of the century, some scientists came up with ideas to explain these experiments. The first was Max Planck, who, in order to describe the spectrum of radiation of a black body, had to introduce that light was quantized. The energy of light that comes to us is not continuous, but it comes in small indivisible quanta. 

    Later on, in the 20s and 30s, people realized that instead of having postulates just to explain experiments, we could have a theory from which you could deduce everything else. That's where Heisenberg and Schrödinger developed the Schrödinger equation and the way that we describe quantum mechanics nowadays. It was a theory that was predictive. One could take the theory and predict some phenomenon that people wanted to experiment and measure. It was indeed predictive and very precise.
    </input>
    <output>
    The last century witnessed many scientific and technological revolutions, but two in particular profoundly changed our society and the way we perceive nature, conduct science, and more. These were the discovery of quantum physics and the development of information theory.

    Information theory, developed in the 1940s by Shannon and others, posits that information can be measured and quantified. For example, given three books, one can determine which contains the most information based on how much the reader learns from it. This quantifiable information is essentially a measure of surprise - the more one learns from a book, the more information it contains. Information theory also showed that information can be manipulated, compressed, error-corrected, and processed. In fact, the theory underpinning these information manipulations forms the basis of modern communication systems, computer systems, artificial intelligence, and many other fields.

    The second revolution was quantum physics. At the beginning of the last century, certain experiments could not be explained by classical theories such as classical mechanics, electromagnetism, thermodynamics, and statistical mechanics. To explain these experiments, scientists introduced new ideas. Max Planck, for instance, proposed that light energy is quantized, coming in indivisible packets, to describe the spectrum of black body radiation. 

    In the 1920s and 1930s, instead of ad hoc postulates to explain experiments, scientists developed a comprehensive theory from which everything else could be deduced. Heisenberg and Schr\"odinger were key figures in developing the Schr\"odinger equation and the modern formulation of quantum mechanics. This theory was not only explanatory but also predictive - one could use the theory to predict phenomena that could then be experimentally verified. The theory was highly accurate in its predictions.
    </output>
    </example>

    <example>
    <input>
    Okay, so let me write an example. For example, this matrix:
    $$
    \begin{pmatrix}
    2 & 1 & 0\\
    1 & 2 & 1\\
    0 & 1 & 3
    \end{pmatrix}
    $$
    This matrix has eigenvalue 1, which is degenerate, so $d_1 = 2$. It has eigenvalue 3, $d_3 = 1$.

    And the eigenvectors of this matrix, so you can see them right away, basically for eigenvalue 1 here is the vector, let me call it the vector $\ket{v_2}$, $\ket{v_1}$, $\ket{v_3}$. So I call the basis $\ket{1}$, $\ket{2}$, $\ket{3}$, this is the basis in which I have written the matrix.

    So this is one vector, the other vector is $\frac{1}{\sqrt{2}}(1, -1, 0)$. And this is just the vector $(0, 0, 1)$.

    And if I call this vector $\ket{v_{1,1}}$, this vector $\ket{v_{1,2}}$ and this vector $\ket{v_{3,1}}$, then we can write the whole matrix, this example as:
    $$
    \ket{v_{1,1}}\bra{v_{1,1}} + \ket{v_{1,2}}\bra{v_{1,2}} + 3 \ket{v_{3,1}}\bra{v_{3,1}}
    $$
    Okay, just replace this in here with this operation and you will get the matrix, it is there.

    And now this here is a projector, so it has a 1 in front, which is the eigenvalue, 1. And so you can call this $P_1$, and this is called $P_2$, and so this is equal to $P_1 + 3 P_2$. Very, very simple.
    </input>
    <output>
    \begin{example}[Spectral decomposition of a degenerate matrix] For the matrix $M$ given by
        \begin{equation}
            M =
            \begin{pmatrix}
                2 & 1 & 0 \\
                1 & 2 & 0 \\
                0 & 0 & 1
            \end{pmatrix},
        \ee
        the eigenvalues and corresponding eigenvectors are:
        \begin{align}
            \lambda_1 & = 1, \ket{v_{1,1}} = \begin{pmatrix}0 \\0 \\1\end{pmatrix}, \ket{v_{1,2}} = \frac{1}{\sqrt{2}}\begin{pmatrix}1 \\-1 \\0\end{pmatrix}; \\
            \lambda_2 & = 3, \ket{v_{2,1}} = \frac{1}{\sqrt{2}}\begin{pmatrix}1 \\1 \\0\end{pmatrix}.
        \end{align}
        The eigenvectors $\ket{v_{1,1}}$ and $\ket{v_{1,2}}$ are said to be degenerate because they are orthogonal eigenvectors of $M$ with the same eigenvalue $\lambda_1=1$. We can henceforth write down the spectral decomposition of $M$ in terms of projectors onto each eigenspace
        \begin{equation}
            M = \ket{v_{1,1}}\bra{v_{1,1}}+\ket{v_{1,2}}\bra{v_{1,2}}+3\ket{v_{2,1}}\bra{v_{2,1}}={P}_{\lambda_1}+3{P}_{\lambda_2}.
        \ee
    \end{example}
    </output>
    </example>

    <example>
    <input>
    Second thing is that I have to tell you how to do inner products. And to do inner products, then I know that this is an orthonormal basis. And by knowing that, then I have everything. I don't have to tell you anything else.

    So if I have this state $\ket{\psi} = \sum_{nm} c_{nm} \ket{nm}$, and if I have another one, $\ket{\phi} = \sum_{n'm'} d_{n'm'} \ket{n'm'}$, then how do I define the inner product? Well, it would be
    $$
        \braket{\phi|\psi} = \sum_{nmn'm'} d_{n'm'}^* c_{nm} \braket{n'm'|nm}
    $$
    And I would have the inner product of $\ket{n'm'}$ and $\ket{nm}$, but this is an orthonormal basis. So this $n'$ should be equal to $n$, and $m'$ should be equal to $m$. So what I get is an inner product:
    $$
        \braket{\phi|\psi} = \sum_{nm} d_{nm}^* c_{nm}
    $$
    And with that, everything is defined. Here, what we are using is that by definition, $\braket{nm|n'm'} = \delta_{nn'} \delta_{mm'}$. It's an orthonormal basis.
    </input>
    <output>
    \paragraph{Inner product} In order to specify the Hilbert space, we have to define the inner product. This is readily established by using the fact that $\ket{n,m}$ forms an ONB, i.e. $\langle n,m|n',m'\rangle= \delta_{n,n'}\delta_{m,m'}$. Trivially, if
    \begin{equation}
        \label{eq:cnmdnm}
        \ket{\Psi} = \sum_{n,m} c_{n,m} \ket{n,m}\in \mathcal{H}, \quad \ket{\Phi} = \sum_{n,m} d_{n,m} \ket{n,m}\in \mathcal{H},
    \end{equation}
    we have
    \begin{equation}
        \langle \Phi\ket{\Psi}= \sum_{n,m} \overline{d_{nm}}c_{nm}.
    \end{equation}
    </output>
    </example>

    An example for the paragraph:
    <example_paragraph>
    \paragraph{Diagonalization} Given a normal matrix $M$, we can always write
    $M=UDU^\dagger$, where $U$ is a unitary matrix and $D$ is a diagonal matrix. Indeed, using
    (\ref{specdec}), we can write $D_{i,i}=\lambda_i$ and $U_{i,j} = \bra{i}v_j\rangle$, where $\ket{i}$ is the vector with zero entries except for a one at the $i$-th position. It is clear that $U$ defined in this way is unitary, since
    \begin{equation}
        \sum_{j=1}^d U_{i,j} \overline{U}_{k,j} = \sum_{j=1} \bra{i}v_j\rangle\langle v_j\ket{k} = \delta_{i,k}
    \end{equation}
    and thus $U U^\dagger = \Id$.
    </example_paragraph>

    Organize the \LaTeX document using this template:
    <latex_template>
    \documentclass{lecture}
    \input{commands_qi}

    \course{QST Theory: Quantum Information}{Semester}{Prof. Ignacio Cirac}
    \note{Lecture X}{Lecture Title}{}{}

    \begin{document}
    \makeheader

    \section{Section 1}

    [Insert the rephrased lecture text here, ensuring all details are captured]

    \paragraph{Concept 1}

    \subsection{Subsection 1.1}
    ...

    \subsection{Subsection 1.2}
    ...

    \section{Section 2}
    ...

    \subsection{Subsection 2.1}
    ...

    \end{document}
    </latex_template>

    Output the \LaTeX document.

  userReflect: |
    After thoroughly and critically reviewing the LaTeX version and comparing it to the original transcription (enclosed in `<transcription>' tag), ensure that the \LaTeX document:
    <requirements>
    \begin{itemize}
        \item Faithfully represent the content, structure, and detail of the original lecture transcription, maintaining the exact order. Refine the section, subsection, and paragraph structure if necessary.
        \item Increase the level of detail from moderate (6/10) to high (9/10), particularly by reincorporating any missing equations or mathematical details from the transcription.
        \item Formalize any content or equations reintroduced from the transcription to align with the \LaTeX document's formal language and style, preserving the correct order.
        \item Eliminate any inconsistencies, invented information, or hallucinations that may have been introduced during the LaTeX revision. Strictly adhere to the content presented in the original lecture without fabrication.
        \item Refrain from directly copying from the transcription; instead, rephrase and formalize the content.
    \end{itemize}
    </requirements>

    Please output the revised \LaTeX document that meets the above requirements and is an accurate, detailed, and faithful representation of the original lecture transcription, with a specific emphasis on rewriting all the additions in a formalized manner consistent with the \LaTeX document's style at the right place of the document.
