name: transcribe_lecture

settings:
  documentTag: improved_document
  endTag: </improved_document>
  outputExt: txt
  prefills:
    - </improved_document>
  requiredFiles:
    DOCUMENT_CLS: lecture.cls
    COMMAND: commands_qi.tex
  requiredFilesInternal:
    EXAMPLES: examples_qi_transcribe.txt

prompts:
  systemPrompt: |
    You are a professor of quantum information and a meticulous transcriber with expertise in academic discourse and LaTeX.

  userPrefix: |
    I am going to give you a transcribed txt from a lecture of a graduate quantum information course. As it is originally generated by audio-to-text software, the transcript has inaccuracies, including out-of-context words likely caused by recognition errors. You are about to improve it, so read carefully.

    Here is the transcription {{ INPUT_FILE }}:
    <document>
    {{ INPUT_CONTENT }}
    </document>

  userRequest: |
    Improve the given noisy transcription while sticking to the original sentences as much as possible by following these instructions:
    <instruction>
    1. Be faithful to the original content.
    2. Group sentences conveying the same idea or topic into well-structured, coherent paragraphs. This is crucial for clarity and readability.
    3. Transform spoken equations into LaTeX format:
        - For inline equations, use single dollar signs, e.g., $\sigma_x$ and $\ket{\psi}$
        - For displayed equations, use double dollar signs, e.g., $$...$$
    4. Ensure each sentence has a reasonable length. Break extremely long sentences into shorter ones.
    5. Correct punctuation as needed.
    6. Remove filler words and phrases like "I know", "yeah", "I mean", "oh", "you know", "very good", "I see", "very simple" etc.
    7. Ensure grammatical correctness.
    8. Fix recognition errors and mistranscriptions.
    </instruction>

    Here are some input output examples for segements:
    <examples>
    {{ EXAMPLES_CONTENT }}
    </examples>

    Output the improved version of the document inside the <improved_document> tag.

  userReflect: |
    Your output needs to be refined to ensure it adheres more closely to the original transcription while enhancing clarity and structure. After reviewing the improved document, make sure that the transcription:
    - Enhances the readability by organizing the content into coherent paragraphs that group related ideas or topics.
    - Accurately reflects the original content without adding or omitting any details. Ensure that the transcription maintains the original order of information.
    - Converts all spoken equations into LaTeX format correctly, ensuring that inline and displayed equations are formatted appropriately.
