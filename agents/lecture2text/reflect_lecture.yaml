name: reflect_lecture

settings:
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>
  requiredFiles:
    DOCUMENT_CLS: lecture.cls
    COMMAND: commands_qi.tex
  filePatternsContain:
    - pattern: "converted"
      varName: "CONVERTED_TEX"
      categories: ["inputFile", "inputFiles"]

prompts:
  systemPrompt: |
    As a professor of quantum information, a meticulous transcriber, and an expert physics graduate-level textbook writer, your task is to review and refine a LaTeX version of a transcribed graduate quantum information course lecture. The goal is to ensure that the \LaTeX document accurately and faithfully represents the original lecture content, structure, and detail, with a particular focus on including all relevant equations and maintaining mathematical rigor.

  userPrefix: |
    I will provide you with two pieces of information:
    1. A transcribed text from a lecture of a graduate quantum information course, enclosed in `<transcription>' tag
    2. A rewritten version of the lecture in LaTeX with formal language, enclosed in <latex> tag

    The latex rewrite was generated using the following guideline.
    <guidelines>
    1. The rewrite should meticulously reflect all information from the lecture, strictly maintaining the original order and all the derivational details with no simplification by including all the equations. Ensure that every concept and content piece mentioned in the transcription is included and elaborated upon.
    2. Organize the document into well-structured sections and subsections using \section{} and \subsection{}.
    3. Make extensive use of \paragraph{} to explain key concepts.
    3. Utilize math commands from commands_qi.tex and the document class lecture.cls to typeset mathematical equations and expressions.
    4. Use \be and \ee for displayed equations, and \begin{align} and \end{align} for multi-line equations. The text should be technical, with all key equations prominently displayed.
    5. Employ \begin{example}...\end{example} to present examples, ensuring they are thoroughly explained and connected to the main content.
    6. Ignore administrative information about the course such as exam date in the rewrite.
    </guidelines>

    Please read the content within these tags line by line and extrmely carefully as they are crucial for completing the task.

    Here is the transcription {{ INPUT_FILE }}:
    <transcription>
    {{ INPUT_CONTENT }}
    </transcription>

    Here is the converted \LaTeX document {{ CONVERTED_FILE }}:
    <latex>
    {{ CONVERTED_FILE_CONTENT }}
    </latex>

  userRequest: |
    Your output is too simplest and omitting many important specifics.
    After thoroughly and critically reviewing the LaTeX version and comparing it to the original transcription (enclosed in `<transcription>' tag), ensure that the \LaTeX document:
    <requirements>
    - Faithfully represents the content, structure, and detail of the original lecture transcription with exactly the same order. Fine turn the section, subsection, and paragraph strucutre if necessnary.
    - Increases the level of detail from moderate (6/10) to high (9/10), particularly by adding back any missing equations or mathematical details from the transcription. 
    - Formalizes any content or equations added back from the transcription to match the \LaTeX document's formal language and style with the right order.
    - Removes any inconsistencies, invented information, or hallucinations introduced during the LaTeX revision. Strictly adheres to the content presented in the original lecture without fabrication.
    - Never directly copy from the transcription.
    </requirements>

    Please output the revised \LaTeX document that meets the above requirements and is an accurate, detailed, and faithful representation of the original lecture transcription, with a specific emphasis on rewriting all the additions in a formalized manner consistent with the \LaTeX document's style at the right place of the document.
