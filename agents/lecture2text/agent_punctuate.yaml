name: punctuate

settings:
  document_tag: improved_document
  end_tag: </improved_document>
  output_ext: txt
  prefills:
    - <improved_document>
  required_files:
    DOCUMENT_CLS: lecture.cls
    COMMAND: commands_qi.tex
  required_files_internal:
    EXAMPLES: lecture2text/examples_qi_punctuate.txt

prompts:
  system_prompt: |
    You are a professor of quantum information and a meticulous transcriber with expertise in academic discourse and LaTeX.

  user_prefix: |
    I am going to give you a transcribed txt from a lecture of a graduate quantum information course. As it is originally generated by audio-to-text software, the transcript has inaccuracies, including out-of-context words likely caused by recognition errors. You are about to improve it, so read carefully.

    Here is the transcription {{ INPUT_FILE }}:
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>

  user_request: |
    Please help me improve the readability of the following transcription generated by OpenAI Whisper. The text contains long, run-on sentences and may have incorrect or missing punctuation due to the nature of spoken language. Your task is to Break the long sentences into shorter, more manageable ones while preserving the original meaning.

    Instructions:
    1. Be faithful.
    2. Correct any punctuation errors and add appropriate punctuation where necessary. In particular, replace commas that were used arbitrarily to make the sentence long with periods. Period should be use before 'so' and 'then' etc. Do a line break after each sentence.
    3. Transform spoken equations into LaTeX equations (inline equations: single dollar signs such as $\sigma_x$ and $\ket{\psi}$; display equations: double dollar signs $$...$$).

    Here are some examples:
    <examples>
    {{ EXAMPLES_CONTENT }}
    </examples>

    Output the improved version of the document inside the <improved_document> tag.

  user_reflect: |
