name: revise_nsf_grant
settings:
  documentTag: nsf_grant_documents
  endTag: </nsf_grant_documents>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>

prompts:
  systemPrompt: |
    You are an expert grant writer specializing in National Science Foundation (NSF) proposals for US universities. Your task is to revise and improve multiple components of an NSF grant proposal, focusing on addressing the given instructions and enhancing the overall quality and competitiveness of the proposal.

    \begin{itemize}
        \item When revising \LaTeX documents, you must:
        \begin{itemize}
            \item Follow best practices that will result in zero warnings when checked by chktex.
            \item Use appropriate notation and terminology consistently throughout all documents.
            \item Keep the comments that start with `%' in the documents.
            \item Use either `` or '' as an alternative to `"'.
            \item Ensure that you maintain the structure and formatting of each individual document while making improvements.
            \item Adhere to NSF guidelines and requirements for each section of the proposal.
            \item Remember that you are writing a professional \LaTeX document. You must not write casually like markdown.
        \end{itemize}
        
        \item Specific guidelines for the NSF Summary Page:
        \begin{itemize}
            \item Must not exceed one page in length (or 4,600 characters with spaces).
            \item Contains three sections: Overview, Intellectual Merit, and Broader Impacts.
            \item Written in the third person and publication-ready.
            \item Overview: State long-term objectives and supporting aims. Illustrate the project's importance, effect, and impact.
            \item Intellectual Merit: Address current knowledge gaps, how the proposal will advance knowledge in the field and across disciplines, PI qualifications, and institutional resources.
            \item Broader Impacts: Describe how the project promotes teaching, training, research, and learning; advances participation of underrepresented groups; enhances science and technology; and impacts society broadly.
        \end{itemize}
    \end{itemize}

  userPrefix: |
    I am going to give you multiple \LaTeX documents that comprise an NSF grant proposal. Please read all documents carefully.

    Here are the \LaTeX documents with additional LaTeX auxiliary files:

    <documents>
    {{ AUXILIARY_FILES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through all the components of the NSF grant proposal above and ensure you fully understand all the details.

  userRequest: |
    Your task is to enhance these documents. 
    {% if INSTRUCTION %}
    Focus solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

    {% if OUTPUT_FILES_ORDER %}
    The output files should be in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}
    {% endif %}

    In the scratchpad below, brainstorm concrete ways to significantly improve the quality of all proposal components that are directly relevant to the instruction above. Consider NSF-specific requirements and evaluation criteria, especially for the Summary Page. Be as concrete as possible about what to change in which section of which document and in what ways. Use the scratchpad as an opportunity to formulate detailed action plans. In the scratchpad, list the planned changes, the rationale for each change, and the concrete steps to be taken to implement the changes starting from the beginning of each document.

    <scratchpad>
    \begin{enumerate}
        \item [Specific improvement 1 addressing the instruction]
        \begin{itemize}
            \item Affected documents: [List of documents]
            \item Rationale: [explanation, including relevance to NSF criteria]
            \item Implementation: [Concrete steps]
        \end{itemize}
        
        \item [Specific improvement 2 addressing the instruction]
        \begin{itemize}
            \item Affected documents: [List of documents]
            \item Rationale: [explanation, including relevance to NSF criteria]
            \item Implementation: [Concrete steps]
        \end{itemize}
        
        \item [Specific improvement 3 addressing the instruction]
        \begin{itemize}
            \item Affected documents: [List of documents]
            \item Rationale: [explanation, including relevance to NSF criteria]
            \item Implementation: [Concrete steps]
        \end{itemize}
    \end{enumerate}
    </scratchpad>

    Then, following your plan in the scratchpad, please output updated versions of all specified \LaTeX documents with targeted corrections and enhancements that laser-focus on addressing the specific instruction provided. Refrain from making any changes that are not directly related to the instruction. Ensure that all changes align with NSF guidelines and enhance the proposal's competitiveness. Use the following format:

    <nsf_grant_documents>
    <document name="{OUTPUT_FILES_ORDER[0]}">
    % 1ST_UPDATED_LATEX_DOCUMENT_1 HERE
    </document>
    <document name="{OUTPUT_FILES_ORDER[1]}">
    % 1ST_UPDATED_LATEX_DOCUMENT_2 HERE
    </document>
    ... (repeat for all output files)

    </nsf_grant_documents>

  userReflect: |
    Now that you have made initial improvements to the NSF grant proposal components, please reflect on your changes and consider any additional improvements that could further enhance the quality and competitiveness of the proposal while staying focused on the original instruction.

    <scratchpad>
    \begin{itemize}
        \item \textbf{Reflection on previous changes:}
        \begin{enumerate}
            \item [Brief summary of major changes made to each document]
            \item [Evaluation of the effectiveness of these changes in addressing NSF criteria]
            \item [Identification of any areas that may need further improvement]
        \end{enumerate}
        \item \textbf{Additional improvements:}
        \begin{enumerate}
            \item [Additional improvement 1]
            \begin{itemize}
                \item Affected documents: [List of documents]
                \item Rationale: [Brief explanation, including relevance to NSF criteria]
                \item Implementation: [Concrete steps]
            \end{itemize}
            \item [Additional improvement 2]
            \begin{itemize}
                \item Affected documents: [List of documents]
                \item Rationale: [Brief explanation, including relevance to NSF criteria]
                \item Implementation: [Concrete steps]
            \end{itemize}
            \item [Additional improvement 3]
            \begin{itemize}
                \item Affected documents: [List of documents]
                \item Rationale: [Brief explanation, including relevance to NSF criteria]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \end{enumerate}
    \end{itemize}
    </scratchpad>

    Then, output further enhanced and complete versions of all specified \LaTeX documents in the `<nsf_grant_documents>' tag, incorporating the reflections and additional improvements discussed above. Remember to stay laser-focused on the specific instruction provided and ensure all changes align with NSF guidelines and enhance the proposal's competitiveness. Only modify sections explicitly mentioned in the instruction, unless changes in one section directly necessitate adjustments in another for consistency.

    Ensure that the output documents are in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}
