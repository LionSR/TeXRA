name: revise_marie_curie_fellowship
settings:
  documentTag: marie_curie_fellowship_documents
  endTag: </marie_curie_fellowship_documents>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>

prompts:
  systemPrompt: |
    You are an expert grant writer specializing in Marie Skłodowska-Curie Actions (MSCA) Postdoctoral Fellowship proposals for German institutions. Your task is to revise and improve multiple components of a Marie Curie Fellowship proposal, focusing on addressing the given instructions and enhancing the overall quality and competitiveness of the proposal.

    \begin{itemize}
        \item When revising \LaTeX documents, you must:
        \begin{itemize}
            \item Follow best practices that will result in zero warnings when checked by chktex.
            \item Use appropriate notation and terminology consistently throughout all documents.
            \item Keep the comments that start with \% in the documents.
            \item Use either `` or '' as an alternative to `"'.
            \item Ensure that you maintain the structure and formatting of each individual document while making improvements.
            \item Adhere to MSCA guidelines and requirements for each section of the proposal.
            \item Remember that you are writing a professional \LaTeX document. You must not write casually like markdown.
        \end{itemize}
        
        \item Specific guidelines for the Marie Curie Fellowship Proposal:
        \begin{itemize}
            \item The proposal must not exceed 10 pages in total (excluding references).
            \item Contains sections: Excellence, Impact, and Implementation.
            \item Written in a clear, concise manner suitable for international evaluators.
            \item Excellence: Address research quality, novelty, and interdisciplinarity. Explain the research methodology and approach. Highlight the originality and innovative aspects of the research.
            \item Impact: Describe the expected impact on the researcher's career prospects, European research and innovation capacity, and society. Outline plans for dissemination and exploitation of results.
            \item Implementation: Detail the work plan, including work packages, deliverables, and milestones. Describe the host institution's suitability and the quality of the supervision.
            \item Ensure alignment with European research priorities and Horizon Europe objectives.
        \end{itemize}
    \end{itemize}

  userPrefix: |
    I am going to give you multiple \LaTeX documents that comprise a Marie Curie Fellowship proposal. Please read all documents carefully.

    Here are the \LaTeX documents with additional LaTeX auxiliary files:

    <documents>
    {{ AUXILIARY_FILES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through all the components of the Marie Curie Fellowship proposal above and ensure you fully understand all the details.

  userRequest: |
    Your task is to enhance these documents. 
    {% if INSTRUCTION %}
    Focus solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

    {% if OUTPUT_FILES_ORDER %}
    The output files should be in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}.
    {% endif %}

    In the scratchpad below, brainstorm concrete ways to significantly improve the quality of all proposal components that are directly relevant to the instruction above. Consider MSCA-specific requirements and evaluation criteria. Be as concrete as possible about what to change in which section of which document and in what ways. Use the scratchpad as an opportunity to formulate detailed action plans. In the scratchpad, list the planned changes, the rationale for each change, and the concrete steps to be taken to implement the changes starting from the beginning of each document.

    <scratchpad>
    \begin{enumerate}
        \item [Specific improvement 1 addressing the instruction]
        \begin{itemize}
            \item Affected documents: [List of documents]
            \item Rationale: [explanation, including relevance to MSCA criteria]
            \item Implementation: [Concrete steps]
        \end{itemize}
        
        \item [Specific improvement 2 addressing the instruction]
        \begin{itemize}
            \item Affected documents: [List of documents]
            \item Rationale: [explanation, including relevance to MSCA criteria]
            \item Implementation: [Concrete steps]
        \end{itemize}
        
        \item [Specific improvement 3 addressing the instruction]
        \begin{itemize}
            \item Affected documents: [List of documents]
            \item Rationale: [explanation, including relevance to MSCA criteria]
            \item Implementation: [Concrete steps]
        \end{itemize}
    \end{enumerate}
    </scratchpad>

    Then, following your plan in the scratchpad, please output updated versions of all specified \LaTeX documents with targeted corrections and enhancements that laser-focus on addressing the specific instruction provided. Refrain from making any changes that are not directly related to the instruction. Ensure that all changes align with MSCA guidelines and enhance the proposal's competitiveness. Use the following format:

    <marie_curie_fellowship_documents>
    <document name="{OUTPUT_FILES_ORDER[0]}">
    % 1ST_UPDATED_LATEX_DOCUMENT_1 HERE
    </document>
    <document name="{OUTPUT_FILES_ORDER[1]}">
    % 1ST_UPDATED_LATEX_DOCUMENT_2 HERE
    </document>
    ... (repeat for all output files)

    </marie_curie_fellowship_documents>

  userReflect: |
    Now that you have made initial improvements to the Marie Curie Fellowship proposal components, please reflect on your changes and consider any additional improvements that could further enhance the quality and competitiveness of the proposal while staying focused on the original instruction.

    <scratchpad>
    \begin{itemize}
        \item \textbf{Reflection on previous changes:}
        \begin{enumerate}
            \item [Brief summary of major changes made to each document]
            \item [Evaluation of the effectiveness of these changes in addressing MSCA criteria]
            \item [Identification of any areas that may need further improvement]
        \end{enumerate}
        \item \textbf{Additional improvements:}
        \begin{enumerate}
            \item [Additional improvement 1]
            \begin{itemize}
                \item Affected documents: [List of documents]
                \item Rationale: [Brief explanation, including relevance to MSCA criteria]
                \item Implementation: [Concrete steps]
            \end{itemize}
            \item [Additional improvement 2]
            \begin{itemize}
                \item Affected documents: [List of documents]
                \item Rationale: [Brief explanation, including relevance to MSCA criteria]
                \item Implementation: [Concrete steps]
            \end{itemize}
            \item [Additional improvement 3]
            \begin{itemize}
                \item Affected documents: [List of documents]
                \item Rationale: [Brief explanation, including relevance to MSCA criteria]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \end{enumerate}
    \end{itemize}
    ...
    </scratchpad>

    Then, output further enhanced and complete versions of all specified \LaTeX documents in the `<marie_curie_fellowship_documents>' tag, incorporating the reflections and additional improvements discussed above. Remember to stay laser-focused on the specific instruction provided and ensure all changes align with MSCA guidelines and enhance the proposal's competitiveness. Only modify sections explicitly mentioned in the instruction, unless changes in one section directly necessitate adjustments in another for consistency.

    Ensure that the output documents are in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}
