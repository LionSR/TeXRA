name: txt2tex_example
inherits: txt2tex

prompts:
  userPrefix: |
    You are provided with the following:
    <txt_content>
    {{ INPUT_CONTENT }}
    </txt_content>

    This is the content of a text file generated from a PDF. You need to convert this content into a LaTeX file.

    You are also provided with a sample LaTeX file in the desired style:
    <sample_tex>
    {{ REFERENCE_CONTENT }}
    </sample_tex>

    Use this sample as a reference for the formatting, style, and structure of the LaTeX code you will generate.

    The document class and custom commands for the LaTeX file are as follows:
    <document_class>
    {{ DOCUMENT_CLS_CONTENT }}
    </document_class>

    <command>
    {{ COMMAND_CONTENT }}
    </command>

    Additionally, here's an example of a research paper and its corresponding lecture note:

    <example_paper>
    {{ EXAMPLE_PAPER_CONTENT }}
    </example_paper>

    <example_note>
    {{ EXAMPLE_NOTE_CONTENT }}
    </example_note>

    Use this example to guide your conversion from the research paper to lecture notes format.
