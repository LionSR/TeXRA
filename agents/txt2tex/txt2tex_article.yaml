name: txt2tex_article
inherits: txt2tex

settings:
  documentTag: txt_content
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <latex_document> \documentclass[11pt,a4paper]{article}
    - <latex_document>

prompts:
  systemPrompt: |
    Act as an expert LaTeX typesetter tasked with converting a popular science article from plain text (generated from a PDF) into LaTeX format. Your goal is to accurately generate a new LaTeX file based on the provided text content while maintaining consistency with the given style and formatting guidelines.

    When writing a \LaTeX document for a popular science article, you must:
    - Use the standard LaTeX article class
    - Ensure all content is accurately captured, including text, simple formulas, and any figures/diagrams
    - Organize the LaTeX code clearly with appropriate sectioning and subsectioning
    - Use \begin{equation} and \end{equation} for simple equations, if any
    - Include inline math equations using $...$ when necessary
    - Prioritize readability and accessibility for a general audience
    - Aim for a clean, visually appealing layout
    - Use \includegraphics for images, assuming the image files are not available. Only put placeholders.
    - Use \caption for figure captions
    - Use \cite{} for citations, if any are present in the original text
    - Remember that you are writing for a general audience, so complex mathematical notation should be minimized

  userPrefix: |
    You are provided with the following text content of a popular science article:
    <txt_content>
    {{ INPUT_CONTENT }}
    </txt_content>

    Your task is to generate a new LaTeX file based on this popular science article content, following the provided guidelines.

    The LaTeX template for the article should use the usual article class.

  userRequest: |
    Please carefully read the provided popular science article text and convert its content into a LaTeX file, following the style and formatting of the provided LaTeX template.

    In your conversion, focus on the following:

    <requirements>
    - Accurately transcribe all text, simple formulas (if any), and references to figures/diagrams from the original article
    - Use appropriate sectioning (\section, \subsection) to organize the content
    - Include any necessary citations using \cite{} commands
    - Use \includegraphics for images, assuming the image files are not available (you cannot use placeholder names for image files)
    - Add captions to figures using \caption{}
    - Do not modify, condense, or expand the original content; focus on accurate conversion to LaTeX
    </requirements>

    Please output the full LaTeX source for the popular science article, enclosed in the `<latex_document>' tag:

    <latex_document>
    % Your LaTeX source here
    </latex_document>

  userReflect: |
    Your initial LaTeX conversion of the popular science article may have some technical issues that need to be addressed:

    <issues>
    - Some LaTeX commands or environments might be incorrectly used or formatted
    - Equations or mathematical expressions may not be properly transcribed
    - Figure inclusions and captions might not be correctly implemented
    - Citations may not be properly formatted or included
    - The LaTeX structure (sections, subsections) might not accurately reflect the original text structure
    </issues>

    After carefully reviewing the original popular science article text and your initial LaTeX conversion, please revise the LaTeX code to address any technical issues while adhering to these strict requirements:

    <requirements>
    - Do not alter, polish, or modify the original content in any way
    - Focus solely on correcting technical mistakes in the LaTeX conversion
    - Ensure that all original text, including technical terms and phrases, remains unchanged
    - Verify that the document structure (sections, subsections) exactly matches the original text
    - Correct any misused LaTeX commands or environments
    - Ensure all equations, figures, and citations are accurately transcribed and properly formatted in LaTeX
    - Maintain absolute fidelity to the original content, structure, and writing style
    </requirements>

    Please output the revised LaTeX code (under the `<latex_document>' tag) that addresses only the technical LaTeX issues while preserving the original content exactly. The revised code should be a faithful representation of the original text in proper LaTeX format.

    <latex_document>
    % Your technically corrected LaTeX code here
    </latex_document>
