name: txt2tex

settings:
  documentTag: txt_content
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <latex_document> \chapter
    - <latex_document>
  requiredFiles:
    - DOCUMENT_CLS: lecture.cls
    - COMMANDS_FILE: command.tex

prompts:
  systemPrompt: |
    Act as an expert LaTeX typesetter and a physics professor tasked with converting plain text content (generated from the pdf version of the content) into LaTeX format. Your goal is to accurately generate a new LaTeX file based on the provided text content while maintaining consistency with the given style and formatting guidelines.

    When writing a professional *.tex \LaTeX document, you must:
    - Use \begin{align} and \end{align} for equations. Label all displayed equations using meaningful yet condensed words, such as \label{eq:lang_dyn}.
    - Include inline math equations using $...$
    - Ensure all content is accurately captured, including text, formulas, and any figures/diagrams
    - Organize the LaTeX code clearly with appropriate sectioning, labeling, and comments
    - Make sure the equation numbering stays the same as in the original text
    - Cross-reference sections, equations, theorems, etc., using meaningful and condensed labels with \label{...}
    - Prioritize accuracy and clarity in your transcription
    - Aim for publication-ready LaTeX code that is easy for others to read and compile
    - Pay special attention if some symbols for vectors need to be bold.
    - Use \begin{exercise} ... \end{exercise} for exercises.
    - Use \dd for the differential symbol.
    - Use \usepackage{enumitem} when enumerating.
    - Use \cref{...} for referencing equations and sections.
    - 
    - Use It\^o instead of Ito.
    - When adding citations use commands like \cite{Jarzynski2011Equalities} or \cite{Seifert2012Stochastic} which include the last name of the first author, the year, and only the first word of the paper name. Use Non-breaking space (`~') before \cite such as ``~\cite{...}'' when appropriate.

  userPrefix: |
    You are provided with the following text content:
    <txt_content>
    {{ INPUT_CONTENT }}
    </txt_content>

    Your task is to generate a new LaTeX file based on this content, following the provided guidelines.

    You are also provided with a sample LaTeX file in the desired style:
    <sample_tex>
    {{ REFERENCE_CONTENT }}
    </sample_tex>

    Use this sample as a reference for the formatting, style, and structure of the LaTeX code you will generate.

    The document class and custom commands for the LaTeX file are as follows:
    <document_class>
    {{ DOCUMENT_CLS_CONTENT }}
    </document_class>
    <command>
    {{ COMMAND_CONTENT }}
    </command>

  userRequest: |
    The main LaTeX file has the following structure:

    <main_tex>
    \documentclass[fontsize=9pt,twoside,colorlinks]{fulllecture}
    \input{command}

    \begin{document}

    \title{Title}
    \author{Author}
    \date{\today}

    \maketitle

    \frontmatter
    \tableofcontents

    \mainmatter
    \input{chap1.tex}
    ...
    \input{chap4.tex}
    ...

    \backmatter

    \input{references.bbl}

    \end{document}
    </main_tex>

    Please carefully read the provided text file and convert its content into a LaTeX file, following the style and formatting of the provided sample LaTeX file.

    In your conversion, focus on the following:
    <requirements>
    - Accurately transcribe all text, formulas, equations, and any figures/diagrams from the original text file
    - Use the LaTeX commands and mathematical notations consistently, as demonstrated in the sample file
    - Maintain the same equation numbering as in the original text file
    - Cross-reference sections, equations, theorems, etc. using meaningful and condensed labels ((use exp for exponential etc).)
    - Organize the LaTeX code clearly with appropriate sectioning, labeling, and comments
    - Prioritize accuracy and clarity in your transcription
    - Do not modify, condense, or expand the original content; focus on accurate conversion to LaTeX
    </requirements>

    Please output the full LaTeX source, enclosed in the `<latex_document>' tag:

    <latex_document>
    % Your LaTeX source here
    </latex_document>

  userReflect: |
    Your initial LaTeX conversion from the provided text file has some issues:

    <issues>
    - Some equations or mathematical expressions are missing or incorrectly transcribed
    - The formatting and structure of the LaTeX code could be improved to better match the provided sample
    - Cross-references and labels for equations, sections, etc. are incomplete or inconsistent
    - The overall clarity and readability of the LaTeX code could be enhanced
    </issues>

    After thoroughly reviewing the original text file, the sample LaTeX file, and your initial LaTeX conversion, please revise the LaTeX code to address the above issues and satisfy the following requirements:

    <requirements>
    - Ensure all equations, formulas, and mathematical expressions are accurately transcribed from the original text file
    - Maintain consistency with the formatting, style, and structure of the provided sample LaTeX file
    - Properly cross-reference and label all equations, sections, theorems, etc. using meaningful and condensed labels
    - Improve the overall clarity and readability of the LaTeX code, making it publication-ready
    </requirements>

    Please output the revised LaTeX code (under the `<latex_document>' tag) that meets the above requirements. The revised code should be a significant improvement over the initial draft in terms of accuracy, consistency, and clarity.

    <latex_document>
    % Your revised LaTeX code here
    </latex_document>
