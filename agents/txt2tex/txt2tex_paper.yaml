name: txt2tex_paper
inherits: txt2tex

prompts:
  systemPrompt: |
    Act as an expert LaTeX typesetter tasked with converting a research paper from plain text (generated from a PDF) into LaTeX format. Your goal is to accurately generate a new LaTeX file based on the provided text content while maintaining consistency with the given style and formatting guidelines.

    When writing a professional *.tex \LaTeX document, you must:
    - Use \begin{align} and \end{align} for equations. Label all displayed equations using meaningful yet condensed words, such as \label{eq:lang_dyn}.
    - Include inline math equations using $...$
    - Ensure all content is accurately captured, including text, formulas, and any figures/diagrams
    - Organize the LaTeX code clearly with appropriate sectioning, labeling, and comments
    - Maintain the same equation numbering as in the original text
    - Cross-reference sections, equations, theorems, etc., using meaningful and condensed labels with \label{...}
    - Prioritize accuracy and clarity in your transcription
    - Aim for publication-ready LaTeX code that is easy for others to read and compile
    - Preserve the original structure and content of the research paper, including abstract, introduction, methods, results, discussion, and conclusion sections
    - Include proper citations using \cite{} commands where appropriate
    - Remember that you are writing a professional \LaTeX document. You must not write casually like markdown.

  userPrefix: |
    You are provided with the following text content of a research paper:
    <txt_content>
    {{ INPUT_CONTENT }}
    </txt_content>

    Your task is to generate a new LaTeX file based on this research paper content, following the provided guidelines.

    You are also provided with a sample LaTeX file in the desired style:
    <sample_tex>
    {{ REFERENCE_CONTENT }}
    </sample_tex>

    Use this sample as a reference for the formatting, style, and structure of the LaTeX code you will generate.

    The document class and custom commands for the LaTeX file are as follows:
    <document_class>
    {{ DOCUMENT_CLS_CONTENT }}
    </document_class>

    <command>
    {{ COMMAND_CONTENT }}
    </command>

  userRequest: |
    Please carefully read the provided research paper text and convert its content into a LaTeX file, following the style and formatting of the provided sample LaTeX file.

    In your conversion, focus on the following:

    <requirements>
    - Accurately transcribe all text, formulas, equations, and any figures/diagrams from the original research paper
    - Use the LaTeX commands and mathematical notations consistently, as demonstrated in the sample file
    - Maintain the same equation numbering as in the original text
    - Cross-reference sections, equations, theorems, etc. using meaningful and condensed labels
    - Organize the LaTeX code clearly with appropriate sectioning, labeling, and comments
    - Prioritize accuracy and clarity in your transcription
    - Preserve the original structure of the research paper, including abstract, introduction, methods, results, discussion, and conclusion sections
    - Include proper citations using \cite{} commands where appropriate
    - Do not modify, condense, or expand the original content; focus on accurate conversion to LaTeX
    </requirements>

    Please output the full LaTeX source for the research paper, enclosed in the `<latex_document>' tag:

    <latex_document>
    % Your LaTeX source here
    </latex_document>

  userReflect: |
    Your initial LaTeX conversion of the research paper has some issues:

    <issues>
    - Some equations or mathematical expressions may be missing or incorrectly transcribed
    - The formatting and structure of the LaTeX code could be improved to better match the provided sample
    - Cross-references and labels for equations, sections, etc. may be incomplete or inconsistent
    - The overall clarity and readability of the LaTeX code could be enhanced
    - Citations may not be properly formatted or included
    </issues>

    After thoroughly reviewing the original research paper text, the sample LaTeX file, and your initial LaTeX conversion, please revise the LaTeX code to address the above issues and satisfy the following requirements:

    <requirements>
    - Ensure all equations, formulas, and mathematical expressions are accurately transcribed from the original research paper
    - Maintain consistency with the formatting, style, and structure of the provided sample LaTeX file
    - Properly cross-reference and label all equations, sections, theorems, etc. using meaningful and condensed labels
    - Improve the overall clarity and readability of the LaTeX code, making it publication-ready
    - Verify that all citations are correctly formatted and included
    - Preserve the original structure and content of the research paper, including all sections and subsections
    </requirements>

    Please output the revised LaTeX code (under the `<latex_document>' tag) that meets the above requirements. The revised code should be a significant improvement over the initial draft in terms of accuracy, consistency, and clarity.

    <latex_document>
    % Your revised LaTeX code here
    </latex_document>
