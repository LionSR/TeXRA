name: pr2popular

settings:
  documentTag: popular_summary
  endTag: </popular_summary>
  outputExt: xml
  prefills:
    - <scratchpad>
  filePatternsContain:
    - pattern: "cover_letter"
      varName: "COVER_LETTER"
      categories: ["inputFile", "inputFiles"]
    - pattern: "CoverLetter"
      varName: "COVER_LETTER"
      categories: ["inputFile", "inputFiles"]
    - pattern: "justification"
      varName: "JUSTIFICATION"
      categories: ["inputFile", "inputFiles", "auxiliaryFile", "auxiliaryFiles"]

prompts:
  systemPrompt: |
    Your task is to write a clear, scientifically accurate summary of a research paper for the APS journal collection. The summary should be accessible to educated non-specialists while maintaining scientific integrity.

    When writing the summary:
    - Focus on the key scientific finding and its significance
    - Explain technical concepts in plain language without oversimplifying
    - Be dense (~100 words)
    - State what's new clearly
    - Maintain scientific accuracy
    - Avoid sensationalism or hype
    - Use specific, meaningful subjects (avoid generic terms like "It", "The researchers", "The authors")
    - Write with active voice and direct statements about the science

  userPrefix: |
    You will be writing a summary for a paper accepted by an APS journal. Here are the inputs you will need:

    <documents>
    <document name="{{ INPUT_FILE }}">
    # The full text of the accepted paper
    {{ INPUT_CONTENT }}
    </document>
    <document name="{{ COVER_LETTER_FILE }}">
    # The cover letter that explains the significance of the work
    {{ COVER_LETTER_CONTENT }}
    </document>
    </documents>

    Here is an example of a well-written summary:

    <example_summary>
    Title of the paper: "Classical algorithms for many-body quantum systems"

    Properties of quantum many-body systems at finite energy densities, such as microcanonical averages, are in general difficult to compute with classical algorithms. Quantum algorithms that combine quantum dynamics with filtering and sampling techniques can however access some of these quantities. Here, the researchers show that simulating the time evolution part with tensor networks provides quantum-inspired classical algorithms that reach much larger systems than other numerical methods.
    </example_summary>

    <example_summary>
    Title of the paper: "Negative-chirality order in the S=1/2 kagome antiferromagnet"

    By the complementary combination of NMR and neutron diffraction measurements, and a symmetry analysis using the previously reported magnetization measurements, a negative-chirality q=0 magnetic structure is successfully identified as the ground state of CdCu3(OH)6(NO3)2⋅H2O, the S=1/2 perfect kagome antiferromagnet. Detailed investigation of the internal fields leads the authors to suggest a spin-locked magnetic structure with <100> anisotropy, which is stabilized by the Dzyaloshinskii-Moriya interaction and the interactions slightly modified by the orientational order of the NO3 units.
    </example_summary>

    <example_summary>
    Title of the paper: "Variational Approximation to Thermal States with Neural and Tensor Networks"

    Researchers from MPQ have introduced a new variational algorithm to approximate the properties of many-body quantum systems at finite temperature. By tailoring a robust and scalable variational Monte Carlo method to a wide class of tensor network and neural network representations, they demonstrated that this method could allow for faster optimization and access to previous unreachable system sizes.

    Neural networks often excel at capturing patterns in complex data, yet they run into limits when tackling finite-temperature quantum many-body states. By expressing neural networks in tensor network language, the researchers not only explained these limitations but showed that this “hybrid” approach can outperform pure neural network and traditional tensor network methods. These findings pave the way towards bridging the gap between the two fields and provide crucial insights into solving many-body problems at finite temperatures.
    </example_summary>

  userRequest: |
    Please read the paper and cover letter carefully. Then write a brief plan in the scratchpad considering:
    - What is the key scientific finding?
    - What is its significance in the field?
    - What background does an educated non-specialist need?

    Write your summary in this format:

    <scratchpad>
    brief plan here
    </scratchpad>

    <popular_summary>
    [Your ~100 word summary explaining the research to educated non-specialists]
    </popular_summary>

    Guidelines:
    1. State the key finding clearly
    2. Explain technical concepts in plain language
    3. Maintain scientific accuracy
    4. Be specific about what's new
    5. Keep it dense
    6. Use active voice and meaningful subjects
    7. Focus on the science itself, not who did it

    {% if INSTRUCTION %}
    Specific instructions that you must follow closely:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    For example, in the instruction, if I ask you to revise section A in all papers, you do not need to revise section B in any paper.
    {% endif %}

  userReflect: |
    Review your summary against these criteria:
    - Is the key scientific finding clearly stated?
    - Are technical concepts explained without oversimplification?
    - Is it accurate and specific?
    - Is it concise (~100 words)?
    - Is it accessible while maintaining scientific integrity?
    - Does it use meaningful subjects and active voice?
    - Does it focus on the science rather than the researchers?

    If needed, revise to better meet these criteria. 