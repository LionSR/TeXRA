name: correct

settings:
  documentTag: latex_documents
  endTag: </latex_documents>
  outputExt: xml
  prefills:
    - Here are the revised \LaTeX documents. <latex_documents>
    - </latex_documents>
  filePatternsContain:
    - pattern: "preamble"
      varName: "PREAMBLE"
      categories: ["auxiliaryFile", "auxiliaryFiles"]
    - pattern: "main"
      varName: "MAIN"
      categories: ["inputFile", "inputFiles"]
    - pattern: "supp"
      varName: "SUPP"
      categories: ["inputFile", "inputFiles"]

prompts:
  systemPrompt: |
    You are an expert physicist and scientific writer. Your task is to correct and improve both the main text and supplementary materials of a research paper submitted to Physical Review Letters. Ensure that your corrections maintain scientific accuracy, improve clarity, and adhere to the journal's style guidelines.

    When correcting a professional \LaTeX document, you must:
    \begin{itemize}
        \item Use appropriate notation and terminology consistently throughout both documents.
        \item Maintain the comments that start with \% in the documents.
        \item Ensure proper referencing between the main text and supplementary materials.
        \item Follow best practices for \LaTeX writing, including proper use of environments, equations, and citations.
        \item Preserve the overall structure of both documents while making improvements.
    \end{itemize}

  userPrefix: |
    I am going to give you the main text and supplementary materials of a research paper to correct. Please read both documents carefully.

    Here are the \LaTeX documents:

    <documents>
    <document name="{{ PREAMBLE_FILE }}">
    {{ PREAMBLE_CONTENT }}
    </document>
    <document name="{{ MAIN_FILE }}">
    {{ MAIN_CONTENT }}
    </document>
    <document name="{{ SUPP_FILE }}">
    {{ SUPP_CONTENT }}
    </document>
    </documents>

  userRequest: |
    {% if INSTRUCTION %}
    Focus solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

    Please carefully read through both the main text and supplementary materials, correcting any typos, grammatical errors, formatting inconsistencies, incorrect math, or factual inaccuracies. Pay special attention to:

    \begin{enumerate}
        \item Consistency in notation and terminology between the main text and supplementary materials.
        \item Proper cross-referencing between the two documents.
        \item Adherence to PRL style and formatting guidelines.
        \item Correctness of mathematical equations and factual statements.
    \end{enumerate}

    Output the corrected versions of both the main text and supplementary materials using the following format:

    <latex_documents>
    <document name="{{ MAIN_FILE }}">
    % CORRECTED_MAIN_CONTENT HERE
    </document>
    <document name="{{ SUPP_FILE }}">
    % CORRECTED_SUPP_CONTENT HERE
    </document>
    </latex_documents>
