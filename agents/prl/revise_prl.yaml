name: revise_prl

settings:
  documentTag: latex_documents
  endTag: </latex_documents>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>
  filePatternsContain:
    - pattern: "preamble"
      varName: "PREAMBLE"
      categories: ["auxiliaryFile", "auxiliaryFiles"]
    - pattern: "main"
      varName: "MAIN"
      categories: ["inputFile", "inputFiles"]
    - pattern: "supp"
      varName: "SUPP"
      categories: ["inputFile", "inputFiles"]

prompts:
  systemPrompt: |
    Your task is to revise a research paper submitted to Physical Review Letters and rebut the referees' comments. This includes revising both the main paper and the supplementary material.

    When writing a professional *.tex \LaTeX document, you must:
    \begin{itemize}
        \item Use appropriate notation and terminology consistently throughout the text.
        \item Ensure that you maintain the structure and formatting of each individual document while making improvements.
        \item Keep the comments that start with `%' in the documents.
        \item When making references in the replies to the paper, use |\cref{...} instead of spelled out references like ``Sec.~II.C'' or ``Eq.~(1)''.
    \end{itemize}

  userPrefix: |
    You will be revising a paper submitted to Physical Review Letters based on referee reports. Here are the inputs you will need:

    <documents>
    <document name="Cover Letter">
    {{ COVER_LETTER_CONTENT }}
    </document>
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    <document name="{{ SUPP_FILE }}">
    {{ SUPP_CONTENT }}
    </document>
    <document name="Editor Decision Letter">
    {{ EDITOR_LETTER_CONTENT }}
    </document>
    <document name="Referee Report A">
    {{ REFEREE_REPORT_A_CONTENT }}
    </document>
    <document name="Referee Report B">
    {{ REFEREE_REPORT_B_CONTENT }}
    </document>
    <document name="Example Reply Letter">
    {{ EXAMPLE_REPLY_LETTER }}
    </document>
    <document name="Draft Reply Letter">
    {{{ DRAFT_REPLY_LETTER }}}
    </document>
    </documents>

    Explanation of documents:
    (1) Cover Letter: The original letter submitted with the paper, explaining its significance and suitability for the journal.
    (2) Main Paper: The full text of the submitted research paper, containing the core content and findings.
    (3) Supplementary Material: Additional details, data, or explanations to support the main paper.
    (4) Editor Decision Letter: The letter from the journal editor, typically containing their initial decision and a summary of the referee reports.
    (5) Referee Report A: The detailed feedback and critique from the first referee.
    (6) Referee Report B: The detailed feedback and critique from the second referee.
    (7) Example Reply Letter: A sample response letter to guide the structure and tone of your reply.
    (8) Draft Reply Letter: An initial version of the response to the referee reports, which you will review and improve.

    {% if OUTPUT_FILES_ORDER %}
    You will be revising all of the following documents.
    The output files should be in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}
    {% endif %}

  userRequest: |
    {% if INSTRUCTION %}
    Focus solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

    In the scratchpad below, brainstorm concrete ways to revise the paper(s) based on the referee reports and the draft reply letter. Consider both the main paper and the supplementary material. Be as specific as possible about what changes need to be made in which sections of which document.

    <scratchpad>
    \begin{enumerate}
        \item [Specific revision 1]
        \begin{itemize}
            \item Affected document(s): [Main paper / Supplementary material / Both]
            \item Section(s) to revise: [List of sections]
            \item Proposed changes: [Detailed description]
            \item Rationale: [Explanation based on referee comments or reply letter]
        \end{itemize}
        \item [Specific revision 2]
        \begin{itemize}
            \item Affected document(s): [Main paper / Supplementary material / Both]
            \item Section(s) to revise: [List of sections]
            \item Proposed changes: [Detailed description]
            \item Rationale: [Explanation based on referee comments or reply letter]
        \end{itemize}
        \item [Specific revision 3]
        \begin{itemize}
            \item Affected document(s): [Main paper / Supplementary material / Both]
            \item Section(s) to revise: [List of sections]
            \item Proposed changes: [Detailed description]
            \item Rationale: [Explanation based on referee comments or reply letter]
        \end{itemize}
    \end{enumerate}
    </scratchpad>

    Then, output further enhanced and complete versions of all the \LaTeX documents in the <latex_documents> tag, incorporating the reflections and additional improvements discussed above. Remember to stay focused on addressing the referees' comments and concerns while maintaining the quality and coherence of all documents. Include all the changes you added in the previous step.

    Use the following format for the output:
    <latex_documents>
    <document name="{OUTPUT_FILES_ORDER[0]}">
    % 1ST_UPDATED_LATEX_DOCUMENT_1 HERE
    </document>
    <document name="{OUTPUT_FILES_ORDER[1]}">
    % 1ST_UPDATED_LATEX_DOCUMENT_2 HERE
    </document>
    ... (repeat for all output files)
    </latex_documents>
