name: polish

settings:
  documentTag: latex_documents
  endTag: </latex_documents>
  outputExt: xml
  prefills:
    - <scratchpad>
    - <scratchpad>
  filePatternsContain:
    - pattern: "preamble"
      varName: "PREAMBLE"
      categories: ["auxiliaryFile", "auxiliaryFiles"]
    - pattern: "main"
      varName: "MAIN"
      categories: ["inputFile", "inputFiles"]
    - pattern: "supp"
      varName: "SUPP"
      categories: ["inputFile", "inputFiles"]

prompts:
  systemPrompt: |
    You are physicist Prof. Ignacio Cirac. Your task is to use your knowledge to improve both the main text and supplementary materials of a research paper to be submitted to Physical Review Letters. Ensure that your improvements enhance scientific clarity, maintain accuracy, and adhere to the journal's style guidelines.

    When polishing a professional *.tex \LaTeX document, you must:
    \begin{itemize}
        \item Use appropriate notation and terminology consistently throughout both documents.
        \item Maintain the comments that start with `%' in the documents.
        \item Ensure proper referencing between the main text and supplementary materials.
        \item Follow best practices for \LaTeX writing, including proper use of environments, equations, and citations.
        \item Preserve the overall structure of both documents while making improvements.
        \item When making references in the replies to the paper, use |\cref{...} instead of spelled out references like ``Sec.~II.C'' or ``Eq.~(1)''.
    \end{itemize}

  userPrefix: |
    I am going to give you the main text and supplementary materials of a research paper to polish. Please read both documents carefully.

    Here are the \LaTeX documents:

    <documents>
    <document name="{{ PREAMBLE_FILE }}">
    {{ PREAMBLE_CONTENT }}
    </document>
    <document name="{{ MAIN_FILE }}">
    {{ MAIN_CONTENT }}
    </document>
    <document name="{{ SUPP_FILE }}">
    {{ SUPP_CONTENT }}
    </document>
    </documents>

    Please carefully read through both the main text and supplementary materials, ensuring you fully understand all the details and the relationship between the two documents.

    Your task is to enhance both documents, focusing on improving clarity, consistency, and adherence to Physical Review Letters guidelines. Pay special attention to:
    \begin{enumerate}
        \item Consistency in notation and terminology between the main text and supplementary materials.
        \item Proper cross-referencing between the two documents.
        \item Clarity and condensation of explanations in both documents.
        \item Adherence to PRL style and formatting guidelines.
    \end{enumerate}

    Focus on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>

  userRequest: |
    In the scratchpad below, brainstorm concrete ways to improve both the main text and supplementary materials. Consider how changes in one document might affect the other. Be specific about what to change in which section of each document and why.

    <scratchpad>
    \begin{enumerate}
        \item [Specific Improvement 1]
        \begin{itemize}
            \item Affected document(s): [Main text / Supplementary materials / Both]
            \item Section(s) to modify:
            \item Rationale:
            \item Implementation steps:
        \end{itemize}
        \item [Specific Improvement 2]
        \begin{itemize}
            \item Affected document(s): [Main text / Supplementary materials / Both]
            \item Section(s) to modify:
            \item Rationale:
            \item Implementation steps:
        \end{itemize}
        \item [Specific Improvement 3]
        \begin{itemize}
            \item Affected document(s): [Main text / Supplementary materials / Both]
            \item Section(s) to modify:
            \item Rationale:
            \item Implementation steps:
        \end{itemize}
    \end{enumerate}
    </scratchpad>

    Then, following your plan in the scratchpad, please output updated versions of both the main text and supplementary materials, implementing the improvements you've outlined. Use the following format:

    <latex_documents>
    <document name="{{ MAIN_FILE }}">
    % REVISED_MAIN_CONTENT HERE
    </document>
    <document name="{{ SUPP_FILE }}">
    % REVISED_SUPP_CONTENT HERE
    </document>
    </latex_documents>

  userReflect: |
    Now that you have made initial improvements to both the main text and supplementary materials, please reflect on your changes and consider any additional improvements that could further enhance the quality of both documents. 

    In particular, 
    - if any fluffy statements like ``XXX provides crucial insights into the structure and behavior of these systems'' or ``It is important to note that...'' were introduced in the revised version, they need to be condensed using the ``show, don't tell'' technique. 
    - The revised version should also be self-contained and not rely on the previous version. Therefore, you cannot write ``Our extended simulations now cover...'' in the main text because it relies on the previous version and is not self-contained.
    - Physical Review Letters are very strict about the style of the paper. Therefore, you should never make any kinds of multiple line lists in the main text.

    <scratchpad>
    \begin{itemize}
        \item Reflection on previous changes:
        \begin{enumerate}
            \item [Summary of major changes made to the main text]
            \item [Summary of major changes made to the supplementary materials]
            \item [Evaluation of the effectiveness of these changes]
            \item [Identification of any areas that may need further improvement]
        \end{enumerate}
        \item Additional improvements:
        \begin{enumerate}
            \item [Additional improvement 1]
            \begin{itemize}
                \item Affected document(s): [Main text / Supplementary materials / Both]
                \item Rationale:
                \item Implementation steps:
            \end{itemize}
            \item [Additional improvement 2]
            \begin{itemize}
                \item Affected document(s): [Main text / Supplementary materials / Both]
                \item Rationale:
                \item Implementation steps:
            \end{itemize}
            \item [Additional improvement 3]
            \begin{itemize}
                \item Affected document(s): [Main text / Supplementary materials / Both]
                \item Rationale:
                \item Implementation steps:
            \end{itemize}
        \end{enumerate}
    \end{itemize}
    </scratchpad>

    Based on this reflection, please output further enhanced versions of both the main text and supplementary materials. Ensure that your revisions maintain consistency between the two documents and adhere to Physical Review Letters guidelines. Include all the changes you added in the previous step.

    <latex_documents>
    <document name="{MAIN_FILE}">
    % FINAL_REVISED_MAIN_CONTENT HERE
    </document>
    <document name="{SUPP_FILE}">
    % FINAL_REVISED_SUPP_CONTENT HERE
    </document>
    </latex_documents>
