name: draft_rebuttal

settings:
  documentTag: rebuttal_package
  endTag: </rebuttal_package>
  outputExt: xml
  prefills:
    - <rebuttal_package><scratchpad>
    - <rebuttal_package><scratchpad>
  requiredFiles:
    COVER_LETTER: replies/cover_letter.txt
    EDITOR_LETTER: replies/editor_letter.txt
    REFEREE_REPORT_A: replies/report_a.txt
    REFEREE_REPORT_B: replies/report_b.txt
  requiredFilesInternal:
    EXAMPLE_REBUTTAL_PACKAGE: example_rebuttal_package.txt
    TEMPLATE_REPLY_TO_EDITOR: template_reply_to_editor.tex
    TEMPLATE_REPLY_TO_REFEREES: template_reply_to_referees.tex
    TEMPLATE_LIST_OF_CHANGES: template_list_of_changes.tex
  defaultOutputFiles:
    - replies/reply_to_editor.tex
    - replies/reply_to_referees.tex
    - replies/list_of_major_changes.tex
  filePatternsContain:
    - pattern: "main"
      varName: "MAIN"
      categories: ["inputFile", "inputFiles"]
    - pattern: "supp"
      varName: "SUPP"
      categories: ["inputFile", "inputFiles"]
    - pattern: "instruction"
      varName: "FILE_INSTRUCTION"
      categories: ["inputFiles", "auxiliaryFile", "auxiliaryFiles"]
    - pattern: "editor_letter"
      varName: "EDITOR_LETTER_CONTENT"
      categories: ["inputFiles"]
    - pattern: "report_a"
      varName: "REFEREE_REPORT_A_CONTENT"
      categories: ["inputFiles"]
    - pattern: "report_b"
      varName: "REFEREE_REPORT_B_CONTENT"
      categories: ["inputFiles"]

prompts:
  systemPrompt: |
    Your task is to draft a comprehensive rebuttal letter for a research paper submitted to a scientific journal. This includes responding to referee comments and revising the paper accordingly.

    When drafting the rebuttal and revising the paper, you must:
    \begin{itemize}
        \item Use appropriate notation and terminology consistent with the specific field of research.
        \item Maintain a professional and respectful tone while firmly defending the research.
        \item Provide specific, detailed responses to referee comments, including concrete examples and references to changes made in the paper.
        \item Ensure all mathematical equations and scientific concepts are accurately represented and explained.
        \item Balance between addressing referee concerns and maintaining the integrity of the original research.
        \item Use \LaTeX formatting appropriately for all scientific notation and equations.
        \item Tailor your responses to the specific field and context of the research paper.
        \item Demonstrate a deep understanding of the research topic and its broader implications in the field.
    \end{itemize}

    When writing professional *.tex \LaTeX documents, you must:
    - Use professional LaTeX commands and environments for all scientific notation and equations. Strongly prefer $\beta$ over β. Use $J_1$ instead of J1. Use $\approx$ instead of ≈.
    - For quotation, prefer ``Schr\"odinger'' over "Schrodinger". Use either `` or '' as an alternative to `"'.
    - Only use enumerate and itemize environments for lists.

  userPrefix: |
    You will be drafting a reply letter to referee reports for a paper submitted to Physical Review Letters. Here are the inputs you will need:

    {% if EXAMPLE_REBUTTAL_PACKAGE_FILE %}
    <documents name="{{ EXAMPLE_REBUTTAL_PACKAGE_FILE }}">
    # A sample reply packagefor reference.
    {{ EXAMPLE_REBUTTAL_PACKAGE_CONTENT }}
    </documents>
    {% endif %}

    <documents>
    <document name="{{ COVER_LETTER_FILE }}">
    The original cover letter submitted with the paper.
    {{ COVER_LETTER_CONTENT }}
    </document>
    <document name="{{ MAIN_FILE }}">
    # The full text of the submitted paper
    {{ MAIN_CONTENT }}
    </document>
    {% if SUPP_FILE %}
    <document name="{{ SUPP_FILE }}">
    # The full text of the supplementary materials
    {{ SUPP_CONTENT }}
    </document>
    {% endif %}
    <document name="{{ EDITOR_LETTER_CONTENT_FILE }}">
    # The full text of the editor's decision and comments.
    {{ EDITOR_LETTER_CONTENT }}
    </document>
    {% if REFEREE_REPORT_A_FILE %}
    <document name="{{ REFEREE_REPORT_A_FILE }}">
    # The full text of the first referee's report.
    {{ REFEREE_REPORT_A_CONTENT }}
    </document>
    {% endif %}
    {% if REFEREE_REPORT_B_FILE %}
    <document name="{{ REFEREE_REPORT_B_FILE }}">
    # The full text of the second referee's report.
    {{ REFEREE_REPORT_B_CONTENT }}
    </document>
    {% endif %}
    {% if FILE_INSTRUCTION_FILE %}
    <document name="{{ FILE_INSTRUCTION_FILE }}">
    # Guidelines on how to draft the reply letter.
    {{ FILE_INSTRUCTION_CONTENT }}
    </document>
    {% endif %}
    </documents>

  userRequest: |
    Please read the paper, referee reports, and example reply carefully. Then, before drafting your full reply, write out your plan inside the `<scratchpad>' tag. Consider which comments from the referee you agree with and will address with changes, and which you will rebut and argue against changing. Refer to the example reply for guidance on tone and structure. 

    After your planning, draft a reply letter that includes the following:
    \begin{enumerate}
        \item A 1-page cover letter to the editor. Summarize the key comments you will make in your reply. Write this inside the <document name="replies/reply_to_editor.tex"></document> tag.
        \item A point-by-point response to the referee comments. Write this inside the <document name="replies/reply_to_referees.tex"></document> tag. To do this:
        \begin{itemize}
            \item Split each referee report into separate comments. Copy each exact comment as a verbatim segment inside the \begin{referee}{A} (or B) and \end{referee} environment.
            \item Similar to the provided example, all the referee's comments (summary, recommendations, criticisms, questions) need to be covered and addressed in the reply letter. For recommendations by the referee, we thank the referee politely and use it as an opportunity to amplify our main points. For criticisms, we also thank the referee, but address the criticisms firmly and be specific about what has been changed in the paper, similar to the provided example.
            \item Write your response to each comment using the \begin{response} and \end{response} environment immediately after each \begin{referee}{A} (or B) and \end{referee} environment.
            \item Be respectful and diplomatic, but firm in your responses. Follow the principles from the book ``They Say, I Say'' in crafting your rebuttals. Use a ``Show, not tell'' approach - be specific about what has been changed in the paper, similar to the provided example.
        \end{itemize}
        \item At the end of each reply to the referees, write a concluding paragraph to further persuade the referee.
        \item A list of major changes you made to the paper. Write this inside the <document name="replies/list_of_major_changes.tex"></document> tag. Order by importance. Minor improvements to the presentation of the paper can be grouped into one item.
        \item A revised version of the paper that addresses the referee comments and implements all the proposed changes mentioned in the reply letter. Include the main paper and the supplementary materials.
    \end{enumerate}

    {% if INSTRUCTION %}
    Specific instructions that you must follow:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

    Write the full reply letter in the following format:

    <rebuttal_package>
    <scratchpad>
    your detailed plan here
    </scratchpad>
    <document name="replies/reply_to_editor.tex">
    {{ TEMPLATE_REPLY_TO_EDITOR_CONTENT }}
    </document>

    <document name="replies/reply_to_referees.tex">
    {{ TEMPLATE_REPLY_TO_REFEREES_CONTENT }}
    </document>
    <document name="replies/list_of_major_changes.tex">
    {{ TEMPLATE_LIST_OF_CHANGES_CONTENT }}
    </document>

    <document name="{{ MAIN_FILE }}">
    (Insert the full text of your revised paper here.)
    </document>
    {% if SUPP_FILE %}
    <document name="{{ SUPP_FILE }}">
    (Insert the full text of your revised supplementary materials here.)
    </document>
    {% endif %}
    </rebuttal_package>

    Remember, the goal is to be respectful and appreciative of the referee's efforts, while still advocating firmly and persuasively for your work and only making changes you agree are necessary. Start with laying down your plan in the `<scratchpad>' tag. Then proceed to drafting the rebuttal letter in the format specified above.

  userReflect: |
    Your output (cover letter to the editor and the response letter to the referees) is too generic and not specific enough.
    After thoroughly and critically reviewing the paper, the cover letters, the report, the reply letter, and the example, write a new reply letter that satisfies the following requirements:
    <requirements>
    \begin{itemize}
        \item Increase the level of details from moderate (6/10) to high (9/10), with specific references to the changes in the new version of the paper.
        \item Ensure all referee comments (summary, recommendations, criticisms, or questions) are addressed using concrete and convincing physical arguments.
        \item Match the style and tone of the reply letter to the provided example (under <document name="replies/{EXAMPLE_REBUTTAL_PACKAGE_FILE}">).
        \item Review the revised version for fluffy statements like ``XXX provides crucial insights into the structure and behavior of these systems'' that can be condensed using the ``show, don't tell'' technique.
        \item Adhere to PRL's strict word count policy for the main paper. Ensure the main paper (excluding appendix) does not exceed $\sim$3500 words. Added text must be concise and focused. If necessary, condense other parts of the paper to maintain the word limit.
    \end{itemize}
    </requirements>

    Start with laying down your plan in the `<scratchpad>' tag. Then proceed to output the revised letter to the editor (under <document name="{{ REPLY_TO_EDITOR_FILE }}">) and the revised response letter (under <document name="{{ REPLY_TO_REFEREES_FILE }}">), the revised main paper (under <document name="{{ INPUT_FILE }}">) and the revised supplementary materials (under <document name="{{ SUPP_FILE }}">) that meets the above requirements. Include all the changes you added in the previous step.
