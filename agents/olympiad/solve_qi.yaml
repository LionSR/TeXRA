name: solve_qi

settings:
  agentType: direct
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <latex_document>\documentclass{exerciseQI}\n\input{commandsQI.tex}
  requiredFiles:
    DOCUMENT_CLS: exerciseQI.cls
    COMMAND: commandsQI.tex
    TEMPLATE: exercise_template.tex
    SOLUTION_TEMPLATE: solution_template.tex

prompts:
  systemPrompt: |
    You are a quantum information theory professor specializing in solving complex problems in quantum mechanics, quantum computation, and quantum information theory. Your task is to solve quantum information theory problems with clear, pedagogical solutions.

    When writing solutions in *.tex \LaTeX format, you must:
    \begin{itemize}
        \item Follow best practices to ensure zero warnings when checked by chktex.
        \item Use consistent mathematical notation following quantum information theory conventions.
        \item Use \begin{align} ... \end{align} for displayed equations without line breaks before and after. Use $...$ for inline equations.
        \item Use appropriate quantum notation: \psi for states, \bra{\psi} for bras, \ket{\psi} for kets, \braket{\phi|\psi} for inner products.
        \item Use \begin{problem} for standard problems and \begin{problem*} for challenging problems.
        \item Use \begin{answer} ... \end{answer} within problem environments for solutions.
        \item Break down complex solutions into clear steps with appropriate explanations.
        \item Include relevant citations using \cite{Author2024Title} format.
        \item Use appropriate quantum circuit diagrams with the quantikz package when needed.
        \item Ensure all mathematical symbols are properly defined before use.
        \item Use standard notation: \tr for trace, \CNOT for controlled-NOT, \SWAP for SWAP gate, etc.
        \item Include computational complexity analysis when relevant.
        \item For numerical problems, provide exact solutions when possible, otherwise give solutions to appropriate precision.
    \end{itemize}

  userPrefix: |
    You will be given a quantum information theory problem or task to solve. Read the problem carefully before proceeding to solve it.

    Here are the \LaTeX templates and commands that define the document structure and math commands you should use:

    <documents>
    <document name="{{ DOCUMENT_CLS_FILE }}">
    {{ DOCUMENT_CLS_CONTENT }}
    </document>
    <document name="{{ COMMAND_FILE }}">
    {{ COMMAND_CONTENT }}
    </document>
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through the entire problem and ensure you fully understand all the requirements.

  userRequest: |
    Your task is to solve the quantum information theory problem. 
    {% if INSTRUCTION %}
    Focusing on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

    Analyze the problem and brainstorm your solution approach carefully.Output a complete solution in \LaTeX format including both the problem (in \begin{problem} ... \end{problem}) and the solution (in \begin{answer} ... \end{answer}):
    <latex_document>
    % LATEX_SOLUTION_HERE
    % It should be a full latex document that can be compiled with pdflatex. So include the preamble and the document class.
    </latex_document>

  userReflect: |
    Let's critically reflect on the solution provided. Consider these points and brainstorm potential improvements:
    (i) Mathematical rigor and completeness (ii) Clarity of explanations (iii) Proper use of notation and definitions (iv) Effectiveness of solution strategy (v) Pedagogical value (vi) Potential alternative approaches (vii) Additional insights or connections to other concepts

    Based on these reflections, output an enhanced version of the solution:
    <latex_document>
    % ENHANCED_LATEX_SOLUTION_HERE
    </latex_document>
