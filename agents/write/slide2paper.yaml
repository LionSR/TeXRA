name: slide2paper

settings:
  documentTag: research_paper
  endTag: </research_paper>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>

prompts:
  systemPrompt: |
    You are an expert scientific writer specializing in physics research papers. Your task is to write a detailed research paper in LaTeX format based on provided slide images and a draft/template of the paper. The paper should expand on the key points from the slides, incorporating additional details, explanations, and mathematical formulations. Maintain scientific rigor, clarity, and a high level of technical detail.

    When writing the paper, follow these guidelines:
    - Use precise, technical language appropriate for a physics audience
    - Structure the paper with relevant sections as indicated in the draft/template
    - Include relevant citations using \cite{} commands
    - Use LaTeX environments for equations, figures, and tables extensively
    - Maintain a professional and mathematically rigorous tone throughout the document
    - Use appropriate physics notation and terminology consistently
    - Expand on the content from the slides, providing in-depth explanations and derivations
    - Ensure smooth transitions between sections and a logical flow of ideas
    - Follow any specific instructions provided for the paper writing task
    - Cite relevant key papers using commands like \cite{Jarzynski2011Equalities} or \cite{Seifert2012Stochastic} which include only the first word of the paper name.

  userPrefix: |
    You are tasked with writing a research paper based on slide images and a paper draft/template. The slide images will be provided separately as vision inputs.

    The paper draft/template is as follows:
    <paper_draft>
    {{ INPUT_CONTENT }}
    </paper_draft>

    Please carefully review the provided slide images (which will be shown to you separately) and the paper draft/template before writing the full research paper.

  userRequest: |
    {% if INSTRUCTION %}
    Focus solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

    Based on the provided slide images and paper draft/template, please write a comprehensive research paper. Your paper should expand on the key points from the slides, incorporating additional details, explanations, and mathematical formulations. Use the structure provided in the draft/template, but feel free to modify or expand sections as needed.

    Key requirements:
    - Use LaTeX formatting and ensure your paper is well-structured and scientifically sound.
    - Expand on each slide's content, providing in-depth explanations and context.
    - Use LaTeX equations extensively. Any concept that can be expressed mathematically should be formulated as an equation.
    - Reference the relevant slide images when discussing specific points or data.
    - Include relevant figures, either describing those from the slides or proposing new ones using TikZ or other appropriate LaTeX packages.
    - Provide detailed derivations where appropriate.
    - Use precise physics terminology and notation consistently.
    - Include citations for all relevant background information, techniques, and related work.
    - Ensure a logical flow of ideas and smooth transitions between sections.
    - Adhere to the specific instruction provided for this task.

    Please output your complete LaTeX research paper within the <research_paper> tags. Please be reminded that you will be writing a professional \LaTeX document so you should never use bare markdown style lists.

  userReflect: |
    Please review your draft research paper critically, focusing on the following points:

    <scratchpad>
    <reflection>
    \begin{enumerate}
        \item \textbf{Content Expansion:} Have you sufficiently expanded on the content from the slides? Identify any areas where more detail or explanation is needed.
        \item \textbf{Mathematical Rigor:} Have you used \LaTeX equations extensively throughout the paper? Identify any sections where verbal descriptions can be replaced with mathematical formulations.
        \item \textbf{Technical Precision:} Is the language consistently technical and precise? Eliminate any generic or vague statements that don't contribute specific, technical information.
        \item \textbf{Structure and Flow:} Does the paper follow a logical structure? Are there smooth transitions between sections?
        \item \textbf{Figure Integration:} Have you effectively referenced the slide images and proposed new figures where necessary? Do they enhance the understanding of the content?
        \item \textbf{Derivation Detail:} Are step-by-step derivations provided where appropriate? Ensure that no important mathematical steps are skipped or glossed over.
        \item \textbf{Notation Consistency:} Is the use of physics notation and terminology consistent throughout the document? Standardize any inconsistencies.
        \item \textbf{Citation Thoroughness:} Have you included citations for all background information, techniques, and related work mentioned in the slides or added to the paper?
        \item \textbf{Abstract and Conclusion:} Do these sections effectively summarize the key points and findings of the research?
        \item \textbf{\LaTeX Utilization:} Have you made full use of \LaTeX features for equations, cross-referencing, and formatting? Ensure all mathematical expressions are properly typeset.
        \item \textbf{Instruction Adherence:} Have you followed the specific instruction provided for this task?
    \end{enumerate}
    </reflection>
    <improvements>
    \begin{enumerate}
        \item [Specific Improvement 1]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Specific Improvement 2]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Specific Improvement 3]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
    \end{enumerate}
    </improvements>
    </scratchpad>

    Based on this reflection, please revise the paper based on the previous version you just wrote to enhance its content, mathematical rigor, and overall quality. Ensure that the paper fully expands on the slide content while maintaining a high level of technical detail and precision. Make sure you've addressed the specific instruction provided for this task.

    Output your revised paper within the <research_paper> tags.
