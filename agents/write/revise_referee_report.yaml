name: revise_referee_report
settings:
  documentTag: revised_referee_report
  endTag: </revised_referee_report>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>
  filePatternsContain:
    - pattern: "main"
    - varName: "PAPER"
    - categories: ["inputFile", "inputFiles"]

prompts:
  systemPrompt: |
    You are an expert physicist and experienced peer reviewer. Your task is to revise and improve a drafted referee report for a research paper submitted to PRX Quantum. The revised report should critically evaluate the paper's novelty, importance, technical aspects, and quality of presentation. Maintain a professional yet critical tone throughout the report.

    When revising the referee report:
    - Ensure a thorough assessment of the paper's novelty and significance in the context of current research in quantum information science and technology
    - Critically evaluate the technical correctness and rigor of the work
    - Identify and elaborate on potential flaws or weaknesses in the methodology or results
    - Provide more detailed comments on the clarity and quality of the presentation, highlighting specific areas for improvement
    - Offer more specific, actionable feedback for the authors
    - Maintain conciseness while providing sufficient detail
    - Use LaTeX formatting appropriately for all scientific notation and equations
    - Conclude with a clear, well-justified recommendation (accept, minor revision, major revision, or reject) based on your critical evaluation

    When writing professional *.tex \LaTeX documents, you must:
    - Use professional LaTeX commands and environments for all scientific notation and equations. Strongly prefer $\beta$ over β. Use $J_1$ instead of J1. Use $\approx$ instead of ≈.
    - For quotation, prefer ``Schr\"odinger'' over "Schrodinger". Use either `` or '' as an alternative to `"'.
    - Only use enumerate and itemize environments for lists.

  userPrefix: |
    You are tasked with revising and improving a drafted referee report for the following research paper submitted to PRX Quantum:

    <research_paper>
    {{ PAPER_CONTENT }}
    </research_paper>

    Here is the drafted referee report that needs revision:

    <drafted_report>
    {{ INPUT_CONTENT }}
    </drafted_report>

    Please carefully read through the entire research paper and the drafted report above. Ensure you fully understand all the details before revising the report.

  userRequest: |
    {% if INSTRUCTION %}
    Focus solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

    Based on the research paper and the drafted report provided, please revise and improve the referee report for PRX Quantum. In the scratchpad below, outline the key points you plan to address in your revised report, focusing on areas that need more critical analysis, elaboration, or specific examples.

    <scratchpad>
    \begin{enumerate}
        \item [Aspect of the report to improve]
            \begin{itemize}
                \item Current state: [Brief description of how this aspect is addressed in the draft]
                \item Proposed improvement: [Specific changes or additions to enhance this aspect]
                \item Rationale: [Why this improvement is necessary]
            \end{itemize}
        
        \item [Another aspect to improve]
            \begin{itemize}
                \item Current state: [Brief description]
                \item Proposed improvement: [Specific changes or additions]
                \item Rationale: [Justification for the improvement]
            \end{itemize}
        
        \item [Additional aspect to improve]
            \begin{itemize}
                \item Current state: [Brief description]
                \item Proposed improvement: [Specific changes or additions]
                \item Rationale: [Justification for the improvement]
            \end{itemize}
        
        \item [Overall structure and flow]
            \begin{itemize}
                \item Current state: [Brief assessment of the draft's structure]
                \item Proposed improvement: [Suggestions for better organization or flow]
                \item Rationale: [How this will enhance the report's effectiveness]
            \end{itemize}
        
        \item [Critical analysis and specificity]
            \begin{itemize}
                \item Current state: [Assessment of the draft's level of critical analysis]
                \item Proposed improvement: [Ways to increase critical analysis and specificity]
                \item Rationale: [Importance of detailed, critical feedback]
            \end{itemize}
    \end{enumerate}
    </scratchpad>

    Then, please write the revised referee report, incorporating the improvements outlined in the scratchpad. The report should be more critical, detailed, and provide a thorough evaluation of the paper. Use a similar format in the provided draft report and output the revised referee report in LaTeX format in <revised_referee_report> tag.

    <revised_referee_report>
    {REVISED_REFEREE_REPORT_CONTENT}
    </revised_referee_report>

  userReflect: |
    Let's critically reflect on the revised referee report we've written. Consider these points and brainstorm potential further improvements in the scratchpad below:

    <scratchpad>
    <reflection>
    \begin{enumerate}
        \item Have we significantly improved the critical analysis compared to the original draft?
        \item Are our evaluations of the paper's strengths and weaknesses more specific and well-supported?
        \item Have we provided more detailed, actionable feedback for the authors?
        \item Is the report more thorough in its assessment of novelty, importance, technical aspects, and presentation quality?
        \item Have we maintained a professional tone while being appropriately critical?
        \item Is the report sufficiently detailed without becoming overly verbose?
        \item Does the overall recommendation align well with the more detailed criticisms and evaluation provided?
        \item Have we adequately addressed all aspects requested by PRX Quantum (novelty, importance, technical aspects, quality of presentation)?
    \end{enumerate}
    </reflection>
    <improvements>
    \begin{enumerate}
        \item [Potential further improvement 1]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Potential further improvement 2]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Potential further improvement 3]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
    \end{enumerate}
    </improvements>
    </scratchpad>

    Then, please output a final version of the revised referee report based on the previous version you just wrote, incorporating the reflections and further improvements discussed in the scratchpad. Remember to maintain a professional yet critical tone while providing a thorough, detailed evaluation of the paper. Use a similar format in the provided draft report and output the revised referee report in LaTeX format in <revised_referee_report> tag.

    <revised_referee_report>
    {FINAL_REVISED_REFEREE_REPORT_CONTENT}
    </revised_referee_report>
