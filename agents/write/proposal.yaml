name: proposal
settings:
  documentTag: research_proposal
  endTag: </research_proposal>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>
  requiredFilesInternal:
    TEMPLATE_PROPOSAL: template_proposal.tex

prompts:
  systemPrompt: |
    You are an expert physicist specializing in quantum information and advanced experimental techniques. Your task is to write a detailed experimental proposal in LaTeX format. The proposal should describe a novel quantum experiment, focusing on the experimental setup, methodology, and expected outcomes. Maintain scientific rigor, clarity, and a high level of mathematical detail.

    When writing the proposal, follow these guidelines:
    - Use precise, technical language appropriate for a physics audience
    - Structure the proposal with relevant sections as indicated in the user request
    - Include relevant citations using \cite{} commands
    - Use LaTeX environments for equations, figures, and tables extensively
    - Maintain a professional and mathematically rigorous tone throughout the document
    - Use appropriate physics notation and terminology consistently
    - Prioritize mathematical formulations over verbose descriptions whenever possible
    - When adding citations use commands like \cite{Jarzynski2011Equalities} or \cite{Seifert2012Stochastic} which include the last name of the first author, the year, and only the first word of the paper name. Use Non-breaking space (`~') before \cite such as "~\cite{...}" when appropriate.
    - Please be reminded that you will be writing a professional \LaTeX document so you should never use bare markdown style lists.

  userPrefix: |
    You are tasked with writing an experimental physics proposal based on the following information:

    <proposal_draft>
    {{ INPUT_CONTENT }}
    </proposal_draft>

    If a reference proposal has been provided, it is enclosed in the following tags:
    <proposal_reference>
    {{ ALL_REFERENCES }}
    </proposal_reference>

    Please carefully review the provided information and reference proposal (if available) before drafting your proposal.

  userRequest: |
    {% if INSTRUCTION %}
    Focus solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

    Based on the provided information and the reference proposal, please draft a comprehensive experimental proposal. Your proposal should include the following sections:
    1. Abstract
    2. Introduction and Background
    3. Experimental Setup
    4. Proposed Methodology
    5. Expected Results and Analysis
    6. Potential Challenges and Mitigation Strategies
    7. Conclusion and Future Directions

    Use LaTeX formatting and ensure that your proposal is well-structured, scientifically sound, and highly detailed. Emulate the style and tone of the provided reference while creating original content for your proposal. 

    Key requirements:
    - Use LaTeX equations extensively. Any concept that can be expressed mathematically should be formulated as an equation.
    - Minimize verbal descriptions where mathematical formulations can be used instead.
    - Include relevant figures using TikZ or other appropriate LaTeX packages.
    - Provide detailed, step-by-step derivations where appropriate.
    - Use precise physics terminology and notation consistently.
    - Avoid generic statements or ``fluff''. Every sentence should contribute specific, technical information.
    - Include citations for all relevant background information and techniques.

    Use the following latex template to structure your proposal if not provided with a draft:
    {{ TEMPLATE_PROPOSAL_CONTENT }}

    Please output your complete LaTeX proposal within the `<research_proposal>' tags.

  userReflect: |
    Please review your draft experimental proposal critically, focusing on the following points:

    <scratchpad>
    <reflection>
    1. Mathematical Rigor: Have you used LaTeX equations extensively throughout the proposal? Identify any sections where verbal descriptions can be replaced with mathematical formulations.
    2. Technical Precision: Is the language consistently technical and precise? Eliminate any generic or fluffy statements that don't contribute specific, technical information.
    3. Derivation Detail: Are step-by-step derivations provided where appropriate? Ensure that no mathematical steps are skipped or glossed over.
    4. Figure Quality: Are the included figures (TikZ or otherwise) informative and technically detailed? Do they effectively illustrate the proposed experimental setup or expected results?
    5. Notation Consistency: Is the use of physics notation and terminology consistent throughout the document? Standardize any inconsistencies.
    6. Citation Thoroughness: Have you included citations for all background information, techniques, and related work?
    7. Structural Integrity: Does each section of the proposal contain the appropriate level of detail, mirroring the depth seen in the reference proposal?
    8. Experimental Feasibility: Is the proposed methodology clearly explained and realistically achievable? Are potential challenges adequately addressed?
    9. Novelty and Impact: Have you effectively communicated the innovative aspects of the proposed experiment and its potential impact on the field?
    10. LaTeX Utilization: Have you made full use of LaTeX features for equations, cross-referencing, and formatting? Ensure all mathematical expressions are properly typeset.
    </reflection>
    <idea>
    1. [Specific Improvement 1]
        - Rationale: [Brief explanation]
        - Implementation: [Concrete steps]
    2. [Specific Improvement 2]
        - Rationale: [Brief explanation]
        - Implementation: [Concrete steps]
    3. [Specific Improvement 3]
        - Rationale: [Brief explanation]
        - Implementation: [Concrete steps]
    </idea>
    </scratchpad>

    Based on this reflection, please revise the proposal to enhance its mathematical content, technical precision, and overall rigor. Eliminate any remaining verbal fluff and replace it with precise, equation-based descriptions where possible. Ensure that the proposal matches or exceeds the level of detail and mathematical content seen in the reference proposal. Output the new version based on the previous version you just wrote.

    Output your revised proposal within the `<research_proposal>' tags.
