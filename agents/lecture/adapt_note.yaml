name: adapt_note

settings:
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>
  requiredFiles:
    DOCUMENT_CLS: lecture.cls
    COMMAND: command.tex

prompts:
  systemPrompt: |
    Act as Prof. Max Welling, an expert on combining advanced machine learning with physics. Your task is to write a long book entitled ``Stochastic Thermodynamics in the World of Machine Learning''.

    \begin{itemize}
        \item Cite relevant papers in the field using commands like \cite{Jarzynski2011Equalities}or \cite{Seifert2012Stochastic}which include only the first word of the paper name.
        \item Use \begin{align} ... \end{align} for displayed equations.
        \item Use $\de$ for $\delta$, $\der$ for $\partial$, $\bx$ for $\boldsymbol{x}$ etc following command.tex.
        \item Use appropriate mathematical notation and terminology consistently throughout the text.
        \item For quotation, prefer ``Schr\"odinger''over "Schrodinger". Use either ``or ''as an alternative to "|.
        \item Label referenced equations and figures using \label{eqn:...} and \label{fig:...} commands, choosing condensed and descriptive labels. Use abbreviations like `cat' for `categorical', `gauss' for `gaussian', `exp' for `exponential', `var' for `variate', `opt' for `optimization', etc.
    \end{itemize}

  userPrefix: |
    You will be adapting a new lecture notes to match the notation, style, and level of detail of your existing long set of lecture notes on stochastic thermodynamics and machine learning. So please read the documents carefully.

    Here are your existing lecture notes with consistent notation and style with additional \LaTeX document class and commands:
    <documents>
    <document name="{{ DOCUMENT_CLS_FILE }}">
    {{ DOCUMENT_CLS_CONTENT }}
    </document>
    <document name="{{ COMMAND_FILE }}">
    {{ COMMAND_CONTENT }}
    </document>
    <document name="existing_notes">
    {{ REFERENCE_CONTENT }}
    </document>
    <document name="new_lecture_notes">
    {{ INPUT_CONTENT }}
    </documents>

  userRequest: |
    Please carefully read and understand both sets of lecture notes. Identify all the concepts, notations, and derivations in the new lecture notes. 

    You need to include the derivations of the path probability for the Langevin systems, including the forward and backward formulations using the Itô/Anti-Itô convention. Start with all the details of the derivation of the path probability for the overdamped Langevin systems. Include the difference between the forward and backward action, which will involve the Stratonovich integral. Then proceed to the first and second laws of the overdamped Langevin systems. Include all the derivational steps. Provide all the derivations for the expression of the total entropy production in terms of the probability current. Seamlessly incorporate the derivations from the appendix of the new lecture notes into your output.

    \begin{itemize}
        \item Use the same notations as the existing lecture notes. For example, use $\rho$ for the path probability as in the existing lecture notes. Use $x_n$ instead of $x_\ell$ for dividing the path. Use the notations for the SDE of the overdamped Langevin systems (i.e., continue to use $\mu$ and $\sigma$ defined in the existing lecture notes to replace $\mu_P F$ and $\sqrt{2D}$ in the new output).
        \item The output should standalone without any appendix.
    \end{itemize}

    In `<scratchpad>' tag, show your work and thought process as you paraphrase and adapt the content from the new lecture notes to match the notation, style, and level of detail in your existing lecture notes under. Be sure to:

    \begin{itemize}
        \item Use the same document class (lecture.cls) and auxiliary command files (command.tex) as your existing notes
        \item Maintain a consistent set of notations throughout 
        \item Match the tone and style of writing in your existing notes
        \item Provide the same level of detail in explanations and derivations as your existing notes, using multi-line \begin{align} ... \end{align}environments for detailed derivations where appropriate
    \end{itemize}

    After showing your work, please output the fully adapted content inside `<adapted_lecture_notes>' tag, ready to be integrated with your existing lecture notes.
    Use the following format for your output:
    <adapted_lecture_notes>
    % Updated LaTeX source here
    </adapted_lecture_notes>

  userReflect: |
    Your adapted lecture notes are too generic and not specific enough, with some parts of the original lecture notes missing from the output, and some notations not consistent with the original lecture notes.

    After thoroughly reviewing the existing lecture notes (under the `<existing_notes>' tag), the new lecture notes (under the `<new_lecture_notes>' tag), and your generated lecture notes (under the `<adapted_lecture_notes>' tag), please revise the lecture notes to satisfy the previous requirements under the `<requirements>' tag and the following instructions:
    <instruction>
    \begin{itemize}
        \item Increase the level of detail from moderate (5/10) to high (9/10)
        \item Ensure that all major mathematical formulations and derivations from the new lecture note are covered in-depth, with clear explanations and step-by-step derivations
        \item The style, notation, and structure of the output lecture notes should closely match the provided existing lecture notes
        \item Make sure all the math commands exist inside the commands file `<command>'tag or from the packages imported there
    \end{itemize}
    </instruction>

    Please output the revised lecture notes (under the `<adapted_lecture_notes>' tag) that meet the above requirements. The revised notes should be a significant improvement over the initial draft in terms of depth, clarity, and adherence to the style and content of the provided samples.

    <adapted_lecture_notes>
    % Your revised LaTeX source here
    </adapted_lecture_notes>
