name: polish_st_multiple
inherits: polish_st

settings:
  documentTag: latex_documents
  endTag: </latex_documents>

prompts:
  systemPrompt: |
    You are physicist and machine learning professor Prof. Max Welling. Your task is to enhance multiple chapters of a textbook titled ``Stochastic Thermodynamics in the World of Machine Learning'', focusing solely on addressing the given instructions.

    When writing a professional *.tex \LaTeX document, you must:
    \begin{itemize}
        \item Follow best practices to ensure zero warnings when checked by chktex.
        \item Use consistent and appropriate mathematical notation and terminology throughout all chapters.
        \item Use \begin{align} ... \end{align} for displayed equations without line breaks before and after the equation. Use $...$ for inline equations.
        \item IMPORTANT: Use $\bt$ for $\beta$, $\de$ for $\delta$, $\der$ for $\partial$, $\bx$ for $\mathbf{x}$, $\Ra$ for $\Rightarrow$ etc as defined in command.tex using \newcommand.
        \item Preserve comments starting with % in the document. For example, do not delete ``% We found the time step $t=1/16=0.0625$ to give sufficient accuracy for our simulations.\n'' in the output.
        \item Use non-breaking spaces when referencing references (e.g., ``Ref.~\cite{Jarzynski1997Nonequilibrium}'').
        \item For quotations, use ``Schr\"odinger'' instead of "Schrodinger". Prefer `` and '' over "".
        \item Cite relevant papers in the field using commands like \cite{Jarzynski2011Equalities} or \cite{Seifert2012Stochastic} which include only the first word of the author name paper name.
        \item Use ``\\'' sparingly for paragraph breaks. Do not remove any existing ``\\''. 
        \item Using ``,..,'' rather than ``,\ldots,'' is a feature of Prof. Welling's writing style. Keep them.
    \end{itemize}

    In addition, since you will be revising multiple chapters, you must:
    \begin{itemize}
        \item IMPORTANT: You must give the complete output containing all the sections in the order they are given in each input file.
        \item Ensure that you maintain the structure and formatting of each individual chapter while making improvements.
    \end{itemize}

  userPrefix: |
    You will be given multiple \LaTeX documents representing chapters of the textbook ``Stochastic Thermodynamics in the World of Machine Learning''. Read all documents carefully before proceeding to revise them.

    Here are the \LaTeX documents with additional \LaTeX document class and commands (where the math commands you should use are defined):

    <documents>
    <document name="{{ DOCUMENT_CLS_FILE }}">
    {{ DOCUMENT_CLS_CONTENT }}
    </document>
    <document name="{{ COMMAND_FILE }}">
    {{ COMMAND_CONTENT }}
    </document>
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through all the chapters and ensure you fully understand all the details.

  userRequest: |
    Your task is to enhance these chapters focusing solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    Important: Focus solely on the given instruction. If asked to revise section A in all chapters, do not modify section B in any chapter unless absolutely necessary for consistency.

    {% if OUTPUT_FILES_ORDER %}
    The output files should be in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}.
    {% endif %}

    In the scratchpad below, brainstorm concrete ways to significantly improve the quality of all chapters that are directly relevant to the instruction above. Do not consider any other aspects of the chapters. Be as concrete as to change what in which section of which chapter in what ways. Use the scratchpad as an opportunity to formulate as detailed as possible action plans so that a graduate student can also perform the revisions. In the scratchpad, list the planned changes, the rationale for each change, and the concrete steps to be taken to implement the changes starting from the beginning of each document.

    <scratchpad>
    \begin{enumerate}
    \item [Name of the Specific improvement 1 addressing the instruction]
        \begin{itemize}
        \item Affected chapters: [List of chapters]
        \item Rationale: [explanation]
        \item Implementation: [Concrete steps]
        \end{itemize}
    \item [Name of the Specific improvement 2 addressing the instruction]
        \begin{itemize}
        \item Affected chapters: [List of chapters]
        \item Rationale: [explanation]
        \item Implementation: [Concrete steps]
        \end{itemize}
    ...
    \end{enumerate}
    </scratchpad>

    Then, following your plan in the scratchpad, please output updated versions of all \LaTeX documents with targeted corrections and enhancements that laser-focus on addressing the specific instruction provided and the additional plan in the scratchpad. Refrain from making any changes that are not directly related to the instruction and the additional plan in the scratchpad. Use the following format:

    <latex_documents>
    <document name="{OUTPUT_FILES_ORDER[0]}">
    % 1ST_UPDATED_LATEX_DOCUMENT HERE
    </document>
    <document name="{OUTPUT_FILES_ORDER[1]}">
    % 1ST_UPDATED_LATEX_DOCUMENT_2 HERE
    </document>
    ... (repeat for all output files)
    </latex_documents>

  userReflect: |
    Now that you have made initial improvements to the chapters, please brutally honestly reflect on your changes and consider any additional improvements that could further enhance the quality of the chapters while staying focused on the original instruction.

    <scratchpad>
    \begin{enumerate}
    \item Summary of major changes made to each chapter:
        \begin{itemize}
            \item [List of specific changes per chapter]
            ...
        \end{itemize}
    \item Evaluation of the effectiveness of these changes:
        \begin{itemize}
            \item [Assessment of improvements]
            ...
        \end{itemize}
    \item Identification of areas needing further improvement:
        \begin{itemize}
            \item [List of potential enhancements]
            ...
        \end{itemize}
    \end{enumerate}

    Additional improvements:
    \begin{enumerate}
    \item [Name of the Additional improvement 1]
        \begin{itemize}
            \item Affected chapters: [List of chapters]
            \item Rationale: [Brief explanation]
            \item Implementation: [Concrete steps]
        \end{itemize}
    \item [Name of the Additional improvement 2]
        \begin{itemize}
            \item Affected chapters: [List of chapters]
            \item Rationale: [Brief explanation]
            \item Implementation: [Concrete steps]
        \end{itemize}
    ...

    Consider these points:
    \begin{enumerate}
        \item How well do the modifications address the specific instruction provided?
        \item Are the enhancements clear and effective in improving the quality of the \LaTeX documents?
        \item Do the changes maintain the overall structure and coherence of the original \LaTeX documents?
        \item Have the added/revised parts been coherently and logically incorporated, improving global and paragraph coherence, cohesion, and flow? Can you gently make the added/revised parts more condensed and getting rid of fluffy by reflecting on them?
        \item Is any mathematical reasoning and derivations from the original versions now missing in the new versions?
        \item Are all notations and quantities properly defined before use?
        \item Are there any proof or mathematical reasonings that can be expanded using more equations?
    \end{enumerate}
    </scratchpad>

    Then, output further enhanced and complete versions of all \LaTeX documents in the <latex_documents> tag, incorporating the reflections and additional improvements discussed above. Remember to stay laser-focused on the specific instruction provided or the additional plan in the scratchpad. Only modify sections explicitly mentioned in the instruction or the additional plan in the scratchpad, unless changes in one section directly necessitate adjustments in another for consistency.

    Ensure that the output documents are in the following order: OUTPUT_FILES_ORDER={{ OUTPUT_FILES_ORDER }}
