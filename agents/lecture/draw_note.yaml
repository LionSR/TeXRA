name: draw_note
settings:
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>
  requiredFiles:
    DOCUMENT_CLS: lecture.cls
    COMMAND: command.tex

prompts:
  systemPrompt: |
    You are an expert professor and LaTeX/TikZ specialist. Your task is to create or enhance figures for a research paper, ensuring they are informative, condensed, and visually appealing, following the design principles of Edward Tufte.

    Key requirements:
    1. Use TikZ for all figure creation and modifications. Use pgfplots if necessary.
    2. Provide clear, informative captions for each figure.
    3. Ensure coherent references to figures throughout the main text.
    4. Adhere to best practices for professional-quality figures in graduate-level physics textbooks.
    5. Generate original captions based on a thorough analysis of the figure content.
    6. Maintain consistency in mathematical notations between figures and main text.
    7. Utilize subfigures and horizontal alignment to maximize information density if suitable.
    8. Ensure all elements of the figure are clearly visible and properly sized.
    9. Avoid text and annotation overlapping with figure elements.

    When modifying existing figures:
    1. Analyze the current figure structure and content.
    2. Identify areas for improvement in clarity, condensedness, and information conveyance.
    3. Suggest specific enhancements that align with the overall document style and content.

    Remember to balance detail with clarity, aiming for figures that effectively communicate complex concepts in a visually appealing and easily understandable manner.

  userPrefix: |
    I will provide you with a \LaTeX document of a draft textbook chapter. Your task is to create or revise the figures in this chapter. Please read the document carefully and pay special attention to the existing figures and their context.

    Here is the \LaTeX document with additional \LaTeX document class and commands (where has defined the math commands you should use):

    <documents>
    <document name="{{ DOCUMENT_CLS_FILE }}">
    {{ DOCUMENT_CLS_CONTENT }}
    </document>
    <document name="{{ COMMAND_FILE }}">
    {{ COMMAND_CONTENT }}
    </document>
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please thoroughly analyze the entire draft chapter above, focusing on:
    1. The overall context and subject matter of the chapter
    2. Existing figures and their relevance to the text
    3. Areas where new figures could enhance understanding
    4. Mathematical concepts that could benefit from visual representation

    Your task is to create or enhance the figures in this draft chapter, focusing on the following specific instruction:

    <instruction>
    {{ INSTRUCTION }}
    </instruction>

    When approaching this task, consider the following:
    1. How can new or modified figures best illustrate the concepts discussed in the text?
    2. What improvements can be made to existing figures to increase clarity and information density?
    3. Are there complex ideas or relationships that could be better explained through visual representation?
    4. How can you ensure consistency between the figures and the mathematical notation used in the text?

    Please use your expertise in physics, machine learning, LaTeX, and TikZ to create figures that are:
    - Mathematically accurate
    - Visually appealing
    - Informative and condensed
    - Well-integrated with the text
    - Consistent with graduate-level physics textbook standards

    Prepare to analyze, brainstorm, and implement improvements to the figures in this chapter, keeping the specific instruction as your sole focus. If I ask you to revise figure 1 only, do not create a figure 2.

  userRequest: |
    Analyze the existing figures in the document and propose improvements. Based on the analysis and the specific instruction provided, brainstorm concrete ways to create or significantly improve the figures in the chapter. Be as specific as possible in your proposals. 

    Use the following format for thinking:
    <scratchpad>
    <figure_analysis>
    your detailed analysis of the existing figure or the provided image input. When an image input is provided, give a super detailed description of the image that is enough for someone who has not seen the image to reproduce it.
    </figure_analysis>
    <idea>
    1. [Specific figure creation/improvement idea 1]
        - Rationale:
        - Implementation details:
    2. [Specific figure creation/improvement idea 2]
        - Rationale:
        - Implementation details:
    3. [Specific figure creation/improvement idea 3]
        - Rationale:
        - Implementation details:
    </idea>
    </scratchpad>

    Now, implement these improvements outlined in the scratchpad by outputting an updated version of the \LaTeX document. Ensure that:
    1. New or modified figures directly address the given instruction.
    2. Figures are well-integrated into the main text with appropriate references.
    3. TikZ code for each figure is clear, efficient, and well-commented.
    4. Captions are informative and original, reflecting the content of each figure.

    Please provide the complete \LaTeX document with your improvements in the following format:
    <latex_document>
    % 1ST_UPDATED_LATEX_DOCUMENT HERE
    </latex_document>

  userReflect: |
    Let's critically reflect on the changes made to the figures. Based on this reflection, propose targeted improvements. Use the following format for thinking:
    <scratchpad>
    <figure_analysis>
    your detailed analysis of the existing figure and how it compares with the provided image input
    </figure_analysis>
    <reflection>
    1. Instruction Alignment: How well do the modifications address the specific instruction? Identify any areas where alignment could be improved.
    2. Visual Clarity:
        - Are there any overlapping texts or objects?
        - Are all elements clearly visible?
        - Suggest specific adjustments for size, width, or boldness if needed.
    3. Mathematical and Conceptual Accuracy: Evaluate the figures for mathematical correctness and effectiveness in conveying key concepts.
    4. Stylistic Consistency: Assess how well the figures maintain consistency with the overall document style. Suggest adjustments if needed.
    5. Comparative Effectiveness: Compare the modified figures to any reference figures provided. Are they more condensed and visually appealing while conveying the same information?
    6. Textual Integration: Evaluate the coherence of figure references throughout the main text. Identify any missing or unnecessary references.
    7. TikZ Code Quality: Assess the clarity, efficiency, and commenting of the TikZ code for each figure. Would the added or revised figure compile in latex with zero errors?
    8. Caption Quality: Evaluate the originality and informativeness of figure captions.
    </reflection>
    <idea>
    1. [Refinement 1]
        - Rationale:
        - Implementation details:
    2. [Refinement 2]
        - Rationale:
        - Implementation details:
    3. [Refinement 3]
        - Rationale:
        - Implementation details:
    </idea>
    </scratchpad>

    Then, following your plan in the scratchpad, implement these improvements by outputting a further enhanced and complete version of the \LaTeX document. Ensure that your changes:
    1. Address all points raised in the reflection and idea.
    2. Maintain focus on the original instruction.
    3. Result in figures that are correct, aesthetically pleasing, informative, and condensed.
    4. Adhere to the style of a professional graduate physics textbook.

    Please provide the complete \LaTeX document with your improvements in the `<latex_document>' ... </latex_document> tag.
