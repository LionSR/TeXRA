name: polish

settings:
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>
  requiredFiles:
    DOCUMENT_CLS: lecture.cls
    COMMAND: command.tex

prompts:
  systemPrompt: |
    When writing a professional *.tex \LaTeX document, you must:
    - Use \begin{align} ... \end{align} for displayed equations. Use $...$ for inline equations.
    - Use appropriate notation and terminology consistently throughout the text.
    - Use non-breaking spaces when referencing references (e.g., ``Ref.~\cite{Jarzynski1997Nonequilibrium}'').
    - Use either `` or '' as an alternative to `"`. For quotation, prefer ``Schr\"odinger'' over "Schrodinger".
    - Treat formulas as part of the sentences and add punctuation accordingly in the displayed math environments depends on the next sentence.
    - Keep comments that start with % in the document.
    - When in doubt, follow the best practice that will result in zero warning when checked by chktex.
    - Label equations and figures that are mentioned in the text using \label{eqn:...} and \label{fig:...} commands, choosing condensed and descriptive labels. Never add \label{} to any equation or figure that is not mentioned in the text.
    - Use ``\\'' sparingly for paragraph breaks. Do not remove any existing ``\\''.

  userPrefix: |
    You will be given a \LaTeX document of a working draft textbook chapter. Read the document carefully before proceeding to revise it.

    Here is the \LaTeX document with additional \LaTeX document class and commands (where the math commands you should use are defined):

    <documents>
    <document name="{{ DOCUMENT_CLS_FILE }}">
    {{ DOCUMENT_CLS_CONTENT }}
    </document>
    <document name="{{ COMMAND_FILE }}">
    {{ COMMAND_CONTENT }}
    </document>
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    Please carefully read through the entire chapter and ensure you fully understand all the details.
    Your task is to enhance this chapter focusing solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    Important: Focus solely on the given instruction. If asked to revise section A, do not modify section B unless absolutely necessary for consistency.

  userRequest: |
    First, brainstorm concrete ways to improve the chapter quality, focusing strictly on the given instruction. Use the scratchpad to formulate detailed action plans (so that a graduate student can also perform the revisions independently):

    <scratchpad>
    \begin{enumerate}
    \item [Name of the Specific improvement 1 addressing the instruction]
        \begin{itemize}
            \item Rationale: [explanation]
            \item Implementation: [Concrete steps]
        \end{itemize}
    \item [Name of the Specific improvement 2 addressing the instruction]
        \begin{itemize}
            \item Rationale: [explanation]
            \item Implementation: [Concrete steps]
        \end{itemize}
    \item [Name of the Specific improvement 3 addressing the instruction]
        \begin{itemize}
            \item Rationale: [explanation]
            \item Implementation: [Concrete steps]
        \end{itemize}
    ...
    \end{enumerate}
    </scratchpad>

    Then, following your plan in the scratchpad, output an updated version of the \LaTeX document with targeted enhancements that address only the specific instruction provided and the additional plan in the scratchpad. Do not make changes unrelated to the instruction and the additional plan in the scratchpad. Use the following format for your output:
    <latex_document>
    % 1ST_UPDATED_LATEX_DOCUMENT HERE
    </latex_document>

  userReflect: |
    Let's critically reflect like a harsh professor on the changes made according to the given instructions. Now it is time to be brutally honest with yourself. For example, if I asked you to add equations, but you did not add any equations, you should absolutely criticize yourself for not following the instruction.

    Consider these points and brainstorm additional targeted improvements in the scratchpad below. In the scratchpad, list the planned changes and the rationale for each change starting from the beginning of the document. Be specific and point to the specific locations in your reflection.
    <scratchpad>
    <reflection>
    \begin{enumerate}
    \item How well do the modifications address the specific instruction provided?
    \item Are the enhancements clear and effective in improving the quality of the \LaTeX document?
    \item Do the changes maintain the overall structure and coherence of the original \LaTeX document?
    \item Have the added/revised parts been coherently and logically incorporated, rather than just appended, improving global and paragraph coherence, cohesion, and flow?
    \item Are all notations and quantities properly defined before use?
    \end{enumerate}
    </reflection>

    <idea>
    \begin{enumerate}
    \item [Name of the Additional improvement 1]
        \begin{itemize}
            \item Rationale: [Brief explanation]
            \item Implementation: [Concrete steps]
        \end{itemize}
    \item [Name of the Additional improvement 2]
        \begin{itemize}
            \item Rationale: [Brief explanation]
            \item Implementation: [Concrete steps]
        \end{itemize}
    \item [Name of the Additional improvement 3]
        \begin{itemize}
            \item Rationale: [Brief explanation]
            \item Implementation: [Concrete steps]
        \end{itemize}
    ...
    \end{enumerate}
    </idea>
    </scratchpad>

    Then, following your plan in the above scratchpad, output a further enhanced and complete version of the \LaTeX document in the `<latex_document>' tag. Include all the changes you added in the previous step.
    Remember to stay laser-focused on the specific instruction provided or the additional plan in the above scratchpad. Only modify sections explicitly mentioned in the instruction or the additional plan in the above scratchpad, unless changes in one section directly necessitate adjustments in another for consistency.
