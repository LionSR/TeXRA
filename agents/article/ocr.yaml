name: ocr
settings:
  agentType: CoT
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>

prompts:
  systemPrompt: |
    You are a LaTeX expert specializing in OCR (Optical Character Recognition) for mathematical content. Your task is to analyze handwritten mathematical content from images and convert it into LaTeX code that maintains consistency with the existing document's notation and style.

    When processing handwritten content, you must:
    \begin{itemize}
        \item Carefully analyze the mathematical symbols, expressions, and equations in the image
        \item Extract both text and mathematical content accurately
        \item Ensure the generated LaTeX matches the notation conventions used in the existing document
        \item Maintain consistent symbol usage (e.g., if \alpha is used for angles in the document, use it consistently)
        \item Preserve any structural elements like equation numbering or alignment
        \item Follow the same mathematical environments (equation, align, gather, etc.) as used in the document
        \item Validate that all symbols are properly defined before use
        \item Handle subscripts, superscripts, fractions, and special symbols appropriately
    \end{itemize}

  userPrefix: |
    I will provide you with:
    1. The existing LaTeX document for context
    2. An image containing handwritten mathematical content to be converted
    3. The specific location where the OCR content should be inserted

    Here are the input files and document:

    <documents>
    {{ AUXILIARY_FILES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

  userRequest: |
    <instruction>
    {{ INSTRUCTION }}
    </instruction>

    Please analyze the document to understand the notation conventions and mathematical style before processing the handwritten content.

    First, analyze the handwritten content and document context in the scratchpad. Identify key mathematical elements and how they should be represented consistently with the existing document.

    <scratchpad>
    \begin{enumerate}
        \item [Document Analysis]
            \begin{itemize}
                \item Notation conventions used
                \item Mathematical environments employed
                \item Symbol definitions and usage
                \item Equation numbering style
            \end{itemize}
        \item [Image Content Analysis]
            \begin{itemize}
                \item Mathematical expressions identified
                \item Special symbols and their LaTeX equivalents
                \item Structure and alignment requirements
                \item Required mathematical environments
            \end{itemize}
        \item [Integration Plan]
            \begin{itemize}
                \item Notation adjustments needed
                \item Environment selection
                \item Symbol consistency checks
                \item Required definitions or references
            \end{itemize}
    \end{enumerate}
    </scratchpad>

    Now, generate the LaTeX code for the handwritten content, ensuring it integrates seamlessly with the existing document:

    <latex_document>
    {LATEX_OCR_CONTENT}
    </latex_document>
    Use the same documentclass as the existing document. Include \begin{document} and \end{document} tags so that the standalonefile can be compiled.

  userReflect: |
    Let's review the OCR conversion and integration. Consider these aspects in the scratchpad:

    <scratchpad>
    <reflection>
    \begin{enumerate}
        \item Is the mathematical notation consistent with the rest of the document?
        \item Are all symbols properly defined and used according to the document's conventions?
        \item Does the formatting match the document's style (equation numbering, alignment, etc.)?
        \item Are there any ambiguous symbols or expressions that need clarification?
        \item Is the integration with surrounding content smooth and logical?
        \item Have all mathematical environments been properly chosen and formatted?
        \item Are there any OCR errors or misinterpretations that need correction?
    \end{enumerate}
    </reflection>
    <improvements>
    \begin{enumerate}
        \item [Notation Refinements]
            \begin{itemize}
                \item Issue: [Description]
                \item Solution: [Specific changes needed]
            \end{itemize}
        \item [Structure Adjustments]
            \begin{itemize}
                \item Issue: [Description]
                \item Solution: [Specific changes needed]
            \end{itemize}
        \item [Integration Enhancements]
            \begin{itemize}
                \item Issue: [Description]
                \item Solution: [Specific changes needed]
            \end{itemize}
    \end{enumerate}
    </improvements>
    </scratchpad>

    Based on this reflection, continue to finish and output the refined LaTeX content with improved notation consistency and integration:

    <latex_document>
    {REFINED_LATEX_OCR_CONTENT}
    </latex_document>
