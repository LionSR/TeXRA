name: convert_tex
settings:
  agentType: CoT
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <scratchpad>
  filePatternsContain:
    - pattern: "iclr"
      varName: "ICLR_TEMPLATE"
      categories: ["inputFile", "inputFiles"]
    - pattern: "neurips"
      varName: "NeurIPS_PAPER"
      categories: ["inputFile", "inputFiles"]

prompts:
  systemPrompt: |
    You are an expert LaTeX formatter specializing in academic conference paper formats. Your task is to convert a NeurIPS paper format to the ICLR conference format, ensuring all content is preserved and properly formatted according to ICLR guidelines.

  userPrefix: |
    I will provide you with the content of a NeurIPS paper (neurips_main.tex) and the ICLR conference template (iclr2025_conference.tex). Your task is to reformat the NeurIPS paper into the ICLR format. An existing outline is already provided in the ICLR conference template (iclr2025_conference.tex) and you must follow it. YOU MUST ALSO FOLLOW THE LATEX SYNTAX OF THE ICLR TEMPLATE.

    Here are the files:

    <documents>
    {{ AUXILIARY_FILES }}
    <document name="neurips_main.tex">
    {{ NeurIPS_PAPER_CONTENT }}
    </document> 

    <document name="iclr2025_conference.tex">
    {{ ICLR_TEMPLATE_CONTENT }}
    </document>
    </documents>

    An existing outline is already provided in the ICLR conference template (iclr2025_conference.tex) and you must follow it to structure the paper.

    Please carefully analyze both documents before proceeding with the conversion.

  userRequest: |
    In the scratchpad below, outline your plan for converting the NeurIPS paper to the ICLR format. Include steps for handling the main sections, special formatting, figures, tables, and references.

    <scratchpad>
    1. [Step 1 for conversion]
        - Details: [Explanation]
    2. [Step 2 for conversion]
        - Details: [Explanation]
    3. [Step 3 for conversion]
        - Details: [Explanation]
    ...
    </scratchpad>

    Now, following your plan in the scratchpad, please output the reformatted paper in ICLR format. Ensure that all content from the original NeurIPS paper is preserved and properly formatted according to ICLR guidelines. Use the following format:

    <latex_document>
    % Insert the reformatted LaTeX content here
    % BOTH THE MAIN TEXT AND THE APPENDIX MUST BE INCLUDED
    </latex_document>

  userReflect: |
    Let's critically reflect on the conversion process and the resulting ICLR-formatted paper. Consider the following points and brainstorm any necessary adjustments or improvements in the scratchpad below:

    <scratchpad>
    <reflection>
    \begin{enumerate}
        \item Have all sections from the original NeurIPS paper been included in the ICLR format?
        \item Are the title, authors, and abstract correctly formatted according to ICLR guidelines?
        \item Have all figures, tables, and references been properly adjusted to match ICLR format?
        \item Are there any NeurIPS-specific formatting or commands that need to be removed or replaced?
        \item Does the overall structure and flow of the paper match ICLR expectations?
        \item Have all mathematical notations, equations, and special symbols been preserved correctly?
        \item Are there any areas where the formatting could be improved to better align with ICLR standards?
    \end{enumerate}
    </reflection>
    <adjustments>
    \begin{enumerate}
        \item [Adjustment 1]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Adjustment 2]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Adjustment 3]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
    \end{enumerate}
    ...
    </adjustments>
    </scratchpad>

    Based on your reflection and planned adjustments, please output the final version of the ICLR-formatted paper, incorporating any necessary changes. Remember to preserve all content from the original NeurIPS paper while ensuring full compliance with ICLR formatting guidelines.
