<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} 'unsafe-inline'; script-src 'nonce-${nonce}';"
    />
    <link rel="stylesheet" href="${styleUri}" />
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "split.js": "${splitJsUri}"
        }
      }
    </script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
  </head>

  <body>
    <div class="main-container">
      <div class="content-area split">
        <div class="log-header">
          <div class="header-left">
            <span id="currentStreamName"></span>
            <span id="statusIndicator" class="status-indicator stopped" data-status="Ready"></span>
          </div>
          <div class="header-actions">
            <button class="clear-button" id="clearStreamBtn">
              <span class="x-icon">✕</span> Clear
            </button>
            <button class="delete-button" id="deleteStreamBtn">
              <span class="x-icon">✕</span> Delete
            </button>
          </div>
        </div>
        <div id="logContent" class="log-container"></div>
      </div>
      <div class="tabs split">
        <div id="streamTabs" class="tabs-content">
          <!-- Stream tabs will be dynamically inserted here -->
        </div>
        <div class="clear-all-container">
          <button class="clear-button danger" id="deleteAllBtn">
            <span class="x-icon">✕</span> Delete All
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
