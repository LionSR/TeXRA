<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src ${cspSource} https://cdnjs.cloudflare.com 'unsafe-inline'; script-src 'nonce-${nonce}' https://cdnjs.cloudflare.com; img-src https:; font-src https://cdnjs.cloudflare.com;"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="${styleUri}" />
    <script type="importmap" nonce="${nonce}">
      {
        "imports": {
          "./modules/stateManager.js": "${stateManagerUri}",
          "./modules/fileHandlers.js": "${fileHandlersUri}",
          "./modules/uiHandlers.js": "${uiHandlersUri}",
          "./modules/messageHandlers.js": "${messageHandlersUri}",
          "./modules/vscodeApi.js": "${vscodeApiUri}",
          "./modules/utils.js": "${utilsUri}",
          "sortablejs": "https://cdn.skypack.dev/sortablejs"
        }
      }
    </script>
    <script type="module" nonce="${nonce}" src="${scriptUri}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
  </head>

  <body>
    <div class="content-wrapper">
      <div class="compact-selections">
        <div class="select-group">
          <i class="fas fa-tasks" title="Agent"></i>
          <select id="agent">
            ${agentOptions}
          </select>
        </div>
        <div class="select-group">
          <i class="fas fa-robot" title="Model"></i>
          <select id="model">
            <option value="sonnet++">sonnet3++</option>
            <option value="sonnet+">sonnet3+</option>
            <option value="opus">opus3</option>
            <option value="haiku+">haiku3+</option>
            <option value="o1">o1(100k)</option>
            <option value="o1preview">o1preview(32k)</option>
            <option value="o1-">o1-(64k)</option>
            <option value="gpt4o">gpt4o(16k)</option>
            <option value="gpt4o-">gpt4o-(16k)</option>
            <option value="gpt4ol">gpt4ol(16k)</option>
            <option value="gpt4t">gpt4t(4k)</option>
            <option value="geminiexp">gemini exp(8k)</option>
            <option value="gemini2f">gemini2.0f(8k)</option>
            <option value="gemini1p+">gemini1.5p(8k)</option>
            <option value="gemini1f+">gemini1.5f(8k)</option>
            <!-- <option value="gemini1p+OR">gemini1.5p(OR)</option> -->
            <!-- <option value="gemini1f+OR">gemini1.5f(OR)</option> -->
            <!-- <option value="llama3+OR">llama3.1 405B(OR)</option> -->
            <!-- <option value="gpt4oOR">gpt4o(64k, OR)</option> -->
          </select>
        </div>
        <div class="select-group">
          <i class="fas fa-sync-alt" title="Reflect"></i>
          <select id="reflect">
            <option value="True">True</option>
            <option value="False">False</option>
          </select>
        </div>
      </div>
      <div class="file-selection-group">
        <div class="file-select">
          <div class="file-select-header">
            <div class="file-select-label-group">
              <label for="inputFile"
                ><i class="fas fa-file-alt"></i> Select Input File:</label
              >
            </div>
            <div class="file-select-actions">
              <button
                id="refreshAllFilesButton"
                class="action-button"
                title="Refresh all file lists"
              >
                <i class="fas fa-sync-alt"></i>
              </button>
              <button
                id="emptyInputFileButton"
                class="icon-button"
                title="Empty"
              >
                <i class="fas fa-times"></i>
              </button>
              <button
                id="currentInputFileButton"
                class="action-button"
                title="Set current file as input"
              >
                <i class="fas fa-file-code"></i>
              </button>
              <span
                id="toggleMultipleInputFiles"
                class="toggle-icon"
                title="More"
                >▼</span
              >
              <button
                id="addOpenedFilesButton"
                class="icon-button"
                title="Add opened files as input"
              >
                <i class="fas fa-folder-open"></i>
              </button>
              <button
                id="emptyMultipleInputFilesButton"
                class="icon-button"
                title="Empty"
              >
                <i class="fas fa-trash-alt"></i>
              </button>
              <button
                id="selectMultipleInputFilesButton"
                class="icon-button"
                title="Add"
              >
                <i class="fas fa-plus"></i>
              </button>
            </div>
          </div>
          <select id="inputFile">
            <option value="">None</option>
          </select>
          <div
            id="multipleInputFilesContainer"
            class="multiple-files-container"
            style="display: none"
          >
            <div class="multiple-files-content">
              <div id="multipleInputFiles" class="multiple-files-list"></div>
            </div>
          </div>
        </div>
        <div class="file-select">
          <div class="file-select-header">
            <label for="referenceFile"
              ><i class="fas fa-file-alt"></i> Select Reference File:</label
            >
            <div class="file-select-actions">
              <button
                id="emptyReferenceFileButton"
                class="icon-button"
                title="Empty"
              >
                <i class="fas fa-times"></i>
              </button>
              <button
                id="currentReferenceFileButton"
                class="action-button"
                title="Set current file as reference"
              >
                <i class="fas fa-file-code"></i>
              </button>
              <span
                id="toggleMultipleReferenceFiles"
                class="toggle-icon"
                title="More"
                >▼</span
              >
              <button
                id="addOpenedReferenceFilesButton"
                class="icon-button"
                title="Add opened files as reference"
              >
                <i class="fas fa-folder-open"></i>
              </button>
              <button
                id="emptyMultipleReferenceFilesButton"
                class="icon-button"
                title="Empty"
              >
                <i class="fas fa-trash-alt"></i>
              </button>
              <button
                id="selectMultipleReferenceFilesButton"
                class="icon-button"
                title="Add"
              >
                <i class="fas fa-plus"></i>
              </button>
            </div>
          </div>
          <select id="referenceFile">
            <option value="">None</option>
          </select>
          <div
            id="multipleReferenceFilesContainer"
            class="multiple-files-container"
            style="display: none"
          >
            <div class="multiple-files-content">
              <div
                id="multipleReferenceFiles"
                class="multiple-files-list"
              ></div>
            </div>
          </div>
        </div>
        <div class="file-select">
          <div class="file-select-header">
            <label for="auxiliaryFile"
              ><i class="fas fa-file-alt"></i> Select Auxiliary File:</label
            >
            <div class="file-select-actions">
              <button
                id="emptyAuxiliaryFileButton"
                class="icon-button"
                title="Empty"
              >
                <i class="fas fa-times"></i>
              </button>
              <button
                id="currentAuxiliaryFileButton"
                class="action-button"
                title="Set current file as auxiliary"
              >
                <i class="fas fa-file-code"></i>
              </button>
              <span
                id="toggleMultipleAuxiliaryFiles"
                class="toggle-icon"
                title="More"
                >▼</span
              >
              <button
                id="addOpenedAuxiliaryFilesButton"
                class="icon-button"
                title="Add opened files as auxiliary"
              >
                <i class="fas fa-folder-open"></i>
              </button>
              <button
                id="emptyMultipleAuxiliaryFilesButton"
                class="icon-button"
                title="Empty"
              >
                <i class="fas fa-trash-alt"></i>
              </button>
              <button
                id="selectMultipleAuxiliaryFilesButton"
                class="icon-button"
                title="Add"
              >
                <i class="fas fa-plus"></i>
              </button>
            </div>
          </div>
          <select id="auxiliaryFile">
            <option value="">None</option>
          </select>
          <div
            id="multipleAuxiliaryFilesContainer"
            class="multiple-files-container"
            style="display: none"
          >
            <div class="multiple-files-content">
              <div
                id="multipleAuxiliaryFiles"
                class="multiple-files-list"
              ></div>
            </div>
          </div>
        </div>
        <div class="file-select">
          <div class="file-select-header">
            <div class="file-select-label-group">
              <label for="figureFile"
                ><i class="fas fa-file-alt"></i> Select Figure File:</label
              >
            </div>
            <div class="file-select-actions">
              <button
                id="emptyFigureFileButton"
                class="icon-button"
                title="Empty"
              >
                <i class="fas fa-times"></i>
              </button>
              <button
                id="currentFigureFileButton"
                class="action-button"
                title="Set current file as figure"
              >
                <i class="fas fa-file-code"></i>
              </button>
              <span
                id="toggleMultipleFigureFiles"
                class="toggle-icon"
                title="More"
                >▼</span
              >
              <button
                id="emptyMultipleFigureFilesButton"
                class="icon-button"
                title="Empty"
              >
                <i class="fas fa-trash-alt"></i>
              </button>
              <button
                id="selectMultipleFigureFilesButton"
                class="icon-button"
                title="Add"
              >
                <i class="fas fa-plus"></i>
              </button>
            </div>
          </div>
          <select id="figureFile">
            <option value="">None</option>
          </select>
          <div
            id="multipleFigureFilesContainer"
            class="multiple-files-container"
            style="display: none"
          >
            <div class="multiple-files-content">
              <div id="multipleFigureFiles" class="multiple-files-list"></div>
            </div>
          </div>
        </div>
        <div class="file-select">
          <div class="file-select-header">
            <label for="multipleOutputFilesSelect">
              <span
                id="toggleMultipleOutputFiles"
                class="toggle-icon"
                title="More"
                >▼</span
              ><span class="advanced-feature">Multiple File Output</span>
            </label>
            <div class="file-select-actions">
              <button
                id="emptyMultipleOutputFilesButton"
                class="icon-button"
                title="Empty"
              >
                <i class="fas fa-trash-alt"></i>
              </button>
              <button
                id="selectMultipleOutputFilesButton"
                class="icon-button"
                title="Add"
              >
                <i class="fas fa-plus"></i>
              </button>
            </div>
          </div>
          <div
            id="multipleOutputFilesContainer"
            class="multiple-files-container"
            style="display: none"
          >
            <div class="multiple-files-content">
              <div id="multipleOutputFiles" class="multiple-files-list"></div>
            </div>
          </div>
        </div>
      </div>
      <p></p>
      <div class="instruction-box">
        <div class="instruction-header">
          <label for="instructionInput"
            ><i class="fas fa-pencil-alt"></i> Specific Instructions:</label
          >
          <button
            id="emptyInstructionsButton"
            class="icon-button"
            title="Empty"
          >
            <i class="fas fa-eraser"></i>
          </button>
        </div>
        <textarea
          id="instructionInput"
          placeholder="Enter your instructions such as: Gently correct mathematical mistakes and typos."
        ></textarea>
      </div>
      <div class="tool-use-execute">
        <div class="checkbox-grid">
          <label
            ><input type="checkbox" id="autoExtractFigure" />
            <i class="fas fa-image"></i> Auto-extract Figs</label
          >
          <label
            ><input type="checkbox" id="autoExtractTikzFigure" />
            <i class="fas fa-draw-polygon"></i> Auto-extract TikZ Figs</label
          >
          <label
            ><input type="checkbox" id="autoExtractTikzFigureReflect" />
            <i class="fas fa-sync-alt"></i> Auto-extract TikZ
            Figs(Reflect)</label
          >
          <label
            ><input type="checkbox" id="includeTexCount" />
            <i class="fas fa-calculator"></i> Include Tex Count</label
          >
          <label
            ><input type="checkbox" id="usePrefillFromInput" />
            <i class="fas fa-file-import"></i> Use Prefill from Input</label
          >
          <label
            ><input type="checkbox" id="printInputPrompt" />
            <i class="fas fa-file-code"></i> Print Input Prompt</label
          >
          <label
            ><input type="checkbox" id="autoConfirmation" />
            <i class="fas fa-check-circle"></i> Auto Confirmation</label
          >
          <label
            ><input type="checkbox" id="useOpenRouter" />
            <i class="fas fa-cloud"></i> Use OpenRouter</label
          >
        </div>
        <div class="execute-row">
          <div class="output-name-override-container">
            <span
              id="toggleOutputNameOverride"
              class="toggle-icon"
              title="Toggle Output Name Override"
              >▼</span
            >Override output name:
            <br />
            <input
              type="text"
              id="outputNameOverride"
              placeholder="(include extension)"
            />
          </div>
          <button id="executeButton">
            <i class="fas fa-play"></i> Execute
          </button>
        </div>
      </div>
      <div class="section">
        <h6 class="section-header">
          <i class="fas fa-broom"></i> Housekeeping
        </h6>
        <div class="button-group">
          <span>For the Selected Agent and Files:</span>
          <button id="packButton" class="icon-button" title="Pack Files">
            <i class="fas fa-box"></i>Pack
          </button>
          <button id="cleanButton" class="icon-button" title="Clean Files">
            <i class="fas fa-trash-alt"></i>Clean
          </button>
        </div>
        <div class="button-group">
          <span>For All the Agents and Files:</span>
          <button id="indentTexButton" class="icon-button" title="Indent TeX">
            <i class="fas fa-indent"></i>Indent TeX
          </button>
          <button
            id="cleanOutputButton"
            class="icon-button"
            title="Clean Output"
          >
            <i class="fas fa-broom"></i>Clean Output
          </button>
          <button id="cleanBuildButton" class="icon-button" title="Clean Build">
            <i class="fas fa-recycle"></i>Clean Build
          </button>
        </div>
      </div>

      <div class="section">
        <h6 class="section-header">
          <i class="fas fa-code-branch"></i> Smart Diffs
        </h6>
        <div class="file-select">
          <div class="file-select-header">
            <div class="file-select-label-group">
              <label for="baseFile"
                ><i class="fas fa-file-alt"></i> Select Base File:</label
              >
            </div>
            <div class="file-select-actions">
              <button
                id="emptyBaseFileButton"
                class="icon-button"
                title="Empty"
              >
                <i class="fas fa-times"></i>
              </button>
              <button
                id="currentBaseFileButton"
                class="action-button"
                title="Set current file as base"
              >
                <i class="fas fa-file-code"></i>
              </button>
            </div>
          </div>
          <select id="baseFile">
            <option value="">None</option>
          </select>
        </div>
        <div class="file-select">
          <div class="file-select-header">
            <div class="file-select-label-group">
              <label for="editedFile"
                ><i class="fas fa-file-edit"></i> Select Edited File:</label
              >
              <button id="mergeButton" class="icon-button" title="Merge">
                <i class="fas fa-code-merge"></i>Merge
              </button>
              <button
                id="latexdiffButton"
                class="icon-button"
                title="LaTeXDiff the edited file with the base file"
              >
                <i class="fas fa-file-medical-alt"></i>latexdiff
              </button>
            </div>
            <div class="file-select-actions">
              <button
                id="refreshEditedFileButton"
                class="action-button"
                title="Refresh edited files"
              >
                <i class="fas fa-sync-alt"></i>
              </button>
              <button
                id="emptyEditedFileButton"
                class="icon-button"
                title="Empty"
              >
                <i class="fas fa-times"></i>
              </button>
              <button
                id="currentEditedFileButton"
                class="action-button"
                title="Set current file as edited"
              >
                <i class="fas fa-file-code"></i>
              </button>
            </div>
          </div>
          <select id="editedFile">
            <option value="">None</option>
          </select>
        </div>
        <div class="file-select">
          <div class="file-select-header">
            <div class="file-select-label-group">
              <label for="commit"
                ><i class="fas fa-code-commit"></i> Select Commit:</label
              >
              <button
                id="latexdiffvcButton"
                class="icon-button"
                title="LaTeXDiff with another git commit"
              >
                <i class="fas fa-file-medical-alt"></i>latexdiff-vc
              </button>
              <button
                id="packLatexdiffvcButton"
                class="icon-button"
                title="Pack"
              >
                <i class="fas fa-box"></i>Pack
              </button>
              <button
                id="cleanLatexdiffvcButton"
                class="icon-button"
                title="Clean"
              >
                <i class="fas fa-trash-alt"></i>Clean
              </button>
            </div>
            <div class="file-select-actions">
              <button
                id="refreshCommitsButton"
                class="icon-button"
                title="Refresh"
              >
                <i class="fas fa-sync"></i>
              </button>
            </div>
          </div>
          <select id="commit">
            <option value="HEAD">HEAD</option>
          </select>
        </div>
      </div>
    </div>
  </body>
</html>
