<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src ${cspSource} https://cdnjs.cloudflare.com; script-src 'nonce-${nonce}' https://cdnjs.cloudflare.com; img-src ${cspSource} https:; font-src https://cdnjs.cloudflare.com;">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="${styleUri}">
  <script nonce="${nonce}" src="${scriptUri}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
</head>

<body>
  <div class="content-wrapper">
    <div class="compact-selections">
      <div class="select-group">
        <i class="fas fa-tasks" title="Task"></i>
        <select id="taskSelect">
          ${taskOptions}
        </select>
      </div>
      <div class="select-group">
        <i class="fas fa-robot" title="Model"></i>
        <select id="modelSelect">
          <option value="sonnet+">Sonnet+</option>
          <option value="opus">Opus</option>
          <option value="sonnet">Sonnet</option>
          <option value="haiku">Haiku</option>
          <option value="gpt4t">GPT-4 Turbo</option>
          <option value="gpt4o">GPT-4 Omni</option>
          <option value="gpt4o-">GPT-4 Omni-</option>
        </select>
      </div>
      <div class="select-group">
        <i class="fas fa-sync-alt" title="Reflect"></i>
        <select id="reflectSelect">
          <option value="True">True</option>
          <option value="False">False</option>
        </select>
      </div>
    </div>
    </p>
    <div class="file-selection-group">
      <div class="file-select">
        <div class="file-select-header">
          <label for="inputFileSelect"><i class="fas fa-file-alt"></i> Select Input File:</label>
          <div class="file-select-actions">
            <button id="currentFileButton" class="action-button" title="Set current file as input"><i class="fas fa-file-code"></i></button>
            <span id="toggleMultipleInputFiles" class="toggle-icon" title="More">▼</span>
            <button id="addOpenedFilesButton" class="icon-button" title="Add opened files as input"><i class="fas fa-folder-open"></i></button>
            <button id="emptyMultipleInputFilesButton" class="icon-button" title="Empty"><i class="fas fa-trash-alt"></i></button>
            <button id="selectMultipleInputFilesButton" class="icon-button" title="Add"><i class="fas fa-plus"></i></button>
          </div>
        </div>
        <select id="inputFileSelect">
          <option value="">None</option>
        </select>
        <div id="multipleInputFilesContainer" class="multiple-files-container" style="display: none;">
          <div class="multiple-files-content">
            <div id="multipleInputFilesSelect" class="multiple-files-list"></div>
          </div>
        </div>
      </div>
      <div class="file-select">
        <div class="file-select-header">
          <label for="sampleFileSelect"><i class="fas fa-file-alt"></i> Select Reference File:</label>
          <div class="file-select-actions">
            <button id="currentSampleFileButton" class="action-button" title="Set current file as reference"><i class="fas fa-file-code"></i></button>
            <span id="toggleMultipleSampleFiles" class="toggle-icon" title="More">▼</span>
            <button id="addOpenedSampleFilesButton" class="icon-button" title="Add Opened"><i class="fas fa-folder-open"></i></button>
            <button id="emptyMultipleSampleFilesButton" class="icon-button" title="Empty"><i class="fas fa-trash-alt"></i></button>
            <button id="selectMultipleSampleFilesButton" class="icon-button" title="Add"><i class="fas fa-plus"></i></button>
          </div>
        </div>
        <select id="sampleFileSelect">
          <option value="">None</option>
        </select>
        <div id="multipleSampleFilesContainer" class="multiple-files-container" style="display: none;">
          <div class="multiple-files-content">
            <div id="multipleSampleFilesSelect" class="multiple-files-list"></div>
          </div>
        </div>
      </div>
      <div class="file-select">
        <div class="file-select-header">
          <label for="auxFileSelect"><i class="fas fa-file-alt"></i> Select Auxiliary File:</label>
          <div class="file-select-actions">
            <button id="currentAuxFileButton" class="action-button" title="Set current file as auxiliary"><i class="fas fa-file-code"></i></button>
            <span id="toggleMultipleAuxFiles" class="toggle-icon" title="More">▼</span>
            <button id="addOpenedAuxFilesButton" class="icon-button" title="Add opened files as auxiliary"><i class="fas fa-folder-open"></i></button>
            <button id="emptyMultipleAuxFilesButton" class="icon-button" title="Empty"><i class="fas fa-trash-alt"></i></button>
            <button id="selectMultipleAuxFilesButton" class="icon-button" title="Add"><i class="fas fa-plus"></i></button>
          </div>
        </div>
        <select id="auxFileSelect">
          <option value="">None</option>
        </select>
        <div id="multipleAuxFilesContainer" class="multiple-files-container" style="display: none;">
          <div class="multiple-files-content">
            <div id="multipleAuxFilesSelect" class="multiple-files-list"></div>
          </div>
        </div>
      </div>
      <div class="file-select">
        <div class="file-select-header">
          <label for="figureFileSelect"><i class="fas fa-file-alt"></i> Select Figure File:</label>
          <div class="file-select-actions">
            <span id="toggleMultipleFigures" class="toggle-icon" title="More">▼</span>
            <button id="emptyMultipleFiguresButton" class="icon-button" title="Empty"><i class="fas fa-trash-alt"></i></button>
            <button id="selectMultipleFiguresButton" class="icon-button" title="Add"><i class="fas fa-plus"></i></button>
          </div>
        </div>
        <select id="figureFileSelect">
          <option value="">None</option>
        </select>
        <div id="multipleFiguresContainer" class="multiple-files-container" style="display: none;">
          <div class="multiple-files-content">
            <div id="multipleFiguresSelect" class="multiple-files-list"></div>
          </div>
        </div>
      </div>
      <div class="file-select">
        <div class="file-select-header">
          <label for="outputFilesSelect">
            <span id="toggleOutputFiles" class="toggle-icon" title="More">▼</span><span class="advanced-feature">Multiple File Output</span> 
          </label>
        </div>
        <div id="outputFilesContainer" style="display: none;">
          <div id="outputFilesList" class="multiple-files-list"></div>
        </div>
      </div>
    </div>
    <p>
    <div class="instruction-box">
      <div class="instruction-header">
        <label for="taskInput"><i class="fas fa-pencil-alt"></i> Specific Instructions:</label>
        <button id="emptyInstructionsButton" class="icon-button" title="Empty"><i class="fas fa-eraser"></i></button>
      </div>
      <textarea id="taskInput"
        placeholder="Enter your instructions such as: Gently correct mathematical mistakes and typos."></textarea>
    </div>
    <div class="tool-use-execute">
      <div class="checkbox-grid">
        <label><input type="checkbox" id="autoExtractFigure"> <i class="fas fa-image"></i> Auto-extract Figs</label>
        <label><input type="checkbox" id="autoExtractTikzFigure"> <i class="fas fa-draw-polygon"></i> Auto-extract TikZ Figs</label>
        <label><input type="checkbox" id="includeTikzReflection"> <i class="fas fa-sync-alt"></i> Include TikZ Reflection</label>
        <label><input type="checkbox" id="includeTexCount"> <i class="fas fa-calculator"></i> Include Tex Count</label>
      </div>
      <div class="execute-row">
        <div class="output-name-override-container">
          <input type="text" id="outputNameOverride" placeholder="Override output name (include extension)">
        </div>
        <button id="executeButton"><i class="fas fa-play"></i> Execute</button>
      </div>
    </div>
    </p>
    <div class="section">
      <h5 class="section-header"><i class="fas fa-broom"></i> Housekeeping</h5>
      <div class="button-group">
        <label>For the Selected Task and Files:</label>
        <div class="button-container">
          <button id="packSingleButton" class="action-button"><i class="fas fa-box"></i> Pack</button>
          <button id="cleanSingleButton" class="action-button"><i class="fas fa-trash-alt"></i> Clean</button>
          <button id="packMultipleButton" class="action-button"><i class="fas fa-boxes"></i> Pack(Multiple)</button>
          <button id="cleanMultipleButton" class="action-button"><i class="fas fa-dumpster"></i> Clean(Multiple)</button>
        </div>
      </div>
      <div class="button-group">
        <label>For All the Files:</label>
        <div class="button-container">
          <button id="indentTexButton" class="action-button"><i class="fas fa-indent"></i> Indent TeX</button>
          <button id="cleanOutputButton" class="action-button"><i class="fas fa-broom"></i> Clean Output</button>
          <button id="cleanBuildButton" class="action-button"><i class="fas fa-recycle"></i> Clean Build</button>
        </div>
      </div>
    </div>

    <div class="section">
      <h5 class="section-header"><i class="fas fa-code-branch"></i> Smart Diffs</h5>
      <div class="file-select">
        <div class="file-select-header">
          <label for="editedFileSelect"><i class="fas fa-file-edit"></i> Select Edited File:</label>
          <div class="file-select-actions">
            <button id="currentEditedFileButton" class="action-button"><i class="fas fa-file-code"></i> Current</button>
            <button id="mergeButton" class="action-button"><i class="fas fa-code-merge"></i> Merge</button>
            <button id="latexDiffButton" class="action-button"><i class="fas fa-file-diff"></i> latexdiff</button>
          </div>
        </div>
        <select id="editedFileSelect">
          <option value="">None</option>
        </select>
      </div>
      <div class="file-select">
        <div class="file-select-header">
          <label for="commitSelect"><i class="fas fa-code-commit"></i> Select Commit:</label>
          <div class="file-select-actions">
            <button id="refreshCommitsButton" class="action-button"><i class="fas fa-sync"></i> Refresh</button>
            <button id="packLatexDiffVCButton" class="action-button"><i class="fas fa-box"></i> Pack</button>
            <button id="cleanLatexDiffVCButton" class="action-button"><i class="fas fa-trash-alt"></i> Clean</button>
            <button id="latexDiffVCButton" class="action-button"><i class="fas fa-file-diff"></i> latexdiff-vc</button>
          </div>
        </div>
        <select id="commitSelect">
          <option value="HEAD">HEAD</option>
        </select>
      </div>
    </div>
  </div>
</body>

</html>
