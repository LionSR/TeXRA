name: paper2cover
settings:
  documentTag: cover_letter
  endTag: </cover_letter>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>

requiredFilesInternal:
  TEMPLATE_COVER_LETTER: template_cover_letter.txt

prompts:
  systemPrompt: |
    You are an experienced physicist and scientific writer. Your task is to write a compelling cover letter for a research paper to be submitted to a Physical Review journal. The cover letter should highlight the significance and novelty of the research, and explain why it is suitable for the chosen journal.

    When writing the cover letter:
    - Use a formal and professional tone appropriate for academic correspondence.
    - Highlight the key findings and significance of the research.
    - Explain why the paper is suitable for the specific Physical Review journal.
    - Keep the letter condensed, typically not exceeding one page.
    - Address the letter to the editor of the journal.
    - Include all necessary components of a cover letter, such as paper title, authors, and contact information.

  userPrefix: |
    I am going to give you a \LaTeX document of a research paper. You are about to write a cover letter for this paper to submit to a Physical Review journal.

    Here is the \LaTeX document of the research paper:
    <latex_document>
    {{ INPUT_CONTENT }}
    </latex_document>

    If a sample cover letter has been provided, it is enclosed in the following tags:
    <sample_cover_letter>
    {{ ALL_REFERENCES }}
    </sample_cover_letter>

    Please carefully read through the entire research paper above and ensure you fully understand all the details. Your task is to write a cover letter for this paper.

  userRequest: |
    {% if INSTRUCTION %}
    Focus solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

    Based on the research paper provided, please write a compelling cover letter for submission to a Physical Review journal. In the scratchpad below, outline the key points you plan to include in the cover letter.

    <scratchpad>
    \begin{enumerate}
        \item [Key findings and their significance]
        \item [Novelty and impact of the research]
        \item [Suitability for the journal]
        \item [Technical highlights]
    \end{enumerate}
    </scratchpad>

    Now, please write the cover letter incorporating these key points. The cover letter should be professional, concise, and effectively highlight the significance of the research.

    The cover letter should use professional latex format, such as ``name'' for double quotes, and ``\\`` at the end of each paragraph for paragraph breaks. Use \begin{enumerate} and \end{enumerate} for lists.

    Please use the following template for the cover letter:

    <cover_letter>
    {{ TEMPLATE_COVER_LETTER_CONTENT }}
    </cover_letter>

  userReflect: |
    Let's critically reflect on the cover letter we've written. Consider these points and brainstorm potential improvements in the scratchpad below:

    <scratchpad>
    <reflection>
    \begin{enumerate}
        \item Does the cover letter effectively highlight the key findings and significance of the research?
        \item Is the explanation of why the paper is suitable for the chosen Physical Review journal clear and compelling?
        \item Is the tone appropriately formal and professional for academic correspondence?
        \item Are all necessary components (paper title, authors) included?
        \item Is the letter dense and focused yet with sufficient detail?
        \item Are there any areas where the letter could be more persuasive?
    \end{enumerate}
    </reflection>
    <improvements>
    \begin{enumerate}
        \item [Potential improvement 1]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Potential improvement 2]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
        \item [Potential improvement 3]
            \begin{itemize}
                \item Rationale: [Brief explanation]
                \item Implementation: [Concrete steps]
            \end{itemize}
    \end{enumerate}
    </improvements>
    </scratchpad>

    Then, based on the first version of the cover letter, please output an improved version of the cover letter, incorporating the reflections and improvements discussed in the scratchpad. Remember to maintain a professional tone and focus on effectively presenting the research to the journal editor. 

    Again, the cover letter should use professional latex format, such as ``name'' for double quotes, and ``\\``for paragraph breaks. Use \begin{enumerate} and \end{enumerate} for lists. Output the new version based on the previous version you just wrote.

    Use the following latex format:

    <cover_letter>
    {{ TEMPLATE_COVER_LETTER_CONTENT }}
    </cover_letter>
