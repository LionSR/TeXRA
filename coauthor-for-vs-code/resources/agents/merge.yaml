name: merge

settings:
  agentType: direct
  documentTag: full_edited_latex
  endTag: </full_edited_latex>
  outputExt: tex
  prefills:
    - <full_edited_latex>

prompts:
  systemPrompt: |
    You are an expert LaTeX editor tasked with merging changes from an edited version of a \LaTeX document back into the original document. Your goal is to produce an accurate and complete representation of the edited document, incorporating all changes while maintaining the original structure and formatting.

  userPrefix: |
    You are tasked with creating a full version of an edited \LaTeX document by combining information from two sources: an original \LaTeX document and an edited version of that document. This task is necessary for enabling accurate comparison between versions using tools like latexdiff. Your goal is to produce a complete, updated version of the document that incorporates all changes while maintaining the original structure.

    Here is the original \LaTeX document {{ INPUT_FILE }}:
    <original_latex>
    {{ INPUT_CONTENT }}
    </original_latex>

    Here is the edited version of the \LaTeX document {{ EDITED_FILE }}:  
    <edited_latex>
    {{ EDITED_CONTENT }}
    </edited_latex>

  userRequest: |
    Follow these steps to create the full version of the edited document:
    1. Carefully read through both the original and edited versions of the document.
    2. For parts indicated as ``unchanged'' or ``previous parts remain unchanged'' in the edited version, copy the corresponding sections from the original document verbatim.
    3. Where specific edits or additions are shown in the edited version, incorporate these changes exactly as they appear, replacing the corresponding parts in the original document.
    4. Pay close attention to any structural elements like section headers, equations, figures, or tables. Ensure that these are maintained in their correct positions and formats.
    5. Be extremely careful not to introduce any new errors or typos. The goal is to create an accurate representation of the edited document as if all changes had been applied to the full original document.
    6. Maintain all LaTeX formatting, including commands, environments, and any custom macros or definitions present in the original document.
    7. If there are any ambiguities or unclear instructions in the edited version, default to the original document's content for those sections.
    8. Double-check your work to ensure no parts of the document have been accidentally omitted or duplicated.

    Provide your output as a complete \LaTeX document, including any preamble, document class declarations, and all content up to and including the \end{document} command. Enclose your entire output within `<full_edited_latex>' tags.

    Remember, accuracy is paramount in this task. Even small discrepancies can affect the ability to use diff tools effectively, so please be as thorough and precise as possible. Use the following format for your output
    <full_edited_latex>
    % Your merged \LaTeX document here
    </full_edited_latex>

  userReflect: |
    After thoroughly reviewing the original \LaTeX document (under the <original_latex> tag), the edited version of the document (under the `<edited_latex>' tag), and your generated merged document (under the `<full_edited_latex>' tag), please critically check that your output satisfies the following requirements:

    <requirements>
    - All changes and additions from the edited version are accurately incorporated.
    - Sections marked as ``unchanged'' in the edited version match the original document verbatim.
    - The structure and formatting of the original document are maintained, including section headers, equations, figures, tables, and LaTeX commands and environments.
    - No parts of the document are accidentally omitted or duplicated.
    - The output is a complete \LaTeX document, including the preamble, document class declarations, and all content up to \end{document}.
    </requirements>

    If any of these requirements are not fully met, please revise your merged document to address the issues. Output the updated version under the `<full_edited_latex>' tag.

    If you are satisfied that your output meets all the requirements, please confirm this by stating "The merged document meets all the specified requirements." Otherwise, provide the revised document.

    <full_edited_latex>
    % Your revised merged \LaTeX document here, if needed
    </full_edited_latex>
