name: draw
settings:
  agentType: CoT
  documentTag: latex_document
  endTag: </latex_document>
  outputExt: tex
  prefills:
    - <scratchpad>
    - <scratchpad>

prompts:
  systemPrompt: |
    You are a professor, and at the same time a LaTeX and TikZ expert tasked with creating or polishing figures for a research paper. Your goal is to create informative, condensed, and aesthetically pleasing figures that effectively convey the key concepts and ideas, with coherent connections to the main text.

    When creating or modifying figures, you must:
    \begin{itemize}
        \item Use TikZ for drawing the figures.
        \item Ensure the figures are well-explained with informative captions.
        \item Reference the figures throughout the main text in relevant places.
        \item Follow the best practices for creating professional-quality figures in research papers.
        \item Stick to the given instructions. If I ask you to revise Figure~\ref{fig:1} only, do not create another Figure~\ref{fig:2}.
    \end{itemize}

  userPrefix: |
    I am going to give you a \LaTeX document of a research paper. You are about to create or revise the figures in this paper, so please read the document carefully.

    Here is the \LaTeX document {{ INPUT_FILE }}:
    <latex_document>
    {{ INPUT_CONTENT }}
    </latex_document>

    Please carefully read through the entire research paper above and ensure you fully understand all the details.
  userRequest: |
    Your task is to create or enhance the figures in this paper, focusing solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>

    In the scratchpad below, brainstorm concrete ways to create or significantly improve the figures in the paper that are directly relevant to the instruction above. Be as specific as possible, detailing which figures to create or modify and in what ways. Use the scratchpad as an opportunity to formulate a detailed action plan.
    <scratchpad>
    1. [Specific figure creation/improvement idea 1 that directly addresses the instruction]
    2. [Specific figure creation/improvement idea 2 that directly addresses the instruction]
    3. [Specific figure creation/improvement idea 3 that directly addresses the instruction]
    </scratchpad>

    Then, following your plan in the scratchpad, please output an updated version of the \LaTeX document with the new or enhanced figures that laser-focus on addressing the specific instruction provided. Ensure that the figures are well-integrated into the main text with appropriate references. Use the following format:
    <latex_document>
    % 1ST_UPDATED_LATEX_DOCUMENT HERE
    </latex_document>

  userReflect: |
    Let's take a moment to critically reflect on the changes made:

    <reflection>
    1. How well do the modifications address the specific instruction provided? Are there any areas where the changes could be better aligned with the instruction?
    2. Are the figures clear, condensed, and effective in conveying the key concepts and ideas? If not, how could they be further refined?
    3. Do the figures maintain consistency with the overall style and aesthetics of the research paper? If not, what adjustments could be made to ensure a cohesive look and feel?
    4. Have the figures been properly referenced throughout the main text in relevant places? Are there any missing or unnecessary references?
    5. Compared to the reference figure(s) provided, does the generated/modified figure(s) effectively convey the same information in a more condensed and visually appealing manner? If not, what improvements can be made?
    </reflection>

    Please carefully consider these points and brainstorm additional targeted improvements in the scratchpad below. In the scratchpad, list the planned changes and the rationale for each change.
    <scratchpad>
    1. [Additional improvement 1]
    2. [Additional improvement 2]
    3. [Additional improvement 3]
    ...
    </scratchpad>

    Then, please output a further enhanced version of the \LaTeX document, incorporating the reflections and additional improvements discussed in the scratchpad. Remember to stay laser-focused on the specific instruction provided or the additional plan in the scratchpad and create figures that are correct, aesthetically pleasing, informative, and condensed, in the style of a professional research paper. If I ask you to revise figure 1 only, do not create a figure 2.
