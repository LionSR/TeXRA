<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <!-- Large Thought Bubble (moved up slightly) -->
  <path d="M50 10 Q0 40 50 70 Q100 100 150 70 Q200 40 150 10 Q100 -20 50 10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  
  <!-- Mathematical Symbols in Thought Bubble -->
  <text x="70" y="30" font-family="Arial" font-size="24" fill="#000000">Σ</text>
  <text x="100" y="50" font-family="Arial" font-size="28" fill="#000000">π</text>
  <text x="130" y="30" font-family="Arial" font-size="26" fill="#000000">∫</text>
  <text x="70" y="70" font-family="Arial" font-size="22" fill="#000000">λ</text>
  <text x="140" y="60" font-family="Arial" font-size="24" fill="#000000">θ</text> <!-- Moved left -->

  <!-- Body -->
  <path d="M50 120 Q70 90 120 90 Q200 90 240 120 Q270 140 260 170 Q240 200 180 200 Q100 200 60 170 Q40 150 50 120" fill="#FFD700"/>
  
  <!-- Head and Neck -->
  <path d="M230 120 Q250 100 260 70 Q262 50 250 40 Q240 35 230 40 Q220 50 220 70 Q220 90 230 120" fill="#FFD700"/>
  
  <!-- PhD Hat (Mortarboard) -->
  <rect x="215" y="30" width="60" height="15" fill="#000000"/>
  <rect x="225" y="15" width="40" height="15" fill="#000000"/>
  
  <!-- Purple Tassel -->
  <path d="M225 45 Q215 55 220 70 Q225 75 230 70" stroke="#800080" stroke-width="2" fill="none"/>
  <circle cx="220" cy="70" r="3" fill="#800080"/>
  
  <!-- Eye -->
  <circle cx="250" cy="55" r="6" fill="#FFFFFF"/>
  <circle cx="250" cy="55" r="3" fill="#000000"/>
  <circle cx="252" cy="53" r="1" fill="#FFFFFF"/>
  
  <!-- Beak -->
  <path d="M260 60 Q270 65 280 60 Q285 65 280 70 Q270 75 260 70 Z" fill="#FFA500"/>
  
  <!-- Books on Back -->
  <g transform="rotate(-10 105 130)">
    <rect x="70" y="100" width="60" height="80" fill="#8B4513"/>
    <rect x="70" y="100" width="60" height="5" fill="#D2691E"/>
    <rect x="75" y="105" width="50" height="70" fill="#FFFAF0"/>
    <line x1="80" y1="115" x2="120" y2="115" stroke="#000000" stroke-width="0.5"/>
    <line x1="80" y1="125" x2="120" y2="125" stroke="#000000" stroke-width="0.5"/>
    <line x1="80" y1="135" x2="120" y2="135" stroke="#000000" stroke-width="0.5"/>
  </g>
  <g transform="rotate(-5 120 125)">
    <rect x="90" y="95" width="55" height="75" fill="#228B22"/>
    <rect x="90" y="95" width="55" height="5" fill="#006400"/>
    <rect x="95" y="100" width="45" height="65" fill="#FFFAF0"/>
    <line x1="100" y1="110" x2="135" y2="110" stroke="#000000" stroke-width="0.5"/>
    <line x1="100" y1="120" x2="135" y2="120" stroke="#000000" stroke-width="0.5"/>
    <line x1="100" y1="130" x2="135" y2="130" stroke="#000000" stroke-width="0.5"/>
  </g>
  <g transform="rotate(0 135 120)">
    <rect x="110" y="90" width="50" height="70" fill="#B22222"/>
    <rect x="110" y="90" width="50" height="5" fill="#8B0000"/>
    <rect x="115" y="95" width="40" height="60" fill="#FFFAF0"/>
    <line x1="120" y1="105" x2="150" y2="105" stroke="#000000" stroke-width="0.5"/>
    <line x1="120" y1="115" x2="150" y2="115" stroke="#000000" stroke-width="0.5"/>
    <line x1="120" y1="125" x2="150" y2="125" stroke="#000000" stroke-width="0.5"/>
  </g>
  
  <!-- Feet (rear foot thickened) -->
  <path d="M110 195 L130 195 L130 210 L110 210 Z" fill="#FFA500"/>
  <path d="M170 195 L190 195 L190 210 L170 210 Z" fill="#FFA500"/>
  
  <!-- Connecting Thought Bubbles (moved left) -->
  <circle cx="205" cy="40" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <circle cx="185" cy="60" r="7" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
</svg>
