<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <!-- Large Thought Bubble -->
  <path d="M50 10 Q0 40 50 70 Q100 100 150 70 Q200 40 150 10 Q100 -20 50 10" 
        fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  
  <!-- Mathematical Symbols in Thought Bubble with better spacing -->
  <text x="65" y="35" font-family="Arial" font-size="24" fill="#000000">Σ</text>
  <text x="95" y="55" font-family="Arial" font-size="28" fill="#000000">π</text>
  <text x="125" y="35" font-family="Arial" font-size="26" fill="#000000">∫</text>
  <text x="75" y="65" font-family="Arial" font-size="22" fill="#000000">λ</text>
  <text x="135" y="60" font-family="Arial" font-size="24" fill="#000000">θ</text>

  <!-- Enhanced Body with better shading -->
  <path d="M50 120 Q70 90 120 90 Q200 90 240 120 Q270 140 260 170 Q240 200 180 200 Q100 200 60 170 Q40 150 50 120" 
        fill="#FFE135"/>
  <path d="M50 120 Q70 90 120 90 Q200 90 240 120 Q200 110 120 110 Q70 110 50 120" 
        fill="#FFD700"/>

  <!-- Improved Head and Neck with better curves -->
  <path d="M230 120 Q250 100 260 70 Q262 50 250 40 Q240 35 230 40 Q220 50 220 70 Q220 90 230 120" 
        fill="#FFE135"/>
  <path d="M230 120 Q250 100 260 70 Q250 65 240 70 Q230 80 230 120" 
        fill="#FFD700"/>

  <!-- Refined PhD Hat -->
  <rect x="215" y="30" width="60" height="15" fill="#333333"/>
  <rect x="225" y="15" width="40" height="15" fill="#333333"/>
  <rect x="235" y="5" width="20" height="10" fill="#333333"/>
  
  <!-- Enhanced Tassel -->
  <path d="M225 45 Q215 55 220 70 Q225 75 230 70" 
        stroke="#800080" stroke-width="2.5" fill="none"/>
  <circle cx="220" cy="70" r="4" fill="#800080"/>
  
  <!-- Improved Eye with Glasses -->
  <circle cx="250" cy="55" r="8" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="250" cy="55" r="4" fill="#000000"/>
  <circle cx="252" cy="53" r="1.5" fill="#FFFFFF"/>
  <path d="M242 55 Q235 56 230 58" stroke="#000000" stroke-width="2" fill="none"/>
  
  <!-- Enhanced Beak -->
  <path d="M260 60 Q270 65 280 60 Q285 65 280 70 Q270 75 260 70 Z" 
        fill="#FF9933"/>
  
  <!-- Improved Stack of Books with better perspective -->
  <g transform="rotate(-12 105 130)">
    <rect x="70" y="100" width="65" height="85" fill="#8B4513"/>
    <rect x="70" y="100" width="65" height="6" fill="#D2691E"/>
    <rect x="75" y="106" width="55" height="73" fill="#FFFAF0"/>
    <line x1="80" y1="116" x2="125" y2="116" stroke="#000000" stroke-width="0.7"/>
    <line x1="80" y1="126" x2="125" y2="126" stroke="#000000" stroke-width="0.7"/>
    <line x1="80" y1="136" x2="125" y2="136" stroke="#000000" stroke-width="0.7"/>
  </g>
  <g transform="rotate(-6 120 125)">
    <rect x="90" y="95" width="60" height="80" fill="#228B22"/>
    <rect x="90" y="95" width="60" height="6" fill="#006400"/>
    <rect x="95" y="101" width="50" height="68" fill="#FFFAF0"/>
    <line x1="100" y1="111" x2="140" y2="111" stroke="#000000" stroke-width="0.7"/>
    <line x1="100" y1="121" x2="140" y2="121" stroke="#000000" stroke-width="0.7"/>
    <line x1="100" y1="131" x2="140" y2="131" stroke="#000000" stroke-width="0.7"/>
  </g>
  <g transform="rotate(-2 135 120)">
    <rect x="110" y="90" width="55" height="75" fill="#B22222"/>
    <rect x="110" y="90" width="55" height="6" fill="#8B0000"/>
    <rect x="115" y="96" width="45" height="63" fill="#FFFAF0"/>
    <line x1="120" y1="106" x2="155" y2="106" stroke="#000000" stroke-width="0.7"/>
    <line x1="120" y1="116" x2="155" y2="116" stroke="#000000" stroke-width="0.7"/>
    <line x1="120" y1="126" x2="155" y2="126" stroke="#000000" stroke-width="0.7"/>
  </g>
  
  <!-- Enhanced Feet -->
  <path d="M110 195 Q120 195 130 195 L130 210 Q120 212 110 210 Z" fill="#FF9933"/>
  <path d="M170 195 Q180 195 190 195 L190 210 Q180 212 170 210 Z" fill="#FF9933"/>
  
  <!-- Improved Connecting Thought Bubbles -->
  <circle cx="205" cy="40" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <circle cx="185" cy="60" r="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <circle cx="170" cy="75" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
</svg>
