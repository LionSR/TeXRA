repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        args: ["coauthor-python"]

  - repo: local
    hooks:
      - id: npm-format
        name: npm run format
        entry: npm
        args: ["--prefix", "coauthor-for-vs-code", "run", "format"]
        language: system
        pass_filenames: false
