<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeXRA Trace</title>
  </head>
  <body>
    <progress-app
      class="trace-viewer-shell"
      role="main"
      aria-label="Trace viewer"
      data-session="trace"
    ></progress-app>
    <div class="trace-scrubber" hidden>
      <label>
        <span>Step</span>
        <input type="range" min="0" max="0" value="0" step="1" />
      </label>
      <output></output>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
