appId: ai.texra.desktop
productName: TeXRA
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
directories:
  output: dist-packaged
  buildResources: build
files:
  - from: dist
    to: dist
    filter:
      - '**/*'
  - package.json
extraResources:
  - from: ../extension/resources
    to: resources
    filter:
      - '**/*'
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
