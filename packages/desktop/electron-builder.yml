appId: ai.texra.desktop
productName: TeXRA
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
directories:
  output: dist-packaged
  buildResources: build
files:
  - from: dist
    to: dist
    filter:
      - '**/*'
  - package.json
extraResources:
  - from: ../extension/resources
    to: resources
    filter:
      - '**/*'
mac:
  icon: build/icon.icns
  target:
    - dir
win:
  target:
    - dir
linux:
  target:
    - dir
