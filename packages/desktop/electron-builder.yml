appId: ai.texra.desktop
productName: TeXRA
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# No update feed: the app only reads the release repo's latest tag
# (src/main/desktopUpdateChecker.ts), so emit no latest*.yml or app-update.yml.
publish: null
protocols:
  - name: TeXRA
    schemes:
      - texra
asar: true
asarUnpack:
  # node-pty loads a native .node binary at runtime, which cannot be read from
  # inside an asar archive.
  - '**/node_modules/node-pty/**'
npmRebuild: false
directories:
  output: dist-packaged
  buildResources: build
# electron-builder copies the node_modules of production dependencies only, so
# node-pty (the one package the bundles keep external) is the only production
# dependency. Everything esbuild or Vite inlines into dist is a devDependency;
# otherwise the app would ship a second, never-loaded node_modules copy. For the
# Codex and Claude Code SDKs that copy would include 250-410 MiB of native CLI
# binary each; the app resolves a user-installed CLI at runtime instead.
# scripts/verify-desktop-package.mjs fails the build if either reappears.
files:
  - from: dist
    to: dist
    filter:
      - '**/*'
  - package.json
  - LICENSE.txt
  - NOTICE.txt
  # The main bundle keeps node-pty external (see esbuild.main.mjs), so the real
  # package has to ship alongside it.
  - '**/node_modules/node-pty/**'
  # ...but that leading `**/` also matches the node-pty copy inside an app this
  # run already wrote to dist-packaged. Without this exclusion the second arch
  # of a universal build packs the first arch's finished .app inside itself,
  # and the merge then fails on a Mach-O file count mismatch between arches.
  - '!dist-packaged/**'
extraResources:
  - from: ../extension/resources
    to: resources
    filter:
      - '**/*'
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # node-pty ships a prebuild per platform+arch and picks one at runtime, so
  # both arch builds contain the same darwin-arm64 and darwin-x64 binaries.
  # @electron/universal refuses to merge Mach-O files that are byte-identical
  # across arches unless they are declared here; declaring them keeps every
  # prebuild in the merged app so each arch still resolves its own.
  x64ArchFiles: '**/app.asar.unpacked/node_modules/node-pty/prebuilds/**'
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
linux:
  category: Office
  executableName: texra
  icon: build/icon.png
  maintainer: TeXRA.ai <contact@texra.ai>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
