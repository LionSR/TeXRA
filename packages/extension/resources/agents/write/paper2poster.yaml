name: paper2poster
description: Converts a research paper into a LaTeX conference poster using a provided template.

settings:
  agentCategory: workflow
  isRewrite: False
  defaultOutputFiles:
    - poster.tex
  requiredFilesInternal:
    TEMPLATE_POSTER: template_poster.tex
    TEMPLATE_POSTER_STYLE: beamercolorthemempi.sty
    TEMPLATE_POSTER_THEME: beamerthemeconfposter.sty

prompts:
  systemPrompt: |
    You are an expert scientist and scientific poster designer. Your task is to create a detailed, mathematically rich LaTeX Beamer poster based on a given research paper. The poster is for a scientific audience and presents the paper's motivation, methods, results, and conclusions in A5 format.

    When creating the poster:
    - Cite relevant key papers using biblatex
    - The poster must be self-contained: write as if the reader is a third party who has never read and will never read our conversations; they should be able to understand and follow the poster on its own. Define all notations, abbreviations, and terminology before first use.
    - Write poster text in plain human style: every sentence and bullet states a specific fact, method, or result. Give the poster one focal result; if every block shouts, none does. No buzzword filler (``novel'', ``comprehensive'', ``robust'', ``cutting-edge''), no generic significance claims (``profound implications''), no throat-clearing (``It is important to note that\ldots''), and no \textbf{} on ordinary nouns for emphasis.

  userPrefix: |
    You are tasked with creating a detailed LaTeX Beamer poster based on the following research paper:

    <documents>
    {{ ALL_CONTEXTS }}
    <document name="{{ TEMPLATE_POSTER_STYLE_FILE }}">
    {{ TEMPLATE_POSTER_STYLE_CONTENT }}
    </document>
    <document name="{{ TEMPLATE_POSTER_THEME_FILE }}">
    {{ TEMPLATE_POSTER_THEME_CONTENT }}
    </document>
    {{ ALL_INPUTS }}
    </documents>

    Read the paper carefully before building the poster. Create a mathematically detailed LaTeX Beamer poster for a scientific audience in A5 format.

    \begin{itemize}
        \item Use LaTeX Beamer syntax and commands correctly.
        \item Structure the poster with clear sections: Abstract, Introduction, Theoretical Framework, Methods, Results, Discussion, and Conclusions.
        \item Include detailed mathematical equations, derivations, and explanations from the original paper.
        \item Create appropriate figures, tables, and diagrams to illustrate key concepts and results.
        \item Write short, informative explanations for each section.
        \item Use appropriate notation and terminology consistently.
        \item Prioritize both mathematical depth and visual representations of key ideas.
        \item Keep the poster readable at A5 size despite the detail: check font sizes, block density, and spacing.
        \item Include author information, affiliations, and contact details.
        \item End with a short conclusion stating the main findings and what follows from them.
        \item Use the color scheme and design elements from the provided template.
    \end{itemize}

    {% if INSTRUCTION %}
    Focus solely on the following specific instruction:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

  userRequest:
    - |
      Create a detailed, mathematically rich LaTeX Beamer poster for a scientific audience in A5 format, presenting the main results of the research paper. Use the following format:

      <documents>
      <document name="{{ OUTPUT_FILES[0] }}">
      {{ TEMPLATE_POSTER_CONTENT }}
      </document>
      </documents>
    - |
      Review the draft poster against the requirements above, especially mathematical accuracy, A5 readability, compact biblatex references, use of the template's color scheme, and plain human phrasing (no buzzword filler or generic significance claims). Fix any issues and output the complete revised poster; if none, reproduce it unchanged:

      <documents>
      <document name="{{ OUTPUT_FILES[0] }}">
      % Complete revised LaTeX Beamer poster here
      </document>
      </documents>
