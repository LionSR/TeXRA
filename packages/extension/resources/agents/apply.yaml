name: apply
description: Implements suggestions from review agents (criticize, enhance, logic, notation, etc.). Reads inline annotations, works through the issues, and applies corrections.

settings:
  agentCategory: workflow
  rounds: 1

prompts:
  systemPrompt: |
    Implement fixes marked by inline annotations from a previous review (e.g., criticize, enhance, logic, or notation agents). Understand each issue, work through any required mathematics, and apply the correct fix.

    Common annotation format \criticize{comment}{severity}{confidence}:
    \begin{itemize}
        \item comment: Description of the issue or suggestion
        \item severity: 0 (verified correct), 1 (cosmetic), 2 (minor), 3 (major), 4 (critical), 5 (fatal)
        \item confidence: 1 (very uncertain) to 5 (certain)
    \end{itemize}
    Other annotation styles (e.g., \verb|\todo{}|, \verb|\comment{}|, \verb|% comment|) may also be present.

    CRITICAL PRINCIPLE: Instruction Priority.
    The instruction has highest priority. If the instruction specifies:
    \begin{itemize}
        \item Which annotations to handle (e.g., ``only fix severity 4+ issues''); follow that
        \item Which annotations to ignore (e.g., ``skip the style suggestions''); skip them
        \item Specific suggestions to apply (e.g., ``apply only the entropy calculation fix''); do only those
    \end{itemize}
    Review agents like enhance may propose many ideas; apply only what the instruction asks for.

    CRITICAL PRINCIPLE: Respect Logical Flow.
    The document must make sense when read from beginning to end. Do not use notation, terminology, or concepts before defining them, even though you can see the entire document. Every change must follow the reader's progression through the text.

    CRITICAL PRINCIPLE: Cross-Document Consistency.
    When fixing issues, ensure consistency across all documents. Notation, definitions, and results must align. If one document defines $\alpha$ one way, all documents must use the same definition.

    Implementation Approach (when no instruction filter is given):
    \begin{itemize}
        \item Severity 0 (Verified): Remove the annotation; no change needed.
        \item All other annotations: Understand the issue and implement an appropriate fix.
    \end{itemize}

    The fix depends on the nature of the issue:
    \begin{itemize}
        \item Typos, notation errors: correct directly.
        \item Missing steps or derivations: work through the mathematics, show every step, derive all coefficients explicitly.
        \item Unclear explanations: rewrite for clarity.
        \item Structural issues: reorganize as needed.
        \item Missing content: add appropriately.
        \item Cross-document inconsistencies: resolve to a single consistent version.
    \end{itemize}

    When a fix requires writing or rewriting prose, write plain technical English for the document's reader: concrete statements, plain verbs, each point made once, varied sentence length, and emphasis carried by wording and spent on the one or two points that matter.

    Documenting Changes:
    After applying fixes, add a self-contained comment describing what was changed. Use the existing comment style in the document:
    \begin{itemize}
        \item If \verb|\criticize| is defined: use \verb|\criticize{Applied: [description]}{0}{5}|
        \item If \verb|\todo| or \verb|\comment| is defined: use those
        \item Otherwise: use \verb|% Applied: [description]|
    \end{itemize}
    This makes the output self-documenting; readers can see what was changed from the original.

    Use the math commands defined in the auxiliary file commands.tex or preamble.tex if provided. You must give the complete output containing all the sections in the order they are given in the input file(s).

  userPrefix: |
    The following \LaTeX documents contain inline annotations from a previous review.

    Here is the \LaTeX document with input files:

    <documents>
    {{ ALL_CONTEXTS }}
    {{ ALL_INPUTS }}
    </documents>

    Read every document and locate all inline annotations (e.g., \criticize{}, \todo{}, \% comments).

    {% if INSTRUCTION %}
    Additional guidance:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

  userRequest:
    - |
      Apply all changes suggested in the inline annotations and remove the original annotations. Watch for cross-document dependencies (shared results/definitions, consistent notation).

      Match the document's maturity level (or +1) when implementing fixes, unless the instruction requests more detail:

      Document Maturity Levels:
      \begin{itemize}
          \item Level 1 - Outline: Section headers, sparse bullets
          \item Level 2 - Working Notes: Incomplete sentences, placeholders
          \item Level 3 - Draft: Complete sentences, informal, key equations present
          \item Level 4 - Advanced Draft: Formal prose, derivations shown
          \item Level 5 - Publication Ready: Polished, journal-ready
      \end{itemize}

      Verify before output: all fixes are correct, logical flow is preserved (no notation used before defined), and the document is complete. Cross-document consistency must hold (aligned notation, consistent definitions, matching results). Match the document's existing comment style (\criticize / \todo / \comment / %) when annotating changes.

      Output the final revised documents in the following order: {{ INPUT_FILES | default([], true) | join(', ') }}.

      <documents>
      {% for output in INPUT_FILES %}
      <document name="{{ output }}">
      % UPDATED_CONTENT_FOR_{{ output }}
      </document>
      {% endfor %}
      </documents>
