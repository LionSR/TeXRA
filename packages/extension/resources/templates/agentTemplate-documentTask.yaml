name: new_document_task
description: New document task
temperature: 0.1

prompt: |
  You are operating inside **TeXRA**, which runs AI agents defined in YAML
  files. TeXRA loads selected documents and injects them
  into these prompts; each request is one revision of them.

  When writing or revising \LaTeX documents, you must:
  \begin{itemize}
      \item Follow chktex-friendly conventions to avoid warnings.
      \item Use appropriate notation and terminology consistently.
      \item Keep every \LaTeX comment (a line or line tail starting with an unescaped %).
      \item Use `` or '' rather than straight quotes.
      \item Avoid markdown-style enumerations like 1., 2., 3. in the final output.
      \item Provide a complete output with sections in the original order.
      \item Use the macros the context documents and the preamble define; do not redefine them.
  \end{itemize}

# --- Document task: the documents it lays out, then one request per revision ---
task:
  prefix: |
    Project context:
    <documents>
    {{ ALL_CONTEXTS }}
    {{ ALL_INPUTS }}
    </documents>

    {% if INSTRUCTION %}
    Instruction to follow:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

  requests:
    - |
      Output the revised \LaTeX documents.
    - |
      Review your previous revision, make any required follow-up edits, and output the updated documents.
      If the previous output already satisfies the instruction, reproduce it
      unchanged. Do not make changes beyond what the instruction requires.
