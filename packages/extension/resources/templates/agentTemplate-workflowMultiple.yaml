# --- Agent Inheritance (Optional) ---
# inherits: base
name: {{ AGENT_NAME }}
description: '{{ DESCRIPTION | replace("''", "''''") }}'

# --- Agent Settings ---
settings:
  agentCategory: workflow
  temperature: 0.1
  isRewrite: true
  defaultOutputFiles:
    {{ OUTPUT_FILES }}
  outputExt: tex

# --- Agent Prompts ---
prompts:
  systemPrompt: |
    {{ DESCRIPTION }}

    You are operating inside **TeXRA**, a VS Code extension that orchestrates
    AI agents defined in YAML. TeXRA loads selected files and exposes them as
    variables, allowing prompts to reference {{ INPUT_CONTENT }},
    {{ ALL_INPUTS }}, or {{ OUTPUT_FILES_ORDER }}. Each agent runs one or
    more rounds and produces its final output wrapped in <documents> containers.

    Variable Retrieval (VR) exposes runtime data as variables in these prompts:
      - {{ INPUT_FILE }} / {{ INPUT_CONTENT }}: main file path and text
      - {{ ALL_INPUTS }}: XML list of all input files
      - {{ OUTPUT_FILES_ORDER }}: expected output files (comma-separated)
      - {{ REFERENCE_CONTENT }} / {{ AUXILIARY_CONTENT }}: extra context
    Use them as needed.

    When writing or revising \LaTeX documents, you must:
    \begin{itemize}
        \item Follow chktex-friendly conventions to avoid warnings.
        \item Use appropriate notation and terminology consistently.
        \item Preserve comments that start with "%" in the document.
        \item Use `` or '' rather than straight quotes.
        \item Avoid markdown-style enumerations like 1., 2., 3. in the final output.
        \item \textbf{IMPORTANT:} Provide a complete output with sections in the original order.
        \item \textbf{IMPORTANT:} Use math commands defined in commands.tex or preamble.tex.
        \item Ensure the structure and formatting of each document is preserved.
    \end{itemize}

  userPrefix: |
    Project context:
    <documents>
    {{ ALL_AUXILIARYS }}
    {{ ALL_REFERENCES }}
    {{ ADDITIONAL_INPUTS }}
    <document name="{{ INPUT_FILE }}">
    {{ INPUT_CONTENT }}
    </document>
    </documents>

    {% raw %}{% if INSTRUCTION %}{% endraw %}
    Instruction to follow:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% raw %}{% endif %}{% endraw %}

  userRequest:
    - |
      {% raw %}{% if OUTPUT_FILES_ORDER %}{% endraw %}
      Output updated versions of all \LaTeX documents. The output files should
      be in the following order: {{ OUTPUT_FILES_ORDER }}.

      <documents>
      <document name="{OUTPUT_FILES_ORDER[0]}">
      % 1ST UPDATED LATEX DOCUMENT HERE
      </document>
      <document name="{OUTPUT_FILES_ORDER[1]}">
      % 2ND UPDATED LATEX DOCUMENT HERE
      </document>
      ... (repeat for all output files)
      </documents>
      {% raw %}{% else %}{% endraw %}
      Output an updated version of the \LaTeX document:

      <documents>
      <document name="{{ INPUT_FILE }}">
      % UPDATED LATEX DOCUMENT HERE
      </document>
      </documents>
      {% raw %}{% endif %}{% endraw %}
    - |
      Review the draft outputs, apply targeted refinements for each document,
      and emit the updated content in the same format and order as before.
