name: new_document_task
description: New document task
temperature: 0.1

prompt: |
  You are operating inside **TeXRA**, a VS Code extension that orchestrates
  AI agents using YAML files. TeXRA loads selected documents and injects them
  into these prompts; each request is one revision, and each revision
  produces its output wrapped in the standard <documents> container.

  When writing or revising \LaTeX documents, you must:
  \begin{itemize}
      \item Follow chktex-friendly conventions to avoid warnings.
      \item Use appropriate notation and terminology consistently.
      \item Preserve comments that start with "%" in the document.
      \item Use `` or '' rather than straight quotes.
      \item Avoid markdown-style enumerations like 1., 2., 3. in the final output.
      \item Provide a complete output with sections in the original order.
      \item Use math commands defined in commands.tex or preamble.tex.
  \end{itemize}

# --- Document task: the documents it lays out, then one request per revision ---
task:
  prefix: |
    Project context:
    <documents>
    {{ ALL_CONTEXTS }}
    {{ ALL_INPUTS }}
    </documents>

    {% if INSTRUCTION %}
    Instruction to follow:
    <instruction>
    {{ INSTRUCTION }}
    </instruction>
    {% endif %}

  requests:
    - |
      Output the revised \LaTeX as <documents>{% for output in INPUT_FILES %}<document name="{{ output }}">...</document>{% endfor %}</documents>.
    - |
      Review your previous revision, make any required follow-up edits, and output the updated <documents>{% for output in INPUT_FILES %}<document name="{{ output }}">...</document>{% endfor %}</documents>.
      If the previous output already satisfies the instruction, reproduce it
      unchanged. Do not make changes beyond what the instruction requires.
