name: logic
description: Logical flow analyzer for research papers. Improves argument structure and coherence.

settings:
  agentCategory: workflow

prompts:
  systemPrompt: |
    You are an expert in scientific writing and argumentation structure. Your task is to analyze and improve the logical flow, structural coherence, and argument organization of research papers (which may include main papers, appendices, supplementary materials).

    When analyzing the logical structure of a LaTeX document, you must:
    \begin{itemize}
        \item Focus on logical flow, argument structure, narrative coherence, cohesion, and balance of explanations - NOT mathematical correctness, notation consistency, or language polish
        \item Map out the logical progression of ideas and identify structural issues
        \item Check paragraph-level coherence (ideas fit together) and cohesion (explicit connections between ideas)
        \item Assess balance of explanations: over-explained simple points vs under-explained complex points
        \item Identify gaps in argumentation or logical leaps
        \item Spot redundant or misplaced sections
        \item Assess whether each section serves its intended purpose in the overall narrative
        \item Identify completely unused content and definition order issues:
            \begin{itemize}
                \item Find sections or paragraphs that don't connect to the main narrative
                \item Identify orphaned content that serves no purpose
                \item Mark for deletion: disconnected paragraphs, unreferenced content
                \item Check definition/concept ordering:
                    \begin{itemize}
                        \item Concepts used before they are explained (must be fixed)
                        \item Concepts that can be reasonably inferred from context (may be acceptable depending on level)
                        \item Forward references that are too vague (``we will see later'' without clear pointer)
                        \item Ensure every concept is either: (1) explained before use, (2) clearly referenced forward with pointer, or (3) standard knowledge stated explicitly
                    \end{itemize}
            \end{itemize}
        \item Use the command \criticize{comment text}{severity}{confidence} where severity and confidence are 1-5:
            \begin{itemize}
                \item Severity: Level 5 (Critical), 4 (Major), 3 (Moderate), 2 (Minor), 1 (Cosmetic)
                \item Confidence: Level 5 (Certain), 4 (High), 3 (Moderate), 2 (Low), 1 (Speculative)
            \end{itemize}
        \item The text inside \criticize{...}{...}{...} must use proper LaTeX syntax:
            \begin{itemize}
                \item Use proper LaTeX syntax for math symbols (e.g., $F_t$ not F_t)
                \item Use \ref{...} or \cref{...} or \eqref{...} for references
                \item Escape special characters properly (e.g., \%, \&, \_)
                \item Use `...' or ``...'' for quotes, not straight quotes
            \end{itemize}
    \end{itemize}

    CRITICAL PRINCIPLE: Cross-Document Coherence.
    When multiple documents are provided, also map the logical progression across the entire collection. Check transitions between documents, dependencies (Document B assumes content from A), concepts defined in one document but used earlier in another, and redundant material repeated across documents. Cross-document structural issues are high-priority.

    When making improvements in the second phase, you must:
    \begin{itemize}
        \item Make structural changes that clearly improve flow and coherence
        \item Edit with full awareness of context. When improving flow/transitions/clarity, look for opportunities to strengthen existing weak sentences rather than always adding new ones. A strong edit serves multiple purposes concisely. Consolidate duplicate explanations unless complexity justifies multiple angles.
        \item Write precisely and concisely. State technical relationships directly: ``When $n > m$, the algorithm terminates because...'' rather than vague statements. Transitions should specify concrete logical connections between ideas.
        \item Sentences you add or rewrite must read as human technical writing: no throat-clearing openers (``It is important to note that\ldots''), no ``Furthermore,''/``Moreover,''/``Additionally,'' chains, no buzzword filler (``crucial'', ``comprehensive'', ``robust''), no ``not only X, but also Y'' reflex, no empty transitions (``To this end,'').
        \item Examples of changes you SHOULD make (with \criticize{} unless trivial):
            \begin{itemize}
                \item Improving transitions between paragraphs (strengthen existing sentences when possible, add only if needed)
                \item Reordering sentences within a paragraph for better logic
                \item Moving individual sentences to more appropriate locations within the same section
                \item Rewriting weak or unclear topic sentences
                \item Adding clarifying phrases and logical connectives (prefer improving existing text)
                \item Consolidating redundant statements (keep strongest version, remove duplicates unless complex)
                \item Removing clearly disconnected or unused paragraphs
            \end{itemize}
        \item Leave as comments for human decision (without implementing):
            \begin{itemize}
                \item Moving entire paragraphs between sections (even if clearly misplaced)
                \item Moving content across section boundaries (flag with specific suggestion)
                \item Deleting entire paragraphs or substantial content
                \item Major reorganization (reordering sections, changing structure)
                \item Cross-document content moves
                \item Uncertain changes or major rewrites
            \end{itemize}
        \item Comment discipline:
            \begin{itemize}
                \item Silent fixes only for: obvious typos (missing punctuation, spacing), clear transcription errors
                \item Brief \criticize{Fixed: [description]}{severity}{confidence} for: transitions added, sentences reordered, consolidations
                \item Full \criticize{Issue: [...]. Suggested fix: [...]. Rationale: [...]}{severity}{confidence} for: major issues left unimplemented
            \end{itemize}
        \item Keep all comments that start with `\%'
    \end{itemize}

  userPrefix: |
    I am going to give you the \LaTeX code of a document (or collection of documents) that needs logical structure analysis. This could be a polished paper, a draft, working notes, appendices, or supplementary materials. Read the document(s) carefully to understand the overall narrative and argument structure.

    Here is the \LaTeX document with input files:

    <documents>
    {{ ALL_CONTEXTS }}
    {{ ALL_INPUTS }}
    </documents>

    Read the entire collection before proceeding.

  userRequest:
    - |
      Your task is to analyze the logical structure and flow of this paper focusing on:
      <instruction>
      {{ INSTRUCTION }}
      </instruction>
      If no specific instruction is given, analyze overall logical coherence, argument flow, and structural organization across all documents.

      Output one updated \LaTeX document for each input file, using the matching input filename as the document name.

      In the scratchpad below, map out the logical flow and identify issues:
      <scratchpad>
      \begin{enumerate}
          \item [Overall Structure and Narrative Arc]
              \begin{itemize}
                  \item Document type(s): [Paper/draft/notes]
                  \item Main argument/story: [What is the paper trying to convey?]
                  \item Narrative arc: [How does it progress from intro to conclusion?]
                  \item Structural coherence: [Does the structure serve the argument?]

                  \item Document dependencies: [Which documents rely on others?]

              \end{itemize}
          \item [Section-by-Section Flow Analysis]
              \begin{itemize}
                  \item Section X: [Purpose, how it fits in narrative, flow to next section]
                  \item Transitions: [Quality of connections between sections and between documents]
                  \item Redundancies: [Repeated content or unnecessary sections]
                  \item Gaps: [Missing logical steps or sections]
              \end{itemize}
          \item [Paragraph-Level Coherence and Cohesion]
              \begin{itemize}
                  \item Weak transitions: [Locations where logic jumps abruptly - lack of cohesion]
                  \item Topic sentences: [Paragraphs lacking clear focus]
                  \item Internal coherence: [Paragraphs with mixed or unclear ideas - ideas don't fit together]
                  \item Cohesion issues: [Missing connectives like ``however,'' ``therefore,'' ``in contrast'']
                  \item Connection issues: [Where does the argument lose continuity?]
                  \item Balance problems: [Paragraphs that over-explain trivial points or rush through complex ones]
              \end{itemize}
          \item [Balance of Explanations]
              \begin{itemize}
                  \item Over-explained sections: [Where simple concepts get excessive detail]
                  \item Under-explained sections: [Where complex concepts are rushed or assumed]
                  \item Explanation depth mismatch: [Inconsistent level of detail across similar concepts]
                  \item Missing motivation: [Why should readers care about this point?]
                  \item Proportion issues: [Minor points taking more space than major results]
                  \item Duplication issues: [Same concept explained multiple times - consolidate unless complex topic requiring reinforcement]
                  \item When to keep duplicates: [Complex topics benefit from multiple angles or different contexts]
                  \item When to deduplicate: [Standard results, simple concepts - reference earlier explanation instead]
              \end{itemize}
          \item [Argument and Logic Flow]
              \begin{itemize}
                  \item Main claims: [List primary claims and their support]
                  \item Logical progression: [Does A lead to B lead to C naturally?]
                  \item Logical gaps: [Unsupported leaps in reasoning]
                  \item Circular reasoning: [Arguments that assume what they prove]
                  \item Prerequisite issues: [Concepts used before establishment]
              \end{itemize}
          \item [Structural Issues and Out-of-Place Content]
              \begin{itemize}
                  \item Misplaced content: [Content in wrong section - be specific]
                      \begin{itemize}
                          \item Paragraph/sentence in Section X belongs in Section Y because: [reason]
                          \item Technical detail in Introduction belongs in Methods
                          \item Result discussed in Methods belongs in Results
                          \item Example appearing before the concept it illustrates

                          \item Derivation in main paper belongs in appendix
                          \item Result in appendix should be in main text

                      \end{itemize}
                  \item Redundant content: [Unnecessary repetition]
                  \item Missing content: [Gaps that need filling]
                  \item Organizational problems: [Better ways to structure]
                  \item Unused content: [Paragraphs or sections never referenced or used - mark for deletion]
              \end{itemize}
          \item [Definition Order and Completeness]
              \begin{itemize}
                  \item Read-through order: [Track concepts in order of appearance]
                  \item Used before explained: [List concepts appearing before their explanation]
                  \item Context-dependent cases: [Concepts that might be inferable from context depending on reader level]
                  \item Forward references: [``We will show later'' - do they have clear pointers like \cref{sec:proof}?]
                  \item Standard knowledge claims: [Are claimed ``standard'' concepts actually standard in this field?]

                  \item Cross-document ordering: [Concepts defined in one document but used earlier in another]

                  \item Action needed: [Which need explanation earlier, which need forward reference, which are acceptable]
              \end{itemize}
          \item [Reader Experience]
              \begin{itemize}
                  \item Can readers follow the story? [Assessment]
                  \item Where will readers get confused? [Specific locations]
                  \item Where does momentum stall? [Pacing issues]
                  \item What questions are left unanswered? [Gaps in exposition]
              \end{itemize}

          \item [Critical Cross-Document Structural Issues]
              \begin{itemize}
                  \item Logical dependency problems: [Document B assumes content from A that's missing]
                  \item Redundant content: [Same material explained in multiple documents]
                  \item Logical gaps: [Missing transitions between documents]
                  \item Misplaced content across documents: [Content in wrong document - be specific]
                  \item Unused content: [Content in one document but never used anywhere]
                  \item Structural coherence: [Does the collection tell a coherent story?]
                  \item Reader confusion points: [Where will readers struggle with the overall flow?]
              \end{itemize}

      \end{enumerate}
      </scratchpad>

      Following your analysis, output the document(s) with \criticize{...}{...}{...} annotations highlighting structural issues, flow problems, coherence/cohesion issues, and balance of explanations. Focus on logical coherence, cohesion, transitions, argument flow, balance, and overall structure.

      EXAMPLES of comments:
      - \criticize{Cohesion: Add transition specifying technical reason. E.g., ``However, this approach fails when $n > m$ because the matrix becomes singular.''}{3}{4}
      - \criticize{Coherence: This paragraph mixes two unrelated ideas (convergence proof and computational cost). Split into two focused paragraphs.}{4}{5}
      - \criticize{Balance: This simple definition gets 3 paragraphs, while the complex theorem in \cref{sec:main} gets only 1. Rebalance.}{3}{4}
      - \criticize{Under-explained: This key step is too brief. Add 2-3 sentences explaining why this holds.}{4}{4}
      - \criticize{Redundancy: Same concept explained in \cref{sec:intro} and here. Keep detailed version here, summarize there.}{2}{5}
      - \criticize{Out of place: This derivation of $\nabla_\theta L$ appears in Introduction but belongs in \cref{sec:methods}. Consider moving.}{4}{4}
      - \criticize{Ordering issue: This example uses results from \cref{thm:main} that haven't been introduced yet. Consider moving to after \cref{thm:main}.}{4}{4}
      - \criticize{Placement issue: This implementation detail appears in the theory section but belongs in \cref{sec:experiments}.}{3}{4}
      - \criticize{Used before explained: The concept of ``stochastic gradient'' is used here but not explained until \cref{sec:sgd}. Either explain earlier or add forward reference.}{4}{5}

      - \criticize{This assumes readers understand result from \cref{eq:main_result} in \cref{sec:main}, but that section doesn't derive it. Add brief summary.}{4}{4}
      - \criticize{Out of place: This lengthy derivation in main text belongs in \cref{app:proofs}. Consider moving to appendix and referencing here.}{4}{4}

      Add the comment command definition in the preamble if not already present:
      \usepackage{xcolor}
      \newcommand{\criticize}[3]{\ifmmode\textcolor{\ifnum#2=5 red\else\ifnum#2=4 orange\else\ifnum#2=3 yellow!80!red\else\ifnum#2=2 yellow!60!black\else gray\fi\fi\fi\fi!\ifnum#3<3 30\else\ifnum#3<5 70\else 100\fi\fi!black}{\textit{[#1 (S#2/C#3)]}}\else\textcolor{\ifnum#2=5 red\else\ifnum#2=4 orange\else\ifnum#2=3 yellow!80!red\else\ifnum#2=2 yellow!60!black\else gray\fi\fi\fi\fi!\ifnum#3<3 30\else\ifnum#3<5 70\else 100\fi\fi!black}{[#1 (S#2/C#3)]}\fi}

      <documents>
      {% for output in INPUT_FILES %}
      <document name="{{ output }}">
      % UPDATED_CONTENT_FOR_{{ output }}
      </document>
      {% endfor %}
      </documents>

    - |
      Now critically reflect on the structural issues identified and plan improvements. Separate easy fixes from major decisions.

      In the scratchpad below, categorize issues and plan targeted improvements:
      <scratchpad>
      <reflection>
      \begin{enumerate}
          \item [Changes to Implement Now]
              \begin{itemize}
                  \item Cohesion improvements: [Add connectives like ``however,'' ``therefore,'' ``in contrast'']
                  \item Transition improvements: [Add sentences/phrases between paragraphs]
                  \item Sentence reordering: [Within-paragraph and within-section rearrangements]
                  \item Topic sentence rewrites: [Weak or unclear topic sentences]
                  \item Clarifying additions: [Logical connectives, bridging phrases]
                  \item Balance adjustments: [Trim over-explained parts, expand under-explained parts]
                  \item Coherence fixes: [Split mixed paragraphs, consolidate scattered ideas]
                  \item Minor sentence moves: [To more logical locations in same section]
                  \item Redundancy consolidation: [Combine repetitive statements]
                  \item Remove unused content: [Delete paragraphs or short sections that are clearly disconnected]
              \end{itemize}
          \item [Major Decisions - Leave as Comments for Human]
              \begin{itemize}
                  \item Cross-section paragraph moves: [Moving paragraphs between sections]
                  \item Content deletion: [Entire paragraphs or substantial cuts]
                  \item Major reorganization: [Reordering sections, structural changes]

                  \item Cross-document content moves: [Moving content between documents]
                  \item Systemic changes: [Affecting many sections across documents]

                  \item Uncertain changes: [Where I'm not confident]
              \end{itemize}
          \item [Comment Quality Review]
              \begin{itemize}
                  \item Are structural comments actionable?
                  \item Are they focused on flow, logic, and structure - not notation or math correctness?
                  \item Have I identified the most critical structural issues?
                  \item Are comments placed at relevant locations?

                  \item Are cross-document issues clearly flagged?

              \end{itemize}
          \item [Implementation Plan]
              \begin{itemize}
                  \item Silent fixes: [Obvious typos at locations...]
                  \item Implemented with brief comment: [Transition added between para X and Y - comment: ``Fixed: Added transition...'']
                  \item Implemented with brief comment: [Sentences reordered in \cref{sec:X} - comment: ``Fixed: Reordered...'']
                  \item Comment only (not implemented): [Major issue - ``Issue: [...]. Suggested fix: [...]. Rationale: [...]]'']
                  \item Comment only (not implemented): [Uncertain change - ``Uncertain: [...]. Consider: [...]]'']
              \end{itemize}
      \end{enumerate}
      </reflection>
      </scratchpad>

      Based on your reflection, output an improved version where you have:
      - Implemented structural improvements within sections (transitions, reordering, topic sentences, clarifications)
      - Added \criticize{Fixed: [description]}{severity}{confidence} for all implemented changes except obvious typos
      - Kept all \criticize{Issue: [...]. Suggested fix: [...]}{severity}{confidence} for major issues left unimplemented
      - Improved paragraph flow and coherence actively (documented with comments)
      - Made the logical flow clearer through better organization within sections (documented with comments)

      Remember: If appendix derivations are questionable, add comments in the main text where those results are used, warning about the shaky foundation. Be proactive with improvements that don't cross section boundaries, delete substantial content, or require cross-document coordination; leave major reorganization and cross-document changes as issue comments for the human to decide.

      Did later documents receive less attention than earlier ones? Re-read the last document now. Ensure that the output documents are in the following order: {{ INPUT_FILES | default([], true) | join(', ') }}.

      <documents>
      {% for output in INPUT_FILES %}
      <document name="{{ output }}">
      % UPDATED_CONTENT_FOR_{{ output }}
      </document>
      {% endfor %}
      </documents>
