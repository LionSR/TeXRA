version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      - dependency-name: '@types/node'
      - dependency-name: '@types/vscode'
    # Aggregate routine updates into as few PRs as possible: one grouped PR for
    # all production minor/patch bumps, one for all dev minor/patch bumps. Major
    # bumps stay individual (reviewed one at a time).
    groups:
      # Effect shipped prerelease versions (4.0.0-rc.N) until 4.0.0, and a prerelease bump was
      # neither 'minor' nor 'patch', so the groups below never caught it, and
      # every release opened one PR per @effect package. The packages must move
      # in lockstep, so they get one group for every update type. Order alone
      # did not keep them there: the 4.0.1 release still put effect,
      # @effect/vitest (dev group) and the platform/sql packages (prod group)
      # in three PRs (#13907-#13909), so the type groups exclude them outright.
      effect:
        patterns:
          - 'effect'
          - '@effect/*'
      production-dependencies:
        dependency-type: 'production'
        exclude-patterns:
          - 'effect'
          - '@effect/*'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - 'effect'
          - '@effect/*'
        update-types:
          - 'minor'
          - 'patch'

  # Action versions drift by hand otherwise (checkout sat at v4, v6 and v7
  # across workflows at once). One grouped PR a week covers every bump,
  # majors included, for the workflows and the composite actions.
  - package-ecosystem: 'github-actions'
    # '/' covers .github/workflows; composite actions need their own entry.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'
