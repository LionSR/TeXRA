name: Require green CI
description: Fail unless the commit being released has a green CI run and a green Nightly run.

runs:
  using: composite
  steps:
    - name: Require green CI and Nightly runs on the commit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      # `ci.yml` runs the static checks and the compile; `nightly.yml` runs
      # every test suite and builds the package. A release needs both on the
      # exact commit, and neither runs the other's jobs. For each workflow
      # the newest run on the commit decides (a rerun updates its run), so a
      # red run followed by a green rerun passes and the reverse fails. A
      # commit whose run was cancelled or is still running, or that a
      # workflow never ran on, fails closed: the scheduled Nightly run only
      # covers the commit `main` was at that night, so dispatch the workflow
      # on the release ref first. The calling job needs `actions: read`.
      run: |
        status=0
        for workflow in ci.yml nightly.yml; do
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.event != "pull_request")] | sort_by(.created_at) | last | .conclusion // "none"')"
          if [ "$conclusion" != success ]; then
            echo "::error::The newest $workflow run on $GITHUB_SHA is '$conclusion', not 'success'. Wait for it, or dispatch it on this ref (gh workflow run $workflow --ref <ref>), then re-run this workflow."
            status=1
          fi
        done
        exit "$status"
