name: npm dist-tag
description: >-
  Check that the release tag names the manifest's version, and choose the npm
  dist-tag from that version and the GitHub pre-release flag, failing when the
  two disagree.

inputs:
  manifest:
    description: The package.json whose version the release publishes.
    required: true
  tag-prefix:
    description: What the release tag puts before the version (`cli-v`, `sdk-v`).
    required: true

outputs:
  npm_tag:
    description: '`latest` for X.Y.Z, `preview` for X.Y.Z-preview.N.'
    value: ${{ steps.channel.outputs.npm_tag }}

runs:
  using: composite
  steps:
    - name: Resolve npm dist-tag from tag, package version and pre-release flag
      id: channel
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
      run: |
        version=$(node -p "require('./$MANIFEST').version")
        if [ "$RELEASE_TAG" != "$TAG_PREFIX$version" ]; then
          echo "::error::Release tag '$RELEASE_TAG' does not match $MANIFEST version '$version' (expected '$TAG_PREFIX$version')"
          exit 1
        fi

        if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          npm_tag=latest
        elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[1-9][0-9]*$ ]]; then
          npm_tag=preview
        else
          echo "::error::Version '$version' is neither X.Y.Z nor X.Y.Z-preview.N; nothing publishes it."
          exit 1
        fi

        # The GitHub pre-release flag and the version form must agree, so a
        # preview can never be published under `latest` and a stable version
        # never under `preview`.
        if [ "$npm_tag" = preview ] && [ "$RELEASE_IS_PRERELEASE" != true ]; then
          echo "::error::'$RELEASE_TAG' is a preview version but the GitHub release is not marked pre-release. Recreate it with 'gh release create --prerelease'."
          exit 1
        fi
        if [ "$npm_tag" = latest ] && [ "$RELEASE_IS_PRERELEASE" = true ]; then
          echo "::error::'$RELEASE_TAG' is a stable version but the GitHub release is marked pre-release. Previews are '${TAG_PREFIX}X.Y.Z-preview.N'."
          exit 1
        fi
        echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
        echo "Channel: npm dist-tag $npm_tag ($version)"
