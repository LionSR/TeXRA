name: Report denied tool calls
description: >-
  Name each tool call the agent action denied, as a warning and in the step
  summary, from the execution log it leaves in the runner's temp directory.

runs:
  using: composite
  steps:
    # The agent action hides its transcript, so a denied tool call is only
    # a count in the log. Name each one so the allowlist can be fixed instead
    # of guessed at. The input stays hidden, as that action intends: secret
    # masking misses unregistered values, so a denial shows only its tool
    # and, for Bash, the program and its word-shaped subcommand (the prefix
    # an allowlist pattern like Bash(gh pr:*) matches; for `gh`, whose
    # groups take a subcommand of their own, one word more, as
    # Bash(gh pr checks:*) needs), never its arguments.
    - name: Report denied tool calls
      shell: bash
      env:
        EXECUTION_FILE: ${{ runner.temp }}/claude-execution-output.json
      run: |
        set -euo pipefail
        if [ ! -f "$EXECUTION_FILE" ]; then
          echo "::warning title=No execution log::$EXECUTION_FILE is missing; denied tool calls cannot be reported."
          exit 0
        fi
        # A result without the list is not "no denials": say so.
        if ! jq -e '[.[]? | select(.type == "result")] | last | .permission_denials | type == "array"' "$EXECUTION_FILE" >/dev/null; then
          echo "::warning title=No denial list::the execution log's result carries no permission_denials array; denied tool calls cannot be reported."
          exit 0
        fi
        denials=$(jq -c '[.[]? | select(.type == "result")] | last | .permission_denials[]' "$EXECUTION_FILE")
        if [ -z "$denials" ]; then
          echo "No denied tool calls."
          exit 0
        fi
        {
          echo "### Denied tool calls"
          echo
        } >> "$GITHUB_STEP_SUMMARY"
        while IFS= read -r denial; do
          name=$(jq -r '.tool_name | tostring' <<<"$denial" | tr -cd 'A-Za-z0-9_.-')
          if [ "$name" = "Bash" ]; then
            # Program name, then the next word only when it is a bare
            # lowercase word (a subcommand), never a path, URL or value;
            # under a `gh` command group (pr, issue, repo, ...) the
            # subcommand is the word after. `gh api` takes an endpoint
            # there (`graphql` aside) and `gh browse` an argument: a word
            # the group list leaves out is never shown.
            name=$(jq -r '.tool_input.command // "" | tostring' <<<"$denial" | head -n1 |
              awk '{ p = $1; sub(/.*\//, "", p); gsub(/[^A-Za-z0-9_.-]/, "", p)
                     s = ($2 ~ /^[a-z][a-z-]*$/) ? " " $2 : ""
                     if (p == "gh" && s != "" && $3 ~ /^[a-z][a-z-]*$/ && ($2 ~ /^(pr|issue|repo|run|workflow|release|search|label|gist|project)$/ || ($2 == "api" && $3 == "graphql"))) s = s " " $3
                     printf "Bash(%s%s)", p, s }')
          fi
          echo "::warning title=Denied tool call::$name"
          echo "- \`$name\`" >> "$GITHUB_STEP_SUMMARY"
        done <<<"$denials"
