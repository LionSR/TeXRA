name: Sync remote agents

on:
  push:
    branches:
      - main
    paths:
      - 'docs/supabase/remote-agents.config.json'
      - 'prompts/agents/remote/**'
      - 'scripts/sync-remote-agents.mjs'
      - '.github/workflows/remote-agents-sync.yml'
  workflow_dispatch:

concurrency:
  group: remote-agents-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply-sql:
    name: apply remote-agents SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.106.0

      - name: Generate and apply remote-agents SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_ACCESS_TOKEN is not set. Add a Supabase access token as a repository secret.'
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo 'SUPABASE_PROJECT_REF is not set. Add the production project ref as a repository variable.'
            exit 1
          fi
          npm run sync:remote-agents -- --apply
