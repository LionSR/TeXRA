name: Desktop Package

on:
  workflow_dispatch:
    inputs:
      run_desktop_installers:
        description: 'Build the macOS, Linux and Windows desktop installers'
        required: false
        default: false
        type: boolean
      require_desktop_signing:
        description: 'Fail desktop installer jobs unless signing secrets are complete'
        required: false
        default: false
        type: boolean
      publish_desktop_release_artifacts:
        description: 'Publish generated desktop installers to the public release repository'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag the installers belong to (vX.Y.Z, or vX.Y.Z-preview.N for a preview); required to publish. Must match packages/desktop/package.json on the dispatched ref.'
        required: false
        default: ''
        type: string

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publishing refuses a red commit before any installer is built, not after.
  # The installers skip when it fails, and publish requires them all.
  require-green-ci:
    name: require green CI
    if: inputs.publish_desktop_release_artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require green CI on the dispatched commit
        uses: ./.github/actions/require-green-ci

  # One row per platform. A job-level `if` cannot read `matrix`, so the rows
  # share one input.
  desktop-installer:
    name: desktop installer (${{ matrix.platform }})
    needs: require-green-ci
    if: ${{ !failure() && !cancelled() && inputs.run_desktop_installers }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            timeout: 90
            signing: mac
            app: packages/desktop/dist-packaged/mac-universal/TeXRA.app/Contents/MacOS/TeXRA
            installers: |
              packages/desktop/dist-packaged/*.dmg
              packages/desktop/dist-packaged/*.zip
          - platform: Linux
            runner: ubuntu-latest
            timeout: 45
            # Linux runners have no display.
            smoke-wrapper: xvfb-run --auto-servernum
            app: packages/desktop/dist-packaged/linux-unpacked/texra
            installers: |
              packages/desktop/dist-packaged/*.AppImage
              packages/desktop/dist-packaged/*.deb
          - platform: Windows
            runner: windows-latest
            timeout: 30
            signing: win
            app: packages/desktop/dist-packaged/win-unpacked/TeXRA.exe
            installers: |
              packages/desktop/dist-packaged/*.exe
    # Each platform's signing credentials reach only that platform's row.
    env:
      CSC_LINK: ${{ matrix.signing == 'mac' && secrets.DESKTOP_MACOS_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.signing == 'mac' && secrets.DESKTOP_MACOS_CSC_KEY_PASSWORD || '' }}
      APPLE_API_KEY_ID: ${{ matrix.signing == 'mac' && secrets.DESKTOP_MACOS_APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ matrix.signing == 'mac' && secrets.DESKTOP_MACOS_APPLE_API_ISSUER || '' }}
      TEXRA_WINDOWS_AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ matrix.signing == 'win' && secrets.DESKTOP_WINDOWS_AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || '' }}
      TEXRA_WINDOWS_AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.signing == 'win' && secrets.DESKTOP_WINDOWS_AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
      TEXRA_WINDOWS_AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ matrix.signing == 'win' && secrets.DESKTOP_WINDOWS_AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || '' }}
      TEXRA_WINDOWS_AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ matrix.signing == 'win' && secrets.DESKTOP_WINDOWS_AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || '' }}
      AZURE_TENANT_ID: ${{ matrix.signing == 'win' && secrets.DESKTOP_WINDOWS_AZURE_TENANT_ID || '' }}
      AZURE_CLIENT_ID: ${{ matrix.signing == 'win' && secrets.DESKTOP_WINDOWS_AZURE_CLIENT_ID || '' }}
      AZURE_CLIENT_SECRET: ${{ matrix.signing == 'win' && secrets.DESKTOP_WINDOWS_AZURE_CLIENT_SECRET || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Linux desktop smoke dependencies
        if: matrix.platform == 'Linux'
        run: pnpm --filter @texra/desktop exec playwright install-deps chromium

      - name: Check desktop Electron binary
        run: node scripts/verify-desktop.mjs electron-binary

      - name: Build desktop app
        run: pnpm run desktop:build

      - name: Check desktop build artifacts
        run: node scripts/verify-desktop.mjs build-artifacts

      - name: Prepare macOS notarization API key
        if: matrix.platform == 'macOS'
        env:
          DESKTOP_MACOS_APPLE_API_KEY: ${{ secrets.DESKTOP_MACOS_APPLE_API_KEY }}
          DESKTOP_MACOS_APPLE_API_KEY_ID: ${{ secrets.DESKTOP_MACOS_APPLE_API_KEY_ID }}
        run: |
          if [ -n "$DESKTOP_MACOS_APPLE_API_KEY" ]; then
            key_id="${DESKTOP_MACOS_APPLE_API_KEY_ID:-texra}"
            key_path="$RUNNER_TEMP/AuthKey_${key_id}.p8"
            printf '%s' "$DESKTOP_MACOS_APPLE_API_KEY" > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Verify signing secrets
        id: desktop-signing
        if: matrix.signing
        env:
          TEXRA_REQUIRE_DESKTOP_SIGNING: ${{ inputs.require_desktop_signing && '1' || '0' }}
        run: node scripts/verify-desktop.mjs signing-env ${{ matrix.signing }}

      # An unsigned build (Linux, or a platform whose signing secrets are
      # incomplete) uses the plain config and drops the macOS credentials,
      # which electron-builder would otherwise try to sign with.
      - name: Package desktop installers
        shell: bash
        env:
          ELECTRON_BUILDER_CONFIG: ${{ steps.desktop-signing.outputs.electron_builder_config || 'electron-builder.yml' }}
          SIGNED: ${{ steps.desktop-signing.outputs.signed }}
        run: |
          if [ "$SIGNED" != true ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          pnpm --filter @texra/desktop exec electron-builder --config "$ELECTRON_BUILDER_CONFIG" --publish never

      - name: Notarize macOS DMG
        if: matrix.platform == 'macOS' && steps.desktop-signing.outputs.signed == 'true'
        run: |
          for dmg in packages/desktop/dist-packaged/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Smoke-test the packaged desktop app
        run: ${{ matrix.smoke-wrapper }} node scripts/verify-desktop.mjs smoke-package --app ${{ matrix.app }}

      - name: Check packaged desktop app contents
        run: node scripts/verify-desktop.mjs package

      - name: Check desktop installer artifacts
        run: node scripts/verify-desktop.mjs installers

      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-installers-${{ matrix.platform }}
          path: ${{ matrix.installers }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop build artifact
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-dist-Windows
          path: packages/desktop/dist/
          if-no-files-found: error
          retention-days: 14

  publish-desktop-release-artifacts:
    name: publish desktop release artifacts
    if: always() && inputs.publish_desktop_release_artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: desktop-installer
    permissions:
      contents: read
    env:
      DESKTOP_RELEASE_REPO: texra-ai/texra-desktop-releases
      GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}

    steps:
      - name: Require desktop artifacts
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) result: \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then echo "$failed"; exit 1; fi

      - name: Checkout repository
        uses: actions/checkout@v7

      # The installers publish on the channel of the TeXRA release they
      # belong to, so that release's pre-release flag is the one checked.
      - name: Read the release's pre-release flag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo '::error::release_tag is required to publish: the vX.Y.Z or vX.Y.Z-preview.N release these installers belong to.'
            exit 1
          fi
          prerelease="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Resolve release channel
        id: channel
        uses: ./.github/actions/release-channel
        with:
          manifest: packages/desktop/package.json
          tag-prefix: v
          tag: ${{ inputs.release_tag }}
          prerelease: ${{ steps.release.outputs.prerelease }}

      - name: Download desktop installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: texra-desktop-installers-*
          path: artifacts/desktop-release
          merge-multiple: true

      - name: Verify downloaded desktop release artifacts
        env:
          TEXRA_DESKTOP_INSTALLER_PLATFORM: all
          TEXRA_DESKTOP_INSTALLER_ROOT: artifacts/desktop-release
        run: node scripts/verify-desktop.mjs installers

      - name: Publish desktop artifacts to public release repository
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ steps.channel.outputs.channel == 'preview' }}
        # Installers land in the public releases repo under the same tag the
        # extension/CLI shipped with. A preview (`vX.Y.Z-preview.N`) is
        # created there as a pre-release, and an existing release under that
        # tag must already be a pre-release, so a preview installer can never
        # be attached to a stable release, nor a stable installer to a
        # preview. A missing token fails the job instead of publishing.
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::error::publish_desktop_release_artifacts was requested but DESKTOP_RELEASES_TOKEN is not configured.'
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          actual_repo="$(gh repo view "$DESKTOP_RELEASE_REPO" --json nameWithOwner --jq .nameWithOwner)"
          visibility="$(gh repo view "$DESKTOP_RELEASE_REPO" --json visibility --jq .visibility)"

          if [ "$actual_repo" != "$DESKTOP_RELEASE_REPO" ]; then
            echo "Desktop release repo target mismatch: expected $DESKTOP_RELEASE_REPO, got $actual_repo"
            exit 1
          fi

          if [ "$visibility" != 'PUBLIC' ]; then
            echo "Desktop release repo must be public for token-free clients; got visibility $visibility"
            exit 1
          fi

          notes_file="$(mktemp)"
          printf 'TeXRA desktop %s installers.\n\nSource run: %s/%s/actions/runs/%s\nSource commit: %s\n' \
            "$version" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            > "$notes_file"

          shopt -s nullglob
          assets=(artifacts/desktop-release/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No downloaded desktop release assets found.'
            exit 1
          fi

          if existing="$(gh release view "$RELEASE_TAG" --repo "$DESKTOP_RELEASE_REPO" --json isPrerelease --jq .isPrerelease 2>/dev/null)"; then
            if [ "$existing" != "$PRERELEASE" ]; then
              echo "::error::Release '$RELEASE_TAG' in $DESKTOP_RELEASE_REPO has isPrerelease=$existing but version '$version' requires isPrerelease=$PRERELEASE; refusing to attach installers to the wrong channel."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$DESKTOP_RELEASE_REPO" --clobber
          else
            prerelease_flag=''
            if [ "$PRERELEASE" = true ]; then
              prerelease_flag=--prerelease
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$DESKTOP_RELEASE_REPO" \
              --title "TeXRA Desktop ${version}" \
              --notes-file "$notes_file" \
              ${prerelease_flag:+"$prerelease_flag"}
          fi
