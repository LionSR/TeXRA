name: Issue Arborist

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

concurrency:
  group: issue-arborist
  cancel-in-progress: false

jobs:
  cluster:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-4-7
            --allowedTools "mcp__github__*"

          prompt: |
            You are the Issue Arborist for ${{ github.repository }}. Cluster open
            orphan issues into native sub-issue trees so the backlog stays coherent.

            ## Process

            1. List up to 100 open issues without a parent. Exclude issues labeled
               `tracking` or with titles starting `Tracking:` / `[Parent]` / `Epic:`.
            2. Find clusters of **5 or more** orphans sharing a clear theme — a
               common `area:*` label is the strongest signal; root-cause overlap or
               feature decomposition also count.
            3. Skip clusters whose theme already has an open `Tracking:` issue.
            4. For each surviving cluster:
               - Create the parent via `mcp__github__issue_write` (method=create):
                 - Title: `Tracking: <theme>`
                 - Labels: `tracking` + the cluster's `area:*` labels
                 - Body: one-paragraph theme + checklist of `- [ ] #N — title` rows
                 - **Capture both `number` and integer `id` from the response.**
               - Link each child as a native sub-issue with
                 `mcp__github__sub_issue_write` (method=`add`,
                 `issue_number=<parent-number>`, `sub_issue_id=<child-integer-id>`).

            ## Caps

            - Max 5 new parents per run
            - Max 50 sub-issue links per run
            - Precision over recall: only link if the relationship is unambiguous

            If no clusters meet the bar, exit with a one-line summary.
