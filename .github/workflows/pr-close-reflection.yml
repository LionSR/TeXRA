name: PR Close Reflection

on:
  pull_request:
    types: [closed]

concurrency:
  group: pr-close-reflection-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reflect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude close reflection
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'dependabot[bot],github-actions[bot],Copilot,chatgpt-codex-connector,claude[bot],cursor[bot]'
          claude_args: |
            --model claude-opus-4-7
            --allowedTools "mcp__github__*" "Bash(git diff:*)" "Bash(git show:*)" "Bash(git log:*)"
          prompt: |
            A pull request has just closed. Look at it as a maintainer who wants
            the whole project to remain coherent for a fresh user.

            Use the GitHub MCP tools for GitHub operations. Read the PR body,
            comments, review discussion, linked issues, and changed files. If the
            PR was merged, inspect the final diff with:

                git diff ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

            Repository: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            Title: ${{ github.event.pull_request.title }}
            State: ${{ github.event.pull_request.state }}
            Merged: ${{ github.event.pull_request.merged }}
            Closed by: ${{ github.event.sender.login }}
            Base branch: ${{ github.event.pull_request.base.ref }}
            Head branch: ${{ github.event.pull_request.head.ref }}

            Post exactly one comment on the PR with a short "Close reflection".
            The comment should help a human maintainer decide what, if anything,
            should happen next.

            Focus on:
            - Direct next steps implied by this PR.
            - Global next steps for the project, if this change affects a wider
              design, workflow, user expectation, or documentation path.
            - Anything that could be confusing from a fresh user's perspective.
            - Missing documentation, migration notes, tests, release notes, or
              follow-up validation.

            Be conservative. Do not invent work. If no next step is needed, say
            so plainly. If the PR was closed without merge, distinguish clearly
            between abandoned work and work that should still be recovered.

            Do not create issues. The existing issue tracker workflow is
            responsible for filing follow-up issues when that is warranted.
            This workflow should only leave the reflection comment.
