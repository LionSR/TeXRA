name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_windows_desktop:
        description: 'Build Windows desktop artifacts'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check desktop Electron binary
        run: pnpm run check:desktop-electron-binary

      - name: Type check
        run: pnpm run typecheck

      - name: Type check workspace packages
        run: pnpm run workspace:typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check extension package invariants
        run: pnpm run check:extension-package-invariants

      - name: Kernel tests
        run: pnpm run test:kernel

      - name: Compile
        run: pnpm run compile

      - name: Build initial extension and desktop artifacts
        run: pnpm run build:initial

      - name: Package macOS desktop app
        if: runner.os == 'macOS'
        run: pnpm --filter @texra/desktop package:dir

      - name: Check packaged desktop app
        if: runner.os == 'macOS'
        run: pnpm run check:desktop-package

      - name: Smoke packaged desktop app
        if: runner.os == 'macOS'
        run: pnpm run desktop:package:smoke

      - name: Smoke extension webviews in Electron
        if: runner.os == 'macOS'
        run: pnpm run smoke:webviews:run

      - name: Upload webview smoke screenshots
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v7
        with:
          name: texra-webview-smoke-screenshots
          path: artifacts/webview-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload extension VSIX artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: texra-extension-vsix
          path: releases/*.vsix
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-dist-${{ runner.os }}
          path: packages/desktop/dist/
          if-no-files-found: error
          retention-days: 14

  desktop-windows-artifact:
    name: desktop artifact (Windows)
    if: github.event_name == 'push' || inputs.run_windows_desktop
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check desktop Electron binary
        run: pnpm run check:desktop-electron-binary

      - name: Build desktop artifacts
        run: pnpm run desktop:build

      - name: Check desktop build artifacts
        run: pnpm run check:desktop-build-artifacts

      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-dist-Windows
          path: packages/desktop/dist/
          if-no-files-found: error
          retention-days: 14

  validate-status:
    name: validate
    runs-on: ubuntu-latest
    needs:
      - validate
      - desktop-windows-artifact
    if: always()

    steps:
      - name: Require validation jobs success
        run: |
          if [ '${{ needs.validate.result }}' != 'success' ]; then
            echo 'Validation matrix result: ${{ needs.validate.result }}'
            exit 1
          fi
          if [ '${{ needs.desktop-windows-artifact.result }}' != 'success' ] && [ '${{ needs.desktop-windows-artifact.result }}' != 'skipped' ]; then
            echo 'Windows desktop artifact result: ${{ needs.desktop-windows-artifact.result }}'
            exit 1
          fi
