name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Type check workspace packages
        run: pnpm run workspace:typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check extension package invariants
        run: pnpm run check:extension-package-invariants

      - name: Kernel tests
        run: pnpm run test:kernel

      - name: Compile
        run: pnpm run compile

      - name: Build initial extension and desktop artifacts
        run: pnpm run build:initial

      - name: Upload extension VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: texra-extension-vsix
          path: releases/*.vsix
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-dist-${{ runner.os }}
          path: packages/desktop/dist/
          if-no-files-found: error
          retention-days: 14
