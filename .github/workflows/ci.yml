name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # Nightly `schedule` runs use github.ref == refs/heads/main, the same ref a
  # push to main uses. Without the event_name suffix, cancel-in-progress would
  # let a same-ref push cancel the nightly runtime-validation timing run (or
  # vice versa) — see #7756.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Validation is split into parallel jobs (static groups / test shards / build) so PR
# wall-time is bounded by the slowest job, not the sum of a serial chain. Each
# job repeats the cheap cached setup (~30s) to buy that parallelism.
#
# The nightly `schedule` run carries the two jobs nothing else covers: the
# runtime-validation timing run and the Windows kernel shards, which no PR or
# push runs (see the `test` matrix). Every push to main already validates Linux,
# so the remaining heavy jobs stay gated off `schedule` rather than
# re-validating an unchanged tree nightly (the macOS jobs bill at 10x Linux
# rates).
jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      desktop: ${{ steps.detect.outputs.desktop }}
      vscode: ${{ steps.detect.outputs.vscode }}
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A pull_request checks out its merge commit; depth 2 brings its
          # base parent, all the diff below needs (full history cost ~15 s
          # on the path every job waits behind).
          fetch-depth: 2

      - name: Detect non-docs changes
        id: detect
        run: |
          # Heavy validation (typecheck/lint/tests/build) only runs when a PR touches
          # something other than docs. Docs-only PRs fall through to the
          # lightweight docs-build job below, keeping CI spend down. Pushes to
          # main and manual dispatches always run full validation, and so
          # does a PR whose checkout is not its merge commit (a conflicted
          # PR's checkout falls back to the head, where HEAD^1 is not the
          # base).
          if [ "${{ github.event_name }}" != "pull_request" ] || ! git rev-parse -q --verify HEAD^2 >/dev/null; then
            echo "Event '${{ github.event_name }}' -> full validation."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "vscode=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD^1 is the base tip the merge commit was built on, so this is
          # the PR's own change. --no-renames lists a rename's source and
          # destination as separate paths, so a rename out of code into
          # docs/ still counts as code.
          files="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          echo "Changed files in this PR:"
          printf '%s\n' "$files"
          # Here-strings, not `printf | grep -q`: an early grep exit would
          # SIGPIPE the writer and pipefail would misread that as no match.
          # Code = any path outside docs/ and *.md.
          if grep -qvE '^docs/|\.md$' <<<"$files"; then
            echo "Non-docs changes detected -> full validation."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change -> lightweight docs build only."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # The session layer and CLI service a host's windows drive.
          session_layer='^packages/texra/src/controllers/(server|session)/|^packages/harness/src/controllers/session/|^packages/cli/src/(runtime/cliService|commands/service)\.ts$'
          # Desktop host = the Electron app, the session layer, and this
          # workflow. Everything else the app bundles is covered by the kernel
          # tests, and every push to main still runs the desktop suite.
          if grep -qE "^packages/desktop/|$session_layer|^\.github/workflows/ci\.yml\$" <<<"$files"; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi
          # VS Code host = the extension, the service and the session layer
          # a window drives it through, the scripts that run it, and this
          # workflow: a PR touching any of them runs the real VS Code.
          if grep -qE "^packages/extension/|$session_layer|^scripts/vscode-host-e2e|^\.github/workflows/ci\.yml\$" <<<"$files"; then
            echo "vscode=true" >> "$GITHUB_OUTPUT"
          else
            echo "vscode=false" >> "$GITHUB_OUTPUT"
          fi
          # Published packages = the two npm packages, what their bundles
          # inline (the code sandbox worker, and the OpenAI SDK the llm build
          # bundles), and every file that decides which versions a consumer's
          # install resolves: a PR touching any of them installs the packed
          # tarballs the way a consumer would.
          if grep -qE '^packages/(harness|llm)/|^scripts/code-sandbox-worker\.mjs$|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig(\.build)?\.json)$|^\.github/workflows/ci\.yml$' <<<"$files"; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi

  # The static gate is `npm run gate` (package.json): lint and the
  # invariants, the docs checks, then typecheck + formatting. CI runs the
  # three groups as parallel jobs (the docs group ungated, see
  # `guidance-refs`), and a local `npm run gate` reproduces exactly what
  # these jobs enforce.
  invariants:
    name: invariants (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: '2.8.3'
          cache: true

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # Lint and the cheap invariant scripts (`npm run gate:invariants`).
      - name: Lint and check invariants
        env:
          TEXRA_RATCHET_BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          # Checkout is shallow. The checks that read TEXRA_RATCHET_BASE (fact
          # spread and the row-kind list) judge this
          # tree against its merge base with the target: fetch the target tip
          # if it is missing, then deepen the target and HEAD until git finds
          # the merge base. The checks fail loudly if it still cannot.
          if ! git rev-parse --verify "$TEXRA_RATCHET_BASE^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/${TEXRA_RATCHET_BASE#origin/}:refs/remotes/$TEXRA_RATCHET_BASE"
          fi
          for depth in 50 500 5000; do
            git merge-base "$TEXRA_RATCHET_BASE" HEAD >/dev/null 2>&1 && break
            git fetch --no-tags --deepen="$depth" origin \
              "+refs/heads/${TEXRA_RATCHET_BASE#origin/}:refs/remotes/$TEXRA_RATCHET_BASE" \
              "$(git rev-parse HEAD)"
          done
          pnpm run gate:invariants

      # Every function that owns a deno.json is validated, so a new edge
      # function cannot ship untested by being omitted from this list. Needs
      # Deno, so it is CI-only and not part of the local gate.
      - name: Validate edge functions
        run: |
          shopt -s nullglob
          for dir in supabase/functions/*/; do
            [ -f "${dir}deno.json" ] || continue
            echo "::group::${dir}"
            (
              cd "${dir}"
              tests=(*_test.ts)
              deno check index.ts "${tests[@]}"
              deno lint
              if [ ${#tests[@]} -gt 0 ]; then
                deno test --allow-env
              fi
            )
            echo "::endgroup::"
          done

  typecheck:
    name: typecheck + format (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # React Compiler smoke, formatting, then every tsconfig. Formatting
      # remains a CI gate instead of an auto-committing workflow: the
      # pre-commit hook formats staged files locally, avoiding a bot push and
      # its token, retrigger, cancellation, and branch-race complexity.
      - name: Check types and formatting
        run: pnpm run gate:typecheck

  guidance-refs:
    name: guidance references
    # Deliberately ungated: this is the one check that must run on BOTH sides
    # of the docs/code split. A guidance-only PR (code=false) skips the static jobs,
    # and that is exactly the PR most likely to introduce a stale path; a
    # code-only PR can break the prose by renaming what it cites. Every
    # script here imports only Node built-ins, so this job installs nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # setup-node@v5 caches the package manager named by package.json's
      # `packageManager` (pnpm) by default and fails when pnpm is absent;
      # this job installs nothing, so opt out.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      # `gate:docs`: guidance paths resolve; no note in `.agents/docs/proposed/`
      # declares itself shipped (an agent would read it as a live
      # direction); every docs-root file is classified (an unclassified one
      # can freeze the texra.ai deploy, and `docs:build`, which also checks
      # it, is gated off on code-only PRs and pushes to main).
      - name: Check guidance, proposals and the docs root
        run: npm run gate:docs

  test:
    # Keep the pre-existing `linux` / `windows` labels rather than the raw
    # runner image: these strings are the historical check names.
    name: kernel tests (${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}, shard ${{ matrix.shard }}/2)
    needs: changes
    # Unlike the other heavy jobs this one also runs on the nightly schedule,
    # where it is the Windows shards and nothing else — the tree may be
    # unchanged, but the drift this catches is in the suites themselves.
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Run every shard on every OS to completion so a red run reports every
      # failure at once instead of hiding the other shard's results.
      fail-fast: false
      matrix:
        # Windows stays off PR and push validation: it re-ran assertions the
        # Linux shards already cover — Windows-specific behaviour is exercised
        # by suites that stub the platform (`platform: 'win32'`), and 17
        # assertions actively skip themselves when the runner really is
        # Windows — while costing ~16 min per shard against ~10 on Linux and
        # setting the wall-clock for the entire workflow. The inventory of
        # genuine Windows defects the matrix did surface is in
        # 2026-07-29-open-source-readiness.md §4.6.
        #
        # What it does run on is the nightly schedule, alone (#12943). A suite
        # that hard-codes a `/` in a native absolute path, or mocks POSIX-only
        # filesystem behaviour, passes everywhere else and is invisible until
        # someone remembers to dispatch this workflow: #12939 repaired five
        # such suites that had been red for a week. A nightly run bounds that
        # window to a day and costs nothing on a PR. A manual dispatch still
        # runs both platforms, for re-checking Windows before a release or
        # right after touching path handling.
        os: ${{ fromJson(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest"]' || github.event_name == 'schedule' && '["windows-latest"]' || '["ubuntu-latest"]') }}
        shard: [1, 2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # Vitest starts the files that took longest last run first; without
      # its results it falls back to the largest files, and the crash-point
      # suites (a few lines each, the slowest by far) would start last and
      # set the shard's wall-clock. Each run saves its own results; a run
      # restores the newest a shard saved, a PR's from its base branch.
      - name: Restore test durations
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-${{ runner.os }}-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: vitest-results-${{ runner.os }}-shard${{ matrix.shard }}-

      # --maxWorkers=2 saturates the 2-vCPU hosted runner (see #8039); the
      # shards exist because a single runner can't go wider than that.
      # The projects that share a module registry run in a new file order
      # each time, so a suite that leaks process-wide state into the next
      # fails here; the log's "Running tests with seed" line replays the
      # order with --sequence.seed. Vitest picks one order for a whole run,
      # so the other two projects keep the duration order in their own step.
      - name: Kernel tests, shuffled
        run: pnpm run test --project pure --project kernel --sequence.shuffle.files --maxWorkers=2 --shard=${{ matrix.shard }}/2

      - name: Isolated and crash tests
        if: ${{ !cancelled() }}
        run: pnpm run test --project isolated --project crash --maxWorkers=2 --shard=${{ matrix.shard }}/2

  build:
    name: build artifacts (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Validate CLI TUI smoke frames
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @texra-ai/cli validate:tui -- \
            --snapshot-dir "$GITHUB_WORKSPACE/artifacts/tui-frames" --smoke

      - name: Upload CLI TUI smoke frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: texra-cli-tui-smoke-frames
          path: artifacts/tui-frames
          if-no-files-found: warn
          retention-days: 14

      # No separate dev-mode `pnpm run compile` step: build:fast starts with
      # clean:dist and rebuilds esbuild + Vite output in production mode, so a
      # preceding dev compile is discarded work.
      # Desktop app packaging is intentionally not part of PR CI. Keep this
      # check scoped to the VS Code extension package.
      - name: Build extension VSIX package
        run: pnpm --filter texra build:fast

      - name: Check extension VSIX contents
        run: node scripts/verify-vsix-contents.mjs

      - name: Upload extension VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: texra-extension-vsix
          path: releases/*.vsix
          if-no-files-found: error
          retention-days: 14

  vscode-host-e2e:
    name: vscode host e2e (stable)
    needs: changes
    # It loads the built extension in the latest stable VS Code and checks
    # activation, command registration, the webview panels and the window's
    # service (scripts/vscode-host-e2e-suite.cjs). The engines.vscode minimum
    # is a by-hand check before a release (`--vscode minimum`): in CI it only
    # ever failed alongside stable. It runs on a macOS runner, so a pull request runs it only when it touches
    # the VS Code host (`changes.vscode`), and `validate` requires it: off
    # pull requests it went red on main for days unseen.
    if: needs.changes.outputs.vscode == 'true' && github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build extension
        run: pnpm run compile:fast

      - name: Run VS Code host e2e
        run: pnpm run test:vscode -- --vscode stable

      - name: Upload VS Code host e2e screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-host-e2e-stable
          path: artifacts/vscode-e2e/
          if-no-files-found: ignore
          retention-days: 7

  desktop-e2e:
    name: desktop e2e (macOS)
    needs: changes
    # The Playwright suite that launches the built Electron app: quit, the
    # project seed, workbench tabs, Monaco, the pty. Nothing else exercises
    # the app end to end, and it broke twice unnoticed before it ran here.
    # macOS because its window-lifecycle specs are macOS behaviour and the
    # runner needs no virtual display. macOS bills at 10x Linux rates, so a
    # pull request runs it only when it touches the desktop host
    # (`changes.desktop`); every push to main runs it.
    if: needs.changes.outputs.desktop == 'true' && github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # The build the installers ship; type checking is the static-checks job's.
      - name: Build desktop app
        run: pnpm run desktop:build

      # `electron` is not in pnpm's allowBuilds, so install skips its
      # postinstall and the binary downloads the first time a test resolves
      # `require('electron')`, inside the first spec's 60 s budget. Download
      # it here, in its own timed step, so no test pays for it.
      - name: Download the Electron binary
        run: pnpm --filter @texra/desktop exec node -e "require('electron')"

      - name: Run desktop e2e suite
        env:
          TEXRA_NO_UPDATE_CHECK: '1'
        run: |
          pnpm --filter @texra/desktop test:e2e tests/e2e/agentCatalog.spec.ts --reporter=list || true
          pnpm --filter @texra/desktop test:e2e tests/e2e/agentCatalog.spec.ts -g "browses agents" --repeat-each=2 --reporter=list

      - name: Upload desktop e2e results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-e2e-results
          path: packages/desktop/tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Packs @texra-ai/llm and @texra-ai/harness, installs both tarballs into
  # a temporary directory outside the repository with plain npm (no workspace
  # links, no lockfile), type-checks packages/harness/example against them,
  # and runs it. The workspace's lockfile cannot see what a consumer's fresh
  # install resolves, so this is the check that a broken tarball, an
  # undeclared dependency, or an incoherent Effect set fails before npm does.
  # It runs nightly too: a new upstream patch changes a consumer's install
  # with no commit here.
  packed-example:
    name: packed example (linux)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Install the packed tarballs and run the example
        run: pnpm --filter @texra-ai/harness run example:packed

  runtime-validation:
    name: runtime validation (linux)
    # Runs on the nightly schedule (whose whole purpose is this timing run)
    # and manual dispatch; never on PRs or pushes, where it never failed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: '22.22.2'

      - name: Validate CLI real-runtime run path
        run: |
          set +e
          start_time="$(date +%s)"
          pnpm --filter @texra-ai/cli validate:run
          status="$?"
          end_time="$(date +%s)"
          duration="$((end_time - start_time))"
          {
            echo '### CLI real-runtime validation'
            echo
            echo "- Command: \`pnpm --filter @texra-ai/cli validate:run\`"
            echo "- Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  docs-check:
    name: docs build
    needs: changes
    # Runs only for docs-only PRs (where the heavy validation jobs are
    # skipped). Formatting still uses the root workspace's pinned oxfmt;
    # VitePress then builds from its self-contained npm sub-project.
    if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          ignore-scripts: 'true'

      - name: Check formatting
        run: pnpm run format:check

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci --legacy-peer-deps

      - name: Build docs site
        working-directory: docs
        run: npm run docs:build

  validate-status:
    name: validate
    runs-on: ubuntu-latest
    needs:
      - changes
      - invariants
      - typecheck
      - guidance-refs
      - test
      - build
      - desktop-e2e
      - vscode-host-e2e
      - runtime-validation
      - packed-example
      - docs-check
    if: always()

    steps:
      - name: Require validation jobs success
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          EVENT: ${{ github.event_name }}
        # `needs` above is the one list of jobs. Every job that ran must have
        # succeeded; a skip passes unless the event requires the job:
        # - always: change detection (if it fails, everything skips) and the
        #   ungated docs checks;
        # - a code change: the Linux jobs, of which the nightly schedule runs
        #   only the kernel shards (with runtime validation and Windows);
        # - a docs-only PR: the docs build, which gates in their place.
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) result: \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then echo "$failed"; exit 1; fi
          required='changes guidance-refs'
          if [ "$CODE" = true ]; then
            if [ "$EVENT" = schedule ]; then required="$required test"
            else required="$required test invariants typecheck build"; fi
          elif [ "$EVENT" = pull_request ]; then
            required="$required docs-check"
          fi
          missing="$(jq -r --arg required "$required" '. as $needs | $required | split(" ")[] | select($needs[.].result != "success") | "\(.) did not run: \($needs[.].result)"' <<<"$NEEDS")"
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
