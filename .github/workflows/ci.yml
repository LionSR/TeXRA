name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_desktop_installers:
        description: 'Build macOS and Linux desktop installers'
        required: false
        default: false
        type: boolean
      run_windows_desktop:
        description: 'Build Windows desktop installer'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check desktop Electron binary
        run: pnpm run check:desktop-electron-binary

      - name: Type check
        run: pnpm run typecheck

      - name: Type check workspace packages
        run: pnpm run workspace:typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check extension package invariants
        run: pnpm run check:extension-package-invariants

      - name: Kernel tests
        run: pnpm run test:kernel

      - name: Compile
        run: pnpm run compile

      - name: Build initial extension and desktop artifacts
        run: pnpm run build:initial

      - name: Package desktop app
        if: runner.os == 'macOS'
        run: pnpm run desktop:package:local

      - name: Check desktop package
        if: runner.os == 'macOS'
        run: pnpm run check:desktop-package

      - name: Smoke packaged desktop launch
        if: runner.os == 'macOS'
        run: pnpm run desktop:package:smoke

      - name: Smoke extension webviews in Electron
        if: runner.os == 'macOS'
        run: pnpm run smoke:webviews:run

      - name: Upload webview smoke screenshots
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v7
        with:
          name: texra-webview-smoke-screenshots
          path: artifacts/webview-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload extension VSIX artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: texra-extension-vsix
          path: releases/*.vsix
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-dist-${{ runner.os }}
          path: packages/desktop/dist/
          if-no-files-found: error
          retention-days: 14

  desktop-macos-installer:
    name: desktop installer (macOS)
    if: github.event_name == 'push' || inputs.run_desktop_installers
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm run desktop:build

      - name: Package macOS desktop installers
        run: pnpm --filter @texra/desktop package:dist

      - name: Check macOS packaged desktop app contents
        run: pnpm run check:desktop-package

      - name: Check macOS desktop installer artifacts
        run: pnpm run check:desktop-installers

      - name: Upload macOS desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-installers-macOS
          path: |
            packages/desktop/dist-packaged/*.dmg
            packages/desktop/dist-packaged/*.zip
            packages/desktop/dist-packaged/*.blockmap
            packages/desktop/dist-packaged/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  desktop-linux-installer:
    name: desktop installer (Linux)
    if: github.event_name == 'push' || inputs.run_desktop_installers
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm run desktop:build

      - name: Package Linux desktop installers
        run: pnpm --filter @texra/desktop package:dist

      - name: Check Linux packaged desktop app contents
        run: pnpm run check:desktop-package

      - name: Check Linux desktop installer artifacts
        run: pnpm run check:desktop-installers

      - name: Upload Linux desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-installers-Linux
          path: |
            packages/desktop/dist-packaged/*.AppImage
            packages/desktop/dist-packaged/*.deb
            packages/desktop/dist-packaged/*.blockmap
            packages/desktop/dist-packaged/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  desktop-windows-artifact:
    name: desktop artifact (Windows)
    if: github.event_name == 'push' || inputs.run_windows_desktop
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check desktop Electron binary
        run: pnpm run check:desktop-electron-binary

      - name: Build desktop artifacts
        run: pnpm run desktop:build

      - name: Check desktop build artifacts
        run: pnpm run check:desktop-build-artifacts

      - name: Package Windows desktop installer
        run: pnpm --filter @texra/desktop package:dist

      - name: Check Windows packaged desktop app contents
        run: pnpm run check:desktop-package

      - name: Check Windows desktop installer artifacts
        run: pnpm run check:desktop-installers

      - name: Upload Windows desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-installers-Windows
          path: |
            packages/desktop/dist-packaged/*.exe
            packages/desktop/dist-packaged/*.blockmap
            packages/desktop/dist-packaged/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-dist-Windows
          path: packages/desktop/dist/
          if-no-files-found: error
          retention-days: 14

  publish-desktop-release-artifacts:
    name: publish desktop release artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - desktop-macos-installer
      - desktop-linux-installer
      - desktop-windows-artifact
    permissions:
      contents: read
    env:
      DESKTOP_RELEASE_REPO: texra-ai/texra-desktop-releases
      GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download desktop installer artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: texra-desktop-installers-*
          path: artifacts/desktop-release
          merge-multiple: true

      - name: Verify downloaded desktop release artifacts
        env:
          TEXRA_DESKTOP_INSTALLER_PLATFORM: all
          TEXRA_DESKTOP_INSTALLER_ROOT: artifacts/desktop-release
        run: node scripts/verify-desktop-installer-artifacts.mjs

      - name: Publish desktop artifacts to public release repository
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'Missing DESKTOP_RELEASES_TOKEN secret for publishing desktop updates.'
            exit 1
          fi

          actual_repo="$(gh repo view "$DESKTOP_RELEASE_REPO" --json nameWithOwner --jq .nameWithOwner)"
          visibility="$(gh repo view "$DESKTOP_RELEASE_REPO" --json visibility --jq .visibility)"

          if [ "$actual_repo" != "$DESKTOP_RELEASE_REPO" ]; then
            echo "Desktop release repo target mismatch: expected $DESKTOP_RELEASE_REPO, got $actual_repo"
            exit 1
          fi

          if [ "$visibility" != 'PUBLIC' ]; then
            echo "Desktop release repo must be public for token-free clients; got visibility $visibility"
            exit 1
          fi

          version="$(node -p "require('./packages/desktop/package.json').version")"
          tag="v${version}"
          notes_file="$(mktemp)"
          printf 'TeXRA desktop %s update artifacts.\n\nSource run: %s/%s/actions/runs/%s\nSource commit: %s\n' \
            "$version" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            > "$notes_file"

          shopt -s nullglob
          assets=(artifacts/desktop-release/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No downloaded desktop release assets found.'
            exit 1
          fi

          if gh release view "$tag" --repo "$DESKTOP_RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$DESKTOP_RELEASE_REPO" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$DESKTOP_RELEASE_REPO" \
              --title "TeXRA Desktop ${version}" \
              --notes-file "$notes_file"
          fi

  validate-status:
    name: validate
    runs-on: ubuntu-latest
    needs:
      - validate
      - desktop-macos-installer
      - desktop-linux-installer
      - desktop-windows-artifact
      - publish-desktop-release-artifacts
    if: always()

    steps:
      - name: Require validation jobs success
        run: |
          if [ '${{ needs.validate.result }}' != 'success' ]; then
            echo 'Validation matrix result: ${{ needs.validate.result }}'
            exit 1
          fi
          if [ '${{ needs.desktop-macos-installer.result }}' != 'success' ] && [ '${{ needs.desktop-macos-installer.result }}' != 'skipped' ]; then
            echo 'macOS desktop installer result: ${{ needs.desktop-macos-installer.result }}'
            exit 1
          fi
          if [ '${{ needs.desktop-linux-installer.result }}' != 'success' ] && [ '${{ needs.desktop-linux-installer.result }}' != 'skipped' ]; then
            echo 'Linux desktop installer result: ${{ needs.desktop-linux-installer.result }}'
            exit 1
          fi
          if [ '${{ needs.desktop-windows-artifact.result }}' != 'success' ] && [ '${{ needs.desktop-windows-artifact.result }}' != 'skipped' ]; then
            echo 'Windows desktop artifact result: ${{ needs.desktop-windows-artifact.result }}'
            exit 1
          fi
          if [ '${{ needs.publish-desktop-release-artifacts.result }}' != 'success' ] && [ '${{ needs.publish-desktop-release-artifacts.result }}' != 'skipped' ]; then
            echo 'Desktop release publish result: ${{ needs.publish-desktop-release-artifacts.result }}'
            exit 1
          fi
