name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # Nightly `schedule` runs use github.ref == refs/heads/main, the same ref a
  # push to main uses. Without the event_name suffix, cancel-in-progress would
  # let a same-ref push cancel the nightly runtime-validation timing run (or
  # vice versa) — see #7756.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Validation is split into parallel jobs (static groups / test shards / build) so PR
# wall-time is bounded by the slowest job, not the sum of a serial chain. Each
# job repeats the cheap cached setup (~30s) to buy that parallelism.
#
# The nightly `schedule` run carries the two jobs nothing else covers: the
# runtime-validation timing run, and the Windows kernel shards, which no PR or
# push runs (see the `test` matrix). Every push to main already validates Linux,
# so the remaining heavy jobs stay gated off `schedule` rather than
# re-validating an unchanged tree nightly (the macOS webview smoke bills at 10x
# Linux rates).
jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      desktop: ${{ steps.detect.outputs.desktop }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: detect
        run: |
          # Heavy validation (typecheck/lint/tests/build) only runs when a PR touches
          # something other than docs. Docs-only PRs fall through to the
          # lightweight docs-build job below, keeping CI spend down. Pushes to
          # main and manual dispatches always run full validation.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event '${{ github.event_name }}' -> full validation."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          # --no-renames lists a rename's source and destination as separate
          # paths, so a rename out of code into docs/ still counts as code.
          files="$(git diff --no-renames --name-only "$base...$head")"
          echo "Changed files in this PR:"
          printf '%s\n' "$files"
          # Here-strings, not `printf | grep -q`: an early grep exit would
          # SIGPIPE the writer and pipefail would misread that as no match.
          # Code = any path outside docs/ and *.md; desktop = the same, minus
          # the CLI (the window bundles the rest of src/ and packages/).
          if grep -qvE '^docs/|\.md$' <<<"$files"; then
            echo "Non-docs changes detected -> full validation."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change -> lightweight docs build only."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qvE '^packages/cli/|^docs/|\.md$' <<<"$files"; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  # The static gate is `npm run gate` (package.json): invariants, then
  # typecheck + formatting, then lint. CI runs the same three groups as
  # parallel jobs, so PR wall-time is the slowest group (lint), not their sum,
  # and a local `npm run gate` reproduces exactly what these jobs enforce.
  invariants:
    name: invariants (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: '2.8.3'
          cache: true

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # The ratchets and cheap invariant scripts (`npm run gate:invariants`).
      - name: Check invariants
        env:
          TEXRA_RATCHET_BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          # Checkout is shallow. Comparing blobs needs only the base tip, and
          # a push to main already has it; fetch only when the ref is missing.
          if ! git rev-parse --verify "$TEXRA_RATCHET_BASE^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/${TEXRA_RATCHET_BASE#origin/}:refs/remotes/$TEXRA_RATCHET_BASE"
          fi
          pnpm run gate:invariants

      # Every function that owns a deno.json is validated, so a new edge
      # function cannot ship untested by being omitted from this list. Needs
      # Deno, so it is CI-only and not part of the local gate.
      - name: Validate edge functions
        run: |
          shopt -s nullglob
          for dir in supabase/functions/*/; do
            [ -f "${dir}deno.json" ] || continue
            echo "::group::${dir}"
            (
              cd "${dir}"
              tests=(*_test.ts)
              deno check index.ts "${tests[@]}"
              deno lint
              if [ ${#tests[@]} -gt 0 ]; then
                deno test --allow-env
              fi
            )
            echo "::endgroup::"
          done

  typecheck:
    name: typecheck + format (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # React Compiler smoke, formatting, then every tsconfig. Formatting
      # remains a CI gate instead of an auto-committing workflow: the
      # pre-commit hook formats staged files locally, avoiding a bot push and
      # its token, retrigger, cancellation, and branch-race complexity.
      - name: Check types and formatting
        run: pnpm run gate:typecheck

  lint:
    name: lint (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Lint
        run: pnpm run lint

  guidance-refs:
    name: guidance references
    # Deliberately ungated: this is the one check that must run on BOTH sides
    # of the docs/code split. A guidance-only PR (code=false) skips the static jobs,
    # and that is exactly the PR most likely to introduce a stale path; a
    # code-only PR can break the prose by renaming what it cites. Every
    # script here imports only Node built-ins, so this job installs nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # setup-node@v5 caches the package manager named by package.json's
      # `packageManager` (pnpm) by default and fails when pnpm is absent;
      # this job installs nothing, so opt out.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check guidance file references resolve
        run: node scripts/check-guidance-refs.mjs

      # Same reason this job is ungated: a note that shipped but still sits in
      # `.agents/docs/proposed/` arrives on the docs side of the split, and an
      # agent reading it as a live direction gets a confidently wrong answer.
      - name: Check no proposal declares itself complete
        run: node scripts/check-proposal-status.mjs

      # The docs-root boundary decides what the texra.ai site publishes. It
      # runs inside `docs:build` (via `check:content`), but that job is gated
      # off on code-only PRs and on pushes to main — exactly the paths where a
      # root-level doc gets added alongside code. An unclassified root doc
      # could therefore freeze the deploy with CI green. This job is the
      # ungated one, so it also runs here; the overlap on docs-only PRs is
      # harmless.
      - name: Check docs root boundary is classified
        run: node docs/scripts/check-root-docs.mjs

  test:
    # Keep the pre-existing `linux` / `windows` labels rather than the raw
    # runner image: these strings are the historical check names.
    name: kernel tests (${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}, shard ${{ matrix.shard }}/2)
    needs: changes
    # Unlike the other heavy jobs this one also runs on the nightly schedule,
    # where it is the Windows shards and nothing else — the tree may be
    # unchanged, but the drift this catches is in the suites themselves.
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Run every shard on every OS to completion so a red run reports every
      # failure at once instead of hiding the other shard's results.
      fail-fast: false
      matrix:
        # Windows stays off PR and push validation: it re-ran assertions the
        # Linux shards already cover — Windows-specific behaviour is exercised
        # by suites that stub the platform (`platform: 'win32'`), and 17
        # assertions actively skip themselves when the runner really is
        # Windows — while costing ~16 min per shard against ~10 on Linux and
        # setting the wall-clock for the entire workflow. The inventory of
        # genuine Windows defects the matrix did surface is in
        # 2026-07-29-open-source-readiness.md §4.6.
        #
        # What it does run on is the nightly schedule, alone (#12943). A suite
        # that hard-codes a `/` in a native absolute path, or mocks POSIX-only
        # filesystem behaviour, passes everywhere else and is invisible until
        # someone remembers to dispatch this workflow: #12939 repaired five
        # such suites that had been red for a week. A nightly run bounds that
        # window to a day and costs nothing on a PR. A manual dispatch still
        # runs both platforms, for re-checking Windows before a release or
        # right after touching path handling.
        os: ${{ fromJson(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest"]' || github.event_name == 'schedule' && '["windows-latest"]' || '["ubuntu-latest"]') }}
        shard: [1, 2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # --maxWorkers=2 saturates the 2-vCPU hosted runner (see #8039); the
      # shards exist because a single runner can't go wider than that.
      - name: Kernel tests
        run: pnpm run test --maxWorkers=2 --shard=${{ matrix.shard }}/2

  build:
    name: build artifacts (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Validate CLI TUI smoke frames
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @texra-ai/cli validate:tui -- \
            --snapshot-dir "$GITHUB_WORKSPACE/artifacts/tui-frames" --smoke

      - name: Upload CLI TUI smoke frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: texra-cli-tui-smoke-frames
          path: artifacts/tui-frames
          if-no-files-found: warn
          retention-days: 14

      # No separate dev-mode `pnpm run compile` step: build:fast starts with
      # clean:dist and rebuilds esbuild + Vite output in production mode, so a
      # preceding dev compile is discarded work.
      # Desktop app packaging is intentionally not part of PR CI. Keep this
      # check scoped to the VS Code extension package.
      - name: Build extension VSIX package
        run: pnpm --filter texra build:fast

      - name: Check extension VSIX contents
        run: pnpm run check:vsix-contents

      - name: Upload extension VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: texra-extension-vsix
          path: releases/*.vsix
          if-no-files-found: error
          retention-days: 14

  webview-smoke:
    name: webview smoke (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    # macOS-only because the smoke renders the packaged webviews in Electron on
    # the macOS runner. It needs just the Vite webview bundles
    # (packages/extension/dist/*/bundle.js) — not the esbuild extension-host
    # compile, typecheck, lint, or kernel tests, which the Linux jobs already
    # cover. Keeping this job lean avoids paying macOS rates (10x Linux) to
    # re-run platform-independent checks.
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build webview smoke assets
        run: pnpm run vite:webviews

      - name: Smoke extension webviews in Electron
        run: pnpm run smoke:webviews:run

      - name: Upload webview smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: texra-webview-smoke-screenshots
          path: artifacts/webview-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14

  vscode-host-e2e:
    name: vscode host e2e (${{ matrix.vscode }})
    needs: changes
    # Off pull requests: it downloads two VS Code builds and runs on a macOS
    # runner. It loads the built extension in a real VS Code and checks
    # activation, command registration and the webview panels
    # (scripts/vscode-host-e2e-suite.cjs); `minimum` is engines.vscode.
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, minimum]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build extension
        run: pnpm run compile:fast

      - name: Run VS Code host e2e
        run: pnpm run test:vscode -- --vscode ${{ matrix.vscode }}

  desktop-e2e:
    name: desktop e2e (macOS)
    needs: changes
    # The Playwright suite that launches the built Electron app: quit, the
    # project seed, workbench tabs, Monaco, the pty. Nothing else exercises
    # the app end to end, and it broke twice unnoticed before it ran here.
    # macOS because its window-lifecycle specs are macOS behaviour and the
    # runner needs no virtual display; skipped on PRs confined to the CLI
    # or docs, since macOS bills at 10x Linux rates.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.desktop == 'true' && github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # The three bundles only: typecheck is the Linux static-checks job's.
      - name: Build desktop app
        run: |
          pnpm --filter @texra/desktop run build:main
          pnpm --filter @texra/desktop run build:preload
          pnpm --filter @texra/desktop run build:renderer

      - name: Run desktop e2e suite
        env:
          TEXRA_NO_UPDATE_CHECK: '1'
        run: pnpm --filter @texra/desktop test:e2e

      - name: Upload desktop e2e results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-e2e-results
          path: packages/desktop/tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  runtime-validation:
    name: runtime validation (linux)
    # Runs on push to main, the nightly schedule (whose whole purpose is this
    # timing run), and manual dispatch; never on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: '22.19.0'

      - name: Validate CLI real-runtime run path
        run: |
          set +e
          start_time="$(date +%s)"
          pnpm --filter @texra-ai/cli validate:run
          status="$?"
          end_time="$(date +%s)"
          duration="$((end_time - start_time))"
          {
            echo '### CLI real-runtime validation'
            echo
            echo "- Command: \`pnpm --filter @texra-ai/cli validate:run\`"
            echo "- Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  docs-check:
    name: docs build
    needs: changes
    # Runs only for docs-only PRs (where the heavy validation jobs are
    # skipped). Formatting still uses the root workspace's pinned Prettier;
    # VitePress then builds from its self-contained npm sub-project.
    if: needs.changes.result == 'success' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          ignore-scripts: 'true'

      - name: Check formatting
        run: pnpm run format:check

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci --legacy-peer-deps

      - name: Build docs site
        working-directory: docs
        run: npm run docs:build

  validate-status:
    name: validate
    runs-on: ubuntu-latest
    needs:
      - changes
      - invariants
      - typecheck
      - lint
      - guidance-refs
      - test
      - build
      - webview-smoke
      - desktop-e2e
      - runtime-validation
      - docs-check
    if: always()

    steps:
      - name: Require validation jobs success
        run: |
          # On code PRs the static/test/build/webview-smoke jobs gate; on
          # docs-only PRs they are skipped and the lightweight docs
          # build gates instead; on the nightly schedule runtime-validation and
          # the Windows kernel shards run, so a Windows-only suite regression
          # turns the nightly red here.
          # Require whichever ran.
          #
          # `changes` must itself succeed (never skip): if it fails, every
          # dependent job skips and the gate would otherwise go green with
          # nothing validated.
          if [ '${{ needs.changes.result }}' != 'success' ]; then
            echo 'Change detection result: ${{ needs.changes.result }}'
            exit 1
          fi
          # guidance-refs is ungated, so unlike the jobs below it must actually
          # have succeeded — "skipped" here means it never ran and the gate
          # would go green without checking anything.
          if [ '${{ needs.guidance-refs.result }}' != 'success' ]; then
            echo 'guidance-refs result: ${{ needs.guidance-refs.result }}'
            exit 1
          fi
          for result in \
            'invariants:${{ needs.invariants.result }}' \
            'typecheck:${{ needs.typecheck.result }}' \
            'lint:${{ needs.lint.result }}' \
            'test:${{ needs.test.result }}' \
            'build:${{ needs.build.result }}' \
            'webview-smoke:${{ needs.webview-smoke.result }}' \
            'desktop-e2e:${{ needs.desktop-e2e.result }}' \
            'runtime-validation:${{ needs.runtime-validation.result }}' \
            'docs-check:${{ needs.docs-check.result }}'; do
            name="${result%%:*}"
            value="${result#*:}"
            if [ "$value" != 'success' ] && [ "$value" != 'skipped' ]; then
              echo "${name} result: ${value}"
              exit 1
            fi
          done
          # Code changes must have run the Linux jobs: "skipped" is only
          # legitimate for them on a docs-only PR (and, for all but the kernel
          # shards, on the nightly schedule, which runs only the Windows shards
          # and runtime validation).
          if [ '${{ needs.changes.outputs.code }}' = 'true' ]; then
            for result in \
              'test:${{ needs.test.result }}' \
              'invariants:${{ needs.invariants.result }}' \
              'typecheck:${{ needs.typecheck.result }}' \
              'lint:${{ needs.lint.result }}' \
              'build:${{ needs.build.result }}'; do
              name="${result%%:*}"
              value="${result#*:}"
              if [ "$value" = 'skipped' ] && \
                 { [ "$name" = 'test' ] || [ '${{ github.event_name }}' != 'schedule' ]; }; then
                echo "${name} was skipped for a code change"
                exit 1
              fi
            done
          fi
          # Docs-only PRs skip the heavy jobs, so the docs build must have
          # actually succeeded (not merely been skipped). Scoped to
          # pull_request: on the nightly schedule both sides are skipped by
          # design.
          if [ '${{ github.event_name }}' = 'pull_request' ] && \
             [ '${{ needs.changes.outputs.code }}' != 'true' ] && \
             [ '${{ needs.docs-check.result }}' != 'success' ]; then
            echo 'Docs-only PR but docs build did not succeed: ${{ needs.docs-check.result }}'
            exit 1
          fi
