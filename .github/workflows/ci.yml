name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check desktop Electron binary
        run: pnpm run check:desktop-electron-binary

      - name: Type check
        run: pnpm run typecheck

      - name: Type check workspace packages
        run: pnpm run workspace:typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check extension package invariants
        run: pnpm run check:extension-package-invariants

      - name: Kernel tests
        run: pnpm run test:kernel

      - name: Compile
        run: pnpm run compile

      - name: Build initial extension and desktop artifacts
        run: pnpm run build:initial

      - name: Package desktop app
        if: runner.os == 'macOS'
        run: pnpm run desktop:package:local

      - name: Check desktop package
        if: runner.os == 'macOS'
        run: pnpm run check:desktop-package

      - name: Smoke packaged desktop launch
        if: runner.os == 'macOS'
        run: pnpm run desktop:package:smoke

      - name: Smoke extension webviews in Electron
        if: runner.os == 'macOS'
        run: pnpm run smoke:webviews:run

      - name: Upload webview smoke screenshots
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v7
        with:
          name: texra-webview-smoke-screenshots
          path: artifacts/webview-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload extension VSIX artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: texra-extension-vsix
          path: releases/*.vsix
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-dist-${{ runner.os }}
          path: packages/desktop/dist/
          if-no-files-found: error
          retention-days: 14

  desktop-macos-installer:
    name: desktop installer (macOS)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm run desktop:build

      - name: Package macOS desktop installers
        run: pnpm --filter @texra/desktop package:dist

      - name: Check macOS packaged desktop app contents
        run: pnpm run check:desktop-package

      - name: Check macOS desktop installer artifacts
        run: pnpm run check:desktop-installers

      - name: Upload macOS desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-installers-macOS
          path: |
            packages/desktop/dist-packaged/*.dmg
            packages/desktop/dist-packaged/*.zip
          if-no-files-found: error
          retention-days: 14

  desktop-linux-installer:
    name: desktop installer (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm run desktop:build

      - name: Package Linux desktop installers
        run: pnpm --filter @texra/desktop package:dist

      - name: Check Linux packaged desktop app contents
        run: pnpm run check:desktop-package

      - name: Check Linux desktop installer artifacts
        run: pnpm run check:desktop-installers

      - name: Upload Linux desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-installers-Linux
          path: |
            packages/desktop/dist-packaged/*.AppImage
            packages/desktop/dist-packaged/*.deb
          if-no-files-found: error
          retention-days: 14

  desktop-windows-artifact:
    name: desktop artifact (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check desktop Electron binary
        run: pnpm run check:desktop-electron-binary

      - name: Build desktop artifacts
        run: pnpm run desktop:build

      - name: Check desktop build artifacts
        run: pnpm run check:desktop-build-artifacts

      - name: Package Windows desktop installer
        run: pnpm --filter @texra/desktop package:dist

      - name: Check Windows packaged desktop app contents
        run: pnpm run check:desktop-package

      - name: Check Windows desktop installer artifacts
        run: pnpm run check:desktop-installers

      - name: Upload Windows desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-installer-Windows
          path: packages/desktop/dist-packaged/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v7
        with:
          name: texra-desktop-dist-Windows
          path: packages/desktop/dist/
          if-no-files-found: error
          retention-days: 14

  validate-status:
    name: validate
    runs-on: ubuntu-latest
    needs:
      - validate
      - desktop-macos-installer
      - desktop-linux-installer
      - desktop-windows-artifact
    if: always()

    steps:
      - name: Require validation jobs success
        run: |
          if [ '${{ needs.validate.result }}' != 'success' ]; then
            echo 'Validation matrix result: ${{ needs.validate.result }}'
            exit 1
          fi
          if [ '${{ needs.desktop-macos-installer.result }}' != 'success' ]; then
            echo 'macOS desktop installer result: ${{ needs.desktop-macos-installer.result }}'
            exit 1
          fi
          if [ '${{ needs.desktop-linux-installer.result }}' != 'success' ]; then
            echo 'Linux desktop installer result: ${{ needs.desktop-linux-installer.result }}'
            exit 1
          fi
          if [ '${{ needs.desktop-windows-artifact.result }}' != 'success' ]; then
            echo 'Windows desktop artifact result: ${{ needs.desktop-windows-artifact.result }}'
            exit 1
          fi
