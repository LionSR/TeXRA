name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Type check workspace packages
        run: pnpm run workspace:typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check extension package invariants
        run: pnpm run check:extension-package-invariants

      - name: Kernel tests
        run: pnpm run test:kernel

      - name: Compile
        run: pnpm run compile

      - name: Build workspace packages
        run: pnpm run workspace:build

      - name: Build extension VSIX
        run: pnpm run build:fast

      - name: Check VSIX contents
        run: pnpm run check:vsix-contents
