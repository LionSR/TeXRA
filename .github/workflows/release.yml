name: Release

# Fires once a GitHub Release is published. Tags are cut in pairs off the same
# commit: `vX.Y.Z` for the extension, `cli-vX.Y.Z` for the CLI. The SDK pair
# (`@texra-ai/llm`, `@texra-ai/harness`) has its own version and its own tag,
# `sdk-vX.Y.Z`, cut whenever what the two packages ship changed. Creating the
# tag/release itself stays a manual step (gh release create) so a human still
# curates the changelog body and decides when to go public; this workflow only
# handles the build + publish that follows.
#
# Two channels, decided per release by the package version and the GitHub
# pre-release flag, which must agree or the job fails before publishing:
#
#   stable   `X.Y.Z`            release NOT marked pre-release
#            -> Marketplace / Open VSX release channel, npm dist-tag `latest`
#   preview  `X.Y.Z-preview.N`  release marked pre-release (`--prerelease`)
#            -> Marketplace / Open VSX pre-release channel, npm dist-tag
#               `preview`
#
# The VS Code Marketplace refuses semver prerelease suffixes outright (vsce
# throws on `1.0.0-preview.3`) and identifies pre-releases by version order:
# users who opted in receive the highest version across both channels, and are
# moved back to stable once a stable version exceeds it. Its documented scheme
# is `major.EVEN.patch` for stable and `major.ODD.patch` for pre-release, so a
# preview `X.Y.0-preview.N` is packaged as the bare `X.(Y+1).N`; from 1.0 on,
# stable extension trains therefore use even minor numbers. npm and
# electron-builder take the suffix as-is, so only the VSIX is renumbered.
# Every job checks its release with `.github/actions/release-channel`, which
# runs `scripts/release-version.mjs`, the one home of these rules.
# Procedure: `.claude/skills/releasing/SKILL.md`.

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-extension:
    name: Publish VS Code extension (Marketplace + Open VSX)
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require green CI on the tagged commit
        uses: ./.github/actions/require-green-ci

      - name: Resolve release channel
        id: channel
        uses: ./.github/actions/release-channel
        with:
          manifest: packages/extension/package.json
          tag-prefix: v

      # vsce refuses a semver prerelease suffix, so the VSIX is packaged under
      # its Marketplace number: the version itself for a stable release,
      # X.(Y+1).N for a preview. Only this job's checkout is renumbered.
      - name: Renumber the extension manifest for the Marketplace
        working-directory: packages/extension
        env:
          MARKETPLACE_VERSION: ${{ steps.channel.outputs.marketplace_version }}
        run: npm pkg set version="$MARKETPLACE_VERSION"

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build extension VSIX
        env:
          # `--pre-release` on a preview: vsce stamps the VSIX manifest, and
          # `vsce publish --pre-release` refuses a package without the stamp.
          VSCE_PACKAGE_FLAGS: ${{ steps.channel.outputs.channel == 'preview' && '--pre-release' || '' }}
        run: pnpm --filter texra build:fast

      - name: Check VSIX contents
        run: node scripts/verify-vsix-contents.mjs

      - name: Locate built VSIX
        id: vsix
        run: |
          version=$(node -p "require('./packages/extension/package.json').version")
          path="releases/texra-${version}.vsix"
          test -f "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish to Visual Studio Marketplace
        # Pinned to the COMMIT `v2` resolves to: this action receives the
        # Marketplace and Open VSX publish credentials, so a moved tag would
        # hand them to code nobody reviewed. Actions requires a commit SHA, so
        # resolve with `git ls-remote <repo> 'refs/tags/v2^{}'` — plain
        # `refs/tags/v2` yields the annotated tag object, which does not
        # resolve. Bump the SHA and the trailing tag together.
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.vsix.outputs.path }}
          preRelease: ${{ steps.channel.outputs.channel == 'preview' }}
          skipDuplicate: true

      - name: Publish to Open VSX
        # Pinned to the COMMIT `v2` resolves to: this action receives the
        # Marketplace and Open VSX publish credentials, so a moved tag would
        # hand them to code nobody reviewed. Actions requires a commit SHA, so
        # resolve with `git ls-remote <repo> 'refs/tags/v2^{}'` — plain
        # `refs/tags/v2` yields the annotated tag object, which does not
        # resolve. Bump the SHA and the trailing tag together.
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2
        with:
          pat: ${{ secrets.OVSX_PAT }}
          registryUrl: https://open-vsx.org
          extensionFile: ${{ steps.vsix.outputs.path }}
          preRelease: ${{ steps.channel.outputs.channel == 'preview' }}
          skipDuplicate: true

  publish-cli:
    name: Publish CLI to npm (Trusted Publishing)
    if: ${{ startsWith(github.event.release.tag_name, 'cli-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require green CI on the tagged commit
        uses: ./.github/actions/require-green-ci

      - name: Resolve release channel
        id: channel
        uses: ./.github/actions/release-channel
        with:
          manifest: packages/cli/package.json
          tag-prefix: cli-v

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm CLI recent enough for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish @texra-ai/cli
        working-directory: packages/cli
        env:
          NPM_TAG: ${{ steps.channel.outputs.npm_tag }}
        # The dist-tag is always explicit: `npm publish` defaults to `latest`,
        # which is exactly where a preview must never land.
        run: npm publish --tag "$NPM_TAG"

  publish-sdk:
    name: Publish SDK to npm (Trusted Publishing)
    if: ${{ startsWith(github.event.release.tag_name, 'sdk-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require green CI on the tagged commit
        uses: ./.github/actions/require-green-ci

      # The harness's version names the release; the publish script fails
      # unless the llm's is the same, and takes the dist-tag from it.
      - name: Check the release channel
        uses: ./.github/actions/release-channel
        with:
          manifest: packages/harness/package.json
          tag-prefix: sdk-v

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm CLI recent enough for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install the packed tarballs and run the example
        run: pnpm --filter @texra-ai/harness run example:packed

      - name: Dry-run the publish
        run: node packages/harness/scripts/publish-npm.mjs --dry-run

      - name: Publish @texra-ai/llm, then @texra-ai/harness
        run: node packages/harness/scripts/publish-npm.mjs
