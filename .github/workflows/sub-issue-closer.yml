name: Sub-Issue Closer

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

concurrency:
  group: sub-issue-closer
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'github-actions[bot]'
          claude_args: |
            --model claude-opus-4-7
            --allowedTools "mcp__github__*"

          prompt: |
            Close open `tracking` issues whose sub-issues are all completed.

            For each open issue labeled `tracking` in ${{ github.repository }}:
            - Read its sub-issues via `mcp__github__issue_read`.
            - Qualifies for close ONLY if it has ≥1 sub-issue AND every sub-issue is
              `closed` with `state_reason=completed` (skip if any are
              `not_planned` or `duplicate`).
            - Skip parents created less than 24 hours ago.
            - Process leaf-up: close inner trackers first, then re-check outer ones.

            To close: comment
            `✅ All N sub-issues closed as completed. Auto-closing this tracker.`,
            then `mcp__github__issue_write` (method=update) with `state=closed`,
            `state_reason=completed`.

            Cap: 20 closures per run. Exit with a one-line summary if nothing matches.
