name: TeXRA Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: texra-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  texra-review:
    if: vars.TEXRA_REVIEW_ENABLED != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      TEXRA_REVIEW_MARKER: '<!-- texra-review -->'

    steps:
      - name: Check TeXRA review switch
        id: texra-switch
        env:
          TEXRA_REVIEW_ENABLED: ${{ vars.TEXRA_REVIEW_ENABLED }}
        run: |
          if [ "$TEXRA_REVIEW_ENABLED" = "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping TeXRA code review: TEXRA_REVIEW_ENABLED=false"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check model provider token
        if: steps.texra-switch.outputs.skip != 'true'
        id: provider-token
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}${DEEPSEEK_API_KEY}${GOOGLE_API_KEY}${OPENAI_API_KEY}${OPENROUTER_API_KEY}${XAI_API_KEY}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping TeXRA code review: no model provider API key is configured."
          fi

      - name: Checkout repository under review
        if: steps.texra-switch.outputs.skip != 'true' && steps.provider-token.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout trusted automation
        if: steps.texra-switch.outputs.skip != 'true' && steps.provider-token.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: .trusted-actions
          persist-credentials: false
          fetch-depth: 1

      - name: Check trusted TeXRA action
        if: steps.texra-switch.outputs.skip != 'true' && steps.provider-token.outputs.skip != 'true'
        id: trusted-texra-action
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -f .trusted-actions/.github/actions/texra-code-review/action.yml ]; then
            {
              echo "available=true"
              echo "source=trusted"
              echo "prompt-file=.trusted-actions/.github/prompts/texra-code-review-prompt.md"
              echo "script-root=.trusted-actions/.github/actions/texra-code-review/scripts"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] &&
            [ "$PR_AUTHOR" = "$REPOSITORY_OWNER" ] &&
            [ -f .github/actions/texra-code-review/action.yml ]; then
            {
              echo "available=true"
              echo "source=bootstrap"
              echo "prompt-file=.github/prompts/texra-code-review-prompt.md"
              echo "script-root=.github/actions/texra-code-review/scripts"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Running TeXRA code review in owner-authored bootstrap mode."
            exit 0
          fi

          {
            echo "available=false"
            echo "source=none"
            echo "prompt-file="
            echo "script-root="
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping TeXRA code review: trusted base branch does not yet contain texra-code-review."

      - name: Resolve TeXRA review model
        if: steps.texra-switch.outputs.skip != 'true' && steps.provider-token.outputs.skip != 'true' && steps.trusted-texra-action.outputs.available == 'true'
        id: review-model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TEXRA_REVIEW_ANTHROPIC_MODEL: ${{ vars.TEXRA_REVIEW_ANTHROPIC_MODEL }}
          TEXRA_REVIEW_DEEPSEEK_MODEL: ${{ vars.TEXRA_REVIEW_DEEPSEEK_MODEL }}
          TEXRA_REVIEW_GOOGLE_MODEL: ${{ vars.TEXRA_REVIEW_GOOGLE_MODEL }}
          TEXRA_REVIEW_MODEL: ${{ vars.TEXRA_REVIEW_MODEL }}
          TEXRA_REVIEW_OPENAI_MODEL: ${{ vars.TEXRA_REVIEW_OPENAI_MODEL }}
          TEXRA_REVIEW_OPENROUTER_MODEL: ${{ vars.TEXRA_REVIEW_OPENROUTER_MODEL }}
          TEXRA_REVIEW_XAI_MODEL: ${{ vars.TEXRA_REVIEW_XAI_MODEL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          node "${{ steps.trusted-texra-action.outputs.script-root }}/resolve-model.cjs"

      - name: Prepare PR diff
        if: steps.texra-switch.outputs.skip != 'true' && steps.provider-token.outputs.skip != 'true' && steps.trusted-texra-action.outputs.available == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .texra-action
          git diff --find-renames "$BASE_SHA" "$HEAD_SHA" > .texra-action/pr.diff
          node "${{ steps.trusted-texra-action.outputs.script-root }}/write-commentable-lines.cjs"

      - name: Write TeXRA review prompt context
        if: steps.texra-switch.outputs.skip != 'true' && steps.provider-token.outputs.skip != 'true' && steps.trusted-texra-action.outputs.available == 'true'
        id: prompt-context
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY_JSON: ${{ toJSON(github.event.pull_request.body) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE_JSON: ${{ toJSON(github.event.pull_request.title) }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REVIEW_MODE: ${{ steps.trusted-texra-action.outputs.source }}
          TEXRA_REVIEW_MODEL: ${{ steps.review-model.outputs.model }}
          TRIGGER_EVENT: ${{ github.event.action }}
        run: |
          set -euo pipefail
          node "${{ steps.trusted-texra-action.outputs.script-root }}/write-prompt-context.cjs"

      - name: Collect previous TeXRA review threads
        if: steps.texra-switch.outputs.skip != 'true' && steps.provider-token.outputs.skip != 'true' && steps.trusted-texra-action.outputs.available == 'true'
        id: texra-threads
        uses: actions/github-script@v7
        env:
          TEXRA_COLLECT_THREADS_SCRIPT: ${{ steps.trusted-texra-action.outputs.script-root }}/collect-threads.cjs
          TEXRA_THREADS_OUTPUT: .texra-action/previous-texra-review-threads.json
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require('node:path');
            const { collectTexraThreads } = require(path.resolve(process.env.TEXRA_COLLECT_THREADS_SCRIPT));
            await collectTexraThreads({ github, context, core });

      - name: Run trusted TeXRA single-agent review
        if: steps.texra-switch.outputs.skip != 'true' && steps.provider-token.outputs.skip != 'true' && steps.trusted-texra-action.outputs.source == 'trusted'
        id: texra-review-trusted
        uses: ./.trusted-actions/.github/actions/texra-code-review
        with:
          prompt-file: ${{ steps.trusted-texra-action.outputs.prompt-file }}
          prompt-context-file: ${{ steps.prompt-context.outputs.path }}
          review-context-file: .texra-action/pr.diff
          commentable-lines-file: .texra-action/commentable-lines.md
          review-thread-context-file: ${{ steps.texra-threads.outputs.path }}
          texra-version: ${{ vars.TEXRA_CLI_VERSION || '' }}
          agent: review
          model: ${{ steps.review-model.outputs.model }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          api-mode: personal
          approval-policy: never

      - name: Run bootstrap TeXRA single-agent review
        if: steps.texra-switch.outputs.skip != 'true' && steps.provider-token.outputs.skip != 'true' && steps.trusted-texra-action.outputs.source == 'bootstrap'
        id: texra-review-bootstrap
        uses: ./.github/actions/texra-code-review
        with:
          prompt-file: ${{ steps.trusted-texra-action.outputs.prompt-file }}
          prompt-context-file: ${{ steps.prompt-context.outputs.path }}
          review-context-file: .texra-action/pr.diff
          commentable-lines-file: .texra-action/commentable-lines.md
          review-thread-context-file: ${{ steps.texra-threads.outputs.path }}
          texra-version: workspace
          agent: review
          model: ${{ steps.review-model.outputs.model }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
          api-mode: personal
          approval-policy: never

      - name: Write TeXRA review failure fallback
        if: >
          always() &&
          steps.texra-switch.outputs.skip != 'true' &&
          steps.provider-token.outputs.skip != 'true' &&
          steps.trusted-texra-action.outputs.available == 'true' &&
          steps.texra-review-trusted.outputs.review-json == '' &&
          steps.texra-review-bootstrap.outputs.review-json == ''
        id: texra-review-fallback
        run: |
          mkdir -p .texra-action
          cat > .texra-action/texra-review-fallback.json <<'JSON'
          {
            "body": "## TeXRA Code Review\n\nTeXRA did not produce a review payload. Inspect the TeXRA Code Review workflow logs for the agent failure.",
            "comments": [],
            "thread_actions": []
          }
          JSON
          echo "review-json=.texra-action/texra-review-fallback.json" >> "$GITHUB_OUTPUT"

      - name: Post TeXRA pull request review
        if: >
          always() &&
          steps.trusted-texra-action.outputs.available == 'true' &&
          (
            steps.texra-review-trusted.outputs.review-json != '' ||
            steps.texra-review-bootstrap.outputs.review-json != '' ||
            steps.texra-review-fallback.outputs.review-json != ''
          )
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEXRA_COMMENTABLE_LINES_JSON: .texra-action/commentable-lines.json
          TEXRA_POST_REVIEW_SCRIPT: ${{ steps.trusted-texra-action.outputs.script-root }}/post-review.cjs
          TEXRA_RESOLVE_THREADS: ${{ secrets.TEXRA_REVIEW_GITHUB_TOKEN != '' && 'true' || 'false' }}
          TEXRA_REVIEW_AGENT: review
          TEXRA_REVIEW_JSON: ${{ steps.texra-review-trusted.outputs.review-json || steps.texra-review-bootstrap.outputs.review-json || steps.texra-review-fallback.outputs.review-json }}
          TEXRA_REVIEW_MODEL: ${{ steps.review-model.outputs.model }}
          TEXRA_THREADS_JSON: .texra-action/previous-texra-review-threads.json
        with:
          github-token: ${{ secrets.TEXRA_REVIEW_GITHUB_TOKEN || github.token }}
          script: |
            const path = require('node:path');
            const { postTexraReview } = require(path.resolve(process.env.TEXRA_POST_REVIEW_SCRIPT));
            await postTexraReview({ github, context, core });
