name: Nightly Fix

# The repair loop for `nightly.yml`. No pull request runs a test suite, so a
# regression reaches `main` and the night finds it; this workflow is what
# answers the night, so that the failure does not wait for a person to read
# an issue.
#
#   Nightly fails on main          -> the agent diagnoses the failed jobs and
#                                     opens a fix PR from a new branch
#   the fix branch gets a commit   -> this workflow dispatches Nightly on it
#   that run fails                 -> the agent continues on the same branch
#   that run passes                -> a comment on the PR says so; a person
#                                     reviews and merges
#   the next scheduled night       -> passes and closes the issue, or fails
#                                     and starts over
#
# The agent never merges and never pushes to `main`. It stops after
# MAX_ROUNDS failed runs on one branch and says so on the issue, and it does
# nothing on a night whose issue already has an open fix PR.
#
# A `workflow_run` workflow always runs the default branch's copy of this
# file, so a fix branch cannot change the loop that judges it.
#
# Repository variable kill switch:
#   NIGHTLY_FIX_ENABLED=false disables the agent; the nightly issue is kept
#   by `nightly.yml` either way.
on:
  workflow_run:
    workflows: [Nightly]
    types: [completed]

concurrency:
  # One run per branch at a time, and none cancelled: a cancelled agent run
  # can leave a half-pushed branch.
  group: nightly-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  FIX_BRANCH_PREFIX: claude/nightly-fix-
  MAX_ROUNDS: '3'

jobs:
  fix:
    name: repair the failing night
    # Two runs start a repair: the scheduled run on `main`, and a dispatch on
    # a branch this workflow named. Any other dispatch of Nightly is a
    # person's own check and gets no agent. A cancelled run says nothing
    # about the tree. The branch prefix is FIX_BRANCH_PREFIX, spelled out
    # because a job's `if` cannot read `env`.
    if: >-
      vars.NIGHTLY_FIX_ENABLED != 'false' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        (github.event.workflow_run.event == 'schedule' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.conclusion == 'failure') ||
        (github.event.workflow_run.event == 'workflow_dispatch' &&
         startsWith(github.event.workflow_run.head_branch, 'claude/nightly-fix-') &&
         contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_PROVIDER: ${{ vars.CLAUDE_CODE_PROVIDER || 'anthropic' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # Read the failed jobs' logs, and dispatch Nightly on the fix branch.
      actions: write

    steps:
      # Everything the loop decides is decided here, from GitHub's own state,
      # before the agent starts: which branch, which round, and whether there
      # is anything to do. The agent is told the answers; it chooses none.
      - name: Decide what this run does
        id: plan
        run: |
          set -euo pipefail
          plan() { echo "$1" >> "$GITHUB_OUTPUT"; }

          case "$CLAUDE_CODE_PROVIDER" in
            anthropic) provider_token="$CLAUDE_CODE_OAUTH_TOKEN" ;;
            deepseek) provider_token="$DEEPSEEK_API_KEY" ;;
            *) echo "::error::Unsupported provider: $CLAUDE_CODE_PROVIDER"; exit 1 ;;
          esac

          if [ "$RUN_BRANCH" = main ]; then
            # A failing night. `nightly.yml` opened or updated the issue
            # before this workflow started.
            issue="$(gh issue list --state open --label nightly-ci --limit 1 --json number --jq '.[0].number // empty')"
            if [ -z "$issue" ]; then
              echo "::notice::Nightly failed but no open nightly-ci issue exists; nothing to repair against."
              plan action=none; exit 0
            fi
            open_pr="$(gh pr list --state open --limit 200 --json number,headRefName \
              --jq "[.[] | select(.headRefName | startswith(\"$FIX_BRANCH_PREFIX$issue-\"))][0].number // empty")"
            if [ -n "$open_pr" ]; then
              echo "::notice::#$open_pr already carries a fix for #$issue; waiting for it to merge."
              plan action=none; exit 0
            fi
            branch="$FIX_BRANCH_PREFIX$issue-$RUN_NUMBER"
            round=1
          else
            # A verification run on a fix branch, named `<prefix><issue>-<n>`.
            branch="$RUN_BRANCH"
            rest="${branch#"$FIX_BRANCH_PREFIX"}"
            issue="${rest%%-*}"
            pr="$(gh pr list --state open --head "$branch" --limit 1 --json number --jq '.[0].number // empty')"
            if [ "$RUN_CONCLUSION" = success ]; then
              gh issue comment "${pr:-$issue}" --body "\`Nightly\` passed on \`$branch\` at \`${RUN_SHA:0:7}\`, every suite included: $RUN_URL"
              plan action=none; exit 0
            fi
            failed="$(gh api --paginate "repos/$GH_REPO/actions/workflows/nightly.yml/runs?branch=$branch&event=workflow_dispatch&status=failure&per_page=100" \
              --jq '.workflow_runs | length' | awk '{ n += $1 } END { print n + 0 }')"
            if [ "$failed" -ge "$MAX_ROUNDS" ]; then
              gh issue comment "$issue" --body "\`Nightly\` has failed $failed times on \`$branch\` (latest: $RUN_URL). The repair agent stops here; this needs a person."
              plan action=none; exit 0
            fi
            round="$((failed + 1))"
          fi

          if [ -z "$provider_token" ]; then
            echo "::notice::Skipping the repair agent: the $CLAUDE_CODE_PROVIDER token is not configured."
            plan action=none; exit 0
          fi

          plan action=repair
          plan "issue=$issue"
          plan "branch=$branch"
          plan "round=$round"
          # The branch tip before the agent runs; empty when it does not
          # exist yet. Compared afterwards to see whether the agent pushed.
          plan "before=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq .object.sha 2>/dev/null || true)"

      - name: Checkout the failing commit
        if: steps.plan.outputs.action == 'repair'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The agent reads `git log` to find what changed since the last
          # green night.
          fetch-depth: 200
          # Do not leave the token in .git/config: the agent reaches GitHub
          # through mcp__github__*, never through git credentials, and it
          # runs with Read over this workspace.
          persist-credentials: false

      # The prompt, the tool allowlist and the actions come from the default
      # branch, never from the fix branch the agent itself wrote. Checked out
      # second: checking out into the workspace root first empties it.
      - name: Checkout trusted automation
        if: steps.plan.outputs.action == 'repair'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-actions
          fetch-depth: 1
          persist-credentials: false

      # Installed here so the agent can run the failing suite at once, and
      # so its allowlist needs no install command.
      - name: Setup workspace
        if: steps.plan.outputs.action == 'repair'
        uses: ./.trusted-actions/.github/actions/setup-workspace

      - name: Run the repair agent
        id: claude
        if: steps.plan.outputs.action == 'repair'
        continue-on-error: true
        uses: LionSR/agent-ci-actions@v1
        with:
          provider: ${{ env.CLAUDE_CODE_PROVIDER }}
          model-tier: sonnet
          allowed_tools_preset: nightly-fix
          allowed_tools_preset_map_file: .trusted-actions/.github/automation/allowed-tools.json
          additional-permissions: |
            actions: read
          claude-prompt-file: .trusted-actions/.github/prompts/nightly-fix-prompt.md
          claude-prompt-context: |
            Repository: ${{ github.repository }}
            Failing Nightly run id: ${{ github.event.workflow_run.id }}
            Failing Nightly run: ${{ github.event.workflow_run.html_url }}
            Failing ref: ${{ github.event.workflow_run.head_branch }} at ${{ github.event.workflow_run.head_sha }}
            Nightly issue: #${{ steps.plan.outputs.issue }}
            Fix branch: ${{ steps.plan.outputs.branch }}
            Round: ${{ steps.plan.outputs.round }} of ${{ env.MAX_ROUNDS }}

      - name: Report denied tool calls
        continue-on-error: true
        if: always() && steps.plan.outputs.action == 'repair' && steps.claude.outcome != 'skipped'
        uses: ./.trusted-actions/.github/actions/report-denied-tools

      # The proof of a fix is every suite on the fix branch, which the fix
      # PR's own checks do not run. A dispatch is one of the two events the
      # job token may start a workflow with, and its completion re-enters
      # this workflow.
      - name: Verify the fix branch with a Nightly run
        if: steps.plan.outputs.action == 'repair'
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
          BEFORE: ${{ steps.plan.outputs.before }}
          ISSUE: ${{ steps.plan.outputs.issue }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          after="$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$after" ] && [ "$after" != "$BEFORE" ]; then
            gh workflow run nightly.yml --ref "$BRANCH"
            echo "Dispatched Nightly on $BRANCH at ${after:0:7}."
          elif [ "$AGENT_OUTCOME" != success ]; then
            gh issue comment "$ISSUE" --body "The repair agent's run ended with \`$AGENT_OUTCOME\` and pushed nothing: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "The agent pushed nothing to $BRANCH; its diagnosis is on #$ISSUE."
          fi
