# IMPORTANT: Do not move this file in your repo! Make sure it's located at .github/workflows/claude-dispatch.yml
name: Claude Code Dispatch

# IMPORTANT: Do not modify this `on` section!
on:
  repository_dispatch:
    types: [claude-dispatch]

jobs:
  claude-dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # - name: Preliminary Setup
      # run: |
      # echo "Setting up environment..."
      # Add any preliminary setup commands here to setup Claude's dev environment
      # e.g., npm install, etc.

      - name: Run Claude Code
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@eap
        with:
          mode: 'remote-agent'

          # Optional: Specify an API key, otherwise we'll use your Claude account automatically
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional: Specify model (defaults to Claude Sonnet 4)
          model: 'claude-sonnet-5'

          # Optional: Allow Claude to run specific commands
          allowed_tools: |
            Bash(npm run lint)
            Bash(npm run compile)

          # Optional: Custom environment variables for Claude
          # claude_env: |
          #   NODE_ENV: test

      - name: Report quota exhaustion
        if: steps.claude.outcome != 'success'
        run: |
          echo "::warning::Claude Code dispatch failed. This may be due to API quota/rate limits. Check logs for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
