name: Repository Quality Improver

on:
  schedule:
    # Weekly Monday 14:00 UTC. Stays quiet — at most one issue per run.
    - cron: '0 14 * * MON'
  workflow_dispatch:

concurrency:
  group: quality-improver
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-4-7
            --allowedTools "mcp__github__*" "Bash(find:*)" "Bash(grep:*)" "Bash(wc:*)" "Bash(jq:*)" "Bash(git log:*)" "Bash(git diff:*)" "Bash(date:*)"

          prompt: |
            You are the Repository Quality Improvement Agent for ${{ github.repository }}.
            Once per week, pick ONE focus area, scan the codebase, and file AT MOST ONE
            issue with concrete, actionable tasks. If no genuine finding, file nothing.

            Use the GitHub MCP tools (not gh CLI) for all GitHub operations.

            ## Step 1 — Self-dedup gate (do this first; bail if hit)

            Search for a recent open quality issue:
              `mcp__github__search_issues` with query
              `repo:${{ github.repository }} is:issue is:open in:title "[quality]"`

            If any result was created in the last 7 days, STOP — output a one-line
            summary ("skipped: recent quality issue #N still open") and exit. Do not
            file another.

            ## Step 2 — Load rotation memory

            Find the tracking issue titled exactly `Tracking: Quality scan history`
            (labels: `tracking`).

            - If it does not exist, create it with `mcp__github__issue_write` (method=create):
              - Title: `Tracking: Quality scan history`
              - Labels: `tracking`
              - Body:
                ```
                ## Quality scan history

                Auto-maintained by `repository-quality-improver` workflow. Each run
                appends a single line to the table below.

                <!-- runs:start -->
                | Date | Focus area | Strategy | Outcome |
                |------|-----------|----------|---------|
                <!-- runs:end -->
                ```

            Read the existing rows to see recent focus areas.

            ## Step 3 — Pick a focus area

            Read CLAUDE.md and AGENTS.md to ground choices in TeXRA's actual structure
            and conventions. Use this distribution:

            - **60% custom** — invent something specific to TeXRA. Examples drawn from
              CLAUDE.md guidance:
              - VS Code coupling violations (imports of `vscode` from `src/agent/`,
                `src/model/`, `src/latex/`, `src/tools/`, `src/shared/`,
                `src/replacement/`, `src/eventBus/`, or webview frontends)
              - Render-time workarounds (synthetic IDs, `Date.now()` during render,
                DOM-based dedup) per CLAUDE.md anti-patterns
              - Two-layer factories called from a single site
              - Stale `_multiple` YAML variants vs base agents in `resources/agents/`
              - Zod schema duplication where `.extend()` / `.pick()` would dedupe
              - Wrapper functions that just create + run a flow
            - **30% standard** — code-quality, documentation, testing, security,
              performance, ci-cd, dependencies, code-organization, accessibility,
              usability. Skip any area used in the last 3 runs.
            - **10% revisit** — the most impactful prior area for deeper analysis.

            Never repeat the most recent focus area.

            ## Step 4 — Analyze (single area only)

            Run targeted bash analysis for the chosen area. Prefer concrete,
            file-and-line citations over generalizations. Stay within 10 minutes of
            wall time.

            Skip directories: `node_modules`, `dist`, `out`, `releases`, `.git`,
            `coverage`. Respect TeXRA's path aliases when reading code.

            ## Step 5 — Decide: file or skip

            File ONLY if you have at least 3 concrete, actionable findings backed by
            specific file paths or line numbers. Speculative or stylistic findings do
            not justify an issue.

            **If skipping**: append a row to the tracking issue body
            (`<!-- runs:start --> ... <!-- runs:end -->` table) via
            `mcp__github__issue_write` (method=update):
              `| <YYYY-MM-DD> | <area> | custom/standard/revisit | skipped (no findings) |`

            **If filing** (max 1 issue per run):

            Title: `[quality] <focus area>: <2-4 word finding>`

            Body:
            ```
            ## Focus area
            <area> (<custom|standard|revisit>)

            ## Findings
            - <finding with file:line reference>
            - <finding with file:line reference>
            - <finding with file:line reference>

            ## Recommended actions
            - [ ] <concrete task>
            - [ ] <concrete task>
            - [ ] <concrete task>

            ## Context
            Automated weekly quality scan. Close as `not planned` if not actionable —
            the rotation algorithm picks a different area next week.

            ---
            *Generated by `repository-quality-improver` workflow.*
            ```

            Labels: pick exactly one type-equivalent (`bug`, `enhancement`,
            `tech-debt`, or `documentation`) plus any matching `area:*` from the
            files cited (`area:agent-runtime`, `area:model-handlers`,
            `area:progress-view`, `area:latex-workflow`, `area:docs`, `area:webview`,
            `area:ci`, `area:deps`).

            Do NOT use `priority:p0` for routine quality findings.

            Then update the tracking issue with the run row, including the new
            issue number in the Outcome column: `filed #<issue>`.

            ## Hard constraints

            - At most ONE issue per run, ever.
            - Skip silently if no findings meet the bar.
            - Never repeat the most recent focus area.
            - All findings must cite file paths.
