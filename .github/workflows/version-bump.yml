name: Version Bump on Release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # Releases are cut in pairs off the same commit: `vX.Y.Z` for the extension
    # and `cli-vX.Y.Z` for the CLI (plus legacy `vX.Y.Z-frontend` tags). Bump
    # only once, off the canonical extension tag — otherwise the `cli-` tag fires
    # a second, redundant run and races the first on the same PR branch.
    if: ${{ startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, '-') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump to next package version
        id: bump_version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          NEW_VERSION=$(node scripts/bump-workspace-version.mjs --from "$RELEASE_TAG")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Refresh pnpm lockfile
        run: |
          corepack pnpm install --lockfile-only --ignore-scripts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: bump version to ${{ steps.bump_version.outputs.NEW_VERSION }}'
          title: 'chore: bump version to ${{ steps.bump_version.outputs.NEW_VERSION }}'
          body: |
            This PR automatically bumps the package manifests to the next development version after release.

            Release: ${{ github.event.release.name }}
            Tag: ${{ github.event.release.tag_name }}
            New version: ${{ steps.bump_version.outputs.NEW_VERSION }}

            If this release changes `llm-zoo`, also update the exact relay pin in `supabase/functions/relay/deno.json` and refresh `supabase/functions/relay/deno.lock`.

            Auto-generated by GitHub Actions.
          branch: version-bump-${{ steps.bump_version.outputs.NEW_VERSION }}
          base: main
          delete-branch: true
