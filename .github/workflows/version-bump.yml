name: Version Bump on Release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # Releases are cut in pairs off the same commit: `vX.Y.Z` for the extension
    # and `cli-vX.Y.Z` for the CLI. Bump only once, off the canonical extension
    # tag — otherwise the `cli-` tag fires a second, redundant run and races the
    # first on the same PR branch.
    #
    # Previews (`vX.Y.Z-preview.N`, released with `--prerelease`) never bump:
    # the next development version after a preview is the next preview, which
    # the maintainer sets by hand (releasing skill, "Preview releases"). Both
    # the GitHub pre-release flag and the tag form are checked so a preview
    # that is mislabelled on either side still cannot open a bump PR.
    if: ${{ github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, '-') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump to next package version
        id: bump_version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          NEW_VERSION=$(node scripts/bump-workspace-version.mjs --from "$RELEASE_TAG")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Refresh pnpm lockfile
        run: |
          corepack pnpm install --lockfile-only --ignore-scripts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: bump version to ${{ steps.bump_version.outputs.NEW_VERSION }}'
          title: 'chore: bump version to ${{ steps.bump_version.outputs.NEW_VERSION }}'
          body: |
            This PR automatically bumps the package manifests to the next development version after release.

            Release: ${{ github.event.release.name }}
            Tag: ${{ github.event.release.tag_name }}
            New version: ${{ steps.bump_version.outputs.NEW_VERSION }}

            Auto-generated by GitHub Actions.
          branch: version-bump-${{ steps.bump_version.outputs.NEW_VERSION }}
          base: main
          delete-branch: true
