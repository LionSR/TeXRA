name: Version Bump on Release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump to next version
        id: bump_version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          NEW_VERSION=$(node scripts/bump-workspace-version.mjs --from "$RELEASE_TAG")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Refresh pnpm lockfile
        run: |
          corepack enable
          corepack pnpm install --lockfile-only --ignore-scripts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: bump version to ${{ steps.bump_version.outputs.NEW_VERSION }}'
          title: 'chore: bump version to ${{ steps.bump_version.outputs.NEW_VERSION }}'
          body: |
            This PR automatically bumps the workspace package manifests to the next patch version after release.

            Release: ${{ github.event.release.name }}
            Tag: ${{ github.event.release.tag_name }}
            New version: ${{ steps.bump_version.outputs.NEW_VERSION }}

            Auto-generated by GitHub Actions.
          branch: version-bump-${{ steps.bump_version.outputs.NEW_VERSION }}
          base: main
          delete-branch: true
