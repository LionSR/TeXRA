name: Version Bump on Release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump to next version
        id: bump_version
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          # Split version into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Increment patch, but if it reaches 11, increment minor and reset patch to 0
          PATCH=$((PATCH + 1))
          if [ $PATCH -gt 10 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          fi

          # Construct new version
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          # Update package.json
          npm version $NEW_VERSION --no-git-tag-version --allow-same-version

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: bump version to ${{ steps.bump_version.outputs.NEW_VERSION }}'
          title: 'chore: bump version to ${{ steps.bump_version.outputs.NEW_VERSION }}'
          body: |
            This PR automatically bumps the version in package.json to the next patch version after release.

            Release: ${{ github.event.release.name }}
            Tag: ${{ github.event.release.tag_name }}
            New version: ${{ steps.bump_version.outputs.NEW_VERSION }}

            Auto-generated by GitHub Actions.
          branch: version-bump-${{ steps.bump_version.outputs.NEW_VERSION }}
          base: main
          delete-branch: true
