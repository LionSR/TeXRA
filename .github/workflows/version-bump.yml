name: Version Bump on Release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from release tag
        id: extract_version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          npm version ${{ steps.extract_version.outputs.VERSION }} --no-git-tag-version

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: bump version to ${{ steps.extract_version.outputs.VERSION }}'
          title: 'chore: bump version to ${{ steps.extract_version.outputs.VERSION }}'
          body: |
            This PR automatically bumps the version in package.json to match the release tag.

            Release: ${{ github.event.release.name }}
            Tag: ${{ github.event.release.tag_name }}

            Auto-generated by GitHub Actions.
          branch: version-bump-${{ steps.extract_version.outputs.VERSION }}
          base: main
          delete-branch: true
