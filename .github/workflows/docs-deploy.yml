name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'TERMS_OF_SERVICE.md'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        # vitepress-plugin-mermaid still declares a peer on vitepress@^1, but
        # we use the alpha of v2 intentionally. The lockfile is built with
        # --legacy-peer-deps, so npm ci must match.
        run: npm ci --legacy-peer-deps

      - name: Build site
        working-directory: docs
        run: npm run docs:build

      # Defense-in-depth: even if srcExclude in .vitepress/config.js drifts,
      # this guard fails the workflow before anything reaches the public site.
      - name: Verify no internal docs leaked into build
        run: |
          set -euo pipefail
          dist=docs/.vitepress/dist
          fail=0

          for dir in prd design dev pocketflow proposals skills supabase toolCalls reference blog; do
            if [ -d "$dist/$dir" ]; then
              echo "::error::Internal directory leaked into build: $dir/"
              fail=1
            fi
          done

          for stem in electron-migration-plan analysis-subagent-updates desktop-signing-ci relay-tier-config; do
            if [ -f "$dist/${stem}.html" ]; then
              echo "::error::Internal page leaked into build: ${stem}.html"
              fail=1
            fi
          done

          # Sanity check: expected public pages must exist.
          for required in index.html launch.html terms.html providers.html guide/index.html; do
            if [ ! -f "$dist/$required" ]; then
              echo "::error::Expected public page missing from build: $required"
              fail=1
            fi
          done

          exit $fail

      - name: Configure Pages metadata
        # TEST DEPLOY: no CNAME so Pages serves at https://lionsr.github.io/TeXRA/.
        # When moving to production, re-add: echo 'texra.ai' > docs/.vitepress/dist/CNAME
        run: |
          touch docs/.vitepress/dist/.nojekyll

      - name: Deploy to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd docs/.vitepress/dist
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy docs from ${COMMIT_SHA} [ci skip]"
          git push -f -q \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
