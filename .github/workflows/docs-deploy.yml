name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'TERMS_OF_SERVICE.md'
      - 'CHANGELOG.md'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        # vitepress-plugin-mermaid still declares a peer on vitepress@^1, but
        # we use the alpha of v2 intentionally. The lockfile is built with
        # --legacy-peer-deps, so npm ci must match.
        run: npm ci --legacy-peer-deps

      - name: Build site
        working-directory: docs
        run: npm run docs:build

      # Defense-in-depth: even if srcExclude in .vitepress/config.js drifts,
      # this check fails the workflow before anything reaches the public site.
      # Any unexpected entry at the dist root trips it: a stray internal doc, or
      # a top-level page that was never declared public. The allowlist is
      # derived from publicDocs.js and public/, the same source the PR-time
      # boundary gate reads, so adding a public page is one edit.
      - name: Verify build output matches public allowlist
        run: node docs/scripts/check-root-docs.mjs --dist docs/.vitepress/dist

      - name: Configure Pages metadata
        run: |
          touch docs/.vitepress/dist/.nojekyll
          echo 'texra.ai' > docs/.vitepress/dist/CNAME

      - name: Deploy to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd docs/.vitepress/dist
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy docs from ${COMMIT_SHA} [ci skip]"
          git push -f -q \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
