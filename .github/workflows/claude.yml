name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  claude:
    # Repository variable kill switch:
    #   CLAUDE_CODE_ENABLED=false disables mention-driven Claude runs.
    #   unset or any other value preserves the default enabled behavior.
    if: |
      vars.CLAUDE_CODE_ENABLED != 'false' &&
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    # Job-level, so a comment that fails the `if` above (every bot comment)
    # never enters the group and cannot cancel a pending @claude run.
    concurrency:
      group: bot-respond-${{ github.event.issue.number || github.event.pull_request.number || github.event.comment.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_CODE_PROVIDER: ${{ vars.CLAUDE_CODE_PROVIDER || 'anthropic' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ env.GH_TOKEN }}
          # Do not leave the token in .git/config. The agent reaches GitHub
          # through mcp__github__*, never through git credentials, and it runs
          # with Read over a workspace that would otherwise contain the PAT.
          persist-credentials: false

      - name: Checkout trusted automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          path: .trusted-actions
          fetch-depth: 1
          # This checkout defaults to the job's GITHUB_TOKEN and would otherwise
          # leave it write-capable in .trusted-actions/.git/config, inside the
          # workspace the agent can Read. Nothing here needs git credentials.
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        continue-on-error: true
        uses: LionSR/agent-ci-actions@v1
        with:
          provider: ${{ env.CLAUDE_CODE_PROVIDER }}
          model-tier: sonnet
          allowed-bots: 'claude[bot],cursor[bot],cursor,copilot-pull-request-reviewer[bot]'
          branch-name-template: '{{prefix}}{{entityType}}-{{entityNumber}}-{{description}}'
          allowed_tools_preset: claude-interactive
          allowed_tools_preset_map_file: .trusted-actions/.github/automation/allowed-tools.json
          additional-permissions: |
            actions: read
          system-prompt-file: .trusted-actions/.github/prompts/claude-code-system-prompt.md

      - name: Check for Claude quota errors and post comment
        if: |
          steps.claude.outcome != 'success' &&
          (github.event_name == 'issues' ||
           (github.event_name == 'issue_comment' && !github.event.issue.pull_request) ||
           github.event_name == 'pull_request_review_comment' ||
           github.event_name == 'pull_request_review')
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            if (!issue_number) {
              console.log('No issue/PR number found, skipping comment');
              return;
            }
            await github.rest.issues.createComment({
              issue_number: issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⏳ Claude ran into a quota or rate limit. Will retry on the next interaction.\n\n(See [action logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details)'
            });
