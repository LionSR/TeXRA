name: Native generated-file cleanup

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuild:
    name: N-API 8 (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-x64, os: macos-15-intel }
          - { target: darwin-arm64, os: macos-15 }
          - { target: win32-x64, os: windows-2022, msvc: x64, nodeArch: x64 }
          - { target: win32-arm64, os: windows-11-arm, msvc: arm64, nodeArch: arm64 }
          - { target: win32-ia32, os: windows-2022, msvc: x86, nodeArch: x86 }
          - { target: linux-x64-gnu, os: ubuntu-latest }
          - { target: linux-arm64-gnu, os: ubuntu-latest }
          - { target: linux-arm-gnu, os: ubuntu-latest }
          - { target: linux-ppc64-gnu, os: ubuntu-latest }
          - { target: linux-s390x-gnu, os: ubuntu-latest }
          - { target: linux-x64-musl, os: ubuntu-latest }
          - { target: linux-arm64-musl, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
          architecture: ${{ matrix.nodeArch || (matrix.target == 'darwin-arm64' && 'arm64') || 'x64' }}
      - name: Prepare verified Node headers
        shell: bash
        run: node scripts/native-cleanup/prepare-headers.mjs "$RUNNER_TEMP/native-headers" '${{ matrix.nodeArch }}'
      - name: Install fixed cross compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz --output "$RUNNER_TEMP/zig.tar.xz"
          echo '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  '"$RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc }}
      - name: Compile N-API 8 binary
        shell: bash
        run: >-
          node scripts/native-cleanup/build.mjs
          --target '${{ matrix.target }}'
          --headers "$RUNNER_TEMP/native-headers/node-v22.13.0/include/node"
          --node-lib "$RUNNER_TEMP/native-headers/node.lib"
      - name: Verify GNU/Linux ABI floor
        if: runner.os == 'Linux' && endsWith(matrix.target, '-gnu')
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const binary = `scripts/native-cleanup/prebuilds/${process.env.NATIVE_TARGET}.node`;
          const versions = execFileSync('readelf', ['--version-info', binary], { encoding: 'utf8' });
          for (const match of versions.matchAll(/GLIBC_(\d+)\.(\d+)/g)) {
            if (Number(match[1]) > 2 || Number(match[1]) === 2 && Number(match[2]) > 28) {
              throw new Error(`Native cleanup raises the glibc floor: ${match[0]}`);
            }
          }
          JS
      - name: Load native host binary
        if: runner.os != 'Linux' || matrix.target == 'linux-x64-gnu'
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import { createRequire } from 'node:module';
          import { mkdtemp, mkdir, rm, access, realpath } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          const binary = resolve('scripts/native-cleanup/prebuilds', `${process.env.NATIVE_TARGET}.node`);
          const addon = createRequire(import.meta.url)(binary);
          const storage = await realpath(await mkdtemp(join(tmpdir(), 'texra-native-')));
          const id = 'b4df3ca4-8036-4ee1-aa20-eeb157e9e0ac';
          await mkdir(join(storage, 'executions', id), { recursive: true });
          try {
            await addon.removeExecutionDirectories(storage, 'executions', [id]);
            if (await access(join(storage, 'executions', id)).then(() => true, () => false)) throw new Error('Directory was not removed');
          } finally {
            await rm(storage, { recursive: true, force: true });
          }
          JS
      - name: Install test dependencies
        if: runner.os != 'Linux' || matrix.target == 'linux-x64-gnu'
        run: pnpm install --frozen-lockfile
      - name: Load the same binary in Electron
        if: matrix.target != 'win32-ia32' && (runner.os != 'Linux' || matrix.target == 'linux-x64-gnu')
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import { createRequire } from 'node:module';
          import { spawnSync } from 'node:child_process';
          import { resolve } from 'node:path';
          const desktopRequire = createRequire(resolve('packages/desktop/package.json'));
          const result = spawnSync(desktopRequire('electron'), ['-e', `
            if (!process.versions.electron) throw new Error('Expected actual Electron host');
            const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict');
            const addon = require(process.env.NATIVE_BINARY);
            const storage = fs.realpathSync(fs.mkdtempSync(path.join(require('node:os').tmpdir(), 'texra-electron-native-')));
            const id = 'b4df3ca4-8036-4ee1-aa20-eeb157e9e0ac';
            fs.mkdirSync(path.join(storage, 'executions', id), { recursive: true });
            addon.removeExecutionDirectories(storage, 'executions', [id]).then(() => {
              assert.equal(fs.existsSync(path.join(storage, 'executions', id)), false);
            }).finally(() => {
              fs.rmSync(storage, { recursive: true, force: true });
            }).catch((error) => { console.error(error); process.exitCode = 1; });
            console.log('Native cleanup loaded in Electron', process.versions.electron);
          `], {
            stdio: 'inherit',
            env: { ...process.env, ELECTRON_RUN_AS_NODE: '1',
              NATIVE_BINARY: resolve('scripts/native-cleanup/prebuilds', `${process.env.NATIVE_TARGET}.node`) },
          });
          if (result.error) throw result.error;
          if (result.status !== 0) process.exit(result.status ?? 1);
          JS
      - name: Prepare local SMB share for UNC confinement
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $share = 'texra-native-' + [Guid]::NewGuid().ToString('N')
          $directory = Join-Path $env:RUNNER_TEMP $share
          New-Item -ItemType Directory -Path $directory | Out-Null
          Start-Service LanmanServer
          $account = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          New-SmbShare -Name $share -Path $directory -FullAccess $account | Out-Null
          "TEXRA_NATIVE_CLEANUP_UNC_ROOT=\\localhost\$share" >> $env:GITHUB_ENV
          "TEXRA_NATIVE_CLEANUP_SMB_SHARE=$share" >> $env:GITHUB_ENV
          "TEXRA_NATIVE_CLEANUP_SMB_DIRECTORY=$directory" >> $env:GITHUB_ENV
      - name: Exercise durable cleanup on the actual host
        if: runner.os != 'Linux' || matrix.target == 'linux-x64-gnu'
        run: npm test -- src/test-kernel/controllers/session/sessionEvents.vitest.ts
      - name: Remove temporary SMB share
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TEXRA_NATIVE_CLEANUP_SMB_SHARE) {
            Remove-SmbShare -Name $env:TEXRA_NATIVE_CLEANUP_SMB_SHARE -Force
            Remove-Item -LiteralPath $env:TEXRA_NATIVE_CLEANUP_SMB_DIRECTORY -Recurse -Force
          }
      - uses: actions/upload-artifact@v7
        with:
          name: native-cleanup-${{ matrix.target }}
          path: scripts/native-cleanup/prebuilds/*.node
          if-no-files-found: error
